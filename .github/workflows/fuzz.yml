name: Fuzzing

# ClusterFuzzLite runs the cargo-fuzz targets of fuzz/ (built by
# .clusterfuzzlite/build.sh) against the parsers that read outside input:
#   - pull requests: the targets touched by the change, 5 minutes in all;
#   - push to main and weekly: every target, 5 minutes in all, corpus kept
#     between runs as a workflow artifact.
# A crash fails the job and leaves the reproducer as an artifact.

on:
  pull_request:
    paths:
      - "crates/**"
      - "fuzz/**"
      - ".clusterfuzzlite/**"
      - "Cargo.lock"
      - ".github/workflows/fuzz.yml"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "fuzz/**"
      - ".clusterfuzzlite/**"
      - "Cargo.lock"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "43 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: ClusterFuzzLite
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      # Corpus and crash reproducers are kept as workflow artifacts.
      actions: read
    steps:
      - id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
      - uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: ${{ github.event_name == 'pull_request' && 'code-change' || 'batch' }}
          sanitizer: address

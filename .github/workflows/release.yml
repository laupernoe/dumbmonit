name: Release

# Builds the images (amd64 only for now; arm64 comes back later) with the repository Dockerfile and pushes them to
# ghcr.io/laupernoe/dumbmonit (server) and ghcr.io/laupernoe/dumbmonit-agent (agent,
# `--target agent-image`), with the same tags:
#   - every push to dev    -> :edge (development; main only gets dev through a PR)
#   - every tag vX.Y.Z     -> :X.Y.Z, :X.Y, :X and :latest
#   - every pre-release tag (with a `-`, e.g. v0.9.0-rc.1)
#                          -> :X.Y.Z-rc.N only: never :latest, :X.Y, :X or :edge
# CI (ci.yml) builds the same images without pushing, on every push and PR.
#
# It also delivers the agent as native binaries: Linux x86_64/aarch64 (static
# musl), Windows x86_64 and FreeBSD x86_64 from the Dockerfile's `agent-dist`
# stage, macOS arm64/x86_64 from a macOS runner, each with its `.sha256`.
#   - every push to dev    -> workflow artifacts `dumbmonit-agent-binaries`
#                             and `dumbmonit-agent-macos` (kept 30 days)
#   - every tag v*         -> attached to the GitHub release of that tag, each
#                             signed with Sigstore (keyless, `<file>.sigstore.json`)
#                             and covered by a SLSA build provenance
#                             (`dumbmonit-agent.intoto.jsonl`). A pre-release tag
#                             gives a draft GitHub pre-release, never latest.
# Both images also get a build provenance attestation, pushed to ghcr.io.

on:
  push:
    branches: [dev]
    tags: ["v*"]

# Read-only by default; each job asks for the write scopes it needs.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/laupernoe/dumbmonit
  AGENT_IMAGE: ghcr.io/laupernoe/dumbmonit-agent
  # Decided once here, read by every job ("true"/"false" strings):
  # a tag v* with a `-` (v0.9.0-rc.1, v1.0.0-beta.2) is a pre-release, any
  # other tag v* a stable release; a push to dev is neither.
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
  PRERELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-') }}
  STABLE_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

# Only the newest :edge matters: a newer push to dev cancels the build in
# progress. Tags each get their own group and are never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev' }}

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      # Push to ghcr.io.
      packages: write
      # Build provenance of both images (Sigstore, keyless).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The server reports the Cargo.toml version (update check, /api/health,
      # "What's new"): a tag that does not match it would publish images and
      # binaries that announce another version. Cargo.lock must follow too,
      # or the macOS build (`--locked`) fails late.
      - name: Check the tag against Cargo.toml
        if: env.RELEASE_TAG == 'true'
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          lock=$(grep -A1 '^name = "dumbmonit-server"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          echo "tag $tag, Cargo.toml $cargo, Cargo.lock $lock, pre-release $PRERELEASE"
          test "$tag" = "$cargo" || { echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $cargo"; exit 1; }
          test "$tag" = "$lock" || { echo "::error::tag $GITHUB_REF_NAME but Cargo.lock says $lock"; exit 1; }

      # Reproducible builds (docs/development/reproducible-builds.md): every
      # timestamp BuildKit writes (image config, history, file dates in the
      # layers with `rewrite-timestamp=true`) is the commit date, not the
      # date of the build. Buildx passes it on as a build argument.
      - name: Commit date
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=dev
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ env.STABLE_RELEASE }}
            type=semver,pattern={{major}},enable=${{ env.STABLE_RELEASE }}
          # :X.Y, :X and :latest follow stable releases only: never dev, never
          # a pre-release. (metadata-action v6 already reduces {{major}} and
          # {{major}}.{{minor}} to the full version for a pre-release, but a
          # forced `latest=true` would still apply: both are spelled out.)
          flavor: |
            latest=${{ env.STABLE_RELEASE }}
          # `created` is the commit date (the default is the time of the build).
          labels: |
            org.opencontainers.image.title=DumbMonit
            org.opencontainers.image.description=Dumb-simple monitoring from the homelab to the small business
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.created={{commit_date 'YYYY-MM-DDTHH:mm:ss[Z]'}}
          annotations: |
            org.opencontainers.image.created={{commit_date 'YYYY-MM-DDTHH:mm:ss[Z]'}}

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          # `push=true` as an output, so that the file dates in the layers can
          # be rewritten to SOURCE_DATE_EPOCH (`rewrite-timestamp`).
          outputs: type=image,push=true,rewrite-timestamp=true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: DUMBMONIT_BUILD=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SBOM (SPDX) and full SLSA provenance, attached to the image index
          # by BuildKit: `docker buildx imagetools inspect <image> --format
          # '{{ json .SBOM }}'` (or `.Provenance`).
          sbom: true
          provenance: mode=max

      # `gh attestation verify oci://ghcr.io/laupernoe/dumbmonit:<tag> -R laupernoe/dumbmonit`
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      # The agent binaries the server image ships in /agents, taken out of the
      # same `agent` stage: it was just built for the image above, so this only
      # exports it from the builder's cache — nothing is compiled twice.
      - name: Extract the agent binaries
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: agent-dist
          platforms: linux/amd64
          outputs: type=local,dest=dist
          cache-from: type=gha

      # Same format as the checksums the server serves on /download/<name>.sha256:
      # `sha256sum -c` and `shasum -a 256 -c` both read it.
      - name: Checksums
        run: |
          set -eu
          cd dist
          for binary in dumbmonit-agent-*; do
            sha256sum "$binary" > "$binary.sha256"
          done
          ls -l

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dumbmonit-agent-binaries
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - id: agent-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.AGENT_IMAGE }}
          tags: |
            type=edge,branch=dev
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ env.STABLE_RELEASE }}
            type=semver,pattern={{major}},enable=${{ env.STABLE_RELEASE }}
          flavor: |
            latest=${{ env.STABLE_RELEASE }}
          labels: |
            org.opencontainers.image.title=DumbMonit agent
            org.opencontainers.image.description=DumbMonit agent, for Docker hosts and remote sites (relay mode)
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.created={{commit_date 'YYYY-MM-DDTHH:mm:ss[Z]'}}
          annotations: |
            org.opencontainers.image.created={{commit_date 'YYYY-MM-DDTHH:mm:ss[Z]'}}

      # Same Dockerfile, second target: the layers above are reused from cache.
      - id: agent-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: agent-image
          platforms: linux/amd64
          outputs: type=image,push=true,rewrite-timestamp=true
          tags: ${{ steps.agent-meta.outputs.tags }}
          labels: ${{ steps.agent-meta.outputs.labels }}
          annotations: ${{ steps.agent-meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SBOM (SPDX) and full SLSA provenance, attached to the image index
          # by BuildKit: `docker buildx imagetools inspect <image> --format
          # '{{ json .SBOM }}'` (or `.Provenance`).
          sbom: true
          provenance: mode=max

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.AGENT_IMAGE }}
          subject-digest: ${{ steps.agent-push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  # ---------------------------------------------------------------------------
  # Agent macOS.
  #
  # Il ne peut pas sortir de l'image : compiler pour macOS exige le SDK d'Apple,
  # que sa licence interdit de redistribuer, et aucun conteneur ne peut donc le
  # construire légalement. Il est donc construit ici, sur un vrai exécuteur
  # macOS, et attaché à la publication (job `github-release`) — c'est là que le
  # serveur renvoie quand on lui demande `/download/dumbmonit-agent-macos-…`.
  #
  # Les deux architectures sont livrées séparément plutôt qu'en binaire
  # universel : l'agent se télécharge par un script qui connaît déjà la sienne.
  # ---------------------------------------------------------------------------
  macos-agent:
    name: Build the macOS agent
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Même version que l'étape `agent` du Dockerfile : l'agent livré ne doit
      # pas dépendre de la date de construction, ni de la plateforme.
      - run: |
          rustup toolchain install 1.99.0 --profile minimal \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default 1.99.0

      # Mêmes réglages que le Dockerfile : l'agent se télécharge sur une liaison
      # parfois lente, la taille prime sur la vitesse de compilation.
      # Les chemins de la machine (dépôt, CARGO_HOME) sont remplacés par des
      # chemins fixes dans le binaire : il ne dépend pas de l'endroit où il est
      # construit (vérifié par reproducible.yml, mêmes options). `-Wl,-S` : sans
      # informations de débogage (chemins des fichiers objets), l'identifiant
      # LC_UUID que calcule ld ne dépend plus du dossier de construction.
      - name: Build
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: s
          CARGO_PROFILE_RELEASE_LTO: fat
        run: |
          set -eu
          export RUSTFLAGS="--remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo --remap-path-prefix=$PWD=/build -C link-arg=-Wl,-S"
          xcodebuild -version
          mkdir -p dist
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p dumbmonit-agent --target "$target"
          done
          cp target/aarch64-apple-darwin/release/dumbmonit-agent dist/dumbmonit-agent-macos-aarch64
          cp target/x86_64-apple-darwin/release/dumbmonit-agent  dist/dumbmonit-agent-macos-x86_64
          # Même format que les empreintes servies par le serveur : `sha256sum -c`
          # et `shasum -a 256 -c` les lisent toutes les deux.
          cd dist
          for binary in dumbmonit-agent-macos-*; do
            shasum -a 256 "$binary" > "$binary.sha256"
          done
          ls -l

      # Sur dev, l'artefact garde l'agent macOS de la version de développement ;
      # sur une étiquette, c'est aussi ce que `github-release` attache.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dumbmonit-agent-macos
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Publication GitHub d'une version : tous les binaires de l'agent et leurs
  # empreintes, sur la page de l'étiquette.
  #
  # Un seul job crée la publication, une fois les deux constructions terminées :
  # deux jobs qui la créent chacun de leur côté se la disputent, et l'un des
  # deux finit par en ouvrir une seconde.
  #
  # Une étiquette stable donne une publication « latest » ; une pré-version
  # (étiquette avec un `-`) une « pre-release » jamais marquée latest. GitHub ne
  # compte pas les pre-releases dans /releases/latest, l'adresse où le serveur
  # renvoie pour l'agent macOS et que la documentation donne : elle reste donc
  # sur la dernière version stable pendant l'essai d'une pré-version.
  #
  # Une pré-version reste de plus en brouillon : la recherche de mise à jour
  # (crates/server/src/update.rs) lit /releases et propose une pré-version plus
  # récente à toute instance qui en exécute déjà une (toutes les 0.1.0-alpha.N) ;
  # l'API anonyme ne montre pas les brouillons. Les signatures et attestations
  # ne dépendent pas de la publication (faites avant, sur les fichiers), et
  # l'envoi des pièces jointes marche sur un brouillon. Publication à la main :
  # voir « Releasing » dans CONTRIBUTING.md.
  # ---------------------------------------------------------------------------
  github-release:
    name: Publish the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, macos-agent]
    runs-on: ubuntu-latest
    permissions:
      # Create the release and attach the files.
      contents: write
      # Sigstore signatures and build provenance (keyless, OIDC).
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: dumbmonit-agent-*
          path: dist
          merge-multiple: true

      - name: Check the files
        run: |
          set -eu
          cd dist
          ls -l
          for name in linux-x86_64 linux-aarch64 windows-x86_64.exe freebsd-x86_64 \
                      macos-aarch64 macos-x86_64; do
            test -s "dumbmonit-agent-$name" || { echo "missing: dumbmonit-agent-$name"; exit 1; }
          done
          sha256sum -c ./*.sha256

      # Les notes de la publication sont la section du CHANGELOG de cette version.
      # Une pré-version (0.9.0-rc.1) prend sa propre section, sinon celle de
      # 0.9.0, sinon Unreleased, sinon un renvoi au CHANGELOG : elle n'échoue
      # jamais ici. Une version stable sans section échoue.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: src
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Extract the release notes
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          # `## <heading>` alone or followed by a space (`## 0.9.0 — 2026-10-20`).
          section() {
            awk -v h="$1" '
              $0 == "## " h || index($0, "## " h " ") == 1 { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' src/CHANGELOG.md
          }
          has_text() { grep -q '[^[:space:]]' "$1"; }
          section "$version" > notes.md
          if [ "$PRERELEASE" = true ] && ! has_text notes.md; then
            section "${version%%-*}" > notes.md
            has_text notes.md || section Unreleased > notes.md
            has_text notes.md ||
              echo "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md)." > notes.md
          fi
          has_text notes.md || { echo "::error::no CHANGELOG section for $version"; exit 1; }
          if [ "$PRERELEASE" = true ]; then
            { printf '> Pre-release %s, for testing: not the latest release, not offered as an update to stable installs.\n\n' "$version"
              cat notes.md; } > notes.tmp
            mv notes.tmp notes.md
          fi

      # Keyless signatures: each binary gets `<binary>.sigstore.json`, checked
      # with `cosign verify-blob` against this workflow's identity (see the
      # agent installation docs). Signed after "Check the files", so only
      # binaries whose checksums matched are signed.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign the binaries
        run: |
          set -eu
          cd dist
          for binary in dumbmonit-agent-*; do
            case "$binary" in *.sha256) continue ;; esac
            cosign sign-blob --yes --bundle "$binary.sigstore.json" "$binary"
          done

      # SLSA build provenance of every binary, stored by GitHub
      # (`gh attestation verify <file> -R laupernoe/dumbmonit`) and attached
      # to the release as well.
      - id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/dumbmonit-agent-*
            !dist/*.sha256
            !dist/*.sigstore.json

      - name: Attach the provenance
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: jq -c . "$BUNDLE" > dist/dumbmonit-agent.intoto.jsonl

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
          draft: ${{ env.PRERELEASE == 'true' }}
          prerelease: ${{ env.PRERELEASE == 'true' }}
          make_latest: ${{ env.PRERELEASE == 'true' && 'false' || 'true' }}

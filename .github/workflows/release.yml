name: Release

# Builds the images (amd64 only for now; arm64 comes back later) with the repository Dockerfile and pushes them to
# ghcr.io/laupernoe/dumbmonit (server) and ghcr.io/laupernoe/dumbmonit-agent (agent,
# `--target agent-image`), with the same tags:
#   - every push to dev    -> :edge (development; main only gets dev through a PR)
#   - every tag vX.Y.Z     -> :X.Y.Z, :X.Y, :X and :latest
#   - every pre-release tag (with a `-`, e.g. v0.9.0-rc.1)
#                          -> :X.Y.Z-rc.N only: never :latest, :X.Y, :X or :edge
# upgrade.yml builds the same images without pushing, on every push to dev and
# main; a tag is only published once that workflow is green on main for the
# tagged commit (job `upgrade-gate`).
#
# Speed: on a tag nearly nothing is compiled. upgrade.yml, on the push to main
# of the same commit, built the images with the same inputs and left the
# BuildKit cache in main's scope, which a tag can read (scopes `server` and
# `agent`, one per image so that they do not overwrite each other's index):
# the server and the four agents of the Dockerfile come out of that cache, which
# is keyed by content (sources, Cargo.lock, Dockerfile, base images, commit and
# commit date as build arguments). agent-macos.yml does the same for macOS with
# its own content key. Only dev writes caches here; a tag only reads them.
#
# It also delivers the agent as native binaries: Linux x86_64/aarch64 (static
# musl), Windows x86_64 and FreeBSD x86_64 from the Dockerfile's `agent-dist`
# stage, macOS arm64/x86_64 from a macOS runner, each with its `.sha256`.
#   - every push to dev    -> workflow artifacts `dumbmonit-agent-binaries`
#                             and `dumbmonit-agent-macos` (kept 30 days)
#   - every tag v*         -> attached to the GitHub release of that tag, each
#                             signed with Sigstore (keyless, `<file>.sigstore.json`)
#                             and covered by a SLSA build provenance
#                             (`dumbmonit-agent.intoto.jsonl`). A pre-release tag
#                             gives a draft GitHub pre-release, never latest.
# Both images also get a build provenance attestation, pushed to ghcr.io.
#
# The agent binaries built in the Dockerfile are also signed with Ed25519
# (`<file>.sig`) when the repository secret AGENT_SIGNING_KEY is set: agents
# check that signature before they update themselves. The signatures are made
# here, outside the build, and reach the server image as the
# `agent-signatures` build context (docs/development/agent-signing.md).

on:
  push:
    branches: [dev]
    tags: ["v*"]

# Read-only by default; each job asks for the write scopes it needs.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/laupernoe/dumbmonit
  AGENT_IMAGE: ghcr.io/laupernoe/dumbmonit-agent
  # Decided once here, read by every job ("true"/"false" strings):
  # a tag v* with a `-` (v0.9.0-rc.1, v1.0.0-beta.2) is a pre-release, any
  # other tag v* a stable release; a push to dev is neither.
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
  PRERELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-') }}
  STABLE_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

# Only the newest :edge matters: a newer push to dev cancels the build in
# progress. Tags each get their own group and are never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev' }}

jobs:
  # A tag is never published before the upgrade test has passed on the very
  # commit it points to: the run of upgrade.yml for the push of that commit to
  # main. Still running: waited for. Missing (commit never pushed to main) or
  # failed: the release stops here, nothing is pushed. A failed run that is
  # re-run and passes unblocks a re-run of this workflow. A push to dev passes
  # straight through.
  upgrade-gate:
    name: Upgrade test passed on main
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      # Read the runs of upgrade.yml.
      actions: read
    steps:
      - name: Not a release
        if: env.RELEASE_TAG != 'true'
        run: echo "Push to dev, no release gate."
      - name: Wait for the upgrade test of this commit on main
        if: env.RELEASE_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          url="repos/$GITHUB_REPOSITORY/actions/workflows/upgrade.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main&per_page=1"
          # Up to 10 minutes for the run to appear, then as long as it runs.
          for attempt in $(seq 1 160); do
            run=$(gh api "$url" --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion) \(.html_url)"')
            if [ -z "$run" ]; then
              if [ "$attempt" -gt 20 ]; then
                echo "::error::no Upgrade test run on main for $GITHUB_SHA: tag a commit of main, after its push"
                exit 1
              fi
            else
              read -r status conclusion link <<< "$run"
              echo "upgrade test: $status $conclusion $link"
              if [ "$status" = completed ]; then
                if [ "$conclusion" = success ]; then
                  echo "Upgrade test passed on main for this commit: $link" >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                fi
                echo "::error::the Upgrade test of $GITHUB_SHA on main ended in $conclusion: $link"
                exit 1
              fi
            fi
            sleep 30
          done
          echo "::error::the Upgrade test of $GITHUB_SHA on main did not finish in time"
          exit 1

  image:
    name: Build and push image
    needs: upgrade-gate
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      # Push to ghcr.io.
      packages: write
      # Build provenance of both images (Sigstore, keyless).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The server reports the Cargo.toml version (update check, /api/health,
      # "What's new"): a tag that does not match it would publish images and
      # binaries that announce another version. Cargo.lock must follow too,
      # or the macOS build (`--locked`) fails late.
      - name: Check the tag against Cargo.toml
        if: env.RELEASE_TAG == 'true'
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          lock=$(grep -A1 '^name = "dumbmonit-server"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          echo "tag $tag, Cargo.toml $cargo, Cargo.lock $lock, pre-release $PRERELEASE"
          test "$tag" = "$cargo" || { echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $cargo"; exit 1; }
          test "$tag" = "$lock" || { echo "::error::tag $GITHUB_REF_NAME but Cargo.lock says $lock"; exit 1; }

      # Reproducible builds (docs/development/reproducible-builds.md): every
      # timestamp BuildKit writes (image config, history, file dates in the
      # layers with `rewrite-timestamp=true`) is the commit date, not the
      # date of the build. Buildx passes it on as a build argument.
      - name: Commit date
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=dev
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ env.STABLE_RELEASE }}
            type=semver,pattern={{major}},enable=${{ env.STABLE_RELEASE }}
          # :X.Y, :X and :latest follow stable releases only: never dev, never
          # a pre-release. (metadata-action v6 already reduces {{major}} and
          # {{major}}.{{minor}} to the full version for a pre-release, but a
          # forced `latest=true` would still apply: both are spelled out.)
          flavor: |
            latest=${{ env.STABLE_RELEASE }}
          # `created` is the commit date (the default is the time of the build).
          labels: |
            org.opencontainers.image.title=DumbMonit
            org.opencontainers.image.description=Dumb-simple monitoring from homelabs to mid-sized companies
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.created={{commit_date 'YYYY-MM-DDTHH:mm:ss[Z]'}}
          annotations: |
            org.opencontainers.image.created={{commit_date 'YYYY-MM-DDTHH:mm:ss[Z]'}}

      # The agent binaries the server image ships in /agents, taken out of the
      # `agent` stage before the server image is built: the image below then
      # reuses that stage from the builder's cache — nothing is compiled twice.
      - name: Extract the agent binaries
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: agent-dist
          platforms: linux/amd64
          outputs: type=local,dest=dist
          cache-from: |
            type=gha,scope=server
            type=gha,scope=agent

      # Same format as the checksums the server serves on /download/<name>.sha256:
      # `sha256sum -c` and `shasum -a 256 -c` both read it.
      - name: Checksums
        run: |
          set -eu
          cd dist
          for binary in dumbmonit-agent-*; do
            sha256sum "$binary" > "$binary.sha256"
          done
          ls -l

      # Ed25519 signatures of the agent binaries, checked by the agents before
      # they replace themselves. Made with `openssl pkeyutl -rawin` (Ed25519 is
      # deterministic: the same binary and key always give the same `.sig`),
      # outside the Docker build: the key never enters a layer or a cache.
      # Without the secret the binaries ship unsigned, and agents refuse them
      # unless the server accepts unsigned builds (development).
      - name: Sign the agent binaries
        env:
          AGENT_SIGNING_KEY: ${{ secrets.AGENT_SIGNING_KEY }}
        run: |
          set -eu
          mkdir -p signatures
          if [ -z "$AGENT_SIGNING_KEY" ]; then
            echo "::warning::AGENT_SIGNING_KEY is not set: the agent binaries are not signed"
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/agent-signing.pem"
          public="$RUNNER_TEMP/agent-signing.pub.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$AGENT_SIGNING_KEY" > "$key"
          openssl pkey -in "$key" -pubout -out "$public"
          # Agents only trust the keys compiled into them: a key missing from
          # release-keys.pem would sign binaries that no agent installs.
          if ! grep -qxF "$(sed -n 2p "$public")" crates/agent/signing/release-keys.pem; then
            echo "::error::the public half of AGENT_SIGNING_KEY is not in crates/agent/signing/release-keys.pem"
            exit 1
          fi
          for binary in dist/dumbmonit-agent-*; do
            case "$binary" in *.sha256|*.sig) continue ;; esac
            openssl pkeyutl -sign -inkey "$key" -rawin -in "$binary" -out "$binary.sig"
            openssl pkeyutl -verify -pubin -inkey "$public" -rawin -in "$binary" -sigfile "$binary.sig"
            cp "$binary.sig" signatures/
          done
          ls -l signatures

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          # `push=true` as an output, so that the file dates in the layers can
          # be rewritten to SOURCE_DATE_EPOCH (`rewrite-timestamp`).
          outputs: type=image,push=true,rewrite-timestamp=true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: DUMBMONIT_BUILD=${{ github.sha }}
          # The `.sig` files made above (an empty folder without the key).
          build-contexts: agent-signatures=signatures
          # Same scopes as upgrade.yml. A tag reads main's cache (left by the
          # push of the same commit to main) and writes none.
          cache-from: |
            type=gha,scope=server
            type=gha,scope=agent
          cache-to: ${{ github.ref == 'refs/heads/dev' && 'type=gha,scope=server,mode=max,ignore-error=true' || '' }}
          # SBOM (SPDX) and full SLSA provenance, attached to the image index
          # by BuildKit: `docker buildx imagetools inspect <image> --format
          # '{{ json .SBOM }}'` (or `.Provenance`).
          sbom: true
          provenance: mode=max

      # `gh attestation verify oci://ghcr.io/laupernoe/dumbmonit:<tag> -R laupernoe/dumbmonit`
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dumbmonit-agent-binaries
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - id: agent-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.AGENT_IMAGE }}
          tags: |
            type=edge,branch=dev
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ env.STABLE_RELEASE }}
            type=semver,pattern={{major}},enable=${{ env.STABLE_RELEASE }}
          flavor: |
            latest=${{ env.STABLE_RELEASE }}
          labels: |
            org.opencontainers.image.title=DumbMonit agent
            org.opencontainers.image.description=DumbMonit agent, for Docker hosts and remote sites (relay mode)
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.created={{commit_date 'YYYY-MM-DDTHH:mm:ss[Z]'}}
          annotations: |
            org.opencontainers.image.created={{commit_date 'YYYY-MM-DDTHH:mm:ss[Z]'}}

      # Same Dockerfile, second target: the layers above are reused from cache.
      - id: agent-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: agent-image
          platforms: linux/amd64
          outputs: type=image,push=true,rewrite-timestamp=true
          tags: ${{ steps.agent-meta.outputs.tags }}
          labels: ${{ steps.agent-meta.outputs.labels }}
          annotations: ${{ steps.agent-meta.outputs.annotations }}
          cache-from: |
            type=gha,scope=agent
            type=gha,scope=server
          cache-to: ${{ github.ref == 'refs/heads/dev' && 'type=gha,scope=agent,mode=max,ignore-error=true' || '' }}
          # SBOM (SPDX) and full SLSA provenance, attached to the image index
          # by BuildKit: `docker buildx imagetools inspect <image> --format
          # '{{ json .SBOM }}'` (or `.Provenance`).
          sbom: true
          provenance: mode=max

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.AGENT_IMAGE }}
          subject-digest: ${{ steps.agent-push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  # ---------------------------------------------------------------------------
  # Agent macOS : construit sur un exécuteur macOS (le SDK d'Apple ne peut pas
  # entrer dans une image), ou repris tel quel d'une construction identique
  # antérieure — voir agent-macos.yml, qui explique la clé de contenu.
  # ---------------------------------------------------------------------------
  macos-agent:
    name: macOS agent
    uses: ./.github/workflows/agent-macos.yml

  # ---------------------------------------------------------------------------
  # Publication GitHub d'une version : tous les binaires de l'agent et leurs
  # empreintes, sur la page de l'étiquette.
  #
  # Un seul job crée la publication, une fois les deux constructions terminées :
  # deux jobs qui la créent chacun de leur côté se la disputent, et l'un des
  # deux finit par en ouvrir une seconde.
  #
  # Une étiquette stable donne une publication « latest » ; une pré-version
  # (étiquette avec un `-`) une « pre-release » jamais marquée latest. GitHub ne
  # compte pas les pre-releases dans /releases/latest, l'adresse où le serveur
  # renvoie pour l'agent macOS et que la documentation donne : elle reste donc
  # sur la dernière version stable pendant l'essai d'une pré-version.
  #
  # Une pré-version reste de plus en brouillon : la recherche de mise à jour
  # (crates/server/src/update.rs) lit /releases et propose une pré-version plus
  # récente à toute instance qui en exécute déjà une (toutes les 0.1.0-alpha.N) ;
  # l'API anonyme ne montre pas les brouillons. Les signatures et attestations
  # ne dépendent pas de la publication (faites avant, sur les fichiers), et
  # l'envoi des pièces jointes marche sur un brouillon. Publication à la main :
  # voir « Releasing » dans CONTRIBUTING.md.
  # ---------------------------------------------------------------------------
  github-release:
    name: Publish the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, macos-agent]
    runs-on: ubuntu-latest
    permissions:
      # Create the release and attach the files.
      contents: write
      # Sigstore signatures and build provenance (keyless, OIDC).
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: dumbmonit-agent-*
          path: dist
          merge-multiple: true

      - name: Check the files
        run: |
          set -eu
          cd dist
          ls -l
          for name in linux-x86_64 linux-aarch64 windows-x86_64.exe freebsd-x86_64 \
                      macos-aarch64 macos-x86_64; do
            test -s "dumbmonit-agent-$name" || { echo "missing: dumbmonit-agent-$name"; exit 1; }
          done
          sha256sum -c ./*.sha256

      # Les notes de la publication sont la section du CHANGELOG de cette version.
      # Une pré-version (0.9.0-rc.1) prend sa propre section, sinon celle de
      # 0.9.0, sinon Unreleased, sinon un renvoi au CHANGELOG : elle n'échoue
      # jamais ici. Une version stable sans section échoue.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: src
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Extract the release notes
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          # `## <heading>` alone or followed by a space (`## 0.9.0 — 2026-10-20`).
          section() {
            awk -v h="$1" '
              $0 == "## " h || index($0, "## " h " ") == 1 { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' src/CHANGELOG.md
          }
          has_text() { grep -q '[^[:space:]]' "$1"; }
          section "$version" > notes.md
          if [ "$PRERELEASE" = true ] && ! has_text notes.md; then
            section "${version%%-*}" > notes.md
            has_text notes.md || section Unreleased > notes.md
            has_text notes.md ||
              echo "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md)." > notes.md
          fi
          has_text notes.md || { echo "::error::no CHANGELOG section for $version"; exit 1; }
          if [ "$PRERELEASE" = true ]; then
            { printf '> Pre-release %s, for testing: not the latest release, not offered as an update to stable installs.\n\n' "$version"
              cat notes.md; } > notes.tmp
            mv notes.tmp notes.md
          fi

      # Keyless signatures: every file attached to the release (the binaries,
      # and `provenance.json`, the BuildKit provenance of the agent-dist
      # export) gets `<file>.sigstore.json`, checked with `cosign verify-blob`
      # against this workflow's identity (docs/install/verify.md). Signed after
      # "Check the files", so only binaries whose checksums matched are signed.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign the release files
        run: |
          set -eu
          cd dist
          for file in *; do
            case "$file" in *.sha256|*.sig|*.sigstore.json) continue ;; esac
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done

      # SLSA build provenance of every binary, stored by GitHub
      # (`gh attestation verify <file> -R laupernoe/dumbmonit`) and attached
      # to the release as well.
      - id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/dumbmonit-agent-*
            !dist/*.sha256
            !dist/*.sig
            !dist/*.sigstore.json

      - name: Attach the provenance
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: jq -c . "$BUNDLE" > dist/dumbmonit-agent.intoto.jsonl

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
          draft: ${{ env.PRERELEASE == 'true' }}
          prerelease: ${{ env.PRERELEASE == 'true' }}
          make_latest: ${{ env.PRERELEASE == 'true' && 'false' || 'true' }}

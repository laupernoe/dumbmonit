name: Security

# Weekly and after every publication of :edge: scans the published server and
# agent images for known CVEs (Trivy). Results land in the repository's
# Security tab. The OpenSSF Scorecard has its own workflow (scorecard.yml).

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: Image CVE scan
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            image: ghcr.io/laupernoe/dumbmonit:edge
          - name: agent
            image: ghcr.io/laupernoe/dumbmonit-agent:edge
    steps:
      - name: Scan
        run: |
          docker run --rm -v "$PWD:/out" aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image \
            --format sarif --output /out/trivy-${{ matrix.name }}.sarif \
            --severity CRITICAL,HIGH --ignore-unfixed ${{ matrix.image }}
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.name)) != ''
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

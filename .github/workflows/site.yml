name: Site

# Builds the product website (site-src/) and the documentation (MkDocs, docs/) and publishes
# both to GitHub Pages: the site at the root, the docs under /docs/ (English) and
# /docs/<lang>/ (fr, de, es, it, pt, pt-BR, ru, zh-Hans). Read the Docs keeps a mirror of the docs.
# The built pages (website/) are not committed.
#
# When it runs: on a push to main OR dev that touches the site, the docs or this file, and by
# hand (Actions -> Site -> Run workflow). The site can therefore be updated without a release.
#
# What comes from where (the consistency rule):
#   - Product data (the integrations and their count, the notification channels, the version
#     shown) is read from the LATEST STABLE RELEASE TAG (vX.Y.Z, no -rc) by site-src/extract.py,
#     with `git show <tag>:<path>`. What the site announces as available is what a user can
#     install today, never what only exists on dev.
#   - Texts, roadmap, design and the documentation come from the pushed branch.
#
# One deployment at a time for main and dev together (group "pages"): a newer push replaces a
# queued one and the last build to finish is what is online. An in-progress deployment is never
# cancelled halfway.
#
# One-time setup: Settings -> Pages -> Source: GitHub Actions. To deploy from dev too, allow dev
# in Settings -> Environments -> github-pages -> Deployment branches (only the default branch is
# allowed there by default).

on:
  push:
    branches: [main, dev]
    paths:
      - "site-src/**"
      - "docs/**"
      - "mkdocs.yml"
      - "overrides/**"
      - "hooks/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

# Read-only by default; the deploy job asks for the Pages scopes.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release tags: the product data is read from the latest one.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Make sure every release tag is here
        run: git fetch --force --tags origin
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Build the pages
        run: python3 site-src/build.py
      - name: Install MkDocs
        run: pip install -r docs/requirements.txt
      - name: Build the documentation (one build per language)
        env:
          DUMBMONIT_DOCS_BASE: https://dumbmonit.app/docs/
          NO_MKDOCS_2_WARNING: "1"
        run: |
          set -euo pipefail
          # Read the Docs language code : directory under docs/ (the website's language codes).
          langs="en: fr:fr de:de es:es it:it pt:pt pt-br:pt-BR ru:ru zh-cn:zh-Hans"
          for pair in $langs; do
            code="${pair%%:*}"; dir="${pair#*:}"
            READTHEDOCS_LANGUAGE="$code" mkdocs build --quiet --site-dir "_docs/$code"
            mkdir -p "website/docs/$dir"
          done
          # English at the root of docs/, every other language in its own directory.
          for pair in $langs; do
            code="${pair%%:*}"; dir="${pair#*:}"
            cp -a "_docs/$code/." "website/docs/$dir/"
          done
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

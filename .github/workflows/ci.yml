name: CI

# Pull requests only run the checks that the change can break (see `changes`):
# a web-only PR does not compile Rust, a Rust-only PR does not wait for the web
# checks. The three required checks (`Rust`, `Web UI`, `Licences and advisories`,
# see the repository rulesets) always run and always report a status: when the
# change does not concern them their steps are skipped and the job succeeds.
# They never skip the job itself, so a failure of `changes` fails them too.
# Pushes to dev and main run everything.
#
# The Docker image build left this workflow: upgrade.yml builds both images on
# every push to dev and main (and release.yml pushes them), never on PRs.

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A newer push to the same branch makes the running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # paths-filter lists the files of the PR through the API.
      pull-requests: read
    outputs:
      rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
      deps: ${{ github.event_name != 'pull_request' || steps.filter.outputs.deps == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - "crates/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "profiles/**"
              - "rustfmt.toml"
              - ".github/workflows/ci.yml"
            web:
              - "web/**"
              - ".github/workflows/ci.yml"
            deps:
              - "Cargo.lock"
              - "**/Cargo.toml"
              - "deny.toml"
              - "web/package-lock.json"
              - ".github/workflows/ci.yml"

  rust:
    name: Rust
    needs: changes
    # Runs even when `changes` failed, to fail rather than be skipped (a
    # skipped required check counts as passed).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      RUN: ${{ needs.changes.outputs.rust }}
    steps:
      - name: Changed paths known
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Nothing to check
        if: env.RUN != 'true'
        run: echo "No Rust change in this pull request." >> "$GITHUB_STEP_SUMMARY"
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The server embeds web/build at compile time (rust_embed): without it
      # the crate does not compile at all. Build the real interface rather than
      # a placeholder, so the tests that serve pages see what users get.
      - if: env.RUN == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: env.RUN == 'true'
        run: npm ci && npm run build
        working-directory: web
      - if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy, rustfmt
      # Saved on pushes to dev and main only: a PR reads the cache of its base
      # branch (and of main), its own would only evict theirs from the 10 GB the
      # repository gets. main always has a warm one for the dev -> main PR.
      - if: env.RUN == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name == 'push' }}
      - if: env.RUN == 'true'
        run: cargo fmt --all --check
      - if: env.RUN == 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings
      - if: env.RUN == 'true'
        run: cargo test --all-features

  # Test coverage of the Rust workspace, on pushes to dev only (main receives
  # the same code through a PR, and its cache stays for the release): the
  # percentage goes to the job summary, the lcov report to a workflow artifact.
  # No third-party service sees the code.
  coverage:
    name: Coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: cargo llvm-cov --workspace --all-features --no-report
      - run: cargo llvm-cov report --lcov --output-path lcov.info
      - name: Summary
        run: |
          set -eu
          cargo llvm-cov report --json --summary-only --output-path summary.json
          jq -r '.data[0].totals |
            "### Rust test coverage\n\n| | Covered | Total | % |\n|---|---:|---:|---:|\n" +
            "| Lines | \(.lines.covered) | \(.lines.count) | \(.lines.percent * 100 | round / 100)% |\n" +
            "| Functions | \(.functions.covered) | \(.functions.count) | \(.functions.percent * 100 | round / 100)% |\n" +
            "| Regions | \(.regions.covered) | \(.regions.count) | \(.regions.percent * 100 | round / 100)% |"' \
            summary.json >> "$GITHUB_STEP_SUMMARY"
      # Branch coverage needs the nightly compiler (`--branch` is unstable); it
      # is only reported, never gating.
      - name: Branch coverage
        continue-on-error: true
        run: |
          set -eu
          rustup toolchain install nightly --profile minimal --component llvm-tools-preview
          cargo +nightly llvm-cov --workspace --all-features --branch --json --summary-only \
            --output-path branch.json
          jq -r '.data[0].totals.branches |
            "### Rust branch coverage\n\n| Covered | Total | % |\n|---:|---:|---:|\n" +
            "| \(.covered) | \(.count) | \(.percent * 100 | round / 100)% |"' \
            branch.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
          retention-days: 30

  licences:
    name: Licences and advisories
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      RUN: ${{ needs.changes.outputs.deps }}
    steps:
      - name: Changed paths known
        if: needs.changes.result != 'success'
        run: exit 1
      # New advisories are still caught: every push to dev and main runs it.
      - name: Nothing to check
        if: env.RUN != 'true'
        run: echo "No dependency change in this pull request." >> "$GITHUB_STEP_SUMMARY"
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - if: env.RUN == 'true'
        uses: taiki-e/install-action@5d880190e41a7608c29a5c91c6b5d24561d53850 # cargo-deny
      # Enforces the "100 % open source" promise: a dependency under a licence
      # that is not in deny.toml fails the build instead of being discovered
      # after publication.
      - if: env.RUN == 'true'
        run: cargo deny check licenses bans
      # RustSec advisories: a vulnerable dependency fails the build until it is
      # updated or explicitly ignored in deny.toml with a reason.
      - if: env.RUN == 'true'
        run: cargo deny check advisories

  web:
    name: Web UI
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      RUN: ${{ needs.changes.outputs.web }}
    steps:
      - name: Changed paths known
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Nothing to check
        if: env.RUN != 'true'
        run: echo "No web change in this pull request." >> "$GITHUB_STEP_SUMMARY"
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: env.RUN == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: env.RUN == 'true'
        working-directory: web
        run: npm ci
      - if: env.RUN == 'true'
        working-directory: web
        run: npm run i18n:check
      - if: env.RUN == 'true'
        working-directory: web
        run: npm run check
      - if: env.RUN == 'true'
        working-directory: web
        run: npm test
      - if: env.RUN == 'true'
        working-directory: web
        run: npm run build

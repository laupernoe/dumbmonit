# Mesures et vues du type « http » (format : crates/collectors/src/catalog.rs).
source: uptime
prefixes: [probe_]
metrics:
  - { name: probe_success, label: "Up", unit: "bool" }
  - { name: probe_duration_seconds, label: "Probe duration", unit: "s", better: "lower" }
  - { name: probe_failure_info, label: "Failure reason", kind: info }
  - { name: probe_connect_seconds, label: "Connect time", unit: "s", better: "lower" }
  - { name: probe_http_first_byte_seconds, label: "Time to first byte", unit: "s", better: "lower" }
  - { name: probe_http_phase_seconds, label: "Request phase", unit: "s" }
  - { name: probe_http_status_code, label: "HTTP status" }
  - { name: probe_http_content_bytes, label: "Body size", unit: "B" }
  - { name: probe_tls_handshake_seconds, label: "TLS handshake", unit: "s", better: "lower" }
  - { name: probe_tls_version_info, label: "TLS version", kind: info }
  - { name: probe_ssl_cert_expiry_days, label: "Certificate expires in", unit: "days" }
  - { name: probe_ssl_cert_valid, label: "Certificate trusted", unit: "bool" }
  - { name: probe_ssl_cert_issuer_info, label: "Certificate issuer", kind: info }
views:
  - view: stat
    title: "Current values"
    metrics:
      - probe_http_status_code
      - probe_http_content_bytes
      - probe_tls_version_info
      - probe_ssl_cert_expiry_days
      - probe_ssl_cert_valid
  - view: timeseries
    title: "Response time"
    metrics: [probe_duration_seconds, probe_connect_seconds, probe_http_first_byte_seconds, probe_tls_handshake_seconds]

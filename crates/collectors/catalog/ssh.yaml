# Mesures et vues du type « ssh » (format : crates/collectors/src/catalog.rs).
source: uptime
prefixes: [probe_]
metrics:
  - { name: probe_success, label: "Up", unit: "bool" }
  - { name: probe_duration_seconds, label: "Probe duration", unit: "s", better: "lower" }
  - { name: probe_failure_info, label: "Failure reason", kind: info }
  - { name: probe_connect_seconds, label: "Connect time", unit: "s", better: "lower" }
  - { name: probe_ssh_banner_seconds, label: "Banner time", unit: "s", better: "lower" }
  - { name: probe_ssh_kex_seconds, label: "Key exchange time", unit: "s", better: "lower" }
  - { name: probe_ssh_protocol_info, label: "Protocol", kind: info }
  - { name: probe_ssh_software_info, label: "Server software", kind: info }
  - { name: probe_ssh_host_key_fingerprint, label: "Host key fingerprint" }
  - { name: probe_ssh_host_key_info, label: "Host key", kind: info }
  - { name: probe_ssh_host_key_match, label: "Host key matches", unit: "bool" }
views:
  - view: stat
    title: "Current values"
    metrics:
      - probe_ssh_host_key_fingerprint
      - probe_ssh_host_key_match
  - view: timeseries
    title: "Response time"
    metrics: [probe_duration_seconds, probe_connect_seconds, probe_ssh_banner_seconds, probe_ssh_kex_seconds]

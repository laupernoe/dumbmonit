# Mesures et vues du type « lidarr » (format : crates/collectors/src/catalog.rs).
source: selfhosted
prefixes: [lidarr_]
metrics:
  - { name: lidarr_queue_total, label: "Queue" }
  - { name: lidarr_queue_has_errors, label: "Queue has errors", better: "lower" }
  - { name: lidarr_queue_has_warnings, label: "Queue has warnings" }
  - { name: lidarr_queue_unknown, label: "Queue unknown" }
  - { name: lidarr_health_errors, label: "Health errors", better: "lower" }
  - { name: lidarr_health_warnings, label: "Health warnings" }
  - { name: lidarr_health_issue, label: "Health issue" }
  - { name: lidarr_disk_used_percent, label: "Disk used", unit: "%", better: "lower", min: 0, max: 100 }
  - { name: lidarr_disk_free_bytes, label: "Disk free", unit: "B", better: "higher" }
  - { name: lidarr_indexers_disabled, label: "Indexers disabled" }
  - { name: lidarr_update_available, label: "Update available", unit: "bool", better: "higher" }
  - { name: lidarr_version_info, label: "Version", kind: info }
  - { name: lidarr_scrape_errors, label: "Scrape errors", better: "lower" }
views:
  - view: stat
    title: "Current values"
    metrics:
      - lidarr_queue_has_errors
      - lidarr_queue_has_warnings
      - lidarr_queue_unknown
      - lidarr_health_errors
      - lidarr_health_warnings
      - lidarr_health_issue
      - lidarr_disk_used_percent
      - lidarr_disk_free_bytes
      - lidarr_indexers_disabled
      - lidarr_update_available
      - lidarr_version_info
  - view: timeseries
    title: "Queue"
    metrics: [lidarr_queue_total]

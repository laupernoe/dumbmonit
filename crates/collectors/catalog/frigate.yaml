# Mesures et vues du type « frigate » (format : crates/collectors/src/catalog.rs).
source: selfhosted
prefixes: [frigate_]
metrics:
  - { name: frigate_detection_fps, label: "Detection FPS", unit: "fps" }
  - { name: frigate_camera_fps, label: "Camera FPS", unit: "fps" }
  - { name: frigate_detector_inference_ms, label: "Detector inference ms", unit: "ms", better: "lower" }
  - { name: frigate_storage_used_percent, label: "Storage used", unit: "%", better: "lower", min: 0, max: 100 }
  - { name: frigate_camera_online, label: "Camera online", unit: "bool" }
  - { name: frigate_cameras_total, label: "Cameras" }
  - { name: frigate_cameras_offline, label: "Cameras offline", better: "lower" }
  - { name: frigate_detector_busy_seconds, label: "Detector busy", unit: "s" }
  - { name: frigate_storage_free_bytes, label: "Storage free", unit: "B", better: "higher" }
  - { name: frigate_uptime_seconds, label: "Uptime", unit: "s" }
  - { name: frigate_update_available, label: "Update available", unit: "bool", better: "higher" }
  - { name: frigate_version_info, label: "Version", kind: info }
views:
  - view: stat
    title: "Current values"
    metrics:
      - frigate_camera_online
      - frigate_cameras_total
      - frigate_cameras_offline
      - frigate_storage_free_bytes
      - frigate_uptime_seconds
      - frigate_update_available
      - frigate_version_info
  - view: timeseries
    title: "Frames per second"
    metrics: [frigate_detection_fps, frigate_camera_fps]
  - view: timeseries
    title: "Inference time"
    metrics: [frigate_detector_inference_ms]
  - view: timeseries
    title: "Storage used"
    metrics: [frigate_storage_used_percent]

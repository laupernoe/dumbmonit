# Mesures et vues du type « snmp_oid » (format : crates/collectors/src/catalog.rs).
source: uptime
prefixes: [probe_]
metrics:
  - { name: probe_success, label: "Up", unit: "bool" }
  - { name: probe_duration_seconds, label: "Probe duration", unit: "s", better: "lower" }
  - { name: probe_failure_info, label: "Failure reason", kind: info }
  - { name: probe_snmp_query_seconds, label: "Query time", unit: "s", better: "lower" }
views:
  - view: timeseries
    title: "Response time"
    metrics: [probe_duration_seconds, probe_snmp_query_seconds]

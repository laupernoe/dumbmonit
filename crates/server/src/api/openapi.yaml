    # -------------------------------------------------------------- sécurité
    SecurityGrade:
      type: [string, "null"]
      enum: [A, B, C, D, F, null]
      description: A ≥ 90, B ≥ 75, C ≥ 60, D ≥ 40, F below; null when nothing could be rated.
    SecurityCheck:
      type: object
      required: [id, title, category, severity, weight, result, evidence, remediation, reference]
      properties:
        id: { type: string, example: pve.updates.security }
        title: { type: string }
        category:
          type: string
          enum: [exposure, patching, authentication, encryption, backup, configuration]
        severity: { type: string, enum: [critical, high, medium, low] }
        weight: { type: integer, description: "critical 10, high 6, medium 3, low 1" }
        result: { type: string, enum: [pass, fail, unknown] }
        evidence: { type: string }
        remediation: { type: string }
        reference: { type: string, format: uri, description: Vendor best-practice page. }
    SecurityReport:
      type: object
      required: [target_id, target_name, kind, supported, score, grade, capped, evaluated_at, counts, checks]
      properties:
        target_id: { type: integer }
        target_name: { type: string }
        kind: { type: string }
        supported: { type: boolean }
        score: { type: [integer, "null"], minimum: 0, maximum: 100 }
        grade: { $ref: "#/components/schemas/SecurityGrade" }
        capped:
          type: boolean
          description: A failing critical check capped the grade at C.
        evaluated_at: { type: string, description: UTC, without suffix. }
        counts:
          type: object
          properties:
            pass: { type: integer }
            fail: { type: integer }
            unknown: { type: integer }
        checks:
          type: array
          description: Failing checks first (heaviest first), then passing, then unknown.
          items: { $ref: "#/components/schemas/SecurityCheck" }
    SecuritySummary:
      type: object
      required: [evaluated_at, devices]
      properties:
        evaluated_at: { type: string }
        devices:
          type: array
          items:
            type: object
            properties:
              target_id: { type: integer }
              target_name: { type: string }
              kind: { type: string }
              score: { type: [integer, "null"] }
              grade: { $ref: "#/components/schemas/SecurityGrade" }
              capped: { type: boolean }
              pass: { type: integer }
              fail: { type: integer }
              unknown: { type: integer }
              top_failures: { type: array, items: { type: string } }

    # ------------------------------------------------------------------ MCP
    McpEndpointInfo:
      type: object
      required: [error]
      properties:
        error: { type: string }
        protocolVersion: { type: string }
        transport: { type: string, const: streamable-http }
        streaming: { type: boolean }
        docs: { type: string }
    JsonRpcRequest:
      type: object
      required: [jsonrpc, method]
      description: A request (with `id`) or a notification (without). Batches are refused.
      properties:
        jsonrpc: { type: string, const: "2.0" }
        id: { type: [string, integer] }
        method:
          type: string
          examples: [server/discover, initialize, tools/list, tools/call, ping]
        params: { type: object, additionalProperties: true }
    JsonRpcResponse:
      type: object
      required: [jsonrpc]
      properties:
        jsonrpc: { type: string, const: "2.0" }
        id: { type: [string, integer, "null"] }
        result: { type: object, additionalProperties: true }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: integer }
            message: { type: string }
            data: {}
    NowPlaying:
      type: object
      required: [playing, kind, title, artists, duration_ms, progress_ms]
      properties:
        playing: { type: boolean }
        kind: { type: string, description: "`track`, `episode`, `ad` or `unknown`." }
        title: { type: string }
        artists: { type: array, items: { type: string } }
        album: { type: [string, "null"] }
        cover_url: { type: [string, "null"], description: Always on https://i.scdn.co. }
        duration_ms: { type: integer }
        progress_ms: { type: integer }
        device_name: { type: [string, "null"] }
        device_type: { type: [string, "null"] }
    WallLink:
      type: object
      required: [link, set_by, set_at]
      properties:
        link: { type: string }
        set_by: { type: string }
        set_at: { type: string, description: UTC, without suffix. }
    WallMusic:
      type: object
      required: [spotify, speaker_name]
      properties:
        spotify:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [off, connected, expired] }
            now_playing:
              oneOf:
                - { $ref: "#/components/schemas/NowPlaying" }
                - { type: "null" }
            error: { type: [string, "null"] }
        link:
          oneOf:
            - { $ref: "#/components/schemas/WallLink" }
            - { type: "null" }
        speaker_name: { type: string }
    WallSpeaker:
      type: object
      required: [speaker_name, status, devices, listed, walls]
      properties:
        speaker_name: { type: string }
        status: { type: string, enum: [off, connected, expired] }
        account_name: { type: [string, "null"] }
        premium: { type: [boolean, "null"], description: "null: unknown." }
        devices:
          type: array
          items:
            type: object
            required: [name, type, is_active, is_restricted]
            properties:
              id: { type: [string, "null"] }
              name: { type: string }
              type: { type: string }
              is_active: { type: boolean }
              is_restricted: { type: boolean }
              volume_percent: { type: [integer, "null"] }
        listed: { type: boolean, description: "Spotify lists the speaker among the account's devices." }
        walls:
          type: array
          items:
            type: object
            required: [display, name, phase, activated, seen_at]
            properties:
              display: { type: string }
              name: { type: string }
              phase: { type: string }
              activated: { type: boolean }
              device_id: { type: [string, "null"] }
              problem: { type: [string, "null"] }
              browser: { type: [string, "null"] }
              premium: { type: [boolean, "null"] }
              listed: { type: [boolean, "null"] }
              seen_at: { type: string, description: "UTC, no suffix." }
        error: { type: [string, "null"] }
    SpotifyAccount:
      type: object
      required: [status, missing_scopes, speaker_name, scopes, loopback_redirect_uri, callback_path]
      properties:
        status: { type: string, enum: [off, connected, expired] }
        client_id: { type: [string, "null"] }
        account_name: { type: [string, "null"] }
        connected_at: { type: [string, "null"] }
        reconnect_by: { type: [string, "null"], description: Spotify ends a connection six months after approval. }
        missing_scopes: { type: array, items: { type: string } }
        last_error: { type: [string, "null"] }
        speaker_name: { type: string }
        scopes: { type: array, items: { type: string } }
        loopback_redirect_uri: { type: string }
        callback_path: { type: string }

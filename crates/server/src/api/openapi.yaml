      summary: Send a test message to a contact method
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: Sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelTestReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/account/oncall:
    get:
      operationId: myOnCallProfile
      tags: [On-call]
      summary: The signed-in account's time zone, quiet hours, current and next shifts
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: Profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnCallProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: updateMyOnCallProfile
      tags: [On-call]
      summary: Set the time zone and quiet hours (null quiet hours clear them)
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnCallProfilePayload" }
      responses:
        "200":
          description: Profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnCallProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/account/oncall/calendar:
    post:
      operationId: createMyOnCallCalendar
      tags: [On-call]
      summary: Create a new iCal subscription link (the previous one stops working)
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: The link, shown once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnCallCalendarLink" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: revokeMyOnCallCalendar
      tags: [On-call]
      summary: Revoke the iCal subscription link
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "204": { description: Link revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/public/oncall/calendar/{token}:
    parameters:
      - { name: token, in: path, required: true, description: "The secret of the link, with or without `.ics`.", schema: { type: string } }
    get:
      operationId: onCallCalendar
      tags: [On-call]
      summary: A person's on-call shifts as an iCalendar feed (30 days back, 90 days ahead)
      security: []
      x-token-scope: public
      responses:
        "200":
          description: The calendar.
          content:
            text/calendar:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: dmt_…
      description: >-
        API token created in Settings → API & assistants. `read` scope: every
        `GET`; `write` scope: also `POST`, `PUT`, `DELETE`. Never valid on
        operations marked `x-token-scope: none`. 120 calls per minute per token.
    scimBearer:
      type: http
      scheme: bearer
      bearerFormat: dmscim_…
      description: >-
        The SCIM token generated in Settings for the identity provider. Valid
        only on `/api/scim/v2`; repeated failures from one address are answered
        429.
    cookieAuth:
      type: apiKey
      in: cookie
      name: dumbmonit_session
      description: >-
        Session opened by `POST /api/auth/login`. State-changing requests must
        also carry `X-Requested-With: DumbMonit`.

  parameters:
    ScimId:
      name: id
      in: path
      required: true
      description: SCIM id (a UUID).
      schema: { type: string }
    ScimFilter:
      name: filter
      in: query
      description: 'For example `userName eq "jane@example.org"`.'
      schema: { type: string }
    ScimStartIndex:
      name: startIndex
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    ScimCount:
      name: count
      in: query
      schema: { type: integer, minimum: 0, maximum: 200, default: 200 }
    ScimExcludedAttributes:
      name: excludedAttributes
      in: query
      description: Comma-separated attributes to leave out, such as `members`.
      schema: { type: string }
    LogDays:
      name: days
      in: query
      description: Number of days, today included, from 1 to the retention.
      schema: { type: integer, minimum: 1, default: 1 }
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    TargetId:
      name: id
      in: path
      required: true
      description: Device id.
      schema: { type: integer, format: int64 }
    PackId:
      name: id
      in: path
      required: true
      description: Pack id, as declared in its YAML.
      schema: { type: string }
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9-]{2,40}$" }
    ComponentKey:
      name: key
      in: path
      required: true
      description: The service's `key` in the public document (its label in URL form).
      schema: { type: string }
    BadgeDays:
      name: days
      in: query
      description: Window of the mean, `400` beyond the page's history.
      schema: { type: integer, enum: [1, 7, 30, 90], default: 30 }
    SubscriptionToken:
      name: token
      in: query
      required: true
      description: The token from the confirmation or update email.
      schema: { type: string }
    ContainerName:
      name: name
      in: path
      required: true
      description: Container name, as Docker reports it.
      schema: { type: string, maxLength: 128 }
    FailureDays:
      name: days
      in: query
      description: How far back to look.
      schema: { type: integer, minimum: 1 }

  headers:
    RetryAfter:
      description: Seconds to wait before trying again.
      schema: { type: integer }
    RateLimitLimit:
      description: Calls allowed per minute for this token.
      schema: { type: integer }
    RateLimitRemaining:
      description: Calls left in the current window.
      schema: { type: integer }
    RateLimitReset:
      description: Seconds until the window resets.
      schema: { type: integer }
    WwwAuthenticate:
      description: "`Bearer` (with `error=\"invalid_token\"` for an expired token)."
      schema: { type: string }

  requestBodies:
    ScimResource:
      required: true
      content:
        application/scim+json:
          schema: { $ref: "#/components/schemas/ScimResource" }
        application/json:
          schema: { $ref: "#/components/schemas/ScimResource" }
    ScimPatch:
      required: true
      content:
        application/scim+json:
          schema: { $ref: "#/components/schemas/ScimPatch" }
        application/json:
          schema: { $ref: "#/components/schemas/ScimPatch" }

  responses:
    ScimResource:
      description: A SCIM resource (RFC 7643).
      content:
        application/scim+json:
          schema: { $ref: "#/components/schemas/ScimResource" }
    ScimList:
      description: A SCIM `ListResponse`.
      content:
        application/scim+json:
          schema:
            type: object
            required: [schemas, totalResults, Resources]
            properties:
              schemas: { type: array, items: { type: string } }
              totalResults: { type: integer }
              startIndex: { type: integer }
              itemsPerPage: { type: integer }
              Resources:
                type: array
                items: { $ref: "#/components/schemas/ScimResource" }
    ScimError:
      description: >-
        A SCIM error: `400` (`scimType` invalidFilter, invalidValue,
        invalidSyntax, mutability, noTarget, invalidPath), `401` missing or
        wrong token, `403` the target is an administrator, `404` unknown id or
        SCIM disabled, `409` uniqueness, `429` too many failed attempts.
      content:
        application/scim+json:
          schema: { $ref: "#/components/schemas/ScimError" }
    BadRequest:
      description: The request is malformed or invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: No valid session or API token (unknown, revoked or expired token).
      headers:
        WWW-Authenticate: { $ref: "#/components/headers/WwwAuthenticate" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: >-
        Not allowed: viewer, operator outside alert handling, or `read` token
        on a write operation, token on a
        session-only operation or from a network it is not allowed from,
        missing `X-Requested-With: DumbMonit` on a cookie write.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Unknown id.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Not possible in the current state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PageAccessRequired:
      description: >-
        A private status page: `access` says what it wants, `password` (POST it to
        `/api/public/status/{slug}/access`) or `users` (sign in to DumbMonit).
      content:
        application/json:
          schema:
            type: object
            required: [error, access]
            properties:
              error: { type: string }
              access: { type: string, enum: [password, users] }
    TooManyRequests:
      description: Rate limited.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
        RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
        RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
        RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadGateway:
      description: >-
        A service the server depends on (the metrics database) is unreachable,
        too slow or answered with an error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Svg:
      description: An SVG badge, `Cache-Control public, max-age=60`.
      content:
        image/svg+xml:
          schema: { type: string }

  schemas:
    ScimSettings:
      type: object
      required: [enabled, base_url, token_set, token_created_at, default_role]
      properties:
        enabled: { type: boolean }
        base_url: { type: string, description: "Tenant URL to give the identity provider: `<origin>/api/scim/v2`." }
        token_set: { type: boolean }
        token_created_at: { type: [string, "null"], description: RFC 3339 UTC. }
        default_role: { type: string, enum: [viewer, operator] }

    ScimResource:
      type: object
      description: A SCIM `User` or `Group` (RFC 7643 §4), or a discovery document.
      additionalProperties: true
      properties:
        schemas: { type: array, items: { type: string } }
        id: { type: string }

    ScimPatch:
      type: object
      required: [Operations]
      properties:
        schemas: { type: array, items: { type: string } }
        Operations:
          type: array
          items:
            type: object
            required: [op]
            properties:
              op: { type: string, description: "`add`, `replace` or `remove`, in any case." }
              path: { type: string }
              value: {}

    ScimError:
      type: object
      required: [schemas, status, detail]
      properties:
        schemas: { type: array, items: { type: string } }
        status: { type: string, description: The HTTP status, as a string. }
        scimType: { type: string }
        detail: { type: string }

    RunbookLink:
      type: object
      required: [scope, value]
      properties:
        scope: { type: string, enum: [rule, group, kind] }
        value: { type: string, description: "Rule uid, folder name or device kind." }
    RunbookInput:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 200 }
        body: { type: string, description: "Markdown, 64 KiB max. HTML is shown as text." }
        links: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/RunbookLink" } }
    Runbook:
      type: object
      required: [id, title, body, links, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        body: { type: string }
        links: { type: array, items: { $ref: "#/components/schemas/RunbookLink" } }
        created_at: { type: string }
        updated_at: { type: string }
        updated_by: { type: [string, "null"] }
    RemediationKind:
      type: object
      required: [kind, label, description, needs_agent, fields]
      properties:
        kind: { type: string, enum: [service.restart, container.restart, script.run, webhook] }
        label: { type: string }
        description: { type: string }
        needs_agent: { type: boolean }
        fields:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              input: { type: string, enum: [text, url, secret, params] }
              required: { type: boolean }
              help: { type: string }
    RemediationActionInput:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, maxLength: 100 }
        kind: { type: string, enum: [service.restart, container.restart, script.run, webhook] }
        params:
          type: object
          description: >-
            service.restart `{service}`, container.restart `{container}`, script.run
            `{script, params}`, webhook `{url}`.
        target_id: { type: [integer, "null"], format: int64 }
        secrets:
          type: object
          description: "webhook `{token}`. Omitted: kept; `{}`: cleared. Never returned."
          additionalProperties: { type: string }
    RemediationAction:
      type: object
      required: [id, name, kind, params, has_secret, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { type: string }
        params: { type: object }
        has_secret: { type: boolean }
        target_id: { type: [integer, "null"], format: int64 }
        created_at: { type: string }
        updated_at: { type: string }
    RemediationPolicyInput:
      type: object
      required: [action_id, rule_uid]
      properties:
        action_id: { type: integer, format: int64 }
        rule_uid: { type: string }
        target_id: { type: [integer, "null"], format: int64 }
        after_minutes: { type: integer, minimum: 1, maximum: 1440, default: 5 }
        max_attempts: { type: integer, minimum: 1, maximum: 10, default: 1 }
        window_minutes: { type: integer, minimum: 5, maximum: 10080, default: 60 }
    RemediationPolicy:
      type: object
      required: [id, action_id, action_name, action_kind, rule_uid, after_minutes, max_attempts, window_minutes, enabled]
      properties:
        id: { type: integer, format: int64 }
        action_id: { type: integer, format: int64 }
        action_name: { type: string }
        action_kind: { type: string }
        rule_uid: { type: string }
        target_id: { type: [integer, "null"], format: int64 }
        after_minutes: { type: integer }
        max_attempts: { type: integer }
        window_minutes: { type: integer }
        enabled: { type: boolean, description: "Armed (confirmed in two steps)." }
        armed_by: { type: [string, "null"] }
        armed_at: { type: [string, "null"] }
        halted_at: { type: [string, "null"], description: "Set after two failed runs in a row." }
        halt_reason: { type: [string, "null"] }
        created_at: { type: string }
        updated_at: { type: string }
    RemediationRun:
      type: object
      required: [id, action_name, kind, params, trigger, requested_by, status, created_at]
      properties:
        id: { type: integer, format: int64 }
        action_id: { type: [integer, "null"], format: int64 }
        action_name: { type: string }
        kind: { type: string }
        params: { type: object, description: "Without secrets." }
        target_id: { type: [integer, "null"], format: int64 }
        target_name: { type: [string, "null"] }
        fingerprint: { type: [string, "null"] }
        rule_uid: { type: [string, "null"] }
        policy_id: { type: [integer, "null"], format: int64 }
        trigger: { type: string, enum: [manual, auto] }
        requested_by: { type: string }
        status: { type: string, enum: [queued, running, done, failed, cancelled, expired] }
        output: { type: [string, "null"], description: "Truncated to 4 KiB, end kept." }
        created_at: { type: string }
        finished_at: { type: [string, "null"] }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: Human-readable message. }

    StatusMessage:
      type: object
      required: [status]
      properties:
        status: { type: string }
        message: { type: string }

    # ----------------------------------------------------------- santé
    Health:
      type: object
      required: [status, version, database, victoria]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        build: { type: string, description: 'Short commit the server was built from; absent from local builds.' }
        database: { $ref: "#/components/schemas/ComponentHealth" }
        victoria: { $ref: "#/components/schemas/ComponentHealth" }
        demo: { type: boolean, description: 'Demonstration mode, every write refused.' }
    UpdateInfo:
      type: object
      required: [current, update_available, enabled, locked_by_env]
      properties:
        current: { type: string, description: Running version. }
        latest: { type: [string, "null"], description: Latest release known; null before the first successful check. }
        release_url: { type: [string, "null"], description: GitHub page of that release. }
        notes: { type: [string, "null"], description: Release notes, shortened. }
        update_available: { type: boolean }
        checked_at: { type: [string, "null"], description: "Last successful check, UTC without suffix." }
        enabled: { type: boolean, description: The check is active. }
        locked_by_env: { type: boolean, description: Turned off by DUMBMONIT_UPDATE_CHECK=off; the setting cannot override it. }
        error: { type: [string, "null"], description: Why the last check failed. }
    ComponentHealth:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        error: { type: string }
        embedded: { type: boolean, description: "VictoriaMetrics only: `true` when the server runs its own." }

    # ----------------------------------------------------------- comptes
    Role:
      type: string
      enum: [admin, operator, viewer]
      description: >-
        `admin` does everything; `operator` reads everything and handles
        alerts (operations marked `x-roles: [admin, operator]`); `viewer`
        reads.
    TeamLevel:
      type: string
      enum: [read, operate, manage]
    TeamGrant:
      type: object
      required: [folder, level]
      properties:
        folder:
          type: string
          description: "`*` for every target, empty for targets in no folder, otherwise a folder (its subfolders included)."
        level: { $ref: "#/components/schemas/TeamLevel" }
    TeamMember:
      type: object
      required: [user_id, username, display_name, role, source]
      properties:
        user_id: { type: integer, format: int64 }
        username: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        source: { type: string, enum: [manual, idp, scim] }
    Team:
      type: object
      required: [id, name, description, idp_groups, members, grants, created_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        idp_groups: { type: array, items: { type: string } }
        members: { type: array, items: { $ref: "#/components/schemas/TeamMember" } }
        grants: { type: array, items: { $ref: "#/components/schemas/TeamGrant" } }
        created_at: { type: string }
    TeamInput:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        idp_groups: { type: array, items: { type: string } }
        members: { type: array, items: { type: integer, format: int64 } }
        grants: { type: array, items: { $ref: "#/components/schemas/TeamGrant" } }
    TeamSettings:
      type: object
      required: [unassigned_access]
      properties:
        unassigned_access:
          type: string
          enum: [all, none]
          description: What an account that belongs to no team can see.
    TeamsOverview:
      type: object
      required: [teams, folders, settings]
      properties:
        teams: { type: array, items: { $ref: "#/components/schemas/Team" } }
        folders: { type: array, items: { type: string } }
        settings: { $ref: "#/components/schemas/TeamSettings" }
    TeamAccess:
      type: object
      required: [scoped, teams, grants]
      properties:
        scoped: { type: boolean, description: "`true` when the account only sees what its teams open." }
        teams: { type: array, items: { type: string } }
        grants: { type: array, items: { $ref: "#/components/schemas/TeamGrant" } }
        ceiling:
          oneOf:
            - { $ref: "#/components/schemas/TeamLevel" }
            - { type: "null" }
    CurrentUser:
      allOf:
        - { $ref: "#/components/schemas/User" }
        - type: object
          required: [access, msp]
          properties:
            access: { $ref: "#/components/schemas/TeamAccess" }
            msp: { $ref: "#/components/schemas/MspAccess" }
    MspAccess:
      type: object
      required: [enabled, admin, clients]
      properties:
        enabled: { type: boolean, description: MSP mode is on. }
        admin: { type: boolean, description: "MSP administrator: sees and manages every client." }
        clients:
          type: array
          description: Clients the account can pick - all of them for the MSP administrator, its own otherwise. Empty when MSP mode is off.
          items: { $ref: "#/components/schemas/ClientRef" }
        current: { type: [integer, "null"], format: int64, description: "Client of the current view (header `X-DumbMonit-Client`, or the only client of the account)." }
    ClientRef:
      type: object
      required: [id, name, has_logo]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        has_logo: { type: boolean }
    Client:
      type: object
      required: [id, name, description, contacts, idp_groups, members, targets, has_logo, sla_report, report_timezone, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        contacts: { type: array, items: { type: string, format: email }, description: Recipients of the automatic monthly SLA report. }
        monitor_quota: { type: [integer, "null"], description: "Most targets the client may have; `null` for no limit." }
        idp_groups: { type: array, items: { type: string } }
        members: { type: array, items: { $ref: "#/components/schemas/TeamMember" } }
        targets: { type: integer }
        has_logo: { type: boolean }
        sla_report: { type: boolean, description: Send the SLA report of the past month to the contacts on the 1st. }
        sla_objective: { type: [number, "null"] }
        report_timezone: { type: string }
        report_last_period: { type: [string, "null"], description: "Last month sent, `YYYY-MM`." }
        report_last_error: { type: [string, "null"] }
        created_at: { type: string }
        updated_at: { type: string }
    ClientInput:
      type: object
      description: An omitted field keeps its value.
      properties:
        name: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        contacts: { type: array, items: { type: string, format: email }, maxItems: 20 }
        monitor_quota: { type: [integer, "null"], minimum: 0 }
        idp_groups: { type: array, items: { type: string } }
        members: { type: array, items: { type: integer, format: int64 }, description: Accounts added by hand. }
        sla_report: { type: boolean }
        sla_objective: { type: [number, "null"], exclusiveMinimum: 0, maximum: 100 }
        report_timezone: { type: string }
    MspSettings:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean, description: "MSP mode on. Off, a single-client instance behaves as before." }
    ClientsOverview:
      type: object
      required: [settings, clients, unassigned_users]
      properties:
        settings: { $ref: "#/components/schemas/MspSettings" }
        clients: { type: array, items: { $ref: "#/components/schemas/Client" } }
        unassigned_users: { type: array, items: { type: integer, format: int64 }, description: Non-admin accounts in no client - with MSP mode on they see nothing. }
    ClientHealth:
      type: object
      required: [id, name, has_logo, targets, alerting_targets, critical, warning, info, paused]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        has_logo: { type: boolean }
        targets: { type: integer }
        monitor_quota: { type: [integer, "null"] }
        alerting_targets: { type: integer, description: Targets with at least one firing alert. }
        critical: { type: integer }
        warning: { type: integer }
        info: { type: integer }
        paused: { type: integer }
    ClientKind:
      type: string
      enum: [target, status_page, agent_token, channel, rule, silence, report, dashboard, schedule, escalation_policy, runbook, remediation_action]
    ClientAssign:
      type: object
      required: [kind, ids]
      properties:
        kind: { $ref: "#/components/schemas/ClientKind" }
        ids: { type: array, items: { type: integer, format: int64 }, maxItems: 1000 }
        client_id: { type: [integer, "null"], format: int64, description: "`null`: shared by the instance (channels, rules, maintenance windows, reports, status pages)." }
    User:
      type: object
      required: [id, username, display_name, role, auth, disabled, totp_enabled, created_at]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        auth: { type: string, enum: [password, ldap, saml, oidc] }
        disabled: { type: boolean }
        totp_enabled: { type: boolean }
        created_at: { type: string }
        last_login_at: { type: [string, "null"] }
    AuthStatus:
      type: object
      required: [configured, authenticated, oidc, demo]
      properties:
        configured: { type: boolean, description: "`false` on a fresh instance." }
        authenticated: { type: boolean }
        user: { $ref: "#/components/schemas/User" }
        oidc:
          type: object
          required: [enabled, provider_name, login_url]
          properties:
            enabled: { type: boolean }
            provider_name: { type: string }
            login_url: { type: string }
        ldap:
          type: object
          required: [enabled]
          properties:
            enabled: { type: boolean, description: Usernames without a local password are checked against the directory. }
        saml:
          type: object
          required: [enabled, label]
          properties:
            enabled: { type: boolean, description: "SAML sign-in is configured; the button leads to `/api/auth/saml/start`." }
            label: { type: string, description: Button label. }
        passkeys: { type: boolean, description: "At least one passkey is registered: the sign-in screen offers to use one." }
        demo: { type: boolean }
    SetupRequest:
      type: object
      required: [setup_code, password]
      properties:
        setup_code:
          type: string
          writeOnly: true
          description: One-time code printed in the server logs at startup (or `DUMBMONIT_SETUP_CODE`). Case, dashes and spaces are ignored.
        username: { type: string, default: admin }
        password: { type: string, minLength: 12, writeOnly: true }
    LoginRequest:
      type: object
      required: [password]
      properties:
        username: { type: string }
        password: { type: string, writeOnly: true }
    TotpChallenge:
      type: object
      required: [totp_required, pending]
      properties:
        totp_required: { type: boolean, const: true }
        pending: { type: string, description: 'Ticket valid five minutes, dead after five wrong codes.' }
    TotpLoginRequest:
      type: object
      required: [pending, code]
      properties:
        pending: { type: string }
        code: { type: string, description: A six-digit code or a recovery code. }
    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, writeOnly: true }
        new_password: { type: string, writeOnly: true }
    PasswordConfirmation:
      type: object
      required: [password]
      properties:
        password: { type: string, writeOnly: true }
    TotpStatus:
      type: object
      required: [enabled, pending, recovery_codes_left]
      properties:
        enabled: { type: boolean }
        pending: { type: boolean }
        recovery_codes_left: { type: integer }
    TotpEnrolment:
      type: object
      required: [secret, otpauth_uri, issuer, account]
      properties:
        secret: { type: string, description: Base32. }
        otpauth_uri: { type: string }
        issuer: { type: string }
        account: { type: string }
    TotpCode:
      type: object
      required: [code]
      properties:
        code: { type: string }
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items: { type: string }
    AuditEntry:
      type: object
      required: [id, at, action]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string }
        actor: { type: [string, "null"] }
        action: { type: string, examples: [login, login.failed, token.created, user.updated] }
        subject: { type: [string, "null"] }
        ip: { type: [string, "null"] }
    SamlConfigUpdate:
      type: object
      properties:
        enabled: { type: boolean }
        idp_entity_id: { type: string, description: "Identity provider entity ID: the expected `Issuer`." }
        idp_sso_url: { type: string, description: Identity provider sign-in endpoint (HTTP-Redirect binding). }
        idp_certificates:
          type: array
          items: { type: string }
          description: PEM signing certificates of the identity provider (several during a rollover). Only these keys verify assertions.
        sp_entity_id: { type: string, description: "DumbMonit's entity ID (the expected audience). Empty: `sp_metadata_url`." }
        allow_idp_initiated: { type: boolean, description: Accept responses the identity provider sends without a request. Off by default. }
        auto_create: { type: boolean, description: Create an account on first sign-in. Off by default. }
        button_label: { type: string, description: "Sign-in button label. Empty: `SAML`." }
        attr_email: { type: string, description: E-mail attribute name. Empty tries the usual names (Entra ID, Okta, Keycloak). }
        attr_name: { type: string, description: Display name attribute. Empty tries the usual names. }
        attr_groups: { type: string, description: Groups attribute. Empty tries the usual names. }
        admin_groups: { type: array, items: { type: string } }
        operator_groups: { type: array, items: { type: string } }
    SamlConfig:
      allOf:
        - $ref: "#/components/schemas/SamlConfigUpdate"
        - type: object
          properties:
            sp_metadata_url: { type: string, readOnly: true, description: Service provider metadata URL to give to the identity provider. }
            acs_url: { type: string, readOnly: true, description: Assertion consumer service (reply URL) to declare at the identity provider. }
    SamlMetadataImportRequest:
      type: object
      required: [xml]
      properties:
        xml: { type: string, description: The identity provider metadata document. }
    SamlMetadataImport:
      type: object
      required: [idp_entity_id, idp_sso_url, idp_certificates]
      properties:
        idp_entity_id: { type: string }
        idp_sso_url: { type: string }
        idp_certificates: { type: array, items: { type: string } }
    OidcConfig:
      type: object
      properties:
        source: { type: string, enum: [settings, env, none] }
        enabled: { type: boolean }
        env_available: { type: boolean }
        issuer: { type: string }
        client_id: { type: string }
        has_client_secret: { type: boolean }
        provider_name: { type: string }
        scopes: { type: string }
        auto_create: { type: boolean }
        admin_groups:
          type: array
          items: { type: string }
        operator_groups:
          type: array
          items: { type: string }
          description: Members who are not in an admin group become operators.
        groups_claim: { type: string }
        public_url: { type: string }
        redirect_uri: { type: string }
    OidcConfigUpdate:
      type: object
      required: [issuer, client_id]
      properties:
        issuer: { type: string }
        client_id: { type: string }
        client_secret: { type: [string, "null"], writeOnly: true, description: Absent or empty keeps the stored one. }
        provider_name: { type: string }
        scopes: { type: string }
        auto_create: { type: boolean, default: true }
        admin_groups:
          type: array
          items: { type: string }
        operator_groups:
          type: array
          items: { type: string }
          description: Members who are not in an admin group become operators.
        groups_claim: { type: string }
        public_url: { type: string }
    OidcTestRequest:
      type: object
      properties:
        issuer: { type: string, description: Defaults to the effective configuration's issuer. }
    OidcTestReport:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        error: { type: string }
        discovery: { type: object, additionalProperties: true }
    LdapGroupMode:
      type: string
      enum: [memberof, search]
      description: "`memberof`: the user's `memberOf` attribute. `search`: a group search with `group_filter`."
    LdapConfig:
      type: object
      properties:
        source: { type: string, enum: [settings, env, none] }
        enabled: { type: boolean }
        env_available: { type: boolean }
        allow_plain: { type: boolean, description: "`DUMBMONIT_LDAP_ALLOW_PLAIN` is set: `ldap://` without StartTLS is accepted." }
        url: { type: string, description: "`ldaps://host:636` or `ldap://host:389`." }
        starttls: { type: boolean }
        tls_verify: { type: boolean }
        ca_cert: { type: string, description: PEM of the authority that issued the server certificate. }
        bind_dn: { type: string }
        has_bind_password: { type: boolean }
        base_dn: { type: string }
        user_filter: { type: string, description: "Contains `{username}`, escaped per RFC 4515." }
        username_attribute: { type: string }
        display_name_attribute: { type: string }
        email_attribute: { type: string }
        group_mode: { $ref: "#/components/schemas/LdapGroupMode" }
        group_base_dn: { type: string }
        group_filter: { type: string, description: "Contains `{dn}` and/or `{username}`." }
        admin_groups:
          type: array
          items: { type: string }
        operator_groups:
          type: array
          items: { type: string }
        viewer_groups:
          type: array
          items: { type: string }
          description: Once any group list is filled, only members of a listed group can sign in.
        timeout_seconds: { type: integer }
    LdapConfigUpdate:
      type: object
      properties:
        url: { type: string }
        starttls: { type: boolean }
        tls_verify: { type: boolean, default: true }
        ca_cert: { type: string }
        bind_dn: { type: string }
        bind_password: { type: [string, "null"], writeOnly: true, description: Absent or empty keeps the stored one. }
        base_dn: { type: string }
        user_filter: { type: string }
        username_attribute: { type: string }
        display_name_attribute: { type: string }
        email_attribute: { type: string }
        group_mode: { $ref: "#/components/schemas/LdapGroupMode" }
        group_base_dn: { type: string }
        group_filter: { type: string }
        admin_groups:
          type: array
          items: { type: string }
        operator_groups:
          type: array
          items: { type: string }
        viewer_groups:
          type: array
          items: { type: string }
        timeout_seconds: { type: integer, minimum: 1, maximum: 30, default: 5 }
    LdapTestRequest:
      type: object
      properties:
        config: { $ref: "#/components/schemas/LdapConfigUpdate" }
        username: { type: string, description: User to search; its password is never asked. }
    LdapTestReport:
      type: object
      required: [ok, steps]
      properties:
        ok: { type: boolean }
        steps:
          type: array
          items:
            type: object
            required: [step, ok, detail, elapsed_ms]
            properties:
              step: { type: string, enum: [connect, service_bind, user_search, groups] }
              ok: { type: boolean }
              detail: { type: string }
              elapsed_ms: { type: integer }
        user:
          type: object
          properties:
            dn: { type: string }
            username: { type: string }
            display_name: { type: string }
            email: { type: [string, "null"] }
            groups:
              type: array
              items: { type: string }
            role: { oneOf: [{ $ref: "#/components/schemas/Role" }, { type: "null" }] }
            allowed: { type: boolean }
    UserCreate:
      type: object
      required: [username, role]
      properties:
        username: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        password: { type: string, writeOnly: true }
    UserUpdate:
      type: object
      properties:
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        disabled: { type: boolean }
        password: { type: string, writeOnly: true }

    # ----------------------------------------------------------- jetons
    TokenScope:
      type: string
      enum: [read, write]
      description: "`read`: every `GET`. `write`: also `POST`, `PUT`, `DELETE`."
    ApiToken:
      type: object
      required: [id, name, prefix, scope, created_at, created_by, expires_at, expired, allowed_networks, last_used_at, last_used_ip, revoked_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        prefix: { type: string, description: "Start of the token (`dmt_` and a few characters), to recognise it.", examples: [dmt_3f9a1c2b] }
        scope: { $ref: "#/components/schemas/TokenScope" }
        created_at: { type: string, format: date-time }
        created_by: { type: [string, "null"], description: Account that created the token. }
        expires_at: { type: [string, "null"], format: date-time, description: "`null`: never expires." }
        expired: { type: boolean }
        allowed_networks:
          type: array
          description: Networks the token may be used from (normalised CIDR); empty means anywhere.
          items: { type: string, examples: ["192.168.1.0/24"] }
        last_used_at: { type: [string, "null"], format: date-time, description: Updated at most once a minute. }
        last_used_ip: { type: [string, "null"] }
        revoked_at: { type: [string, "null"], format: date-time }
    ApiTokenCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        scope: { $ref: "#/components/schemas/TokenScope", default: read }
        expires_in_days:
          type: [integer, "null"]
          minimum: 1
          maximum: 3650
          description: 'Absent or `null`: never expires.'
        allowed_networks:
          type: array
          maxItems: 32
          description: CIDR networks or single addresses; absent or empty means anywhere.
          items: { type: string }
    CreatedApiToken:
      allOf:
        - $ref: "#/components/schemas/ApiToken"
        - type: object
          required: [secret]
          properties:
            secret: { type: string, description: "The token in clear — shown once, never again.", examples: ["dmt_…"] }
    AgentToken:
      type: object
      required: [id, name, prefix, created_at, uses]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        prefix: { type: string }
        created_at: { type: string }
        last_used_at: { type: [string, "null"] }
        revoked_at: { type: [string, "null"] }
        max_uses: { type: [integer, "null"], description: "`null` for a fleet token." }
        uses: { type: integer }
        expires_at: { type: [string, "null"], description: Enrolments stop after it; enrolled machines keep reporting. }
        relay: { type: boolean, description: The machine it enrols becomes a relay for its site at its first report. }
        relay_site: { type: [string, "null"] }
        ad_domain: { type: [string, "null"], description: Active Directory fleet token - enrols only fully qualified names in this domain. }
        client_id: { type: integer, format: int64, description: "MSP mode: the client this token enrols into, and the only one its machines report to." }
    AgentInstallParams:
      type: object
      required: [base_url, checksums, linux_template, windows_template]
      properties:
        base_url: { type: string, description: URL of the web port (install scripts and binaries). }
        agent_url: { type: [string, "null"], description: "URL of the encrypted agent channel, `https://host:8443`." }
        ca_pin: { type: [string, "null"], description: SHA-256 fingerprint of the agent certificate authority. }
        checksums:
          type: array
          items:
            type: object
            required: [platform, sha256]
            properties:
              platform: { type: string }
              sha256: { type: string }
        linux_template: { type: string, description: "Unix install command; replace `{TOKEN}`." }
        windows_template: { type: string, description: "PowerShell install command; replace `{TOKEN}`." }
    AgentChannel:
      type: object
      required: [enabled, required, required_setting, protocol, key_exchange, agents]
      properties:
        enabled: { type: boolean, description: The agent port is open. }
        port: { type: [integer, "null"] }
        required: { type: boolean, description: The plain channel is refused right now. }
        required_setting: { type: boolean }
        legacy_until: { type: [string, "null"], description: End of the transition set by DUMBMONIT_AGENT_LEGACY_DAYS. }
        protocol: { type: string }
        key_exchange: { type: string }
        ca_pin: { type: [string, "null"] }
        rotation:
          type: [object, "null"]
          properties:
            started_at: { type: [string, "null"] }
            next_pin: { type: string }
            ready: { type: integer }
            total: { type: integer }
        agents:
          type: array
          items:
            type: object
            required: [id, channel]
            properties:
              id: { type: integer, format: int64 }
              channel: { type: string, enum: [mtls, legacy, none] }
              group: { type: [string, "null"] }
              tls_seen_at: { type: [string, "null"] }
              legacy_seen_at: { type: [string, "null"] }
    AgentUpdateSettings:
      type: object
      required: [enabled, window, canary_minutes, allow_unsigned]
      properties:
        enabled: { type: boolean, description: Agents update themselves (default true). }
        window: { type: string, enum: [any, maintenance, manual] }
        canary_minutes: { type: integer, minimum: 0, maximum: 10080, description: Minutes canary agents must run the new build before the others get it. }
        allow_unsigned: { type: boolean, description: Accept unsigned builds (development), over the encrypted agent channel only. }
    AgentUpdateSettingsChange:
      type: object
      properties:
        enabled: { type: boolean }
        window: { type: string, enum: [any, maintenance, manual] }
        canary_minutes: { type: integer, minimum: 0, maximum: 10080 }
        allow_unsigned: { type: boolean }
    AgentUpdates:
      type: object
      required: [settings, version, binaries, rollout, agents]
      properties:
        settings: { $ref: "#/components/schemas/AgentUpdateSettings" }
        version: { type: string, description: Version of this server and of the agent binaries it ships. }
        build: { type: [string, "null"], description: Commit of this build. }
        binaries:
          type: array
          items:
            type: object
            required: [platform, sha256, signed]
            properties:
              platform: { type: string, examples: [linux-x86_64] }
              sha256: { type: string }
              signed: { type: boolean }
        rollout:
          type: object
          required: [canaries, canaries_updated, open]
          properties:
            canaries: { type: integer }
            canaries_updated: { type: integer }
            open: { type: boolean, description: Agents that are not canaries may update. }
            reason: { type: [string, "null"] }
        agents:
          type: array
          items:
            type: object
            required: [id, name, hostname, version, canary, requested, status]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
              hostname: { type: string }
              version: { type: string }
              platform: { type: [string, "null"] }
              sha256: { type: [string, "null"] }
              enabled: { type: [boolean, "null"], description: Per-agent override; null follows the global setting. }
              canary: { type: boolean }
              requested: { type: boolean, description: Update now was asked and has not been answered yet. }
              status:
                type: string
                enum: [up_to_date, pending, updating, failed, refused, disabled, manual, waiting_window, waiting_canary, newer, legacy, container, read_only, disabled_locally, unsupported, no_binary]
              reason: { type: [string, "null"] }
              last:
                type: [object, "null"]
                properties:
                  outcome: { type: string, enum: [succeeded, failed, rolled_back, refused] }
                  version: { type: [string, "null"] }
                  reason: { type: [string, "null"] }
                  at: { type: [string, "null"] }
              last_seen_at: { type: [string, "null"] }
    AgentTokenCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        base_url: { type: string, description: The URL agents will use; the listen address by default. }
        reusable: { type: boolean, default: false, description: 'Without it, the token enrols one machine.' }
        max_uses: { type: [integer, "null"], minimum: 1 }
        expires_in_days: { type: [integer, "null"], minimum: 1 }
        relay: { type: boolean, default: false, description: Make the enrolled machine a relay for a remote site. }
        site: { type: [string, "null"], maxLength: 80, description: Site of that relay. }
        client_id: { type: [integer, "null"], format: int64, description: "MSP mode: the client the token enrols into. Absent: the default client." }
    CreatedAgentToken:
      allOf:
        - $ref: "#/components/schemas/AgentToken"
        - type: object
          required: [secret, install_linux, install_windows]
          properties:
            secret: { type: string, description: Shown once. }
            install_linux: { type: string }
            install_windows: { type: string }
    AgentAdKitCreate:
      type: object
      required: [domain]
      properties:
        domain: { type: string, description: 'DNS name of the domain, e.g. corp.example.com.' }
        base_url: { type: string, description: The URL servers will use; the listen address by default. }
        max_uses: { type: [integer, "null"], minimum: 1, description: Servers it may enrol; unlimited when absent. }
        expires_in_days: { type: [integer, "null"], minimum: 1, default: 30 }
        target_ou: { type: [string, "null"], maxLength: 512, description: Distinguished name of the OU to link the group policy to. }
        include_domain_controllers: { type: boolean, default: false }
        security_group: { type: [string, "null"], maxLength: 512, description: Only members of this group apply the group policy. }
        sysvol_binary: { type: boolean, default: false, description: Also copy the agent binary to SYSVOL for servers without outbound access. }
        server_host: { type: [string, "null"], description: 'DNS name (FQDN) or IPv4 address of this server that agents contact, with an optional :port. Replaces the host of base_url.' }
        dns_server: { type: [string, "null"], description: IP address of a DNS server used to resolve server_host on machines that cannot. }
    CreatedAgentAdKit:
      type: object
      required: [token, secret, script, filename, folder, install_windows, server_url]
      properties:
        token: { $ref: "#/components/schemas/AgentToken" }
        secret: { type: string, description: Shown once. }
        script: { type: string, description: Content of Deploy-DumbMonit.ps1 (UTF-8 with a byte order mark). }
        filename: { type: string }
        folder: { type: string, description: Folder the enrolled servers are filed in. }
        install_windows: { type: string }
        server_url: { type: string, description: URL the agents contact, as written in the kit. }
        dns_server: { type: [string, "null"], description: DNS server written in the kit, if any. }

    # -------------------------------------------------- types d'équipement
    KindDescription:
      type: object
      required: [kind, label, summary, examples, credential_types, credentials, address_hint, default_port, setup, options]
      properties:
        kind: { type: string }
        label: { type: string }
        summary: { type: string }
        examples:
          type: array
          items: { type: string }
        credential_types:
          type: array
          description: The `type` values of `credentials`, in order of preference.
          items: { type: string }
        credentials:
          type: array
          items: { $ref: "#/components/schemas/CredentialDescription" }
        address_hint: { type: string }
        default_port: { type: integer, description: "0 when there is none." }
        setup: { $ref: "#/components/schemas/SetupDescription" }
        options:
          type: array
          description: Settings read from the device's `tags`, in display order.
          items: { $ref: "#/components/schemas/OptionDescription" }
        requirements:
          type: array
          description: >-
            What the server's deployment (not the device) must provide for this type to work fully,
            with whether the server found it in place. Omitted when the type needs nothing. The
            interface writes the sentences from `id` and shows the notice while `satisfied` is false.
          items: { $ref: "#/components/schemas/Requirement" }
    Requirement:
      type: object
      required: [id, satisfied, doc_url, compose_snippet]
      properties:
        id:
          type: string
          description: "Stable identifier: `browser` (headless Chromium for website-change screenshots) or `icmp` (ICMP echo sockets for ping)."
        satisfied: { type: boolean, description: "True when the server found the requirement met (browser answering, ICMP socket opened)." }
        doc_url: { type: string, description: Documentation section that explains it. }
        compose_snippet: { type: string, description: YAML to add to docker-compose.yml, as is. }
    SetupDescription:
      type: object
      properties:
        title: { type: string }
        steps:
          type: array
          items: { type: string }
        ports:
          type: array
          description: >-
            Network ports to open, one per entry. `direction` is `to_device` (from the DumbMonit
            server or its relay agent to the device) or `to_server` (from the agent to the
            server). `optional` ports are only used by an option or mode, named in `purpose`.
            Omitted when the type opens no connection to the device.
          items:
            type: object
            properties:
              port: { type: integer }
              protocol: { type: string, enum: [tcp, udp] }
              direction: { type: string, enum: [to_device, to_server] }
              purpose: { type: string }
              optional: { type: boolean }
        permissions:
          type: array
          description: >-
            Rights, roles or permissions to give the monitoring account, one per entry: the first
            line is the right as the product names it, the optional next line says what it is for.
            Omitted when the type needs none.
          items: { type: string }
        warning: { type: string }
        doc_url: { type: string, description: "The 'Full guide' page of the documentation, or a pack's link." }
    OptionDescription:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        help: { type: string }
        placeholder: { type: string }
        default: { type: string }
        required: { type: boolean }
        input:
          type: string
          description: "`text`, `number`, `boolean`, `select`, `checklist`, `rows`, or `agent`: a choice among the agents known to the server, stored as the id of the agent's monitor (blank: none). Unknown values are shown as text."
        choices:
          type: array
          items: { type: string }
        group: { type: string, description: "Sub-heading under \"More options\"; empty: the UI falls back to a generic key-prefix heuristic." }
        items:
          type: array
          description: "Tick boxes of an `input: checklist` option. The tag holds the ticked `value`s separated by commas, `-` when none is ticked; absent means all are ticked. `default` is what a new monitor ticks."
          items:
            type: object
            properties:
              value: { type: string }
              label: { type: string }
              help: { type: string }
              badges: { type: array, items: { type: string } }
        columns:
          type: array
          description: "Columns of an `input: rows` option. The tag holds a JSON array of objects keyed by column `key`."
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              placeholder: { type: string }
              input: { type: string, enum: [text, select, boolean] }
              choices: { type: array, items: { type: string } }
              pattern: { type: string, description: "JavaScript regular expression the text must match; empty: none." }
              invalid: { type: string, description: Message shown when `pattern` does not match. }
              unique: { type: boolean }
    CredentialDescription:
      type: object
      properties:
        kind: { type: string }
        label: { type: string }
        help: { type: string }
        fields:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              help: { type: string }
              placeholder: { type: string }
              input: { type: string }
              choices:
                type: array
                items: { type: string }
              required: { type: boolean }

    DiscoveryRequest:
      type: object
      required: [cidr]
      properties:
        cidr: { type: string, examples: ["192.168.1.0/24"] }
        community: { type: string, default: public, writeOnly: true }
        port: { type: integer, default: 161 }
        timeout_ms: { type: integer, minimum: 100, maximum: 10000 }
    DiscoveryResult:
      type: object
      required: [devices, scanned]
      properties:
        scanned: { type: integer, description: Addresses probed. }
        devices:
          type: array
          items:
            type: object
            required: [address]
            properties:
              address: { type: string }
              sysdescr: { type: [string, "null"] }
              sysname: { type: [string, "null"] }
              sysobjectid: { type: [string, "null"] }
              suggested_profile: { type: [string, "null"] }

    DiscoveryJobRequest:
      type: object
      required: [cidr]
      properties:
        cidr: { type: string, examples: ["192.168.1.0/24"] }
        agent_id:
          type: [integer, "null"]
          format: int64
          description: Relay agent that runs the scan; null means the server itself.
        snmp_community: { type: string, default: public, writeOnly: true }
        depth: { type: string, enum: [standard, extended], default: standard }
    NetscanScheduleInput:
      type: object
      required: [cidr]
      properties:
        name: { type: string, maxLength: 80 }
        cidr: { type: string, examples: ["192.168.1.0/24"] }
        agent_id:
          type: [integer, "null"]
          format: int64
          description: Relay agent that runs the scan; null or absent means the server itself.
        interval_secs: { type: integer, minimum: 300, maximum: 2592000, default: 3600 }
        depth:
          type: string
          enum: [standard, extended]
          default: standard
          description: Port list of the discovery (`extended` tests more ports).
        enabled: { type: boolean, default: true }
    NetscanSchedule:
      type: object
      required: [id, name, cidr, agent_id, agent_name, interval_secs, depth, enabled, initialized, running, last_run_at, last_status, last_error, devices, unknown_devices, unknown_ports]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        cidr: { type: string }
        agent_id: { type: [integer, "null"], format: int64 }
        agent_name: { type: [string, "null"] }
        interval_secs: { type: integer }
        depth: { type: string, enum: [standard, extended] }
        enabled: { type: boolean }
        initialized: { type: boolean, description: "The first scan has initialized the inventory (nothing was reported)." }
        running: { type: boolean }
        last_run_at: { type: [string, "null"], description: UTC, no suffix. }
        last_status: { type: [string, "null"], enum: [running, done, failed, cancelled, null] }
        last_error: { type: [string, "null"] }
        devices: { type: integer }
        unknown_devices: { type: integer }
        unknown_ports: { type: integer, description: Unknown ports of known devices. }
    NetscanPort:
      type: object
      required: [id, port, protocol, product, known, first_seen, last_seen]
      properties:
        id: { type: integer, format: int64 }
        port: { type: integer }
        protocol: { type: string, enum: [tcp, udp] }
        product: { type: string }
        known: { type: boolean }
        first_seen: { type: string }
        last_seen: { type: string }
    NetscanDevice:
      type: object
      required: [id, schedule_id, ip, mac, hostname, vendor, known, first_seen, last_seen, ports]
      properties:
        id: { type: integer, format: int64 }
        schedule_id: { type: integer, format: int64 }
        ip: { type: string, description: Last address seen; a device is identified by its MAC when visible. }
        mac: { type: [string, "null"] }
        hostname: { type: [string, "null"] }
        vendor: { type: [string, "null"] }
        known: { type: boolean }
        first_seen: { type: string }
        last_seen: { type: string }
        ports:
          type: array
          items: { $ref: "#/components/schemas/NetscanPort" }
    DiscoveryJobSummary:
      type: object
      required: [id, cidr, agent_id, agent_name, status, started_at, finished_at, hosts_found]
      properties:
        id: { type: string }
        cidr: { type: string }
        agent_id: { type: [integer, "null"], format: int64 }
        agent_name: { type: [string, "null"] }
        status: { type: string, enum: [running, done, failed, cancelled] }
        started_at: { type: string }
        finished_at: { type: [string, "null"] }
        hosts_found: { type: integer }
    DiscoveryJob:
      allOf:
        - $ref: "#/components/schemas/DiscoveryJobSummary"
        - type: object
          required: [progress, error, hosts]
          properties:
            error: { type: [string, "null"] }
            progress:
              type: object
              required: [phase, probed, total]
              properties:
                phase: { type: string, enum: [sweep, fingerprint, done] }
                probed: { type: integer }
                total: { type: integer }
            hosts:
              type: array
              items: { $ref: "#/components/schemas/DiscoveredHost" }
    DiscoveredHost:
      type: object
      required: [ip, hostname, mac, vendor, services]
      properties:
        ip: { type: string }
        hostname: { type: [string, "null"], description: Reverse DNS. }
        mac: { type: [string, "null"], description: Only on the same L2 segment (host network). }
        vendor: { type: [string, "null"] }
        services:
          type: array
          items: { $ref: "#/components/schemas/DiscoveredService" }
    DiscoveredService:
      type: object
      required: [port, protocol, product, kind, version, confidence, tls, detail, monitored_target_id, prefill]
      properties:
        port: { type: integer }
        protocol: { type: string, enum: [tcp, udp] }
        product: { type: string, description: Readable label, e.g. "Proxmox VE". }
        kind: { type: [string, "null"], description: Matching DumbMonit collector kind. }
        version: { type: [string, "null"] }
        confidence: { type: string, enum: [high, medium, low] }
        tls: { type: boolean }
        detail: { type: [string, "null"] }
        monitored_target_id: { type: [string, "null"], description: Existing target already pointing at this address. }
        prefill:
          type: [object, "null"]
          additionalProperties: true
          description: Fields to pre-fill in the target form for `kind`; never a secret.
    LocalSubnets:
      type: object
      required: [subnets]
      properties:
        subnets:
          type: array
          description: Suggested IPv4 networks, most reliable source first.
          items:
            type: object
            required: [cidr, source]
            properties:
              cidr: { type: string, example: 192.168.1.0/24 }
              source:
                type: string
                enum: [config, devices, server]
              interface: { type: string, description: Server interface; `server` source only. }
    TargetTestRequest:
      description: A `TargetPayload`, plus the id of the device being edited.
      allOf:
        - $ref: "#/components/schemas/TargetPayload"
        - type: object
          properties:
            id:
              type: integer
              format: int64
              description: >-
                When editing, reuses the stored credential if `credential` is
                omitted (refused if the address or connection settings changed).
    TargetTestReport:
      type: object
      required: [ok, unreachable]
      properties:
        ok: { type: boolean }
        error: { type: [string, "null"], description: The probe error message. }
        unreachable: { type: boolean, description: True when the failure means "device down". }
        sysname: { type: [string, "null"] }
        sysdescr: { type: [string, "null"] }
        profile_id: { type: [string, "null"], description: Profile auto-detection would pick. }
    Onboarding:
      type: object
      required: [skipped, complete, dismissed, has_target, has_channel, notification_confirmed]
      properties:
        skipped: { type: boolean }
        complete: { type: boolean, description: Latched; never goes back to false. }
        completed_at: { type: [string, "null"] }
        dismissed:
          type: array
          items: { type: string, enum: [device, channel, test] }
        has_target: { type: boolean }
        has_channel: { type: boolean }
        notification_confirmed: { type: boolean }
    OnboardingPatch:
      type: object
      properties:
        skipped: { type: boolean }
        dismissed:
          type: array
          items: { type: string, enum: [device, channel, test] }
    ProductMode:
      type: string
      enum: [homelab, enterprise]
      description: "`homelab`: a simpler interface. `enterprise`: the dense dark interface with advanced options in view. Presentation only."
    PublicInstance:
      type: object
      required: [product_mode, setup_completed]
      properties:
        product_mode: { $ref: "#/components/schemas/ProductMode" }
        setup_completed: { type: boolean }
    InstanceSettings:
      type: object
      required: [product_mode, setup_completed, name, language, timezone]
      properties:
        product_mode: { $ref: "#/components/schemas/ProductMode" }
        setup_completed: { type: boolean }
        setup_completed_at: { type: [string, "null"], description: UTC without suffix. }
        name: { type: string, maxLength: 80, description: Empty shows "DumbMonit". }
        language: { type: string, description: "Default interface language (`en`, `fr`, `de`, `es`, `it`, `pt`, `pt-BR`, `ru`, `zh-Hans`); empty follows the browser." }
        timezone: { type: string, description: IANA time zone; empty means UTC. }
    InstancePatch:
      type: object
      properties:
        product_mode: { $ref: "#/components/schemas/ProductMode" }
        setup_completed: { type: boolean }
        name: { type: string, maxLength: 80 }
        language: { type: string }
        timezone: { type: string }

    # ---------------------------------------------------------- équipements
    Target:
      type: object
      required: [id, name, address, kind, interval_secs, enabled, tags, credential_kind, has_secret, credential_public]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        address: { type: string }
        kind: { type: string, description: "A kind from `GET /api/collectors` (`snmp`, `proxmox`, `agent`, `http`, `pack.<id>`…)." }
        profile_id: { type: [string, "null"] }
        parent_id: { type: [integer, "null"], format: int64 }
        via_agent: { type: [integer, "null"], format: int64, description: Relay agent probing this device; `null` means the server. }
        client_id: { type: integer, format: int64, description: "MSP mode: the client of the target (`1`, the default client, otherwise)." }
        interval_secs: { type: integer }
        enabled: { type: boolean }
        tags:
          type: object
          additionalProperties: { type: string }
        credential_kind: { type: string, description: A label — the secret itself is never returned. }
        has_secret: { type: boolean, description: "A secret (community, passphrase, token, password) is stored. Leaving its field empty on `PUT` keeps it." }
        credential_public:
          type: object
          description: "Non-secret parts of the credential, under the form's field keys (`username`, `token_id` for a Proxmox `user@realm!name` token, `auth_protocol`, `privacy_protocol`, `context`), to pre-fill the edit form. Never a secret; empty for a reader."
          additionalProperties: { type: string }
        group_name: { type: string, description: "Flat folder shown on `/targets`; empty: no folder." }
        position: { type: integer, format: int64, description: "Manual rank, tiebreaking only within the same state and folder." }
        location_id: { type: [integer, "null"], format: int64, description: "Location assigned on the world map; null: none (the device may still sit at one through its site, see `GET /api/locations`)." }
        multisite:
          description: "Probe locations of an uptime monitor (the server and/or relay agents) and the quorum; null: probed from one place."
          oneOf:
            - { $ref: "#/components/schemas/MultisiteConfig" }
            - { type: "null" }
        managed:
          oneOf:
            - { $ref: "#/components/schemas/TargetManaged" }
            - { type: "null" }
          description: Set when Docker labels manage this monitor.
        last_probe_at: { $ref: "#/components/schemas/NullableServerTimestamp" }
        last_error: { type: [string, "null"] }
        error_kind:
          type: [string, "null"]
          enum: [down, config, null]
          description: "`down`: the device did not answer; `config`: our side (credentials, address, option)."
    TargetManaged:
      type: object
      description: >-
        Present on a monitor created from `dumbmonit.*` Docker labels. It follows
        the labels (create, update, archive) and cannot be edited or deleted
        by hand until released (`POST /api/targets/{id}/release`).
      required: [by, key]
      properties:
        by: { type: string, enum: [docker-labels] }
        source: { type: [integer, "null"], format: int64, description: Agent whose containers declare it. }
        key: { type: string, description: "`project/service/http` for a Compose service, else `container/http`." }
        missing_since: { $ref: "#/components/schemas/NullableServerTimestamp" }
    StatusSummary:
      type: object
      required: [status, devices, alerts]
      properties:
        status:
          type: string
          enum: [ok, warning, critical]
          description: "`critical` when an alert is critical or a device is unreachable, `warning` for any other firing alert."
        sentence: { type: [string, "null"], description: The one-line summary shown by the interface. }
        devices:
          type: object
          required: [total, up, down, waiting, disabled]
          properties:
            total: { type: integer }
            up: { type: integer }
            down: { type: integer, description: Unreachable or down. }
            waiting: { type: integer }
            disabled: { type: integer }
        alerts:
          type: object
          required: [firing, critical, warning, info, building_up, suppressed]
          properties:
            firing: { type: integer }
            critical: { type: integer }
            warning: { type: integer }
            info: { type: integer }
            building_up: { type: integer }
            suppressed: { type: integer }
    Passkey:
      type: object
      required: [id, name, created_at, synced]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        created_at: { $ref: "#/components/schemas/NullableServerTimestamp" }
        last_used_at: { $ref: "#/components/schemas/NullableServerTimestamp" }
        synced: { type: boolean, description: The passkey is copied to a synced keychain. }
    PasskeyCeremony:
      type: object
      required: [challenge_id, options]
      properties:
        challenge_id: { type: string, description: "Single-use, valid five minutes." }
        options:
          type: object
          description: WebAuthn `publicKey` options with binary values encoded as base64url.
          additionalProperties: true
    NullableServerTimestamp:
      type: [string, "null"]
      description: UTC timestamp without suffix (`2026-08-31 20:15:00`), or `null`.
    KumaImportReport:
      type: object
      required: [dry_run, total, created, skipped, errors, notifications_ignored, rows]
      properties:
        dry_run: { type: boolean }
        total: { type: integer }
        created: { type: integer, description: Devices created (or that would be, in a dry run). }
        skipped: { type: integer, description: Monitors ignored or already monitored. }
        errors: { type: integer }
        notifications_ignored: { type: integer, description: Notifications in the file, never imported. }
        rows:
          type: array
          items:
            type: object
            required: [row, name, source_type, address, folder, tags, status]
            properties:
              row: { type: integer, description: Position of the monitor in the file, from 1. }
              name: { type: string }
              source_type: { type: string, description: Uptime Kuma monitor type. }
              kind: { type: [string, "null"], description: Device type created; null when skipped. }
              address: { type: string }
              folder: { type: string }
              interval_secs: { type: [integer, "null"] }
              tags: { type: array, items: { type: string }, description: Uptime Kuma tags as `key=value`. }
              status: { type: string, enum: [ok, created, skipped, error] }
              message: { type: [string, "null"], description: Why it was skipped, or what is not imported. }
              id: { type: [integer, "null"], format: int64 }
    TargetImportReport:
      type: object
      required: [dry_run, total, created, skipped, errors, rows]
      properties:
        dry_run: { type: boolean }
        total: { type: integer }
        created: { type: integer, description: Devices created (or that would be, in a dry run). }
        skipped: { type: integer }
        errors: { type: integer }
        rows:
          type: array
          items:
            type: object
            required: [row, url, name, folder, status]
            properties:
              row: { type: integer, description: Line number in the file (header is 1). }
              url: { type: string }
              name: { type: string }
              folder: { type: string }
              platform: { type: [string, "null"] }
              category: { type: [string, "null"], description: "Category from the CSV column, else guessed from the page." }
              status: { type: string, enum: [ok, created, skipped, error] }
              message: { type: [string, "null"] }
              id: { type: [integer, "null"], format: int64 }
    TargetPayload:
      type: object
      required: [name, address, kind]
      properties:
        name: { type: string, maxLength: 200 }
        address: { type: string, maxLength: 253 }
        kind: { type: string }
        profile_id: { type: [string, "null"], description: "Absent on `PUT` keeps the detected profile; `\"\"` clears it." }
        parent_id: { type: [integer, "null"], format: int64 }
        via_agent: { type: [integer, "null"], format: int64, description: "Absent on `PUT` keeps the relay; `null` means direct probing." }
        client_id: { type: integer, format: int64, description: "MSP mode: the client of the target. Absent on `POST`: the client chosen in the header, the only client of the account, or the default client. Only an MSP administrator changes it on `PUT`; the targets depending on it move along." }
        interval_secs: { type: integer, minimum: 10, default: 60 }
        enabled: { type: boolean, default: true }
        tags:
          type: object
          description: Type options go here under their key.
          additionalProperties: { type: string }
        group_name: { type: [string, "null"], description: "Flat folder shown on `/targets`. Empty or `null`: no folder. Absent on `PUT` keeps the folder." }
        location_id: { type: [integer, "null"], format: int64, description: "Location on the world map; `null`: none. Absent on `PUT` keeps the assignment." }
        multisite:
          description: "Probe from several locations (uptime monitors only, at least two locations, not combined with `via_agent`); `null`: one place. Absent on `PUT` keeps the setting."
          oneOf:
            - { $ref: "#/components/schemas/MultisiteConfig" }
            - { type: "null" }
        credential:
          $ref: "#/components/schemas/CredentialInput"
          description: 'Absent on `PUT` keeps the stored secret; `{"type": "none"}` clears it. Sent with a secret field absent or empty (community, passphrase, token `secret`, `password`), that secret is kept as long as the identity it belongs to (`username`, `token_id`) is unchanged; otherwise the request is refused with "Enter the … again".'
    CredentialInput:
      description: A device credential. Accepted on input only — never returned.
      writeOnly: true
      oneOf:
        - type: object
          required: [type]
          properties:
            type: { const: none }
        - type: object
          required: [type]
          properties:
            type: { const: snmp_community }
            community: { type: string }
        - type: object
          required: [type, username]
          properties:
            type: { const: snmp_v3 }
            username: { type: string }
            auth:
              type: [object, "null"]
              required: [protocol]
              properties:
                protocol: { type: string, enum: [md5, sha1, sha224, sha256, sha384, sha512] }
                passphrase: { type: string }
            privacy:
              type: [object, "null"]
              required: [protocol]
              properties:
                protocol: { type: string, enum: [des, aes128, aes192, aes256] }
                passphrase: { type: string }
            context: { type: [string, "null"] }
        - type: object
          required: [type]
          description: "`token`, or the two halves `token_id` and `secret` that the server joins into `user@realm!name=secret` for Proxmox VE and PBS."
          properties:
            type: { const: api_token }
            token: { type: string }
            token_id: { type: string }
            secret: { type: string }
        - type: object
          required: [type, username]
          properties:
            type: { const: username_password }
            username: { type: string }
            password: { type: string }
        - type: object
          required: [type, username]
          description: SSH login of a network configuration backup; `enable_secret` is the optional privileged-mode password.
          properties:
            type: { const: ssh_login }
            username: { type: string }
            password: { type: string }
            enable_secret: { type: string }
    MultisiteConfig:
      type: object
      required: [server]
      properties:
        server: { type: boolean, description: The DumbMonit server probes too. }
        agents:
          type: array
          description: Relay agents (ids of `agent` monitors) that probe too.
          items: { type: integer, format: int64 }
        quorum: { type: [integer, "null"], minimum: 1, description: "Failing locations needed to declare the monitor down; null: majority." }
    ProbeLocationsReport:
      type: object
      required: [decision, quorum, counted, failing, confirming, locations]
      properties:
        decision: { type: string, enum: [up, degraded, down, unknown], description: Last published quorum decision. }
        quorum: { type: integer, description: "Failing locations needed for `down`, after exclusions." }
        counted: { type: integer, description: Locations counted in the last decision (excluded ones left out). }
        failing: { type: integer }
        confirming: { type: boolean, description: A confirmation round is re-checking a first failure from every location. }
        decided_at: { $ref: "#/components/schemas/NullableServerTimestamp" }
        locations:
          type: array
          items:
            type: object
            required: [location, name, state]
            properties:
              location: { type: string, description: "Value of the `location` metric label: `server` or `agent-<id>`." }
              agent_id: { type: [integer, "null"], format: int64 }
              name: { type: string, description: Agent name; empty for the server. }
              site: { type: [string, "null"] }
              latitude: { type: [number, "null"] }
              longitude: { type: [number, "null"] }
              state: { type: string, enum: [up, down, excluded, pending] }
              latency_ms: { type: [integer, "null"] }
              error: { type: [string, "null"] }
              excluded_reason: { type: [string, "null"], enum: [silent, not_relay, busy, error, null] }
              checked_at: { $ref: "#/components/schemas/NullableServerTimestamp" }
    ProbeReport:
      type: object
      required: [sample_count, series]
      properties:
        sample_count: { type: integer }
        series:
          type: array
          description: Series keys as the collector produced them, without the `dumbmonit_` prefix.
          items: { type: string }
    DiscoveryReport:
      type: object
      required: [profile_id]
      properties:
        profile_id: { type: [string, "null"] }

    Series:
      type: object
      required: [metric, values]
      properties:
        metric:
          type: object
          additionalProperties: { type: string }
        values:
          type: array
          description: "`[timestamp_seconds, \"value\"]` pairs."
          items:
            type: array
            prefixItems:
              - { type: number }
              - { type: string }
            minItems: 2
            maxItems: 2

    # -------------------------------------------------------------- alertes
    Severity:
      type: string
      enum: [info, warning, critical]
      description: Internal severity. The UI words are info, advisory (warning) and warning (critical).
    Phase:
      type: string
      enum: [ok, pending, firing, resolved]
    EffectivePhase:
      type: string
      enum: [ok, pending, firing, resolved, suppressed]
    ActiveAlert:
      type: object
      required: [fingerprint, rule_uid, rule_name, severity, series_key, labels, phase, effective_phase, suppressed, silenced, learning, acked, dismissed, notify_count]
      properties:
        fingerprint: { type: string }
        rule_uid: { type: string }
        rule_name: { type: string, description: Empty if the rule was deleted meanwhile. }
        severity: { $ref: "#/components/schemas/Severity" }
        target_id: { type: [integer, "null"], format: int64 }
        series_key: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
        phase: { $ref: "#/components/schemas/Phase" }
        effective_phase: { $ref: "#/components/schemas/EffectivePhase" }
        suppressed: { type: boolean }
        suppressed_by: { type: [integer, "null"], format: int64, description: The unreachable parent device. }
        silenced: { type: boolean }
        learning: { type: boolean, description: Baseline rules stay silent for 14 days. }
        acked: { type: boolean }
        acked_until: { type: [string, "null"], format: date-time }
        acked_by: { type: [string, "null"], description: "An account, or `token:<name>`." }
        ack_note: { type: [string, "null"] }
        dismissed: { type: boolean, description: "Dismissed (\"Got it\"): hidden from the active views, silent until it resolves." }
        dismissed_at: { type: [string, "null"], format: date-time }
        dismissed_by: { type: [string, "null"], description: "An account, or `token:<name>`." }
        value: { type: [number, "null"] }
        score: { type: [number, "null"] }
        condition_since: { type: [string, "null"], format: date-time }
        firing_since: { type: [string, "null"], format: date-time }
        last_eval_at: { type: [string, "null"], format: date-time }
        last_notified_at: { type: [string, "null"], format: date-time }
        notify_count: { type: integer }
        tickets:
          type: array
          description: Tickets opened for this alert by the Jira, GLPI, Zammad, GitHub Issues and GitLab Issues channels.
          items: { $ref: "#/components/schemas/AlertTicket" }
    AlertTicket:
      type: object
      required: [channel_id, channel_name, kind, label, url, state]
      properties:
        channel_id: { type: integer, format: int64 }
        channel_name: { type: string }
        kind: { type: string, description: "Channel kind: `jira`, `glpi`, `zammad`, `github_issues` or `gitlab_issues`." }
        label: { type: string, description: "Ticket reference, such as `OPS-12` or `#34`." }
        url: { type: string, description: Address of the ticket in the service. }
        state: { type: string, enum: [open, closed] }
    AckRequest:
      type: object
      description: "`until` or `duration_secs` (not both); neither means 4 hours; `{\"until\": null}` lifts it."
      properties:
        until: { type: [string, "null"], description: "RFC 3339, or `YYYY-MM-DD HH:MM:SS` in UTC; at most 30 days ahead." }
        duration_secs: { type: integer, minimum: 1 }
        note: { type: string }
    AlertHistoryEntry:
      type: object
      required: [id, fingerprint, rule_uid, from_phase, to_phase, severity, notified, reason, at, dismissed]
      properties:
        id: { type: integer, format: int64 }
        fingerprint: { type: string }
        rule_uid: { type: string }
        target_id: { type: [integer, "null"], format: int64 }
        from_phase: { $ref: "#/components/schemas/Phase" }
        to_phase: { $ref: "#/components/schemas/Phase" }
        severity: { $ref: "#/components/schemas/Severity" }
        value: { type: [number, "null"] }
        notified: { type: boolean }
        reason: { type: string, description: "Empty, or why nothing was sent (`learning: would have fired`, `maintenance window`…)." }
        at: { type: string, format: date-time }
        dismissed: { type: boolean, description: "Cleared from the active view by the user; the row is kept." }

    TargetSelector:
      oneOf:
        - type: object
          required: [kind]
          properties:
            kind: { const: all }
        - type: object
          required: [kind, ids]
          properties:
            kind: { const: ids }
            ids:
              type: array
              items: { type: integer, format: int64 }
        - type: object
          required: [kind, labels]
          properties:
            kind: { const: labels }
            labels:
              type: object
              additionalProperties: { type: string }
    AnomalyParams:
      type: object
      properties:
        k: { type: number, default: 3.5 }
        alpha: { type: number, default: 0.05 }
        mad_floor_abs: { type: number, default: 0.000001 }
        mad_floor_rel: { type: number, default: 0.01 }
        min_samples: { type: integer, default: 3 }
        log_window_secs: { type: integer, minimum: 60, maximum: 86400, default: 300, description: "`log_pattern` rules: counting window. Accepted on write as `window_secs` too." }
        log_per_target: { type: boolean, default: true, description: "`log_pattern` rules: one alert per device (the `target` field of the lines), or a single one. Accepted on write as `per_target` too." }
    Operator:
      type: string
      enum: [">", ">=", "<", "<="]
    Rule:
      type: object
      required: [id, uid, name, description, kind, query, operator, threshold, for_secs, severity, selector, channels, params, unit, enabled, builtin, overrides]
      properties:
        id: { type: integer, format: int64 }
        uid: { type: string }
        name: { type: string }
        description: { type: string }
        kind: { type: string, enum: [threshold, anomaly, predict, log_pattern], description: "`log_pattern` counts the log lines that match `query` (a LogsQL filter, no pipes) over `params.log_window_secs` and compares the count to `threshold`." }
        query: { type: string }
        operator: { $ref: "#/components/schemas/Operator" }
        threshold: { type: number }
        clear_threshold: { type: [number, "null"], description: Hysteresis; `null` without. }
        for_secs: { type: integer }
        severity: { $ref: "#/components/schemas/Severity" }
        selector: { $ref: "#/components/schemas/TargetSelector" }
        channels:
          type: array
          description: Channel ids; empty means every enabled channel.
          items: { type: integer, format: int64 }
        params: { $ref: "#/components/schemas/AnomalyParams" }
        unit: { type: string }
        repeat_secs: { type: [integer, "null"] }
        escalate_after_secs: { type: [integer, "null"] }
        enabled: { type: boolean }
        builtin: { type: boolean }
        overrides:
          type: array
          items: { $ref: "#/components/schemas/RuleOverride" }
    RulePayload:
      type: object
      required: [name, query]
      properties:
        uid: { type: string, description: Derived from the name when absent. }
        name: { type: string }
        description: { type: string }
        kind: { type: string, enum: [threshold, anomaly, predict, log_pattern], description: "`log_pattern` counts the log lines that match `query` (a LogsQL filter, no pipes) over `params.log_window_secs` and compares the count to `threshold`." }
        query: { type: string }
        operator: { $ref: "#/components/schemas/Operator" }
        threshold: { type: number }
        clear_threshold: { type: [number, "null"] }
        for_secs: { type: integer, minimum: 0 }
        severity: { $ref: "#/components/schemas/Severity" }
        selector: { $ref: "#/components/schemas/TargetSelector" }
        channels:
          type: array
          items: { type: integer, format: int64 }
        params: { $ref: "#/components/schemas/AnomalyParams" }
        unit: { type: string }
        repeat_secs: { type: [integer, "null"] }
        escalate_after_secs: { type: [integer, "null"] }
        enabled: { type: boolean }
    EnableRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    RuleOverride:
      type: object
      required: [rule_uid, target_id]
      properties:
        rule_uid: { type: string }
        target_id: { type: integer, format: int64 }
        threshold: { type: [number, "null"] }
        clear_threshold: { type: [number, "null"] }
        enabled: { type: [boolean, "null"], description: "`false` removes the device from the rule." }
    OverridePayload:
      type: object
      properties:
        threshold: { type: [number, "null"] }
        clear_threshold: { type: [number, "null"] }
        enabled: { type: [boolean, "null"] }

    Schedule:
      description: >-
        Days are 0 = Monday … 6 = Sunday (1–31 for a monthly `days`); minutes are
        since local midnight (0–1439). On a recurring schedule, `timezone` (IANA)
        wins over `utc_offset_minutes`.
      oneOf:
        - type: object
          required: [kind, starts_at, ends_at]
          properties:
            kind: { const: once }
            starts_at: { type: string, format: date-time }
            ends_at: { type: string, format: date-time }
        - type: object
          required: [kind, days, start_minute, end_minute]
          properties:
            kind: { const: weekly }
            days:
              type: array
              items: { type: integer, minimum: 0, maximum: 6 }
            start_minute: { type: integer, minimum: 0, maximum: 1439 }
            end_minute: { type: integer, minimum: 0, maximum: 1440 }
            utc_offset_minutes: { type: integer, default: 0 }
            timezone: { type: string, examples: [Europe/Paris] }
        - type: object
          required: [kind, start_minute, duration_minutes]
          properties:
            kind: { const: monthly }
            days:
              type: array
              items: { type: integer, minimum: 1, maximum: 31 }
            nth_weekdays:
              type: array
              items:
                type: object
                required: [nth, weekday]
                properties:
                  nth: { type: integer, description: "1 to 5, or -1 for the last one of the month." }
                  weekday: { type: integer, minimum: 0, maximum: 6 }
            start_minute: { type: integer, minimum: 0, maximum: 1439 }
            duration_minutes: { type: integer, minimum: 1 }
            utc_offset_minutes: { type: integer, default: 0 }
            timezone: { type: string }
    Silence:
      type: object
      required: [id, name, comment, matchers, schedule, enabled, active_now]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        comment: { type: string }
        target_id: { type: [integer, "null"], format: int64 }
        matchers:
          type: object
          additionalProperties: { type: string }
        schedule: { $ref: "#/components/schemas/Schedule" }
        enabled: { type: boolean }
        active_now: { type: boolean }
        active_until: { type: [string, "null"], format: date-time }
        next_start_at: { type: [string, "null"], format: date-time }
    SilencePayload:
      type: object
      required: [name, schedule]
      properties:
        name: { type: string }
        comment: { type: string }
        target_id: { type: [integer, "null"], format: int64, description: "`null` with no matchers: the whole instance." }
        matchers:
          type: object
          additionalProperties: { type: string }
        schedule: { $ref: "#/components/schemas/Schedule" }
        enabled: { type: boolean, default: true }

    # -------------------------------------------------------- notifications
    MatchCondition:
      oneOf:
        - type: object
          required: [field, key, value]
          properties:
            field: { const: tag }
            key: { type: string }
            value: { type: string }
        - type: object
          required: [field, value]
          properties:
            field: { const: kind }
            value: { type: string }
        - type: object
          required: [field, value]
          properties:
            field: { const: rule }
            value: { type: string }
    ChannelMatcher:
      type: object
      description: Routing filter (12 conditions at most). Empty means the channel receives everything.
      properties:
        include:
          type: array
          items: { $ref: "#/components/schemas/MatchCondition" }
        exclude:
          type: array
          items: { $ref: "#/components/schemas/MatchCondition" }
    ChannelPolicy:
      type: object
      properties:
        min_severity: { $ref: "#/components/schemas/Severity" }
        notify_resolved: { type: boolean }
        min_interval_secs: { type: integer, minimum: 0 }
        quiet_hours:
          description: A weekly schedule, or `null`.
          oneOf:
            - $ref: "#/components/schemas/Schedule"
            - type: "null"
        matcher: { $ref: "#/components/schemas/ChannelMatcher" }
    ChannelKind:
      type: object
      required: [kind, label, summary, doc_url, settings, secrets, actions]
      properties:
        kind: { type: string }
        label: { type: string }
        summary: { type: string }
        doc_url: { type: string }
        actions:
          type: string
          enum: [buttons, links, none]
          description: "How the channel shows the Acknowledge / Snooze action links: native buttons, links in the message, or not at all."
        settings:
          type: array
          items: { $ref: "#/components/schemas/ChannelField" }
        secrets:
          type: array
          items: { $ref: "#/components/schemas/ChannelField" }
    ChannelField:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        required: { type: boolean }
        input: { type: string, enum: [text, url, number, boolean, select, textarea, password] }
        help: { type: string }
        placeholder: { type: string }
        options:
          type: array
          items: { type: string }
        shape: { type: string, enum: [scalar, list, object] }
        default: { type: string }
        destination:
          type: boolean
          description: The field says where the secrets go; changing it on update requires `secrets` in the same request.
        lookup:
          type: string
          description: Empty, or a list the UI loads itself (`oncall_policies`, the escalation policies) to offer as choices.
    Channel:
      type: object
      required: [id, name, kind, enabled, settings, has_secret, policy]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { type: string }
        enabled: { type: boolean }
        settings: { type: object, additionalProperties: true }
        has_secret: { type: boolean, description: Secrets are never returned. }
        last_error: { type: [string, "null"] }
        last_sent_at: { type: [string, "null"] }
        policy: { $ref: "#/components/schemas/ChannelPolicy" }
    ChannelPayload:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind: { type: string }
        enabled: { type: boolean }
        settings: { type: object, additionalProperties: true, description: Non-secret settings; secret keys are refused here. }
        secrets:
          type: [object, "null"]
          additionalProperties: true
          writeOnly: true
          description: "Absent or `null` on `PUT` keeps the stored secrets; `{}` clears them. Otherwise merged by key: a key sent replaces its value, a key left out is kept, `null` or `\"\"` clears it; a new kind or destination replaces the whole set."
        policy:
          type: [object, "null"]
          description: Each field optional; absent keeps the stored policy.
          properties:
            min_severity: { $ref: "#/components/schemas/Severity" }
            notify_resolved: { type: boolean }
            min_interval_secs: { type: integer, minimum: 0 }
            quiet_hours: { description: "A weekly schedule; `null` clears it." }
            matcher: { description: "A `ChannelMatcher`; `null` or `{}` clears it." }
    ChannelTestReport:
      type: object
      required: [ok, message]
      properties:
        ok: { type: boolean }
        message: { type: string }
    WebPushDevice:
      type: object
      required: [id, device, push_service, fingerprint, created_at, last_success_at, last_error]
      properties:
        id: { type: integer }
        device: { type: string, description: "Readable label from the User-Agent, e.g. \"Firefox on Android\"." }
        push_service: { type: string, description: "Host of the browser's push service." }
        fingerprint: { type: string, description: "First 16 hex characters of SHA-256(endpoint)." }
        created_at: { type: string }
        last_success_at: { type: [string, "null"] }
        last_error: { type: [string, "null"] }
    WebPushOverview:
      type: object
      required: [public_key, devices]
      properties:
        public_key: { type: string, description: "VAPID public key, base64url (uncompressed P-256 point)." }
        devices:
          type: array
          items: { $ref: "#/components/schemas/WebPushDevice" }
    WebPushSubscription:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, format: uri }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string, description: "base64url, 65 bytes." }
            auth: { type: string, description: "base64url, 16 bytes." }
    WebPushTestReport:
      type: object
      required: [ok, delivered, failed, removed, message]
      properties:
        ok: { type: boolean }
        delivered: { type: integer }
        failed: { type: integer }
        removed: { type: integer, description: "Expired subscriptions removed." }
        message: { type: string }
    NotifyPolicy:
      type: object
      required: [batch_window_secs, max_per_hour, flap_events, flap_window_secs, flap_hold_secs, public_url, escalate_after_secs, escalate_channel, action_links, resolutions_during_silence]
      properties:
        batch_window_secs: { type: integer, description: "0: send at once." }
        max_per_hour: { type: integer, description: "Per channel; 0: unlimited." }
        flap_events: { type: integer }
        flap_window_secs: { type: integer }
        flap_hold_secs: { type: integer, description: "0: no flap detection." }
        public_url: { type: string, description: "Links in messages; empty: `DUMBMONIT_PUBLIC_URL`." }
        escalate_after_secs: { type: integer, description: "0: no escalation." }
        escalate_channel: { type: [integer, "null"], format: int64 }
        action_links: { type: boolean, description: "Acknowledge / Snooze links in notifications; only effective with a public URL. Off also revokes links already sent." }
        resolutions_during_silence: { type: string, enum: [suppress, send], description: "Recovery message for an announced alert that resolves while a silence or maintenance window covers it. `suppress` (default): none is sent; the resolution stays in the alert history. `send`: it is sent anyway." }
    NotifyPolicyUpdate:
      type: object
      properties:
        batch_window_secs: { type: integer }
        max_per_hour: { type: integer }
        flap_events: { type: integer }
        flap_window_secs: { type: integer }
        flap_hold_secs: { type: integer }
        public_url: { type: string }
        escalate_after_secs: { type: integer }
        escalate_channel: { type: [integer, "null"], format: int64 }
        action_links: { type: boolean }
        resolutions_during_silence: { type: string, enum: [suppress, send] }
    AlertActionToken:
      type: object
      required: [token]
      properties:
        token: { type: string, description: "The part after `#` in the link." }
    AlertActionLinked:
      type: object
      required: [rule_name, target_name, severity, acked, acked_until, dismissed]
      properties:
        rule_name: { type: string }
        target_name: { type: [string, "null"] }
        severity: { $ref: "#/components/schemas/Severity" }
        acked: { type: boolean }
        acked_until: { type: [string, "null"], format: date-time }
        dismissed: { type: boolean }
    AlertActionView:
      type: object
      required: [action, expires_at, used, alerts]
      properties:
        action: { type: string, enum: [ack, snooze, dismiss] }
        expires_at: { type: string, format: date-time }
        used: { type: boolean, description: "The link has already been used." }
        alerts:
          type: array
          description: The link's alerts that are still active.
          items: { $ref: "#/components/schemas/AlertActionLinked" }
    AlertActionResult:
      type: object
      required: [action, until, acked, dismissed, alerts]
      properties:
        action: { type: string, enum: [ack, snooze, dismiss] }
        until: { type: string, format: date-time, description: "End of the acknowledgement; for `dismiss`, when it was done." }
        acked: { type: integer, description: "Alerts acknowledged by this action." }
        dismissed: { type: integer, description: "Alerts dismissed by this action." }
        alerts:
          type: array
          items: { $ref: "#/components/schemas/AlertActionLinked" }
    MatchPreviewRequest:
      type: object
      required: [matcher]
      properties:
        matcher: { $ref: "#/components/schemas/ChannelMatcher" }
    MatchPreview:
      type: object
      required: [devices, matched, total, rules, excluded_rules]
      properties:
        devices:
          type: array
          items:
            type: object
            required: [id, name, kind, tags, matched]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
              kind: { type: string }
              tags:
                type: object
                additionalProperties: { type: string }
              matched: { type: boolean }
        matched: { type: integer }
        total: { type: integer }
        rules:
          type: array
          items: { type: string }
        excluded_rules:
          type: array
          items: { type: string }

    # ----------------------------------------------------- pages de statut
    ReportSchedule:
      type: object
      required: [id, name, enabled, frequency, weekday, day_of_month, hour, timezone, recipients]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        enabled: { type: boolean }
        frequency: { type: string, enum: [daily, weekly, monthly] }
        weekday: { type: integer, minimum: 0, maximum: 6, description: 0 is Monday. }
        day_of_month: { type: integer, minimum: 1, maximum: 28 }
        hour: { type: integer, minimum: 0, maximum: 23 }
        timezone: { type: string, description: IANA name, example: Europe/Paris }
        recipients: { type: array, items: { type: string, format: email } }
        channel_id:
          type: [integer, "null"]
          format: int64
          description: Email (SMTP) channel used to send; null means the first enabled one.
        last_sent_at: { type: [string, "null"], format: date-time }
        last_error: { type: [string, "null"] }
        next_run_at: { type: [string, "null"], format: date-time }
        kind: { type: string, enum: [digest, sla], description: "`digest`: the rolling summary; `sla`: the previous calendar month with a PDF and CSV files." }
        attach_pdf: { type: boolean }
        attach_csv: { type: boolean }
        page_id: { type: [integer, "null"], format: int64, description: Status page whose title heads the SLA report. }
        objective: { type: [number, "null"], description: Availability objective in percent (SLA report). }
    ReportSchedulePayload:
      type: object
      properties:
        name: { type: string, maxLength: 80, default: Team report }
        enabled: { type: boolean, default: true }
        frequency: { type: string, enum: [daily, weekly, monthly], default: weekly }
        weekday: { type: integer, minimum: 0, maximum: 6, default: 0 }
        day_of_month: { type: integer, minimum: 1, maximum: 28, default: 1 }
        hour: { type: integer, minimum: 0, maximum: 23, default: 8 }
        timezone: { type: string, default: UTC }
        recipients:
          type: array
          maxItems: 20
          items: { type: string, format: email }
        channel_id: { type: [integer, "null"], format: int64 }
        kind: { type: string, enum: [digest, sla], default: digest, description: "`sla` requires `frequency: monthly`." }
        attach_pdf: { type: boolean, default: true, description: SLA report only. }
        attach_csv: { type: boolean, default: true, description: "SLA report only: the monitors file and the incidents file." }
        page_id: { type: [integer, "null"], format: int64 }
        objective: { type: [number, "null"], exclusiveMinimum: 0, maximum: 100 }
    MaintenanceCalendar:
      type: object
      required: [token, path]
      properties:
        token: { type: string }
        path: { type: string, description: "`/api/calendar/maintenance.ics?token=…`: add the server's origin to subscribe." }
    ReportPreviewResult:
      type: object
      required: [sent, failed]
      properties:
        sent: { type: integer }
        failed: { type: integer }
    StatusPageView:
      type: object
      required: [id, slug, title, description, published, theme, show_uptime_days, created_at, updated_at, accent, footer_text, homepage_url, items]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string }
        title: { type: string }
        description: { type: string }
        published: { type: boolean }
        theme: { type: string, enum: [auto, light, dark] }
        show_uptime_days: { type: integer, minimum: 1, maximum: 90 }
        created_at: { type: string }
        updated_at: { type: string }
        accent: { type: string, enum: [default, blue, teal, violet, rose, amber] }
        footer_text: { type: string }
        homepage_url: { type: string }
        show_calendar: { type: boolean }
        show_latency: { type: boolean }
        logo_type: { type: [string, "null"], enum: [image/png, image/jpeg, image/webp, null] }
        subscribe_channel_id: { type: [integer, "null"], format: int64 }
        domain: { type: [string, "null"], description: "Public host name serving this page at `/`; `null` for none." }
        seo: { $ref: "#/components/schemas/StatusPageSeo" }
        access_mode: { type: string, enum: [public, password, users], description: "Who can read the page; set through `PUT /api/status-pages/{id}/access`." }
        has_password: { type: boolean, description: A page password is stored (the hash is never returned). }
        group_labels:
          type: array
          items: { $ref: "#/components/schemas/StatusPageGroupLabel" }
          description: Public names of the monitors that come in through a checked group. None set for a monitor means its own name is published.
        groups:
          type: array
          items: { type: string }
          description: Checked groups (monitor folders), in order. Their current members are shown, so a monitor added to or removed from the folder appears or disappears by itself.
        items:
          type: array
          items: { $ref: "#/components/schemas/StatusPageItem" }
    StatusPageGroupLabel:
      type: object
      required: [target_id, label]
      properties:
        target_id: { type: integer, format: int64 }
        label: { type: string, maxLength: 80, description: Public name shown to visitors. The monitor's private name is never published when this is set. }
    StatusPageSeo:
      type: object
      description: >-
        Search-engine settings. An empty text field means "generated default"
        (built from the page name). The page is indexable only when it is
        published and `index` is true; otherwise it answers `noindex, nofollow`.
      properties:
        index: { type: boolean, default: false, description: "`true`: `index, follow`; `false`: `noindex, nofollow`." }
        title: { type: string, maxLength: 120, description: About 60 characters is displayed. }
        description: { type: string, maxLength: 320, description: About 155 characters is displayed. }
        keywords: { type: string, maxLength: 300 }
        canonical: { type: string, description: "Absolute `http(s)://` URL, or empty." }
        image: { type: string, description: "Absolute `http(s)://` share image (Open Graph / Twitter), or empty." }
        lang: { type: string, description: "Language tag such as `en`, `fr`, `pt-BR`; empty: `en`." }
        site_name: { type: string, maxLength: 100 }
    StatusPageItem:
      type: object
      required: [id, page_id, target_id, label, group_name, position]
      properties:
        id: { type: integer, format: int64 }
        page_id: { type: integer, format: int64 }
        target_id: { type: integer, format: int64 }
        label: { type: string }
        group_name: { type: string }
        position: { type: integer }
    StatusPageItemInput:
      type: object
      required: [target_id]
      properties:
        target_id: { type: integer, format: int64 }
        label: { type: string, maxLength: 80 }
        group_name: { type: string, maxLength: 60 }
    StatusPagePayload:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 120 }
        slug: { type: string, pattern: "^[a-z0-9-]{2,40}$", description: Derived from the title when omitted. }
        description: { type: string, maxLength: 1000 }
        published: { type: boolean, default: false }
        theme: { type: string, enum: [auto, light, dark], default: auto }
        show_uptime_days: { type: integer, minimum: 1, maximum: 90, default: 90, description: "Period shown by the history bars: 1 (24 hours), 7, 30, 60 or 90 days. The bars adapt to younger data." }
        accent: { type: string, enum: [default, blue, teal, violet, rose, amber] }
        footer_text: { type: string, maxLength: 280 }
        homepage_url: { type: string, maxLength: 300, description: "`http(s)://` or empty." }
        scenes:
          type: array
          items: { type: string }
          description: Decorative scene ids. Omitted keeps the saved list; `[]` means no scene.
        scene_rotation: { type: string, description: Omitted keeps the saved value (`visit` on creation). }
        simple: { type: boolean, default: false, description: Omitted keeps the saved value. }
        show_calendar: { type: boolean, default: false, description: Public 90-day calendar. Omitted keeps the saved value. }
        show_latency: { type: boolean, default: false, description: Public response-time graph per service. Omitted keeps the saved value. }
        subscribe_channel_id: { type: [integer, "null"], format: int64, description: "An `smtp` channel; `null` turns email subscription off." }
        seo:
          $ref: "#/components/schemas/StatusPageSeo"
        groups:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 200 }
          description: Monitor folders shown as a whole (dynamic). Omitted keeps the saved list; `[]` unchecks all.
        group_labels:
          type: array
          items: { $ref: "#/components/schemas/StatusPageGroupLabel" }
          description: Public names of group members. Omitted keeps the saved ones; `[]` clears them.
        domain:
          type: [string, "null"]
          description: >-
            Public host name (`status.example.com`), lowercased; a scheme or trailing
            slash is stripped, a port or path is refused. Unique across pages and
            never the address of DumbMonit itself (409 / 400). `null` or `""`
            removes it. Requests whose `Host` is this name only reach this page.
    LogoUpload:
      type: object
      required: [data]
      properties:
        data: { type: string, description: "Base64, or a `data:` URL." }
    StatusSubscriptionSettings:
      type: object
      properties:
        sms_channel_id: { type: [integer, "null"], format: int64, description: "Vonage, Telnyx or ASPSMS channel that texts the subscribers; `null`: no SMS." }
        webhook: { type: boolean }
        slack: { type: boolean }
    Subscriber:
      type: object
      required: [id, page_id, kind, destination, created_at]
      properties:
        id: { type: integer, format: int64 }
        page_id: { type: integer, format: int64 }
        kind: { type: string, enum: [email, sms, webhook, slack] }
        destination: { type: string, description: "Address for email; masked number or URL host otherwise." }
        email: { type: [string, "null"], description: "Address, email subscribers only." }
        components: { type: [array, "null"], items: { type: integer, format: int64 }, description: "Followed devices; `null`: all." }
        confirmed_at: { type: [string, "null"], description: "`null` while pending." }
        created_at: { type: string }
    Incident:
      type: object
      required: [id, title, kind, status, severity, starts_at, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        page_id: { type: [integer, "null"], format: int64 }
        title: { type: string }
        kind: { type: string, enum: [incident, maintenance] }
        status:
          type: string
          description: "Incident: investigating, identified, monitoring, resolved. Maintenance: scheduled, in_progress, completed."
        severity: { type: string, enum: [minor, major] }
        starts_at: { type: string }
        ends_at: { type: [string, "null"] }
        created_at: { type: string }
        updated_at: { type: string }
    IncidentUpdate:
      type: object
      required: [id, incident_id, status, body, created_at]
      properties:
        id: { type: integer, format: int64 }
        incident_id: { type: integer, format: int64 }
        status: { type: string }
        body: { type: string }
        created_at: { type: string }
    IncidentView:
      allOf:
        - $ref: "#/components/schemas/Incident"
        - type: object
          required: [updates, components]
          properties:
            updates:
              type: array
              items: { $ref: "#/components/schemas/IncidentUpdate" }
            components:
              type: array
              items: { type: integer, format: int64 }
              description: Devices the announcement concerns; empty means the whole page.
    IncidentPayload:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 160 }
        kind: { type: string, enum: [incident, maintenance] }
        status: { type: string }
        severity: { type: string, enum: [minor, major] }
        page_id: { type: [integer, "null"], format: int64 }
        starts_at: { type: string }
        ends_at: { type: [string, "null"] }
        body: { type: string, maxLength: 4000, description: 'First update, at creation only.' }
        components:
          type: array
          items: { type: integer, format: int64 }
          description: Devices the announcement concerns. Subscribers who follow only other services are not notified; omitted keeps the stored value (the whole page at creation).
    IncidentUpdatePayload:
      type: object
      required: [body]
      properties:
        status: { type: string, description: Defaults to the incident's current status. }
        body: { type: string, maxLength: 4000 }
    PublicStatus:
      type: object
      required: [page, overall, generated_at, groups, incidents, maintenance]
      properties:
        page:
          type: object
          properties:
            slug: { type: string }
            title: { type: string }
            description: { type: string }
            theme: { type: string }
            show_uptime_days: { type: integer }
            window_secs: { type: integer, description: "Duration the history bars really cover: the chosen period, or less when the data is younger." }
            step_secs: { type: integer, description: "Duration of one bar; 86400 means one bar per day." }
            updated_at: { type: string }
            accent: { type: string }
            footer_text: { type: string }
            homepage_url: { type: string }
            logo_url: { type: [string, "null"], description: "The page logo, or in MSP mode the logo of the page's client." }
            brand_name: { type: string, description: "MSP mode: name of the page's client. Absent otherwise." }
            subscribe: { type: boolean, description: The page offers at least one subscription. }
            subscribe_kinds:
              type: array
              items: { type: string, enum: [email, sms, webhook, slack] }
            show_calendar: { type: boolean, description: Present (true) only when the page shows the calendar. }
            show_latency: { type: boolean, description: Present (true) only when the page shows response times. }
            seo:
              type: object
              description: Effective search-engine values (settings, or defaults built from the page name).
              properties:
                indexable: { type: boolean }
                title: { type: string }
                description: { type: string }
                keywords: { type: string }
                canonical: { type: string }
                image: { type: string }
                lang: { type: string }
                site_name: { type: string }
        calendar:
          type: array
          description: One entry per day, oldest first (90 days). Present only when the calendar is enabled.
          items:
            type: object
            properties:
              date: { type: string }
              state: { type: string, enum: [operational, degraded, outage, nodata] }
              uptime_pct: { type: [number, "null"] }
              incidents: { type: integer }
        overall: { type: string }
        generated_at: { type: string }
        groups:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              items:
                type: array
                items:
                  type: object
                  properties:
                    key: { type: string }
                    label: { type: string }
                    state: { type: string }
                    uptime_24h: { type: [number, "null"] }
                    uptime_7d: { type: [number, "null"] }
                    uptime_30d: { type: [number, "null"] }
                    uptime_90d: { type: [number, "null"] }
                    uptime_history:
                      type: [number, "null"]
                      description: Uptime over the page's history_days, the days the bar shows.
                    latency_ms: { type: [number, "null"] }
                    latency_series:
                      type: object
                      description: Present only when response times are enabled and the service has latency data.
                      properties:
                        h24: { type: array, items: { type: array, items: { type: number }, description: "[unix seconds, milliseconds]" } }
                        d7: { type: array, items: { type: array, items: { type: number } } }
                    history:
                      type: array
                      items:
                        type: object
                        properties:
                          date: { type: string }
                          uptime_pct: { type: [number, "null"] }
                          down_minutes: { type: [integer, "null"] }
                          incidents: { type: integer }
                    external:
                      type: boolean
                      description: Present and true for a third-party provider (a `provider` monitor), shown as an external component.
        incidents:
          type: array
          items: { $ref: "#/components/schemas/PublicIncident" }
        maintenance:
          type: array
          items: { $ref: "#/components/schemas/PublicIncident" }
    PublicIncident:
      type: object
      properties:
        title: { type: string }
        kind: { type: string }
        status: { type: string }
        severity: { type: string }
        starts_at: { type: string }
        ends_at: { type: [string, "null"] }
        updates:
          type: array
          items:
            type: object
            properties:
              status: { type: string }
              body: { type: string }
              created_at: { type: string }

    # ------------------------------------------------------- agents, conteneurs
    Relay:
      type: object
      required: [id, name, relay, relayed]
      properties:
        id: { type: integer, format: int64, description: Id of the `agent` device. }
        name: { type: string }
        site: { type: [string, "null"] }
        relay: { type: boolean, description: The agent declared `relay true` in its last batch. }
        last_seen_at: { type: [string, "null"] }
        relayed: { type: integer, description: Devices reached through this agent. }
    DashboardWidget:
      type: object
      required: [id, type, x, y, w, h]
      properties:
        id: { type: string, maxLength: 40, description: "Letters, digits, '-' and '_'; unique in the dashboard." }
        type: { type: string, enum: [chart, stat, group, alerts, text] }
        title: { type: string, maxLength: 80 }
        x: { type: integer, minimum: 0, maximum: 11, description: Column on the 12-column grid. }
        y: { type: integer, minimum: 0 }
        w: { type: integer, minimum: 1, maximum: 12 }
        h: { type: integer, minimum: 1, maximum: 24 }
        config:
          type: object
          description: |
            By type. `chart`: `query`, `unit`. `stat`: `query`, `unit`, `warn`, `crit`,
            `direction` (`above` or `below`). `group`: `folder` (empty: devices without a
            folder). `alerts`: `limit` (1 to 50). `text`: `markdown`. Other keys are dropped.
          additionalProperties: true
    DashboardInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 80 }
        shared: { type: boolean, default: false }
        range_secs: { type: integer, minimum: 60, maximum: 34560000, default: 3600 }
        refresh_secs: { type: integer, description: "0 (off) or 5 to 3600.", default: 30 }
        widgets:
          type: array
          maxItems: 60
          items: { $ref: "#/components/schemas/DashboardWidget" }
    Dashboard:
      allOf:
        - $ref: "#/components/schemas/DashboardInput"
        - type: object
          required: [id, can_edit, owner, created_at, updated_at, widgets, range_secs, refresh_secs, shared]
          properties:
            id: { type: integer, format: int64 }
            owner: { type: [string, "null"], description: Account that owns it; null when made by a token. }
            can_edit: { type: boolean, description: The caller may change or delete it. }
            created_at: { type: string }
            updated_at: { type: string }
    MetricsCatalog:
      type: object
      required: [metrics, truncated]
      properties:
        truncated: { type: boolean }
        metrics:
          type: array
          items:
            type: object
            required: [name, series, labels]
            properties:
              name: { type: string }
              series: { type: integer }
              labels:
                type: array
                items:
                  type: object
                  required: [name, values, more]
                  properties:
                    name: { type: string }
                    values: { type: array, items: { type: string } }
                    more: { type: boolean }
    Locations:
      type: object
      required: [locations, sites, unplaced]
      properties:
        locations:
          type: array
          items: { $ref: "#/components/schemas/Location" }
        sites:
          type: array
          items: { type: string }
          description: Remote sites the topology map knows, sorted.
        unplaced:
          type: array
          items: { type: integer, format: int64 }
          description: Devices no location gathers.
    Location:
      type: object
      required: [id, name, address, latitude, longitude, site, main_site, members]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        address: { type: string, description: Free text, shown only. }
        latitude: { type: number }
        longitude: { type: number }
        site: { type: string, description: "Topology site this location stands for (case-insensitive); empty: none." }
        main_site: { type: boolean, description: Gathers the devices with no remote site. At most one location. }
        members:
          type: array
          items:
            type: object
            required: [target_id, source]
            properties:
              target_id: { type: integer, format: int64 }
              source:
                type: string
                enum: [assigned, site, main]
    LocationInput:
      type: object
      required: [name, latitude, longitude]
      properties:
        name: { type: string, maxLength: 80 }
        address: { type: string, maxLength: 200 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        site: { type: string, maxLength: 80 }
        main_site: { type: boolean }
    Basemap:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [offline, osm, custom] }
        url: { type: string, description: "Tile address with `{z}`, `{x}`, `{y}`; set by the server for `osm`, empty for `offline`." }
        attribution: { type: string, maxLength: 200 }
    GeoipStatus:
      type: object
      required: [enabled, state, ranges, source, source_url]
      properties:
        enabled: { type: boolean }
        state: { type: string, enum: [ready, loading, missing, failed, disabled] }
        month: { type: [string, "null"], description: "Month of the loaded database (`2026-10`)." }
        ranges: { type: integer }
        error: { type: [string, "null"] }
        source: { type: string }
        source_url: { type: string, description: Link the attribution must carry (CC BY 4.0). }
    OpnsenseLiveTally:
      type: object
      required: [blocked, passed, other]
      properties:
        blocked: { type: integer }
        passed: { type: integer }
        other: { type: integer }
    OpnsenseLive:
      type: object
      required: [enabled, relayed, window_secs, totals, countries, rules, ports, recent, seq, geoip]
      properties:
        enabled: { type: boolean, description: False while the `live_map` option is off. }
        relayed: { type: boolean, description: Polled through a relay agent; the server cannot read the log. }
        window_secs: { type: integer }
        polled_at: { type: [integer, "null"], description: Unix seconds. }
        error: { type: [string, "null"], description: Why the last read of the log failed. }
        totals: { $ref: "#/components/schemas/OpnsenseLiveTally" }
        countries:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/OpnsenseLiveTally"
              - type: object
                required: [code]
                properties:
                  code: { type: string, description: "ISO 3166-1 alpha-2, `local` or `unknown`." }
        rules:
          type: array
          items:
            type: object
            required: [rule, action, count]
            properties:
              rule: { type: string }
              action: { type: string, enum: [block, pass, other] }
              count: { type: integer }
        ports:
          type: array
          items:
            type: object
            required: [proto, port, count]
            properties:
              proto: { type: string }
              port: { type: integer }
              count: { type: integer }
        recent:
          type: array
          items:
            type: object
            required: [seq, at, action, outbound, country, proto, rule]
            properties:
              seq: { type: integer }
              at: { type: integer }
              action: { type: string, enum: [block, pass, other] }
              outbound: { type: boolean }
              country: { type: string }
              proto: { type: string }
              port: { type: [integer, "null"] }
              rule: { type: string }
        seq: { type: integer }
        firewall:
          type: [object, "null"]
          properties:
            name: { type: string }
            latitude: { type: number }
            longitude: { type: number }
        geoip: { $ref: "#/components/schemas/GeoipStatus" }
    Topology:
      type: object
      required: [nodes, edges, metrics_available]
      properties:
        nodes:
          type: array
          items: { $ref: "#/components/schemas/TopologyNode" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/TopologyEdge" }
        metrics_available:
          type: boolean
          description: False when VictoriaMetrics did not answer; `hypervisor` and `lldp` links are then missing.
        corrections:
          type: array
          items: { $ref: "#/components/schemas/TopologyCorrection" }
          description: Corrections made by hand, already applied to `nodes` and `edges`.
        rules:
          type: array
          items: { $ref: "#/components/schemas/TopologyRule" }
        suggestions:
          type: array
          items: { $ref: "#/components/schemas/TopologySuggestion" }
    TopologyCorrection:
      type: object
      required: [id, kind, to, use_for_alerts, author, created_at]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [forbid, link, parent, site, group] }
        from: { type: [string, "null"], description: "Upstream node: the new parent, or one end of the link." }
        to: { type: string, description: "The node corrected (`t<id>`, `g<host>:<name>`, `n<host>:<node>`)." }
        source: { type: [string, "null"], description: Type of the link forbidden or drawn. }
        value: { type: [string, "null"], description: "Site (empty: the main site) or grouping." }
        use_for_alerts: { type: boolean, description: "`parent` only: also the device's declared parent." }
        author: { type: string }
        created_at: { type: string, description: UTC, without suffix. }
    TopologyCorrectionInput:
      type: object
      required: [kind, to]
      properties:
        kind: { type: string, enum: [forbid, link, parent, site, group] }
        from: { type: [string, "null"] }
        to: { type: string }
        source:
          type: [string, "null"]
          description: "`forbid`: any deduced type; `link`: manual, hypervisor, hosted, relay, lldp, l2, samehost, backup or firewall."
        value: { type: [string, "null"], maxLength: 80 }
        use_for_alerts: { type: boolean, default: true }
    TopologyRuleSpec:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [forbid, parent] }
        subnet: { type: [string, "null"], description: "Scope: an IPv4 subnet (CIDR)." }
        address: { type: [string, "null"], description: "Scope: the address (host) of the devices." }
        target_kind: { type: [string, "null"], description: Scope limited to one device type. }
        source: { type: [string, "null"], description: "`forbid`: the type of link never deduced in the scope." }
        parent: { type: [string, "null"], description: "`parent`: the node the scope depends on." }
    TopologyRuleInput:
      allOf:
        - { $ref: "#/components/schemas/TopologyRuleSpec" }
        - type: object
          required: [status]
          properties:
            status: { type: string, enum: [active, dismissed] }
            evidence: { type: integer, description: Corrections it comes from. }
    TopologyRule:
      allOf:
        - { $ref: "#/components/schemas/TopologyRuleSpec" }
        - type: object
          required: [id, status, evidence, author, created_at, matches]
          properties:
            id: { type: integer, format: int64 }
            status: { type: string, enum: [active, dismissed] }
            evidence: { type: integer }
            author: { type: string }
            created_at: { type: string }
            matches: { type: integer, description: Links it sets or removes on today's map. }
    TopologySuggestion:
      allOf:
        - { $ref: "#/components/schemas/TopologyRuleSpec" }
        - type: object
          required: [key, evidence, corrections, matches]
          properties:
            key: { type: string }
            evidence: { type: integer, description: Number of corrections it comes from. }
            corrections:
              type: array
              items: { type: integer, format: int64 }
            matches: { type: integer, description: Other links it would change on today's map. }
    TopologyNode:
      type: object
      required: [id, name, kind, group_name, ips]
      properties:
        id: { type: string, description: "`t<id>` for a device, `g<host>:<name>` for an unmonitored guest." }
        target_id: { type: [integer, "null"], format: int64, description: The device; null for a guest. }
        name: { type: string }
        kind: { type: string, description: "The device type; `vm` or `container` for a guest, `pve_node` for a node of a Proxmox cluster." }
        subnet: { type: [string, "null"], description: "Subnet of the device (CIDR), none for a guest, a node, a public address or a host name." }
        vlan: { type: [integer, "null"], description: "VLAN of that subnet, when a firewall reports it." }
        vlan_name: { type: [string, "null"], description: "Name of that network (the firewall interface description)." }
        group_name: { type: string, description: Folder; a guest takes its hypervisor's. }
        site: { type: [string, "null"], description: "Remote site the node belongs to; null for the main site." }
        site_source:
          type: [string, "null"]
          enum: [tag, agent, relay, location, manual, null]
          description: "Where `site` comes from: the `site` tag, the site an agent declares, the relay agent that polls the device (its name), the location the device is placed at, or a correction on the map."
        group_source:
          type: [string, "null"]
          enum: [manual, null]
          description: "`manual` when `group_name` was corrected on the map."
        host_id: { type: [integer, "null"], format: int64, description: Guest only, the hypervisor device. }
        running: { type: [boolean, "null"], description: Guest only, running at the last measurement; for a `pve_node`, online. }
        ips:
          type: array
          items: { type: string }
          description: "Guest (its own node, or the device that stands for it): the IP addresses its hypervisor reports. Empty otherwise."
    TopologyEdge:
      type: object
      required: [from, to, source, origin]
      properties:
        from: { type: string, description: Upstream node (parent, relay, hypervisor, switch). }
        to: { type: string }
        source:
          type: string
          enum: [parent, service, relay, hypervisor, hosted, lldp, l2, samehost, backup, firewall, manual]
          description: "`manual`: attached by hand or by a learned rule, on the map only."
        origin:
          type: string
          enum: [deduced, manual, rule]
          description: Deduced by the server, corrected by hand, or set by a learned rule.
        correction_id: { type: [integer, "null"], format: int64, description: The correction that drew it. }
        rule_id: { type: [integer, "null"], format: int64, description: The learned rule that drew it. }
        from_port: { type: [string, "null"], description: "Switch port at the `from` end (`lldp` and `l2` links)." }
        to_port: { type: [string, "null"], description: "Switch port at the `to` end." }
    AgentHost:
      type: object
      required: [hostname, os, agent_version, commands_supported, relay, relayed, binding, bound]
      properties:
        hostname: { type: string }
        os: { type: string }
        os_version: { type: [string, "null"] }
        arch: { type: [string, "null"] }
        agent_version: { type: string }
        commands_supported: { type: boolean }
        relay: { type: boolean }
        site: { type: [string, "null"] }
        relay_wanted: { type: boolean, description: Relay mode asked from the UI (or by the enrolment token). }
        relay_wanted_site: { type: [string, "null"] }
        relay_control: { type: boolean, description: "False: the agent is too old to follow `relay_wanted`." }
        relay_local: { type: boolean, description: "`relay: true` is set in the agent's own configuration, which wins." }
        relayed: { type: integer }
        last_seen_at: { type: [string, "null"] }
        binding: { type: string, enum: [bound, pending, unsupported] }
        bound: { type: boolean }
        bound_at: { type: [string, "null"] }
        rebind_until: { type: [string, "null"] }
    RebindWindow:
      type: object
      required: [rebind_until, minutes]
      properties:
        rebind_until: { type: string }
        minutes: { type: integer }
    AgentModule:
      type: object
      required: [id, label, detected, enabled, automatic, target_id, last_seen_at]
      properties:
        id: { type: string, description: "`docker`, `plakar`, `backup_repos`, `zfs`, `libvirt`, `wireguard`, `ipsec`, `speedtest`." }
        label: { type: string }
        detected: { type: boolean, description: The agent has reported this service on this machine. }
        enabled: { type: boolean, description: "Ticked: a device exists (or will) for this service." }
        automatic: { type: boolean, description: Nobody ticked or unticked it; the device follows detection. }
        target_id: { type: [integer, "null"], description: The service's device. }
        last_seen_at: { type: [string, "null"], description: Last batch with readings of this service (UTC). }
    AgentEventLevel:
      type: string
      enum: [critical, error, warning, information]
      description: "Event Viewer level. `information` also covers level 0 (LogAlways), the level of Security audit events."
    AgentEventRuleInput:
      type: object
      required: [name, channel]
      properties:
        name: { type: string, maxLength: 256 }
        channel: { type: string, maxLength: 256, description: "`System`, `Application`, `Security` or a channel such as `Microsoft-Windows-TaskScheduler/Operational`." }
        provider: { type: [string, "null"], description: "Event source (provider), such as `Microsoft-Windows-Kernel-Power`; empty for any." }
        event_ids: { type: string, description: "Comma-separated IDs and ranges, such as `4625, 7000-7099` (20 at most); empty for any." }
        levels: { type: array, items: { $ref: "#/components/schemas/AgentEventLevel" }, description: Empty for any level. }
        pattern: { type: [string, "null"], description: Text the message must contain (case-insensitive), or a regular expression when `pattern_regex`. }
        pattern_regex: { type: boolean, default: false }
        severity: { $ref: "#/components/schemas/Severity" }
        enabled: { type: boolean, default: true }
    AgentEventRule:
      type: object
      required: [id, target_id, name, channel, provider, event_ids, levels, pattern, pattern_regex, severity, enabled, matches_total, dropped_total, last_match_at]
      properties:
        id: { type: integer, format: int64 }
        target_id: { type: integer, format: int64 }
        name: { type: string }
        channel: { type: string }
        provider: { type: [string, "null"] }
        event_ids: { type: string, description: Canonical form; empty for any. }
        levels: { type: array, items: { $ref: "#/components/schemas/AgentEventLevel" } }
        pattern: { type: [string, "null"] }
        pattern_regex: { type: boolean }
        severity: { $ref: "#/components/schemas/Severity" }
        enabled: { type: boolean }
        matches_total: { type: integer, format: int64, description: Events received for this rule. }
        dropped_total: { type: integer, format: int64, description: Events the agent skipped because of the rate limit. }
        last_match_at: { type: [string, "null"], description: Last event received (UTC). }
    AgentEventRulePreset:
      type: object
      required: [id, name, channel, provider, event_ids, levels, severity]
      properties:
        id: { type: string, description: "Stable key: `failed_logon`, `account_locked`, `unexpected_reboot`, `service_crashed`, `disk_errors`, `log_cleared`, `application_errors`." }
        name: { type: string }
        channel: { type: string }
        provider: { type: [string, "null"] }
        event_ids: { type: string }
        levels: { type: array, items: { $ref: "#/components/schemas/AgentEventLevel" } }
        severity: { $ref: "#/components/schemas/Severity" }
    AgentEventRules:
      type: object
      required: [supported, max_per_minute, rules, presets]
      properties:
        supported: { type: boolean, description: The machine runs Windows; elsewhere the rules are kept but never sent. }
        max_per_minute: { type: integer, description: Events kept per rule and per minute; the rest is counted in `dropped_total`. }
        rules: { type: array, items: { $ref: "#/components/schemas/AgentEventRule" } }
        presets: { type: array, items: { $ref: "#/components/schemas/AgentEventRulePreset" } }
    AgentEvent:
      type: object
      required: [id, rule_id, rule_name, severity, channel, provider, event_id, level, record_id, computer, message, occurred_at, received_at]
      properties:
        id: { type: integer, format: int64 }
        rule_id: { type: [integer, "null"], description: Null once the rule is deleted. }
        rule_name: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        channel: { type: string }
        provider: { type: string }
        event_id: { type: integer }
        level: { oneOf: [{ $ref: "#/components/schemas/AgentEventLevel" }, { type: "null" }] }
        record_id: { type: integer, format: int64 }
        computer: { type: string }
        message: { type: string, description: Formatted message, 2000 characters at most. }
        occurred_at: { type: [string, "null"], description: When Windows logged the event (UTC). }
        received_at: { type: [string, "null"], description: When the server received it (UTC). }
    ContainerPolicy:
      type: object
      required: [auto_restart, auto_update, prune_old_image, only_in_maintenance]
      properties:
        auto_restart: { type: boolean }
        auto_update: { type: boolean }
        prune_old_image: { type: boolean }
        only_in_maintenance: { type: boolean }
    ContainerPolicyPatch:
      type: object
      properties:
        auto_restart: { type: boolean }
        auto_update: { type: boolean }
        prune_old_image: { type: boolean }
        only_in_maintenance: { type: boolean }
    Command:
      type: object
      required: [id, target_id, kind, args, status, created_at]
      properties:
        id: { type: integer, format: int64 }
        target_id: { type: integer, format: int64 }
        kind: { type: string, enum: [container.restart, container.update] }
        args: { type: object, additionalProperties: true }
        status: { type: string, enum: [queued, running, done, failed, cancelled, expired] }
        requested_by: { type: [string, "null"], description: "An account, `token:<name>`, or `policy`." }
        created_at: { type: string }
        started_at: { type: [string, "null"] }
        finished_at: { type: [string, "null"] }
        result: { type: [string, "null"], description: Truncated to the last 4 KB. }
    Container:
      type: object
      required: [name, image, up, health, restart_count, policy]
      properties:
        name: { type: string }
        image: { type: string }
        up: { type: boolean }
        health: { type: string }
        restart_count: { type: integer }
        uptime_seconds: { type: [integer, "null"] }
        image_age_seconds: { type: [integer, "null"] }
        update_available: { type: [boolean, "null"] }
        policy: { $ref: "#/components/schemas/ContainerPolicy" }
        last_command:
          oneOf:
            - $ref: "#/components/schemas/Command"
            - type: "null"

    PushMonitor:
      type: object
      required: [target_id, token, path, last_status, last_message, received_total, created_at, verdict]
      properties:
        target_id: { type: integer, format: int64 }
        token: { type: [string, "null"], description: "The secret of the heartbeat URL; `null` unless the caller is an admin (or holds a `write` token)." }
        path: { type: [string, "null"], description: "`/api/push/<token>`, relative to the server's address; `null` like `token`." }
        last_seen_at: { type: [string, "null"] }
        last_seen_age_secs: { type: [integer, "null"] }
        last_status: { type: string, enum: [up, down] }
        last_message: { type: string }
        received_total: { type: integer }
        created_at: { type: string }
        expected_interval_secs: { type: [integer, "null"] }
        grace_secs: { type: [integer, "null"] }
        settings_error: { type: [string, "null"] }
        verdict: { type: string, enum: [waiting, on_time, missed, reported_down] }
        schedule: { type: [string, "null"], description: "Cron expression replacing the interval, when set." }
        timezone: { type: [string, "null"], description: "IANA time zone in which `schedule` is read." }
        next_expected_at: { type: [string, "null"], description: "Next scheduled run of a cron schedule. UTC, without suffix." }
        max_duration_secs: { type: [integer, "null"] }
        last_run:
          oneOf:
            - $ref: "#/components/schemas/PushRun"
            - type: "null"

    PushRun:
      type: object
      required: [id, status, output]
      properties:
        id: { type: integer, format: int64 }
        started_at: { type: [string, "null"], description: "UTC, without suffix. `null` when no `/start` preceded the end." }
        finished_at: { type: [string, "null"], description: "UTC, without suffix. `null` while the run is open." }
        duration_secs: { type: [number, "null"], description: "`null` when the duration is unknown." }
        status: { type: string, enum: [running, success, failed, lost], description: "`lost`: started, then replaced by a new start without ever finishing." }
        exit_code: { type: [integer, "null"] }
        output: { type: string, description: "Output of the job, truncated to its last 10 KiB." }

    PushRunsPage:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items: { $ref: "#/components/schemas/PushRun" }
        next_before: { type: [integer, "null"], format: int64, description: "Pass as `before` for the next page; `null` on the last one." }

    WebsiteOverview:
      type: object
      required: [checked_at, error, probe, platform_label, fields, changes_checked_at, robots_checked_at, robots_blocks_all, sitemap_ok]
      properties:
        checked_at: { type: [string, "null"], description: "Last reading, successful or not. UTC, without suffix." }
        error: { type: [string, "null"], description: "Why the last reading failed (unreachable, certificate refused, redirect loop…); `probe` then stays the last successful one." }
        probe:
          oneOf:
            - { $ref: "#/components/schemas/WebsiteProbe" }
            - { type: "null" }
        platform_label: { type: [string, "null"], description: "Display name of `probe.platform`, e.g. Next.js." }
        fields:
          type: array
          items: { $ref: "#/components/schemas/WebsiteField" }
        changes_checked_at: { type: [string, "null"], description: "Last comparison of the metadata with the reference. It only happens every change_check_minutes (6 hours by default); a pending value is checked again at the next probe. UTC, without suffix." }
        robots_checked_at: { type: [string, "null"], description: "robots.txt and the sitemap are read at change checks, at most once an hour. UTC, without suffix." }
        robots_blocks_all: { type: [boolean, "null"], description: "robots.txt forbids Googlebot (or *) to crawl /." }
        sitemap_ok: { type: [boolean, "null"], description: "The sitemap announced by robots.txt, or /sitemap.xml, answers 200 and reads as a sitemap." }

    WebsiteProbe:
      type: object
      required: [requested_url, final_url, status, response_ms, redirects, platform, category, content_type, text_chars, blank, expect_text_found, metadata]
      properties:
        requested_url: { type: string }
        final_url: { type: string, description: "Where the redirects lead." }
        status: { type: integer, description: "HTTP status of the final answer." }
        response_ms: { type: integer, description: "Total time, redirects included." }
        redirects:
          type: array
          description: "Redirects followed, in order; the last one leads to `final_url`. Empty without redirect."
          items:
            type: object
            required: [url, status]
            properties:
              url: { type: string }
              status: { type: integer }
        platform: { $ref: "#/components/schemas/WebsitePlatform" }
        category: { type: [string, "null"], description: "The `category` option, else a guess (`ecommerce`, `blog`, `app`, `showcase`); null when unclear." }
        content_type: { type: string }
        text_chars: { type: [integer, "null"], description: "Characters of visible text; null unless the final answer is 2xx." }
        blank: { type: [boolean, "null"], description: "Visible text below `min_text_chars`." }
        expect_text_found: { type: [boolean, "null"], description: "Null without the `expect_text` option." }
        metadata:
          oneOf:
            - { $ref: "#/components/schemas/WebsiteMetadata" }
            - { type: "null" }

    WebsiteMetadata:
      type: object
      required: [title, description, canonical, robots, og_title, og_description, lang, h1_count, hreflang_count, hreflang, google_verification, og_type, noindex, nofollow]
      properties:
        title: { type: [string, "null"] }
        description: { type: [string, "null"] }
        canonical: { type: [string, "null"], description: "Resolved against the final address." }
        robots: { type: [string, "null"], description: "Robots meta tags and X-Robots-Tag headers, joined." }
        og_title: { type: [string, "null"] }
        og_description: { type: [string, "null"] }
        lang: { type: [string, "null"], description: "`<html lang>`." }
        h1_count: { type: integer }
        hreflang_count: { type: integer }
        hreflang: { type: array, items: { type: string }, description: Languages of the hreflang alternates, sorted. }
        google_verification: { type: array, items: { type: string }, description: "`google-site-verification` tokens, sorted." }
        og_type: { type: [string, "null"] }
        noindex: { type: boolean }
        nofollow: { type: boolean }

    WebsitePlatform:
      type: string
      description: "Platform guessed from the generator meta tag, headers and markup; also the `platform` label of `dumbmonit_website_info`."
      enum: [wordpress, shopify, wix, squarespace, webflow, ghost, drupal, joomla, prestashop, magento, nextjs, nuxt, gatsby, hugo, jekyll, other]

    WebsiteField:
      type: object
      required: [field, value, pending, changed_at, recently_changed]
      properties:
        field: { type: string, enum: [final_url, title, description, canonical, robots, og_title, og_description, lang, h1_count, hreflang_count, hreflang, google_verification] }
        value: { type: [string, "null"], description: "Confirmed value; empty string when the page has none." }
        pending: { type: [string, "null"], description: "A different value seen once, confirmed if the next check sees it again." }
        changed_at: { type: [string, "null"], description: "Last confirmed change. UTC, without suffix." }
        recently_changed: { type: boolean, description: "Changed less than 24 hours ago." }

    WebsiteChange:
      type: object
      required: [id, detected_at, field, before, after]
      properties:
        id: { type: integer, format: int64 }
        detected_at: { type: string, description: "UTC, without suffix." }
        field: { type: string }
        before: { type: string }
        after: { type: string }

    WebchangePages:
      type: object
      required: [screenshots_available, found, pages]
      properties:
        screenshots_available: { type: boolean }
        found:
          type: [integer, "null"]
          description: "Pages found (read and still queued) when **Max pages** stopped the last crawl; null when the crawl was not stopped by it, or when the last check failed."
        pages:
          type: array
          items: { $ref: "#/components/schemas/WebchangePage" }

    WebchangePage:
      type: object
      required: [url, title, status, error, last_checked, last_changed, changes, latest_snapshot]
      properties:
        url: { type: string }
        title: { type: [string, "null"] }
        status: { type: [integer, "null"], description: "HTTP status of the last read; always 404 for a removed page, 410 or no longer linked included." }
        error: { type: [string, "null"], description: "Why the last read failed, or why the page counts as removed." }
        last_checked: { type: [string, "null"], description: "UTC, without suffix." }
        last_changed: { type: [string, "null"], description: "UTC, without suffix." }
        changes: { type: integer, description: Changes kept for this page. }
        latest_snapshot: { type: [integer, "null"], format: int64 }

    WebchangeChange:
      type: object
      required: [id, url, kind, detected_at, added, removed, before, after, signature]
      properties:
        id: { type: integer, format: int64 }
        url: { type: string }
        kind: { type: string, enum: [changed, new_page, removed_page] }
        detected_at: { type: string, description: "UTC, without suffix." }
        added: { type: integer, description: Lines added. }
        removed: { type: integer, description: Lines removed. }
        before: { type: [integer, "null"], format: int64, description: Snapshot before the change. }
        after: { type: [integer, "null"], format: int64, description: Snapshot after the change. }
        signature:
          type: [string, "null"]
          description: "Same value for the same edit (the same lines removed and added) made on several pages, so that it can be shown once; null for a new or removed page."

    WebchangeSnapshot:
      type: object
      required: [id, fetched_at, title, has_screenshot]
      properties:
        id: { type: integer, format: int64 }
        fetched_at: { type: string, description: "UTC, without suffix." }
        title: { type: [string, "null"] }
        has_screenshot: { type: boolean }

    WebchangeDiffLine:
      type: object
      required: [op, text, count]
      properties:
        op: { type: string, enum: [equal, insert, delete, skip] }
        text: { type: string, description: "Empty for `skip`." }
        count: { type: [integer, "null"], description: "Unchanged lines hidden by a `skip` line." }

    NetconfigVersion:
      type: object
      required: [id, fetched_at, last_seen_at, profile, size_bytes, lines, added, removed]
      properties:
        id: { type: integer, format: int64 }
        fetched_at: { type: string, description: "UTC, `YYYY-MM-DD HH:MM:SS`." }
        last_seen_at: { type: string, description: Last backup that found this same configuration. }
        profile: { type: string }
        size_bytes: { type: integer }
        lines: { type: integer }
        added: { type: integer, description: Lines added since the previous version, volatile lines aside. }
        removed: { type: integer }
    NetconfigOverview:
      type: object
      required: [running, host_key, can_read, can_reveal, versions]
      properties:
        profile: { type: [string, "null"] }
        profile_label: { type: [string, "null"] }
        transport: { type: [string, "null"], enum: [ssh_shell, ssh_exec, http, null] }
        running: { type: boolean }
        last_attempt_at: { type: [string, "null"] }
        last_success_at: { type: [string, "null"] }
        last_error: { type: [string, "null"] }
        last_error_kind: { type: [string, "null"], enum: [down, auth, config, host_key, null] }
        host_key:
          type: object
          properties:
            pinned: { type: [string, "null"], description: "Remembered SHA-256 fingerprint (`SHA256:…`)." }
            pinned_at: { type: [string, "null"] }
            changed_to: { type: [string, "null"], description: A different key the device presented and that was refused. }
            changed_at: { type: [string, "null"] }
        can_read: { type: boolean, description: The caller may read version contents, secrets masked. }
        can_reveal: { type: boolean, description: The caller may reveal secrets and download. }
        versions:
          type: array
          items: { $ref: "#/components/schemas/NetconfigVersion" }
    NetconfigVersionContent:
      type: object
      required: [version, masked, masked_values, content]
      properties:
        version: { $ref: "#/components/schemas/NetconfigVersion" }
        masked: { type: boolean }
        masked_values: { type: integer }
        content: { type: string }
    NetconfigCompare:
      type: object
      required: [to, masked, added, removed, diff]
      properties:
        from:
          oneOf:
            - $ref: "#/components/schemas/NetconfigVersion"
            - type: "null"
        to: { $ref: "#/components/schemas/NetconfigVersion" }
        masked: { type: boolean }
        added: { type: integer }
        removed: { type: integer }
        diff:
          type: array
          items: { $ref: "#/components/schemas/WebchangeDiffLine" }

    WebchangeChangeDetail:
      allOf:
        - $ref: "#/components/schemas/WebchangeChange"
        - type: object
          required: [before_snapshot, after_snapshot, diff]
          properties:
            before_snapshot:
              oneOf:
                - $ref: "#/components/schemas/WebchangeSnapshot"
                - type: "null"
            after_snapshot:
              oneOf:
                - $ref: "#/components/schemas/WebchangeSnapshot"
                - type: "null"
            diff:
              type: array
              items: { $ref: "#/components/schemas/WebchangeDiffLine" }

    Pack:
      type: object
      required: [id, version, label, summary, enabled, installed_at, sha256, metrics, rules, snmp_profiles, targets, warnings]
      properties:
        id: { type: string }
        version: { type: string }
        label: { type: string }
        summary: { type: string }
        kind: { type: [string, "null"], description: "`pack.<id>`; `null` for a pack with SNMP profiles only." }
        enabled: { type: boolean }
        installed_at: { type: string }
        sha256: { type: string }
        metrics:
          type: array
          items: { type: string }
        rules:
          type: array
          description: Uids of the rules it ships.
          items: { type: string }
        snmp_profiles:
          type: array
          items: { type: string }
        targets: { type: integer, description: Devices using it. }
        warnings:
          type: array
          items: { type: string }
        error: { type: [string, "null"], description: Set when the stored pack no longer passes validation. }
    PackInstallReport:
      type: object
      required: [outcome, pack, rules_added, restart_required]
      properties:
        outcome: { type: string, enum: [created, updated, unchanged] }
        pack: { $ref: "#/components/schemas/Pack" }
        rules_added: { type: integer }
        restart_required: { type: boolean, description: SNMP profiles take effect after a restart. }

    # ------------------------------------------------------------- sauvegarde
    LogsOverview:
      type: object
      required: [directory, retention_days, max_total_mb, total_bytes, days_available, files, writer]
      properties:
        directory: { type: string, examples: ["/data/logs"] }
        retention_days: { type: integer, minimum: 1, maximum: 365 }
        max_total_mb: { type: integer, minimum: 16, maximum: 102400 }
        total_bytes: { type: integer }
        oldest_day: { type: [string, "null"], format: date }
        days_available: { type: integer }
        files:
          type: array
          description: Newest first.
          items:
            type: object
            properties:
              day: { type: string, format: date }
              bytes: { type: integer }
              compressed: { type: boolean }
        writer:
          type: object
          properties:
            active: { type: boolean }
            dropped:
              type: integer
              description: Records lost before reaching the disk (writer lagging, or the size cap reached).
    StorageUpdate:
      type: object
      additionalProperties: false
      properties:
        metrics_retention_days: { type: integer, minimum: 7, maximum: 3650 }
        rollup_enabled: { type: boolean }
        rollup_retention_days: { type: integer, minimum: 30, maximum: 3650 }
        logs_store_enabled: { type: boolean }
        logs_store_retention_days: { type: integer, minimum: 1, maximum: 3650 }
    StorageView:
      type: object
      required: [metrics, rollup, logs_store, disk, growth, limits, restarted]
      properties:
        metrics:
          type: object
          required: [embedded, retention_days, retention_source, running]
          properties:
            embedded: { type: boolean }
            retention_days: { type: integer }
            retention_source: { type: string, enum: [settings, environment, default] }
            running: { type: boolean }
        rollup:
          type: object
          required: [available, embedded, enabled, running, retention_days, step_seconds, backfill_done]
          properties:
            available: { type: boolean }
            embedded: { type: boolean }
            enabled: { type: boolean }
            running: { type: boolean }
            retention_days: { type: integer }
            step_seconds: { type: integer }
            last_window: { type: [string, "null"], description: UTC, without suffix }
            backfilled_until: { type: [string, "null"], description: UTC, without suffix }
            backfill_done: { type: boolean }
            series: { type: [integer, "null"] }
            last_error: { type: [string, "null"] }
        logs_store:
          type: object
          required: [available, enabled, running, retention_days]
          properties:
            available: { type: boolean }
            enabled: { type: boolean }
            running: { type: boolean }
            retention_days: { type: integer }
            last_error: { type: [string, "null"] }
        disk:
          type: object
          required: [usage]
          properties:
            usage:
              type: array
              items:
                type: object
                required: [key, path]
                properties:
                  key: { type: string, enum: [metrics, rollup, logs_store, database, logs, backups] }
                  path: { type: string }
                  bytes: { type: [integer, "null"] }
            free_bytes: { type: [integer, "null"] }
            total_bytes: { type: [integer, "null"] }
        growth:
          type: object
          required: [sampled_days]
          properties:
            bytes_per_day: { type: [number, "null"] }
            days_until_full: { type: [number, "null"] }
            sampled_days: { type: integer }
        limits:
          type: object
          properties:
            min_retention_days: { type: integer }
            max_retention_days: { type: integer }
            min_rollup_retention_days: { type: integer }
            max_rollup_retention_days: { type: integer }
            min_logs_retention_days: { type: integer }
            max_logs_retention_days: { type: integer }
        restarted:
          type: array
          items: { type: string, enum: [metrics, rollup, logs_store] }
    LogSearchResult:
      type: object
      required: [entries, truncated]
      properties:
        truncated: { type: boolean }
        entries:
          type: array
          items:
            type: object
            required: [time, level, message, source, fields]
            properties:
              time: { type: string, description: UTC, without suffix }
              level: { type: string }
              message: { type: string }
              source: { type: string, enum: [dumbmonit, agent, syslog, trap], description: Stream the line belongs to. }
              host: { type: [string, "null"] }
              origin: { type: [string, "null"], description: "Unit, file, channel or sender address." }
              target_name: { type: [string, "null"], description: Device the sender is attached to. }
              fields: { type: object, additionalProperties: { type: string } }
    AgentLogsSetting:
      type: object
      properties:
        enabled: { type: boolean, default: false }
        min_level: { type: string, enum: [error, warn, info, debug], default: warn }
        journald: { type: boolean, default: true, description: Read the systemd journal (Linux). }
        files:
          type: array
          maxItems: 20
          items: { type: string, description: "Absolute path; `*` and `?` work in each component." }
        eventlog:
          type: array
          maxItems: 10
          items: { type: string, description: Windows event log channel. }
    AgentLogs:
      allOf:
        - $ref: "#/components/schemas/AgentLogsSetting"
        - type: object
          required: [last_received_at, received_total, store_running]
          properties:
            last_received_at: { type: [string, "null"], description: UTC, without suffix }
            received_total: { type: integer }
            store_running: { type: boolean, description: False when the embedded log store is off, lines would be dropped. }
    LogInput:
      type: object
      required: [enabled, listening, received, rejected, unmatched, last_at, error]
      properties:
        enabled: { type: boolean }
        listening: { type: array, items: { type: string, description: "`udp/5514`, `tcp/5514`" } }
        received: { type: integer }
        rejected: { type: integer }
        unmatched: { type: integer, description: Messages from a sender no device carries. }
        last_at: { type: [string, "null"] }
        error: { type: [string, "null"] }
    LogInputs:
      type: object
      required: [store_running, syslog, traps, written, dropped]
      properties:
        store_running: { type: boolean }
        syslog: { $ref: "#/components/schemas/LogInput" }
        traps: { $ref: "#/components/schemas/LogInput" }
        written: { type: integer, description: Central log entries written to the store since the server started. }
        dropped: { type: integer }
    LogsSettingsRequest:
      type: object
      properties:
        retention_days: { type: integer, minimum: 1, maximum: 365 }
        max_total_mb: { type: integer, minimum: 16, maximum: 102400 }
    LogsEstimate:
      type: object
      required: [days, from, to, files, bytes]
      properties:
        days: { type: integer }
        from: { type: string, format: date }
        to: { type: string, format: date }
        files: { type: integer }
        bytes: { type: integer, description: Estimated size of the .tar.gz archive. }
    LogDestinationKind:
      type: object
      required: [kind, label, summary, doc_url, settings, secrets]
      properties:
        kind: { type: string, examples: [gelf, victorialogs, loki, elasticsearch, syslog] }
        label: { type: string }
        summary: { type: string }
        doc_url: { type: string, format: uri }
        settings:
          type: array
          items: { $ref: "#/components/schemas/ChannelField" }
        secrets:
          type: array
          items: { $ref: "#/components/schemas/ChannelField" }
    LogDestinationRequest:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, maxLength: 100 }
        kind: { type: string }
        enabled: { type: boolean, default: true }
        min_level: { type: string, enum: [error, warn, info, debug], default: info }
        settings: { type: object, additionalProperties: true }
        secrets:
          type: [object, "null"]
          additionalProperties: { type: string }
          description: Omitted or null keeps the stored secrets; `{}` clears them.
    LogDestination:
      type: object
      required: [id, name, kind, enabled, min_level, settings, has_secret, stats]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { type: string }
        enabled: { type: boolean }
        min_level: { type: string, enum: [error, warn, info, debug] }
        settings: { type: object, additionalProperties: true }
        has_secret: { type: boolean }
        stats:
          type: object
          description: Counters since the server started.
          properties:
            sent: { type: integer }
            dropped: { type: integer, description: Records lost (queue full or batch refused). }
            failed_batches: { type: integer }
            queued: { type: integer }
            last_error: { type: [string, "null"] }
            last_error_at: { type: [string, "null"], description: UTC, without suffix. }
            last_success_at: { type: [string, "null"], description: UTC, without suffix. }
    BackupStatus:
      type: object
      required: [bundle_version, min_passphrase_length, contents, secret_source, secret_path, schedule]
      properties:
        bundle_version: { type: integer }
        min_passphrase_length: { type: integer }
        contents:
          type: array
          items:
            type: object
            properties:
              section: { type: string }
              description: { type: string }
              count: { type: integer }
        secret_source: { type: string, enum: [file, environment] }
        secret_path: { type: string }
        schedule: { $ref: "#/components/schemas/LocalBackupStatus" }
    LocalBackupStatus:
      type: object
      properties:
        enabled: { type: boolean }
        directory: { type: string }
        interval_hours: { type: integer }
        keep: { type: integer }
        includes_secret_key: { type: boolean }
        last_run:
          type: [object, "null"]
          properties:
            at: { type: string }
            ok: { type: boolean }
            file: { type: string }
            bytes: { type: integer }
            duration_ms: { type: integer }
            with_secret: { type: boolean }
            error: { type: [string, "null"] }
        files:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              bytes: { type: integer }
              at: { type: string }
              with_secret: { type: boolean }
        total_bytes: { type: integer }
        directory_error: { type: [string, "null"] }
    ConfigRequest:
      type: object
      description: Either `yaml` or `config`.
      properties:
        yaml: { type: string, description: The file, as text. }
        config: { type: object, additionalProperties: true, description: The same document as JSON. }
        prune: { type: boolean, default: false, description: Delete managed objects that are no longer declared. }
    ConfigChange:
      type: object
      required: [section, key, action, fields]
      properties:
        section: { type: string, enum: [targets, channels, rules, rule_overrides, silences, status_pages] }
        key: { type: string }
        action: { type: string, enum: [create, update, delete] }
        fields:
          type: array
          items: { type: string }
          description: Names of the fields that differ (never their values).
    ConfigPlan:
      type: object
      required: [changes, create, update, delete, unchanged, warnings, applied, unresolved]
      properties:
        changes:
          type: array
          items: { $ref: "#/components/schemas/ConfigChange" }
        create: { type: integer }
        update: { type: integer }
        delete: { type: integer }
        unchanged: { type: integer }
        warnings:
          type: array
          items: { type: string }
        applied: { type: boolean }
        unresolved:
          type: array
          items: { type: string }
    ConfigExport:
      type: object
      required: [version, yaml, config, variables]
      properties:
        version: { type: integer }
        yaml: { type: string }
        config: { type: object, additionalProperties: true }
        variables:
          type: array
          items: { type: string }
    ConfigStatus:
      type: object
      required: [schema_version, watch, managed, keys]
      properties:
        schema_version: { type: integer }
        watch:
          type: object
          properties:
            directory: { type: [string, "null"] }
            files:
              type: array
              items: { type: string }
            last_applied_at: { type: [string, "null"] }
            last_error: { type: [string, "null"] }
            last_changes:
              type: [array, "null"]
              items: { type: integer }
              description: "[created, updated, deleted] of the last application."
        managed:
          type: object
          additionalProperties: { type: integer }
        keys:
          type: object
          description: Keys of the managed objects by kind (rule, channel, silence, status_page, override).
          additionalProperties:
            type: array
            items: { type: string }
    BackupExportRequest:
      type: object
      required: [passphrase]
      properties:
        passphrase: { type: string, minLength: 16, writeOnly: true }
        include_account_secrets: { type: boolean, default: false }
        include_netconfig_versions:
          type: boolean
          default: false
          description: Also carry the stored network configuration versions, which hold device secrets.
    BackupRestoreRequest:
      type: object
      required: [bundle, passphrase]
      properties:
        bundle: { type: object, additionalProperties: true }
        passphrase: { type: string, writeOnly: true }
        apply: { type: boolean, default: false, description: "`false`: dry run inside a transaction rolled back." }
    RestoreReport:
      type: object
      properties:
        applied: { type: boolean }
        created_at: { type: string }
        source_version: { type: string }
        sections:
          type: array
          items:
            type: object
            properties:
              section: { type: string }
              created: { type: integer }
              updated: { type: integer }
              skipped: { type: integer }
              notes:
                type: array
                items: { type: string }
        created: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }
        warnings:
          type: array
          items: { type: string }

    # ------------------------------------------ panneaux (premier niveau seulement)
    PanelObject:
      type: object
      description: >-
        A panel read from the device's last probe. Only the top-level properties
        are described here; see the HTTP API reference for the full shape.
      additionalProperties: true
    ProxmoxGuest:
      type: object
      additionalProperties: true
      properties:
        vmid: { type: integer }
        name: { type: string }
        node: { type: string }
        kind: { type: string, enum: [qemu, lxc] }
        status: { type: string }
        cpu_percent: { type: [number, "null"] }
        cpu_count: { type: [number, "null"] }
        memory_used_bytes: { type: [number, "null"] }
        memory_total_bytes: { type: [number, "null"] }
        memory_percent: { type: [number, "null"] }
        disk_used_bytes: { type: [number, "null"] }
        disk_total_bytes: { type: [number, "null"] }
        disk_percent: { type: [number, "null"] }
        uptime_seconds: { type: [number, "null"] }
        last_backup_age_seconds: { type: [number, "null"] }
        os: { type: [string, "null"] }
        ip: { type: [string, "null"] }
    ProxmoxNodes:
      type: object
      additionalProperties: true
      properties:
        nodes:
          type: array
          items: { $ref: "#/components/schemas/PanelObject" }
        fencing_state: { type: [string, "null"] }
        fencing_armed: { type: [boolean, "null"] }
    ProxmoxCeph:
      type: object
      additionalProperties: true
      properties:
        available: { type: boolean }
        health: { type: [number, "null"], description: "0 OK, 1 WARN, 2 ERR, 3 unknown." }
        health_status: { type: [string, "null"] }
        used_percent: { type: [number, "null"] }
        osds:
          type: array
          items: { $ref: "#/components/schemas/PanelObject" }
        pools:
          type: array
          items: { $ref: "#/components/schemas/PanelObject" }
        filesystems:
          type: array
          items: { type: string }
    PbsCalendar:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        days: { type: integer }
        offset_minutes: { type: integer }
        groups:
          type: array
          items: { $ref: "#/components/schemas/PanelObject" }
    PbsJobs:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        jobs:
          type: array
          items: { $ref: "#/components/schemas/PanelObject" }
    PbsHealth:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        version: { type: [string, "null"] }
        datastores: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        disks: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        zpools: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        services: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        certificates: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
    PbsTaskLog:
      type: object
      additionalProperties: true
      properties:
        upid: { type: string }
        lines:
          type: array
          items: { type: string }
    PbsTaskFailure:
      type: object
      additionalProperties: true
      properties:
        upid: { type: string }
        worker_type: { type: string }
        kind: { type: string }
        worker_id: { type: string }
        datastore: { type: [string, "null"] }
        object: { type: [string, "null"] }
        user: { type: [string, "null"] }
        start: { type: [integer, "null"] }
        end: { type: [integer, "null"] }
        error: { type: [string, "null"] }
    PdmTaskFailure:
      type: object
      additionalProperties: true
      properties:
        upid: { type: string }
        remote: { type: string }
        node: { type: [string, "null"] }
        user: { type: [string, "null"] }
        worker_type: { type: string }
        kind: { type: string }
        worker_id: { type: string }
        start: { type: [integer, "null"] }
        end: { type: [integer, "null"] }
        error: { type: [string, "null"] }
    PdmRemotes:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        version: { type: [string, "null"] }
        estate: { $ref: "#/components/schemas/PanelObject" }
        remotes:
          type: array
          items: { $ref: "#/components/schemas/PanelObject" }
    SkippedFeatures:
      type: object
      required: [features]
      properties:
        features:
          type: array
          items:
            type: object
            required: [feature, privilege]
            properties:
              feature:
                type: string
                description: Technical id (`guest_agent`, `updates`, `certificates`, `disks`, `services`, `traffic_control`, `remote_updates`).
              privilege:
                type: string
                description: The privilege the token lacks, as the device names it.
    PdmHealth:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        version: { type: [string, "null"] }
        memory_used_percent: { type: [number, "null"] }
        rootfs_used_percent: { type: [number, "null"] }
        certificates: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
    PmgQueues:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        queues: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        total_messages: { type: number }
        stuck: { type: boolean }
    PmgTraffic:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        recent: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        spam_scores: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        viruses: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
    PmgHealth:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        version: { type: [string, "null"] }
        nodes: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        cluster: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        stopped_services: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
    OpnsenseGateways:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        gateways: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        down: { type: integer }
        degraded: { type: integer }
        wan_addresses: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
    OpnsenseTraffic:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        interfaces: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        dhcp: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
    OpnsenseHealth:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        version: { type: [string, "null"] }
        hostname: { type: [string, "null"] }
        services: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        stopped_services: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        tunnels: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        tunnels_down: { type: integer }
    TruenasStorage:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        pools: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        unhealthy_pools: { type: integer }
        datasets: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        snapshots_total: { type: [number, "null"] }
        disks: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
    TruenasProtection:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        scrubs: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        tasks: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        failed_tasks: { type: integer }
    TruenasHealth:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        version: { type: [string, "null"] }
        hostname: { type: [string, "null"] }
        alerts: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        services: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        stopped_services: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
    ActiveDirectoryFinding:
      type: object
      required: [id, severity, category, title, detail, count, samples]
      properties:
        id: { type: string, description: "Stable identifier, e.g. asrep_roastable_users, krbtgt_password_age." }
        severity: { type: string, enum: [low, medium, high, critical] }
        category:
          type: string
          enum: [privileged, kerberos, accounts, policy, hygiene, infrastructure]
        title: { type: string }
        detail: { type: string }
        count: { type: integer, minimum: 0, description: "Objects concerned; 0 means the check was examined and found nothing." }
        samples: { type: array, items: { type: string }, maxItems: 20 }
    ActiveDirectoryFindingCounts:
      type: object
      properties:
        low: { type: integer }
        medium: { type: integer }
        high: { type: integer }
        critical: { type: integer }
    ActiveDirectoryFindings:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        inventory_at: { type: [integer, "null"] }
        findings: { type: array, items: { $ref: "#/components/schemas/ActiveDirectoryFinding" } }
        counts: { $ref: "#/components/schemas/ActiveDirectoryFindingCounts" }
    ActiveDirectoryOverview:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        connection: { oneOf: [{ $ref: "#/components/schemas/PanelObject" }, { type: "null" }] }
        bind_error: { type: [string, "null"] }
        domain: { oneOf: [{ $ref: "#/components/schemas/PanelObject" }, { type: "null" }] }
        policy: { oneOf: [{ $ref: "#/components/schemas/PanelObject" }, { type: "null" }] }
        dcs: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        fsmo: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        replication: { oneOf: [{ $ref: "#/components/schemas/PanelObject" }, { type: "null" }] }
        privileged_groups: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        inventory: { oneOf: [{ $ref: "#/components/schemas/PanelObject" }, { type: "null" }] }
        findings: { type: array, items: { $ref: "#/components/schemas/ActiveDirectoryFinding" } }
        finding_counts: { $ref: "#/components/schemas/ActiveDirectoryFindingCounts" }
        errors: { type: array, items: { type: string } }
    RedfishOverview:
      type: object
      additionalProperties: true
      properties:
        service: { $ref: "#/components/schemas/PanelObject" }
        systems: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        temperatures: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        fans: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        power_supplies: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        drives: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        logs: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        scrape_errors: { type: [number, "null"] }
    ServiceOverview:
      type: object
      additionalProperties: true
      properties:
        kind: { type: string }
        version: { type: [string, "null"] }
        sampled_at: { type: [number, "null"] }
        state: { type: string }
        checks: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        figures: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        breakdowns: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
    BlacklistOverview:
      type: object
      additionalProperties: true
      properties:
        kind: { type: string }
        sampled_at: { type: [number, "null"] }
        scan_running: { type: boolean }
        scan_age_seconds: { type: [number, "null"] }
        scan_duration_seconds: { type: [number, "null"] }
        addresses_checked: { type: [number, "null"] }
        addresses_listed: { type: [number, "null"] }
        listed_lists: { type: [number, "null"] }
        listed_major_lists: { type: [number, "null"] }
        unknown_checks: { type: [number, "null"] }
        domain_listed: { type: [boolean, "null"] }
        lists: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        checks: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        addresses: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        auth: { type: [object, "null"], additionalProperties: true }
        providers: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
    SynologyOverview:
      type: object
      additionalProperties: true
      properties:
        system: { $ref: "#/components/schemas/PanelObject" }
        volumes: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        pools: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        ssd_caches: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        disks: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        sampled_at: { type: [number, "null"] }
    SynologyActiveBackup:
      type: object
      additionalProperties: true
      properties:
        tasks: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        devices: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        utc_offset_s: { type: integer }

    # -------------------------------------------------------------- sécurité
    SecurityGrade:
      type: [string, "null"]
      enum: [A, B, C, D, F, null]
      description: A ≥ 90, B ≥ 75, C ≥ 60, D ≥ 40, F below; null when nothing could be rated.
    SecurityCheck:
      type: object
      required: [id, title, category, severity, weight, result, evidence, remediation, reference]
      properties:
        id: { type: string, example: pve.updates.security }
        title: { type: string }
        category:
          type: string
          enum: [exposure, patching, authentication, encryption, backup, configuration]
        severity: { type: string, enum: [critical, high, medium, low] }
        weight: { type: integer, description: "critical 10, high 6, medium 3, low 1" }
        result: { type: string, enum: [pass, fail, unknown] }
        evidence: { type: string }
        remediation: { type: string }
        reference: { type: string, format: uri, description: Vendor best-practice page. }
    SecurityGuide:
      type: object
      description: How to raise the score on this kind of device.
      required: [product, steps, doc_url]
      properties:
        product: { type: string, examples: [Proxmox VE, Linux host] }
        steps: { type: array, items: { type: string }, description: Concrete steps, in order. }
        doc_url: { type: string, format: uri, description: Matching section of the documentation. }
    SelfMonitoringComponent:
      type: object
      required: [name, ok]
      properties:
        name: { type: string, enum: [scheduler, database, victoria] }
        ok: { type: boolean }
        error: { type: string }
    HeartbeatPing:
      type: object
      required: [at, outcome, ok, failed]
      properties:
        at: { type: string, description: "UTC, without suffix." }
        outcome:
          type: string
          enum: [up, fail, withheld]
          description: "`withheld`: a component was down and nothing was sent."
        ok: { type: boolean, description: The call left and the service accepted it. }
        error: { type: string }
        failed:
          type: array
          items: { type: string }
    Heartbeat:
      type: object
      required: [enabled, interval_seconds, send_fail, has_url, url_host, last_ping]
      properties:
        enabled: { type: boolean }
        interval_seconds: { type: integer, minimum: 30, maximum: 3600 }
        send_fail: { type: boolean, description: Send a failure signal instead of staying silent. }
        has_url: { type: boolean }
        url_host: { type: [string, "null"] }
        last_ping:
          oneOf:
            - { $ref: "#/components/schemas/HeartbeatPing" }
            - { type: "null" }
    HeartbeatUpdate:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        interval_seconds: { type: integer, minimum: 30, maximum: 3600 }
        send_fail: { type: boolean }
        url: { type: string, description: "Omitted: kept. Empty: cleared." }
    HeartbeatTestResult:
      type: object
      required: [ok, error]
      properties:
        ok: { type: boolean }
        error: { type: [string, "null"] }
    SelfMonitoring:
      type: object
      required: [status, components, data_free_bytes, data_total_bytes, database_bytes, vm_embedded, vm_restarts, scheduler_idle_seconds, scheduler_backlog, heartbeat]
      properties:
        status: { type: string, enum: [ok, degraded] }
        components:
          type: array
          items: { $ref: "#/components/schemas/SelfMonitoringComponent" }
        data_free_bytes: { type: [integer, "null"] }
        data_total_bytes: { type: [integer, "null"] }
        database_bytes: { type: integer }
        vm_embedded: { type: boolean }
        vm_restarts: { type: integer }
        scheduler_idle_seconds: { type: integer }
        scheduler_backlog: { type: integer }
        heartbeat: { $ref: "#/components/schemas/Heartbeat" }
    SecuritySettings:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    SecurityReport:
      type: object
      required: [enabled, target_id, target_name, kind, supported, score, grade, capped, evaluated_at, counts, checks, guide]
      properties:
        enabled:
          type: boolean
          description: "`false`: the score is turned off; `supported` is false and nothing else is filled."
        target_id: { type: integer }
        target_name: { type: string }
        kind: { type: string }
        supported: { type: boolean }
        score: { type: [integer, "null"], minimum: 0, maximum: 100 }
        grade: { $ref: "#/components/schemas/SecurityGrade" }
        capped:
          type: boolean
          description: A failing critical check capped the grade at C.
        evaluated_at: { type: string, description: UTC, without suffix. }
        counts:
          type: object
          properties:
            pass: { type: integer }
            fail: { type: integer }
            unknown: { type: integer }
        checks:
          type: array
          description: Failing checks first (heaviest first), then passing, then unknown.
          items: { $ref: "#/components/schemas/SecurityCheck" }
        guide:
          oneOf:
            - { $ref: "#/components/schemas/SecurityGuide" }
            - { type: "null" }
    SecuritySummary:
      type: object
      required: [enabled, evaluated_at, devices]
      properties:
        enabled: { type: boolean, description: "`false`: the score is turned off, `devices` is empty." }
        evaluated_at: { type: string }
        devices:
          type: array
          items:
            type: object
            properties:
              target_id: { type: integer }
              target_name: { type: string }
              kind: { type: string }
              score: { type: [integer, "null"] }
              grade: { $ref: "#/components/schemas/SecurityGrade" }
              capped: { type: boolean }
              pass: { type: integer }
              fail: { type: integer }
              unknown: { type: integer }
              top_failures: { type: array, items: { type: string } }

    CveState:
      type: string
      enum: [vulnerable, patched, unknown]
      description: "`unknown`: to check by hand (backported fix possible, ambiguous data)."
    CveSeverity:
      type: string
      enum: [critical, high, medium, low, none]
      description: CVSS 3 class; `none` when no score is known.
    CveSettings:
      type: object
      required: [enabled, has_nvd_key]
      properties:
        enabled: { type: boolean }
        has_nvd_key: { type: boolean }
    CveSettingsInput:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        nvd_api_key: { type: string, description: "Omitted: kept. Empty: cleared." }
    CveFinding:
      type: object
      properties:
        target_id: { type: integer }
        target_name: { type: string }
        target_kind: { type: string }
        component: { type: string }
        installed_version: { type: string }
        fixed_version: { type: [string, "null"] }
        cve_id: { type: string }
        summary: { type: string }
        cvss: { type: [number, "null"] }
        severity: { $ref: "#/components/schemas/CveSeverity" }
        published: { type: [string, "null"] }
        exploited: { type: boolean, description: In the CISA KEV catalog. }
        ransomware: { type: boolean }
        state: { $ref: "#/components/schemas/CveState" }
        reason:
          type: string
          enum: [below_fixed_version, in_affected_range, no_fix_available, fixed_version_installed, vendor_build, undetermined, version_unparsed]
        source: { type: string, enum: [nvd, osv, debian] }
        link: { type: string }
        ignored: { type: boolean }
        ignore_note: { type: [string, "null"] }
        ignored_by: { type: [string, "null"] }
        ignored_at: { type: [string, "null"] }
    CveList:
      type: object
      required: [enabled, findings]
      properties:
        enabled: { type: boolean }
        findings: { type: array, items: { $ref: "#/components/schemas/CveFinding" } }
    CveSummary:
      type: object
      properties:
        enabled: { type: boolean }
        refreshing: { type: boolean }
        last_refresh: { type: [string, "null"] }
        counts:
          type: object
          properties:
            vulnerable: { type: integer }
            exploited: { type: integer }
            unknown: { type: integer }
            patched: { type: integer }
            ignored: { type: integer }
        targets: { type: integer }
        components: { type: integer }
        sources:
          type: array
          items:
            type: object
            properties:
              name: { type: string, enum: [nvd, osv, debian, kev] }
              last_success: { type: [string, "null"] }
              last_error: { type: [string, "null"] }
              items: { type: integer }
    CveInventory:
      type: object
      properties:
        components:
          type: array
          items:
            type: object
            properties:
              target_id: { type: integer }
              target_name: { type: string }
              component: { type: string }
              version: { type: string }
              origin: { type: string, examples: [nvd, "debian:bookworm", "osv:Ubuntu:24.04:LTS", none] }
              findings: { type: integer }

    # ------------------------------------------------------------------ MCP
    McpEndpointInfo:
      type: object
      required: [error]
      properties:
        error: { type: string }
        protocolVersion: { type: string }
        transport: { type: string, const: streamable-http }
        streaming: { type: boolean }
        docs: { type: string }
    JsonRpcRequest:
      type: object
      required: [jsonrpc, method]
      description: A request (with `id`) or a notification (without). Batches are refused.
      properties:
        jsonrpc: { type: string, const: "2.0" }
        id: { type: [string, integer] }
        method:
          type: string
          examples: [server/discover, initialize, tools/list, tools/call, ping]
        params: { type: object, additionalProperties: true }
    JsonRpcResponse:
      type: object
      required: [jsonrpc]
      properties:
        jsonrpc: { type: string, const: "2.0" }
        id: { type: [string, integer, "null"] }
        result: { type: object, additionalProperties: true }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: integer }
            message: { type: string }
            data: {}
    NowPlaying:
      type: object
      required: [playing, kind, title, artists, duration_ms, progress_ms]
      properties:
        playing: { type: boolean }
        kind: { type: string, description: "`track`, `episode`, `ad` or `unknown`." }
        title: { type: string }
        artists: { type: array, items: { type: string } }
        album: { type: [string, "null"] }
        cover_url: { type: [string, "null"], description: Always on https://i.scdn.co. }
        duration_ms: { type: integer }
        progress_ms: { type: integer }
        device_name: { type: [string, "null"] }
        device_type: { type: [string, "null"] }
    WallNewsItem:
      type: object
      required: [title, link, source]
      properties:
        title: { type: string }
        link: { type: string }
        source: { type: string }
        published: { type: [string, "null"], description: UTC, without suffix. }
    WallNews:
      type: object
      required: [ticker, items, problems]
      properties:
        ticker: { type: boolean }
        items:
          type: array
          items: { $ref: "#/components/schemas/WallNewsItem" }
        problems:
          type: array
          items:
            type: object
            required: [feed, message]
            properties:
              feed: { type: string }
              message: { type: string }
    WallNewsSettings:
      type: object
      required: [ticker, feeds]
      properties:
        ticker: { type: boolean }
        feeds:
          type: array
          maxItems: 8
          items:
            type: object
            required: [url]
            properties:
              url: { type: string }
              label: { type: string, maxLength: 40 }
    WallPlace:
      type: object
      required: [name, latitude, longitude]
      properties:
        name: { type: string }
        region: { type: string }
        country_code: { type: string }
        latitude: { type: number }
        longitude: { type: number }
    WallWidgetsSettings:
      type: object
      properties:
        layout: { $ref: "#/components/schemas/WallLayout" }
        text:
          type: object
          description: The free message widget (plain text, one line).
          properties:
            enabled: { type: boolean }
            content: { type: string, maxLength: 200 }
        crypto:
          type: object
          properties:
            enabled: { type: boolean }
            coins: { type: array, maxItems: 10, items: { type: string }, description: CoinGecko ids. }
            currency: { type: string, default: usd }
        weather:
          type: object
          properties:
            enabled: { type: boolean }
            places: { type: array, maxItems: 1, items: { $ref: "#/components/schemas/WallPlace" }, description: "The one place whose weather shows under the clock." }
            units: { type: string, enum: [metric, imperial] }
        stocks:
          type: object
          properties:
            enabled: { type: boolean }
            symbols: { type: array, maxItems: 10, items: { type: string } }
        fx:
          type: object
          properties:
            enabled: { type: boolean }
            base: { type: string, default: EUR }
            currencies: { type: array, maxItems: 10, items: { type: string } }
        cve:
          type: object
          properties:
            enabled: { type: boolean }
            source: { type: string, enum: [both, nvd, kev] }
            count: { type: integer, minimum: 1, maximum: 10 }
        has_finnhub_key: { type: boolean, readOnly: true }
        ai:
          type: object
          description: >-
            AI usage cards (Claude, OpenAI), read from the providers'
            organization admin APIs. Consumer subscriptions (Claude Pro/Max,
            ChatGPT Plus) have no official API and are not covered.
          properties:
            period: { type: string, enum: [today, week, month], default: week, description: "UTC; week = the last 7 days, month = the current month." }
            by_person: { type: boolean, description: "Also list the biggest consumers (tokens only; the providers do not break costs down by person)." }
            claude: { $ref: "#/components/schemas/WallAiProvider" }
            openai: { $ref: "#/components/schemas/WallAiProvider" }
        has_coingecko_key: { type: boolean, readOnly: true }
        has_anthropic_key: { type: boolean, readOnly: true }
        has_openai_key: { type: boolean, readOnly: true }
    WallAiProvider:
      type: object
      properties:
        enabled: { type: boolean }
        people:
          type: array
          maxItems: 30
          description: Display names for the identifiers the provider's API returns (Anthropic account or API key ids, OpenAI user or API key ids).
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, maxLength: 100 }
              name: { type: string, maxLength: 40 }
    WallAiUsage:
      type: object
      required: [period, from, cost_usd, input_tokens, output_tokens]
      properties:
        period: { type: string, enum: [today, week, month] }
        from: { type: string, description: First day (UTC, YYYY-MM-DD). }
        cost_usd: { type: number, description: Total cost in US dollars. }
        input_tokens: { type: integer, description: Input tokens, cache included. }
        output_tokens: { type: integer }
        people:
          type: [array, "null"]
          description: Biggest consumers by tokens; null unless `by_person` is on.
          items:
            type: object
            required: [name, mapped, input_tokens, output_tokens]
            properties:
              name: { type: [string, "null"], description: "A configured name, else the shortened identifier; null when the API attributes the usage to no key or account." }
              mapped: { type: boolean }
              input_tokens: { type: integer }
              output_tokens: { type: integer }
    WallWidgetSection:
      type: object
      required: [updated, error, needs_key, source, source_url]
      properties:
        data: { description: "The widget's data; null when unavailable." }
        updated: { type: [string, "null"], description: When the source was read (UTC, without suffix). }
        error: { type: [string, "null"], description: Why the last read failed (the data may be older). }
        needs_key: { type: boolean }
        source: { type: string, description: The source to credit on the widget. }
        source_url: { type: string }
    WallWidgets:
      type: object
      required: [layout]
      properties:
        layout: { $ref: "#/components/schemas/WallLayout" }
        crypto:
          oneOf:
            - { $ref: "#/components/schemas/WallWidgetSection" }
            - { type: "null" }
        weather:
          oneOf:
            - { $ref: "#/components/schemas/WallWidgetSection" }
            - { type: "null" }
        stocks:
          oneOf:
            - { $ref: "#/components/schemas/WallWidgetSection" }
            - { type: "null" }
        fx:
          oneOf:
            - { $ref: "#/components/schemas/WallWidgetSection" }
            - { type: "null" }
        cve:
          oneOf:
            - { $ref: "#/components/schemas/WallWidgetSection" }
            - { type: "null" }
        claude:
          description: "Claude (Anthropic) usage; `data` is a WallAiUsage. Null when off."
          oneOf:
            - { $ref: "#/components/schemas/WallWidgetSection" }
            - { type: "null" }
        openai:
          description: "OpenAI usage; `data` is a WallAiUsage. Null when off."
          oneOf:
            - { $ref: "#/components/schemas/WallWidgetSection" }
            - { type: "null" }
        text: { type: [string, "null"], description: "The free message; null when off or empty." }
    WallNewsCountry:
      type: object
      required: [code, feeds]
      properties:
        code: { type: string, description: ISO 3166-1 alpha-2, TECH or AI (themed groups), or INT. }
        feeds:
          type: array
          items:
            type: object
            required: [label, url]
            properties:
              label: { type: string }
              url: { type: string }
    WallLayout:
      type: object
      description: >-
        Where each wall widget goes (weather, news, cve, crypto, stocks, fx,
        claude, openai, text), in order. Unknown or repeated ids are dropped; a
        widget missing from every zone goes to its default one (weather, news,
        cve and text on the right, the others in the bottom bar). Placing a widget
        does not turn it on.
      properties:
        top: { type: array, items: { type: string } }
        bottom: { type: array, items: { type: string } }
        right: { type: array, items: { type: string } }
        hidden: { type: array, items: { type: string } }
    WallNewsTest:
      type: object
      required: [ok, count]
      properties:
        ok: { type: boolean }
        error: { type: [string, "null"] }
        count: { type: integer }
        first:
          oneOf:
            - { $ref: "#/components/schemas/WallNewsItem" }
            - { type: "null" }
    WallLink:
      type: object
      required: [link, set_by, set_at]
      properties:
        link: { type: string }
        set_by: { type: string }
        set_at: { type: string, description: UTC, without suffix. }
    WallMusic:
      type: object
      required: [spotify, speaker_name]
      properties:
        spotify:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [off, connected, expired] }
            now_playing:
              oneOf:
                - { $ref: "#/components/schemas/NowPlaying" }
                - { type: "null" }
            error: { type: [string, "null"] }
        link:
          oneOf:
            - { $ref: "#/components/schemas/WallLink" }
            - { type: "null" }
        speaker_name: { type: string }
    WallSpeaker:
      type: object
      required: [speaker_name, status, devices, listed, walls]
      properties:
        speaker_name: { type: string }
        status: { type: string, enum: [off, connected, expired] }
        account_name: { type: [string, "null"] }
        premium: { type: [boolean, "null"], description: "null: unknown." }
        devices:
          type: array
          items:
            type: object
            required: [name, type, is_active, is_restricted]
            properties:
              id: { type: [string, "null"] }
              name: { type: string }
              type: { type: string }
              is_active: { type: boolean }
              is_restricted: { type: boolean }
              volume_percent: { type: [integer, "null"] }
        listed: { type: boolean, description: "Spotify lists the speaker among the account's devices." }
        walls:
          type: array
          items:
            type: object
            required: [display, name, phase, activated, seen_at]
            properties:
              display: { type: string }
              name: { type: string }
              phase: { type: string }
              activated: { type: boolean }
              device_id: { type: [string, "null"] }
              problem: { type: [string, "null"] }
              browser: { type: [string, "null"] }
              premium: { type: [boolean, "null"] }
              listed: { type: [boolean, "null"] }
              seen_at: { type: string, description: "UTC, no suffix." }
        error: { type: [string, "null"] }
    SpotifyAccount:
      type: object
      required: [status, missing_scopes, speaker_name, scopes, loopback_redirect_uri, callback_path]
      properties:
        status: { type: string, enum: [off, connected, expired] }
        client_id: { type: [string, "null"] }
        account_name: { type: [string, "null"] }
        connected_at: { type: [string, "null"] }
        reconnect_by: { type: [string, "null"], description: Spotify ends a connection six months after approval. }
        missing_scopes: { type: array, items: { type: string } }
        last_error: { type: [string, "null"] }
        speaker_name: { type: string }
        scopes: { type: array, items: { type: string } }
        loopback_redirect_uri: { type: string }
        callback_path: { type: string }
    OnCallPerson:
      type: object
      properties:
        id: { type: integer, format: int64 }
        display_name: { type: string }
        disabled: { type: boolean }
        on_call: { type: boolean, description: On call right now on at least one schedule. }
        username: { type: string, description: Administrators and the person themselves only. }
        role: { type: string, enum: [admin, operator, viewer], description: Administrators and the person themselves only. }
        contacts: { type: integer, description: Enabled contact methods. Administrators and the person themselves only. }
    OnCallEntry:
      type: object
      properties:
        schedule_id: { type: integer, format: int64 }
        schedule_name: { type: string }
        user_id: { type: [integer, "null"], format: int64 }
        since: { type: [string, "null"], format: date-time }
        until: { type: [string, "null"], format: date-time }
        override_id: { type: [integer, "null"], format: int64 }
    OnCallWindow:
      type: object
      description: Weekly window in the schedule's time zone; an end at or before the start crosses midnight, equal start and end cover the whole day.
      required: [days, start_minute, end_minute]
      properties:
        days: { type: array, items: { type: integer, minimum: 0, maximum: 6 }, description: "0 = Monday." }
        start_minute: { type: integer, minimum: 0, maximum: 1439 }
        end_minute: { type: integer, minimum: 0, maximum: 1439 }
    OnCallLayer:
      type: object
      required: [rotation, participants]
      properties:
        name: { type: string }
        rotation:
          type: object
          required: [kind, start]
          properties:
            kind: { type: string, enum: [daily, weekly, custom] }
            start: { type: string, description: "First handoff, local time of the schedule (YYYY-MM-DDTHH:MM)." }
            length: { type: integer, minimum: 1, description: Custom rotations only. }
            unit: { type: string, enum: [hours, days, weeks], description: Custom rotations only. }
        participants: { type: array, items: { type: integer, format: int64 }, description: Account ids in rotation order. }
        restrictions: { type: array, items: { $ref: "#/components/schemas/OnCallWindow" } }
    OnCallSchedulePayload:
      type: object
      required: [name, timezone, layers]
      properties:
        name: { type: string }
        description: { type: string }
        timezone: { type: string, description: IANA time zone. }
        handoff_notifications: { type: boolean }
        layers: { type: array, items: { $ref: "#/components/schemas/OnCallLayer" }, description: A later layer wins where it is active. }
    OnCallSchedule:
      allOf:
        - $ref: "#/components/schemas/OnCallSchedulePayload"
        - type: object
          properties:
            id: { type: integer, format: int64 }
            now:
              type: [object, "null"]
              properties:
                user_id: { type: integer, format: int64 }
                since: { type: [string, "null"], format: date-time }
                until: { type: [string, "null"], format: date-time }
                layer: { type: [integer, "null"] }
                override_id: { type: [integer, "null"], format: int64 }
            created_at: { type: string }
            updated_at: { type: string }
    OnCallShift:
      type: object
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        user_id: { type: integer, format: int64 }
        layer: { type: [integer, "null"] }
        override_id: { type: [integer, "null"], format: int64 }
    OnCallShifts:
      type: object
      properties:
        final: { type: array, items: { $ref: "#/components/schemas/OnCallShift" } }
        layers: { type: array, items: { type: array, items: { $ref: "#/components/schemas/OnCallShift" } } }
        overrides: { type: array, items: { $ref: "#/components/schemas/OnCallOverride" } }
    OnCallOverridePayload:
      type: object
      required: [user_id, starts_at, ends_at]
      properties:
        user_id: { type: integer, format: int64, description: Who takes the shift. }
        replaces: { type: [integer, "null"], format: int64, description: "Only while this person would be on call; null: whoever is." }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        note: { type: string }
    OnCallOverride:
      allOf:
        - $ref: "#/components/schemas/OnCallOverridePayload"
        - type: object
          properties:
            id: { type: integer, format: int64 }
            schedule_id: { type: integer, format: int64 }
            created_by: { type: string }
            created_at: { type: string }
    EscalationStep:
      type: object
      required: [delay_minutes, targets]
      properties:
        delay_minutes: { type: integer, minimum: 1, maximum: 1440, description: Wait after this step before the next one. }
        targets:
          type: array
          items:
            type: object
            required: [type, id]
            properties:
              type: { type: string, enum: [schedule, user, channel] }
              id: { type: integer, format: int64 }
    EscalationPolicyPayload:
      type: object
      required: [name, steps]
      properties:
        name: { type: string }
        description: { type: string }
        repeat: { type: integer, minimum: 0, maximum: 9, description: Extra rounds of the whole chain after the last step. }
        steps: { type: array, items: { $ref: "#/components/schemas/EscalationStep" } }
    EscalationPolicy:
      allOf:
        - $ref: "#/components/schemas/EscalationPolicyPayload"
        - type: object
          properties:
            id: { type: integer, format: int64 }
            channels: { type: array, items: { type: integer, format: int64 }, description: On-call channels that run this policy. }
            created_at: { type: string }
            updated_at: { type: string }
    Escalation:
      type: object
      properties:
        id: { type: integer, format: int64 }
        policy_id: { type: integer, format: int64 }
        policy_name: { type: string }
        channel_id: { type: integer, format: int64 }
        fingerprint: { type: string }
        target_id: { type: [integer, "null"], format: int64 }
        target_name: { type: string }
        rule_name: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        status: { type: string, enum: [active, acked, resolved, exhausted, cancelled] }
        step: { type: integer, description: Next step index. }
        round: { type: integer }
        next_at: { type: [string, "null"], format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        acked_by: { type: [string, "null"] }
        events:
          type: array
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              step: { type: [integer, "null"] }
              round: { type: [integer, "null"] }
              event: { type: string, enum: [started, notified, failed, skipped, acked, resolved, exhausted, cancelled] }
              user_id: { type: [integer, "null"], format: int64 }
              user_name: { type: [string, "null"] }
              via: { type: string }
              kind: { type: string }
              detail: { type: string }
    ContactOptions:
      type: object
      properties:
        kinds: { type: array, items: { type: string } }
        team_channels:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
              kind: { type: string }
              recipient: { type: string, enum: [email, phone, chat_id] }
    ContactPayload:
      type: object
      required: [label]
      properties:
        label: { type: string }
        kind: { type: string, description: Own service (one of `ContactOptions.kinds`). }
        via_channel_id: { type: [integer, "null"], format: int64, description: Team channel that reaches this address instead. }
        address: { type: [string, "null"] }
        settings: { type: object }
        secrets: { type: object, description: "Omitted: kept. `{}`: cleared." }
        enabled: { type: boolean }
        min_severity: { type: string, enum: [info, warning, critical] }
    Contact:
      type: object
      properties:
        id: { type: integer, format: int64 }
        label: { type: string }
        kind: { type: string }
        via_channel_id: { type: [integer, "null"], format: int64 }
        via_channel_name: { type: [string, "null"] }
        address: { type: [string, "null"] }
        settings: { type: object }
        has_secret: { type: boolean }
        enabled: { type: boolean }
        min_severity: { type: string, enum: [info, warning, critical] }
        last_error: { type: [string, "null"] }
        last_used_at: { type: [string, "null"], format: date-time }
    OnCallProfilePayload:
      type: object
      properties:
        timezone: { type: string }
        quiet_hours: { type: [object, "null"], description: "A weekly window, as a channel's quiet hours. Outside on-call duty, only critical alerts get through during it." }
    OnCallProfile:
      type: object
      properties:
        timezone: { type: string }
        quiet_hours: { type: [object, "null"] }
        calendar: { type: boolean, description: An iCal link exists. }
        on_call: { type: array, items: { $ref: "#/components/schemas/OnCallEntry" } }
        next_shift:
          type: [object, "null"]
          properties:
            schedule_id: { type: integer, format: int64 }
            schedule_name: { type: string }
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
    OnCallCalendarLink:
      type: object
      properties:
        url: { type: string }

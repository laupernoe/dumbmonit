    get:
      operationId: getSecuritySummary
      tags: [Security]
      summary: Security score of every rated device, worst first
      description: "While the score is turned off, answers `enabled: false` and no device."
      x-token-scope: read
      responses:
        "200":
          description: One row per enabled device whose kind has checks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecuritySummary" }

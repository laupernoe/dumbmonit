# Spécification OpenAPI 3.1 de l'API HTTP de DumbMonit.
#
# Maintenue à la main, embarquée dans le binaire (`api/openapi.rs`) et servie en
# JSON à `GET /api/openapi.json`. Le serveur réécrit `info.version` avec sa
# constante API_VERSION et ajoute `info.x-server-version`.
#
# Un test de dérive compare les routes déclarées dans `crates/server/src/api/**`
# à ce fichier : toute route ajoutée au routeur doit l'être ici, avec ses méthodes
# exactes. Seules en sont exclues, volontairement, les routes du protocole des
# agents (`/api/ingest`, `/api/agent/commands*`, `/api/agent/relay*`), les
# redirections du navigateur pour OpenID Connect (`/api/auth/oidc/start`,
# `/api/auth/oidc/callback`) et SAML (`/api/auth/saml/start`, `/acs`,
# `/complete`), et la distribution de l'agent (`/install.sh`,
# `/install.ps1`, `/download/{name}`).
#
# Chaque opération porte `x-token-scope` :
#   public  aucune authentification (`security: []`)
#   read    jeton `read` (ou `write`), ou session de n'importe quel compte
#   write   jeton `write`, ou session d'administrateur
#   none    session seulement : tout jeton d'API est refusé (403)
openapi: 3.1.0
info:
  title: DumbMonit HTTP API
  version: "0.1"
  summary: Monitoring from homelabs to mid-sized companies — the API the web UI uses, open to scripts and assistants.
  description: |
    Everything the DumbMonit web interface does goes through this API. It is an
    **alpha**: routes and fields may still change between releases. The
    `X-DumbMonit-Api-Version` header, present on every `/api` response, says
    which revision of this document the server implements.

    ## Authentication

    Two ways in, accepted on every protected route:

    - **API token** — `Authorization: Bearer dmt_…`, created in Settings →
      *API & assistants*. Meant for scripts, dashboards and assistants. No
      cookie is involved, so no anti-CSRF header is needed.
    - **Session cookie** — `dumbmonit_session`, what the web UI uses after
      `POST /api/auth/login`. Every state-changing request (`POST`, `PUT`,
      `DELETE`) sent with the cookie must also carry
      `X-Requested-With: DumbMonit`, or it is refused with `403`.

    A token has a scope. **`read`** grants what a *viewer* account sees: every
    `GET`. **`write`** grants what an *administrator* does: `POST`, `PUT` and
    `DELETE` as well. Whatever its scope, a token can never manage accounts,
    sessions, two-factor authentication, SSO, API or agent tokens, nor export
    or restore a backup: those operations are marked `x-token-scope: none` and
    answer `403` to a bearer token. A token can also expire, be restricted to
    some networks, and is refused when the account that created it is disabled;
    when that account is no longer an administrator, a `write` token acts as a
    `read` one.

    Each operation carries `x-token-scope`: `public` (no authentication),
    `read`, `write` or `none` (session only).

    ## Roles

    Accounts have one of three roles. **`viewer`** reads every `GET`.
    **`operator`** reads the same and handles alerts — the operations marked
    `x-roles: [admin, operator]`: acknowledge, ignore a rule for one device
    (an override with `enabled: false` only, no threshold), snooze
    (maintenance windows) and clear resolved history. **`admin`** does
    everything. Every other write is admin only, and an operator can never
    manage accounts or roles.

    ## Errors

    Every error body is JSON: `{"error": "message"}` — `400` bad request,
    `401` no valid session or token (with `WWW-Authenticate: Bearer` for a
    token), `403` not allowed (viewer, operator outside alert handling, or
    `read` token on a write route, missing
    anti-CSRF header, token on a session-only route, token used from a network
    it is not allowed from), `404` unknown id, `409` conflict, `429` rate
    limited (with `Retry-After`), `500` otherwise. An unknown path under `/api`
    answers `404 {"error": "Unknown API route: …"}`.

    ## Limits

    Each API token may make **120 calls per minute**. Beyond, `429` with
    `Retry-After` (seconds). Every response to a token-authenticated request
    carries `RateLimit-Limit`, `RateLimit-Remaining` and `RateLimit-Reset`.

    ## CORS

    Cross-origin requests are answered only when they carry an
    `Authorization: Bearer dmt_…` header (plus `GET /api/openapi.json`, which
    is public): `Access-Control-Allow-Origin` is sent, never
    `Access-Control-Allow-Credentials`, so a session cookie is never usable
    from another origin. Allowed origins: any by default, or the list in
    `DUMBMONIT_API_CORS_ORIGINS` (`off` disables CORS altogether).

    Full guide: <https://dumbmonit.readthedocs.io/en/latest/reference/api/>
  license:
    name: MIT
    identifier: MIT
  contact:
    name: DumbMonit
    url: https://github.com/laupernoe/dumbmonit
externalDocs:
  description: HTTP API reference (Read the Docs)
  url: https://dumbmonit.readthedocs.io/en/latest/reference/api/
servers:
  - url: /
    description: This DumbMonit instance
security:
  - bearerAuth: []
  - cookieAuth: []
tags:
  - name: Health
    description: Liveness of the server and its dependencies.
  - name: Specification
    description: This document.
  - name: Accounts
    description: Sign-in, sessions, two-factor authentication, SSO and accounts. Session only.
  - name: SCIM
    description: >-
      SCIM 2.0 provisioning of accounts and teams by an identity provider
      (Entra ID, Okta), with its own bearer token (`dmscim_…`). No API token or
      session is accepted; disabled, these routes answer 404.
  - name: API tokens
    description: Tokens for scripts and assistants. Session only — a token never creates another token.
  - name: Devices
    description: Monitored devices and services (targets).
  - name: Device types
    description: The catalogue of kinds this server can monitor.
  - name: Discovery
    description: SNMP network scan.
  - name: Onboarding
    description: The first-run guide.
  - name: Metrics
    description: MetricsQL queries proxied to VictoriaMetrics.
  - name: Dashboards
    description: Custom dashboards (a grid of widgets) and the metrics catalogue behind the explorer.
  - name: Alerts
    description: Active alerts, history and acknowledgements.
  - name: Rules
    description: Alert rules and per-device overrides.
  - name: Silences
    description: Maintenance windows.
  - name: Notifications
    description: Notification channels and the global notification policy.
  - name: On-call
    description: On-call schedules, replacements, escalation policies and their log; each account's contacts, quiet hours and calendar link.
  - name: Status pages
    description: Status pages, their items, logos and subscribers.
  - name: Reports
    description: Periodic availability reports sent by email.
  - name: Incidents
    description: Incidents and maintenance announcements shown on status pages.
  - name: Public status
    description: What a published status page exposes, without authentication.
  - name: Agents
    description: Machines running the DumbMonit agent, relays and enrolment tokens.
  - name: Containers
    description: Docker containers on agent machines, and the commands sent to them.
  - name: Heartbeats
    description: Push monitors — the secret URL a job calls.
  - name: Website changes
    description: Pages, changes, line diffs and screenshots of a `webchange` device.
  - name: Websites
    description: Last reading, tracked SEO metadata and confirmed changes of a `website` device.
  - name: Network configuration backups
    description: Stored configuration versions, line diffs and the SSH host key of a `netconfig` device.
  - name: Integration packs
    description: Device types described in YAML.
  - name: Integrations
    description: Panels specific to one device kind (Proxmox, PBS, PDM, PMG, OPNsense, TrueNAS, Redfish, Synology, observability backends, proxies).
  - name: Security
    description: >-
      Security score per device: checks derived from vendor best practices,
      evaluated on the data collectors already gather.
  - name: Remediation
    description: >-
      Runbooks linked to alerts, remediation actions (closed catalogue), automatic
      policies armed in two steps, and the audit log. Actions are session only.
  - name: Backup
    description: Encrypted export and restore of the instance. Session only.
  - name: Configuration files
    description: >-
      Declarative configuration in YAML (GitOps): plan, apply and export.
      Administrator session or `write` token. Objects declared by a file are
      managed by it and refuse manual edits.
  - name: Logs
    description: Server logs kept on disk, their export, and shipping to a log service. Session only.
  - name: Storage
    description: Metrics retention, long-term 5-minute history, embedded log store and disk usage. Session only.
  - name: Self-monitoring
    description: Health of DumbMonit itself and the outgoing heartbeat.
  - name: Assistants
    description: The built-in Model Context Protocol (MCP) server.
  - name: Wall news
    description: >-
      Optional headlines (RSS/Atom, read by the server) on the wall display.
      Off by default.
  - name: Wall widgets
    description: >-
      Optional widgets on the wall display (coins, weather, stocks, exchange
      rates, critical CVEs), read by the server from public sources and
      cached. Off by default. API keys never come back.
  - name: Wall music
    description: >-
      Music on the wall display: what plays on the connected Spotify account,
      the link every wall plays, and connecting Spotify (Authorization Code +
      PKCE). Refresh tokens never leave the server.
  - name: Prometheus compatibility
    description: Read access for an existing Prometheus or Grafana, outside `/api`.
  - name: OpenTelemetry
    description: OTLP/HTTP reception of metrics and logs, outside `/api`.

paths:
  # ------------------------------------------------------------------ santé
  /api/health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Server version and state of its dependencies
      description: Always `200`; a failing component is reported in the body and `status` is then `degraded`.
      security: []
      x-token-scope: public
      responses:
        "200":
          description: Health report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/integrations/wordpress.zip:
    get:
      operationId: downloadWordpressBanner
      tags: [Status pages]
      summary: Download the WordPress status banner plugin
      description: >-
        The `dumbmonit-status-banner` plugin as a zip with the plugin folder at its root, ready for
        Plugins > Add New > Upload Plugin. Embedded in the server; contains no secret.
      x-token-scope: read
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: The plugin archive.
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/integrations/banner.php:
    get:
      operationId: downloadPhpBanner
      tags: [Status pages]
      summary: Download the PHP status banner helper
      description: >-
        `banner.php`, to `require` from a PHP site and call with the status page URL. Embedded in
        the server; contains no secret.
      x-token-scope: read
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: The PHP source.
          content:
            text/x-php:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/update:
    get:
      operationId: getUpdate
      tags: [Health]
      summary: Whether a newer release exists
      description: >-
        The server asks the public GitHub releases API for the latest release at most once
        every 24 hours (cached in memory) and compares it with the running version, pre-releases
        such as `0.1.0-alpha.7` included. Nothing is sent but an anonymous request. Disabled by
        `DUMBMONIT_UPDATE_CHECK=off` or by `PUT /api/update/settings`; `latest` stays empty then.
        Nothing is ever installed automatically.
      x-token-scope: read
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: Update state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/update/check:
    post:
      operationId: checkUpdateNow
      tags: [Health]
      summary: Look for a new release now
      description: Bypasses the 24-hour cache. At most once a minute; `409` with the wait otherwise.
      x-token-scope: write
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: Update state after the check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/update/settings:
    put:
      operationId: setUpdateCheck
      tags: [Health]
      summary: Turn the update check on or off
      description: Ignored while `DUMBMONIT_UPDATE_CHECK=off` is set (`locked_by_env`).
      x-token-scope: write
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: Update state with the new setting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/openapi.json:
    get:
      operationId: getOpenApi
      tags: [Specification]
      summary: This OpenAPI document
      description: Public and free of any secret. Served with `Access-Control-Allow-Origin` so that API tools hosted elsewhere can load it.
      security: []
      x-token-scope: public
      responses:
        "200":
          description: The OpenAPI 3.1 document, in JSON.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  # ------------------------------------------------------------- comptes
  /api/auth/status:
    get:
      operationId: getAuthStatus
      tags: [Accounts]
      summary: Whether the instance is configured and who is signed in
      description: >-
        `configured: false` means a fresh instance: until the first administrator
        exists, every protected route answers `401`.
      security: []
      x-token-scope: public
      responses:
        "200":
          description: Authentication state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }

  /api/auth/setup:
    post:
      operationId: setupFirstAdmin
      tags: [Accounts]
      summary: Create the first administrator
      description: Only on a fresh instance (`409` once an account exists), with the setup code printed in the server logs (`401` if wrong, `429` after too many attempts). Does not open a session.
      security: []
      x-token-scope: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "204": { description: Account created. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auth/login:
    post:
      operationId: login
      tags: [Accounts]
      summary: Sign in with a password
      description: >-
        `204` with a `Set-Cookie` header carrying the session. When the account
        has two-factor authentication, `200` with a pending ticket to finish
        with `POST /api/auth/login/totp`. Rate limited after five failures
        (`429`, `Retry-After` doubling from 30 s to 5 min).
      security: []
      x-token-scope: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "204":
          description: Signed in; the session cookie is set.
          headers:
            Set-Cookie:
              description: "`dumbmonit_session`, HttpOnly, SameSite=Lax."
              schema: { type: string }
        "200":
          description: Two-factor authentication required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpChallenge" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auth/login/totp:
    post:
      operationId: loginTotp
      tags: [Accounts]
      summary: Finish a sign-in with a two-factor code
      security: []
      x-token-scope: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpLoginRequest" }
      responses:
        "204":
          description: Signed in; the session cookie is set.
          headers:
            Set-Cookie:
              description: "`dumbmonit_session`, HttpOnly, SameSite=Lax."
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auth/logout:
    post:
      operationId: logout
      tags: [Accounts]
      summary: End the current session
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "204": { description: Signed out; the cookie is cleared. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/me:
    get:
      operationId: getCurrentUser
      tags: [Accounts]
      summary: The signed-in account
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/password:
    post:
      operationId: changePassword
      tags: [Accounts]
      summary: Change the password of the signed-in account
      description: Signs out every other session of the account.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "204": { description: Password changed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auth/passkey/login/begin:
    post:
      operationId: beginPasskeyLogin
      tags: [Accounts]
      summary: Start a sign-in with a passkey
      description: >-
        Returns the WebAuthn options for `navigator.credentials.get()` (discoverable
        credential, user verification required). The relying-party id is the host
        of the request's `Origin` (or of `DUMBMONIT_PUBLIC_URL` when set); HTTPS is
        required except on `localhost`, and an IP address is refused.
      security: []
      x-token-scope: public
      responses:
        "200":
          description: A challenge id and the options.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyCeremony" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/auth/passkey/login/finish:
    post:
      operationId: finishPasskeyLogin
      tags: [Accounts]
      summary: Finish a sign-in with a passkey
      description: >-
        Verifies the assertion (challenge, origin, relying party, user presence and
        verification, ES256 signature, counter) and opens the session. A passkey
        replaces the password and the second factor.
      security: []
      x-token-scope: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, credential]
              properties:
                challenge_id: { type: string }
                credential:
                  type: object
                  required: [id, response]
                  properties:
                    id: { type: string, description: "Credential id, base64url." }
                    response:
                      type: object
                      required: [clientDataJSON, authenticatorData, signature]
                      properties:
                        clientDataJSON: { type: string }
                        authenticatorData: { type: string }
                        signature: { type: string }
                        userHandle: { type: [string, "null"] }
      responses:
        "204":
          description: Signed in; the session cookie is set.
          headers:
            Set-Cookie:
              description: "`dumbmonit_session`, HttpOnly, SameSite=Lax."
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auth/passkeys:
    get:
      operationId: listPasskeys
      tags: [Accounts]
      summary: Passkeys of the signed-in account
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: The account's passkeys, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Passkey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/passkeys/register/begin:
    post:
      operationId: beginPasskeyRegistration
      tags: [Accounts]
      summary: Start adding a passkey
      description: >-
        Asks for the password again (like the two-factor enrolment) and returns the
        options for `navigator.credentials.create()`: ES256 only, attestation
        `none`, resident key and user verification required. Local accounts only;
        at most 20 passkeys per account.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordConfirmation" }
      responses:
        "200":
          description: A challenge id and the options.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyCeremony" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auth/passkeys/register/finish:
    post:
      operationId: finishPasskeyRegistration
      tags: [Accounts]
      summary: Finish adding a passkey
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, credential]
              properties:
                challenge_id: { type: string }
                name: { type: string, description: "Shown in the list; 60 characters at most." }
                credential:
                  type: object
                  required: [id, response]
                  properties:
                    id: { type: string }
                    transports: { type: array, items: { type: string } }
                    response:
                      type: object
                      required: [clientDataJSON, attestationObject]
                      properties:
                        clientDataJSON: { type: string }
                        attestationObject: { type: string }
      responses:
        "200":
          description: The passkey that was added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Passkey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/auth/passkeys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      operationId: renamePasskey
      tags: [Accounts]
      summary: Rename a passkey
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "204": { description: Renamed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deletePasskey
      tags: [Accounts]
      summary: Remove a passkey
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/auth/totp:
    get:
      operationId: getTotpStatus
      tags: [Accounts]
      summary: Two-factor state of the signed-in account
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: Two-factor state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: disableTotp
      tags: [Accounts]
      summary: Remove the second factor of the signed-in account
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordConfirmation" }
      responses:
        "204": { description: Second factor removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auth/totp/enroll:
    post:
      operationId: enrollTotp
      tags: [Accounts]
      summary: Propose a two-factor secret
      description: Nothing is enforced until the secret is confirmed with `POST /api/auth/totp/verify`.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordConfirmation" }
      responses:
        "200":
          description: The proposed secret.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpEnrolment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auth/totp/verify:
    post:
      operationId: verifyTotp
      tags: [Accounts]
      summary: Confirm the enrolment with a first code
      description: Returns the recovery codes — shown once.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpCode" }
      responses:
        "200":
          description: Two-factor enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/auth/audit:
    get:
      operationId: listAuditLog
      tags: [Accounts]
      summary: The latest security events
      description: Administrator session only.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 200 }
      responses:
        "200":
          description: Events, most recent first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/oidc/config:
    get:
      operationId: getOidcConfig
      tags: [Accounts]
      summary: Single sign-on settings
      description: Administrator session only. The client secret is never returned (`has_client_secret`).
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: The effective settings and where they come from.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OidcConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: putOidcConfig
      tags: [Accounts]
      summary: Store single sign-on settings
      description: An absent or empty `client_secret` keeps the stored one.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OidcConfigUpdate" }
      responses:
        "200":
          description: The new effective settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OidcConfig" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: deleteOidcConfig
      tags: [Accounts]
      summary: Forget the stored single sign-on settings
      description: Environment variables, if any, apply again.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "204": { description: Settings forgotten. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/oidc/test:
    post:
      operationId: testOidc
      tags: [Accounts]
      summary: Fetch the identity provider's discovery document
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OidcTestRequest" }
      responses:
        "200":
          description: What was found, or why it failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OidcTestReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/ldap/config:
    get:
      operationId: getLdapConfig
      tags: [Accounts]
      summary: LDAP / Active Directory settings
      description: Administrator session only. The service account password is never returned (`has_bind_password`).
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: The effective settings and where they come from.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LdapConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: putLdapConfig
      tags: [Accounts]
      summary: Store LDAP / Active Directory settings
      description: >-
        An absent or empty `bind_password` keeps the stored one, as long as the
        server URL and bind DN are unchanged. An empty `bind_dn` (anonymous
        search) clears it. A plain `ldap://` URL without StartTLS is refused
        unless `DUMBMONIT_LDAP_ALLOW_PLAIN` is set.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LdapConfigUpdate" }
      responses:
        "200":
          description: The new effective settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LdapConfig" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: deleteLdapConfig
      tags: [Accounts]
      summary: Forget the stored LDAP settings
      description: Environment variables (`DUMBMONIT_LDAP_*`), if any, apply again.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: The effective settings once the stored ones are gone.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LdapConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/ldap/test:
    post:
      operationId: testLdap
      tags: [Accounts]
      summary: Test the directory connection
      description: >-
        Connects, binds the service account and, when `username` is given,
        searches that user and its groups. No user password is asked or tried.
        The stored service password is only used for the server URL and bind
        DN it was saved for.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LdapTestRequest" }
      responses:
        "200":
          description: A step-by-step diagnostic.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LdapTestReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/saml/metadata:
    get:
      operationId: getSamlMetadata
      tags: [Accounts]
      summary: SAML service provider metadata
      description: |
        Public: give this URL (or the document) to the identity provider. It
        declares the entity ID, the assertion consumer service (HTTP-POST) and
        that assertions must be signed. The sign-in itself goes through
        `/api/auth/saml/start` (redirect to the identity provider),
        `/api/auth/saml/acs` (the provider's HTTP-POST response) and
        `/api/auth/saml/complete`: browser navigations, not API calls.
      security: []
      x-token-scope: public
      responses:
        "200":
          description: SAML 2.0 metadata.
          content:
            application/samlmetadata+xml:
              schema: { type: string }

  /api/auth/saml/config:
    get:
      operationId: getSamlConfig
      tags: [Accounts]
      summary: SAML single sign-on settings
      description: Administrator session only.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: The stored settings, with the addresses to declare at the identity provider.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SamlConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: putSamlConfig
      tags: [Accounts]
      summary: Store SAML single sign-on settings
      description: |
        Absent fields take their default. When `enabled`, the identity provider
        entity ID, sign-in URL and at least one signing certificate are required:
        unsigned assertions are always refused.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SamlConfigUpdate" }
      responses:
        "200":
          description: The new settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SamlConfig" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/saml/metadata/import:
    post:
      operationId: importSamlMetadata
      tags: [Accounts]
      summary: Read identity provider metadata
      description: Extracts the entity ID, the sign-in URL and the signing certificates. Nothing is stored.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SamlMetadataImportRequest" }
      responses:
        "200":
          description: The values to put in the settings form.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SamlMetadataImport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/scim:
    get:
      operationId: getScimSettings
      tags: [Accounts]
      summary: SCIM provisioning settings
      description: >-
        Administrator session only. Says whether SCIM provisioning is on, the
        base URL to give the identity provider, whether a token exists (never
        the token itself) and the role given to the accounts SCIM creates.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: putScimSettings
      tags: [Accounts]
      summary: Turn SCIM provisioning on or off
      description: >-
        `default_role` is `viewer` or `operator`: SCIM never creates an
        administrator. An absent `default_role` keeps the current one.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
                default_role: { type: string, enum: [viewer, operator] }
      responses:
        "200":
          description: The new settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/scim/token:
    post:
      operationId: createScimToken
      tags: [Accounts]
      summary: Generate the SCIM token
      description: >-
        Generates a new bearer token for the identity provider and returns it
        in `token`, this once only. The previous token stops working at once.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: The settings, with the new token in clear.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ScimSettings" }
                  - type: object
                    required: [token]
                    properties:
                      token: { type: string, description: "`dmscim_…`, shown once." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: deleteScimToken
      tags: [Accounts]
      summary: Revoke the SCIM token
      description: Every SCIM request is refused until a new token is generated.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "204": { description: Token revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/scim/v2/ServiceProviderConfig:
    get:
      operationId: scimServiceProviderConfig
      tags: [SCIM]
      summary: SCIM service provider configuration
      security: [{ scimBearer: [] }]
      x-token-scope: none
      responses:
        "200": { $ref: "#/components/responses/ScimResource" }
        "401": { $ref: "#/components/responses/ScimError" }
        "403": { $ref: "#/components/responses/ScimError" }
        "404": { $ref: "#/components/responses/ScimError" }

  /api/scim/v2/ResourceTypes:
    get:
      operationId: scimResourceTypes
      tags: [SCIM]
      summary: SCIM resource types (User, Group)
      security: [{ scimBearer: [] }]
      x-token-scope: none
      responses:
        "200": { $ref: "#/components/responses/ScimList" }
        "401": { $ref: "#/components/responses/ScimError" }
        "403": { $ref: "#/components/responses/ScimError" }

  /api/scim/v2/Schemas:
    get:
      operationId: scimSchemas
      tags: [SCIM]
      summary: SCIM schemas (User, Group)
      security: [{ scimBearer: [] }]
      x-token-scope: none
      responses:
        "200": { $ref: "#/components/responses/ScimList" }
        "401": { $ref: "#/components/responses/ScimError" }
        "403": { $ref: "#/components/responses/ScimError" }

  /api/scim/v2/Users:
    get:
      operationId: scimListUsers
      tags: [SCIM]
      summary: List provisioned accounts
      description: >-
        Only the accounts SCIM created or linked. `filter` understands `eq`
        comparisons joined by `and` on `id`, `userName`, `externalId`,
        `displayName`, `active`, `emails` and `emails[type eq "work"].value`;
        anything else is `400 invalidFilter`.
      security: [{ scimBearer: [] }]
      x-token-scope: none
      parameters:
        - { $ref: "#/components/parameters/ScimFilter" }
        - { $ref: "#/components/parameters/ScimStartIndex" }
        - { $ref: "#/components/parameters/ScimCount" }
        - { $ref: "#/components/parameters/ScimExcludedAttributes" }
      responses:
        "200": { $ref: "#/components/responses/ScimList" }
        "400": { $ref: "#/components/responses/ScimError" }
        "401": { $ref: "#/components/responses/ScimError" }
        "403": { $ref: "#/components/responses/ScimError" }
    post:
      operationId: scimCreateUser
      tags: [SCIM]
      summary: Provision an account
      description: >-
        Creates the account with the `default_role` setting (never admin), or
        links the existing account with the same `userName` when it is not an
        administrator and not already provisioned (`409 uniqueness` otherwise).
        A `password` is never read: the account signs in through SSO.
      security: [{ scimBearer: [] }]
      x-token-scope: none
      requestBody: { $ref: "#/components/requestBodies/ScimResource" }
      responses:
        "201": { $ref: "#/components/responses/ScimResource" }
        "400": { $ref: "#/components/responses/ScimError" }
        "401": { $ref: "#/components/responses/ScimError" }
        "403": { $ref: "#/components/responses/ScimError" }
        "409": { $ref: "#/components/responses/ScimError" }

  /api/scim/v2/Users/{id}:
    parameters:
      - { $ref: "#/components/parameters/ScimId" }
    get:
      operationId: scimGetUser
      tags: [SCIM]
      summary: A provisioned account
      security: [{ scimBearer: [] }]
      x-token-scope: none
      responses:
        "200": { $ref: "#/components/responses/ScimResource" }
        "401": { $ref: "#/components/responses/ScimError" }
        "403": { $ref: "#/components/responses/ScimError" }
        "404": { $ref: "#/components/responses/ScimError" }
    put:
      operationId: scimReplaceUser
      tags: [SCIM]
      summary: Replace a provisioned account
      description: Refused (`403`) on an administrator.
      security: [{ scimBearer: [] }]
      x-token-scope: none
      requestBody: { $ref: "#/components/requestBodies/ScimResource" }
      responses:
        "200": { $ref: "#/components/responses/ScimResource" }
        "400": { $ref: "#/components/responses/ScimError" }
        "401": { $ref: "#/components/responses/ScimError" }
        "403": { $ref: "#/components/responses/ScimError" }
        "404": { $ref: "#/components/responses/ScimError" }
        "409": { $ref: "#/components/responses/ScimError" }
    patch:
      operationId: scimPatchUser
      tags: [SCIM]
      summary: Update a provisioned account
      description: >-
        `add`, `replace` and `remove`, in any case, with or without `path`.
        `active: false` (or `"False"`) disables the account and closes its
        sessions; `true` only re-enables an account SCIM disabled. Attributes
        DumbMonit does not keep are ignored. Refused (`403`) on an administrator.
      security: [{ scimBearer: [] }]
      x-token-scope: none
      requestBody: { $ref: "#/components/requestBodies/ScimPatch" }
      responses:
        "200": { $ref: "#/components/responses/ScimResource" }
        "400": { $ref: "#/components/responses/ScimError" }
        "401": { $ref: "#/components/responses/ScimError" }
        "403": { $ref: "#/components/responses/ScimError" }
        "404": { $ref: "#/components/responses/ScimError" }
    delete:
      operationId: scimDeleteUser
      tags: [SCIM]
      summary: Delete a provisioned account
      description: The account, its sessions and its API tokens go. Refused (`403`) on an administrator.
      security: [{ scimBearer: [] }]
      x-token-scope: none
      responses:
        "204": { description: Account deleted. }
        "401": { $ref: "#/components/responses/ScimError" }
        "403": { $ref: "#/components/responses/ScimError" }
        "404": { $ref: "#/components/responses/ScimError" }

  /api/scim/v2/Groups:
    get:
      operationId: scimListGroups
      tags: [SCIM]
      summary: List provisioned teams
      description: >-
        Only the teams SCIM created or linked. `filter` understands `eq`
        comparisons joined by `and` on `id`, `displayName`, `externalId` and
        `members`. `excludedAttributes=members` leaves the members out.
      security: [{ scimBearer: [] }]
      x-token-scope: none
      parameters:
        - { $ref: "#/components/parameters/ScimFilter" }
        - { $ref: "#/components/parameters/ScimStartIndex" }
        - { $ref: "#/components/parameters/ScimCount" }
        - { $ref: "#/components/parameters/ScimExcludedAttributes" }
      responses:
        "200": { $ref: "#/components/responses/ScimList" }
        "400": { $ref: "#/components/responses/ScimError" }
        "401": { $ref: "#/components/responses/ScimError" }
        "403": { $ref: "#/components/responses/ScimError" }
    post:
      operationId: scimCreateGroup
      tags: [SCIM]
      summary: Provision a team
      description: >-
        Creates the team, or links the existing team with the same name when no
        provider manages it yet. Folder rights stay the administrator's: a new
        team sees nothing until it is given some.
      security: [{ scimBearer: [] }]
      x-token-scope: none
      requestBody: { $ref: "#/components/requestBodies/ScimResource" }
      responses:
        "201": { $ref: "#/components/responses/ScimResource" }
        "400": { $ref: "#/components/responses/ScimError" }
        "401": { $ref: "#/components/responses/ScimError" }
        "403": { $ref: "#/components/responses/ScimError" }
        "409": { $ref: "#/components/responses/ScimError" }

  /api/scim/v2/Groups/{id}:
    parameters:
      - { $ref: "#/components/parameters/ScimId" }
    get:
      operationId: scimGetGroup
      tags: [SCIM]
      summary: A provisioned team
      security: [{ scimBearer: [] }]
      x-token-scope: none
      parameters:
        - { $ref: "#/components/parameters/ScimExcludedAttributes" }
      responses:
        "200": { $ref: "#/components/responses/ScimResource" }
        "401": { $ref: "#/components/responses/ScimError" }
        "403": { $ref: "#/components/responses/ScimError" }
        "404": { $ref: "#/components/responses/ScimError" }
    put:
      operationId: scimReplaceGroup
      tags: [SCIM]
      summary: Replace a provisioned team
      description: >-
        With `members`, the members SCIM added follow the list; members added by
        an administrator always stay. A linked team keeps its name.
      security: [{ scimBearer: [] }]
      x-token-scope: none
      requestBody: { $ref: "#/components/requestBodies/ScimResource" }
      responses:
        "200": { $ref: "#/components/responses/ScimResource" }
        "400": { $ref: "#/components/responses/ScimError" }
        "401": { $ref: "#/components/responses/ScimError" }
        "403": { $ref: "#/components/responses/ScimError" }
        "404": { $ref: "#/components/responses/ScimError" }
        "409": { $ref: "#/components/responses/ScimError" }
    patch:
      operationId: scimPatchGroup
      tags: [SCIM]
      summary: Update a provisioned team
      description: >-
        `members` add, remove and replace, `members[value eq "…"]` remove,
        `displayName` and `externalId`.
      security: [{ scimBearer: [] }]
      x-token-scope: none
      requestBody: { $ref: "#/components/requestBodies/ScimPatch" }
      responses:
        "204": { description: Team updated. }
        "400": { $ref: "#/components/responses/ScimError" }
        "401": { $ref: "#/components/responses/ScimError" }
        "403": { $ref: "#/components/responses/ScimError" }
        "404": { $ref: "#/components/responses/ScimError" }
    delete:
      operationId: scimDeleteGroup
      tags: [SCIM]
      summary: Delete a provisioned team
      description: >-
        Deletes the team when SCIM created it; otherwise only removes the members
        SCIM added and unlinks it.
      security: [{ scimBearer: [] }]
      x-token-scope: none
      responses:
        "204": { description: Team deleted or unlinked. }
        "401": { $ref: "#/components/responses/ScimError" }
        "403": { $ref: "#/components/responses/ScimError" }
        "404": { $ref: "#/components/responses/ScimError" }

  /api/users:
    get:
      operationId: listUsers
      tags: [Accounts]
      summary: Every account
      description: Administrator session only.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: Accounts.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createUser
      tags: [Accounts]
      summary: Create an account
      description: "`password` may be omitted only when SSO is enabled."
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/users/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updateUser
      tags: [Accounts]
      summary: Update an account
      description: An omitted field keeps its value. The last administrator can be neither demoted nor disabled.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteUser
      tags: [Accounts]
      summary: Delete an account
      description: Not yourself, not the last administrator. The account's API tokens are revoked.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "204": { description: Account deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/teams:
    get:
      operationId: listTeams
      tags: [Accounts]
      summary: Teams, existing folders and the team settings
      description: Administrator session only.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: Teams.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamsOverview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createTeam
      tags: [Accounts]
      summary: Create a team
      description: Administrator session only. `members` lists the accounts added by hand.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamInput" }
      responses:
        "201":
          description: Team created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/teams/settings:
    put:
      operationId: updateTeamSettings
      tags: [Accounts]
      summary: What accounts without a team can see
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamSettings" }
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/teams/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updateTeam
      tags: [Accounts]
      summary: Update a team
      description: An omitted field keeps its value. Members added by an identity provider or SCIM are kept.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamInput" }
      responses:
        "200":
          description: The team.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteTeam
      tags: [Accounts]
      summary: Delete a team
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "204": { description: Team deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/clients:
    get:
      operationId: listClients
      tags: [Accounts]
      summary: MSP clients, the MSP setting and the accounts in no client
      description: MSP administrator session only.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: Clients.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientsOverview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createClient
      tags: [Accounts]
      summary: Create a client
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientInput" }
      responses:
        "201":
          description: Client created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/clients/settings:
    put:
      operationId: updateMspSettings
      tags: [Accounts]
      summary: Turn MSP mode on or off
      description: >-
        Off, every account sees what its role and teams allow, as before. On,
        a non-admin account only sees the clients it belongs to.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MspSettings" }
      responses:
        "200":
          description: The setting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MspSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/clients/overview:
    get:
      operationId: getClientsOverview
      tags: [Accounts]
      summary: State of each client, for the MSP overview
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: One entry per client.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClientHealth" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/clients/assignments:
    get:
      operationId: getClientAssignments
      tags: [Accounts]
      summary: The client of every object that has one
      description: >-
        One map per kind (`targets`, `status_pages`, `agent_tokens`,
        `channels`, `rules`, `silences`, `reports`) from object id to client
        id. An object missing from its map is shared by the instance.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: The maps.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/clients/assign:
    put:
      operationId: assignToClient
      tags: [Accounts]
      summary: Move objects to a client
      description: >-
        Moving a target takes along what depends on it (children, relayed
        targets, label-managed monitors) and cuts any link left between two
        clients. A status page of a client may only list targets of that
        client; a maintenance window on a target follows the target.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientAssign" }
      responses:
        "204": { description: Moved. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/clients/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updateClient
      tags: [Accounts]
      summary: Update a client
      description: An omitted field keeps its value. Members added by an identity provider are kept.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientInput" }
      responses:
        "200":
          description: The client.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteClient
      tags: [Accounts]
      summary: Delete an empty client
      description: >-
        Refused while the client has targets, status pages or agent tokens,
        and for the default client. Its channels, rules, maintenance windows
        and report schedules go with it.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "204": { description: Client deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/clients/{id}/logo:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getClientLogo
      tags: [Accounts]
      summary: Logo of a client
      description: For the MSP administrator and the members of the client; 404 for anyone else.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: The image.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: uploadClientLogo
      tags: [Accounts]
      summary: Set the logo of a client
      description: PNG, JPEG or WebP, 256 KiB at most, shown on its reports and status pages.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { type: string, description: "The file in base64, with or without a `data:` prefix." }
      responses:
        "204": { description: Logo stored. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteClientLogo
      tags: [Accounts]
      summary: Remove the logo of a client
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "204": { description: Logo removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/users/{id}/totp:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      operationId: resetUserTotp
      tags: [Accounts]
      summary: Reset another account's second factor
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "204": { description: Second factor removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------- jetons d'API
  /api/tokens:
    get:
      operationId: listApiTokens
      tags: [API tokens]
      summary: Every API token, revoked ones included
      description: Admin only. The secret is never listed.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: Tokens, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createApiToken
      tags: [API tokens]
      summary: Create an API token
      description: >-
        Administrator session only. The response is the only time the secret is
        shown. The token is tied to the account that creates it.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiTokenCreate" }
            example:
              name: Grafana
              scope: read
              expires_in_days: 90
              allowed_networks: ["192.168.1.0/24"]
      responses:
        "201":
          description: Token created; `secret` is shown once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedApiToken" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/tokens/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      operationId: revokeApiToken
      tags: [API tokens]
      summary: Revoke an API token
      description: Effective immediately. `404` when unknown or already revoked.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "204": { description: Token revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ----------------------------------------------------------- équipements
  /api/collectors:
    get:
      operationId: listDeviceTypes
      tags: [Device types]
      summary: Every device kind this server can monitor
      description: >-
        Drives the "Add device" form: label, examples, accepted credentials,
        setup notice and typed options (stored as `tags[key]` on the device).
        Kinds brought by an integration pack are listed as `pack.<id>`.
      x-token-scope: read
      responses:
        "200":
          description: The catalogue.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/KindDescription" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/discovery:
    post:
      operationId: scanNetwork
      tags: [Discovery]
      summary: Scan a network for SNMP devices
      description: >-
        At most 4096 addresses. A `POST` with a JSON body so that the community
        never appears in a URL or a log line.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscoveryRequest" }
      responses:
        "200":
          description: What answered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/discovery/subnets:
    get:
      operationId: localSubnets
      tags: [Discovery]
      summary: Suggested networks for the scan form
      description: >-
        In order, `DUMBMONIT_SCAN_SUBNETS`, /24 networks of the private IPv4
        addresses of monitored devices (most devices first), then the server's
        connected networks (not when the server runs in a container, where they
        are the container's own networks). Docker bridge ranges are excluded; the
        list is empty when nothing reliable is known. Administrators only.
      x-token-scope: read
      responses:
        "200":
          description: Suggested IPv4 networks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalSubnets" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/discovery/jobs:
    get:
      operationId: listDiscoveryJobs
      tags: [Discovery]
      summary: The last discovery scans
      description: >-
        The twenty most recent scans, kept in memory only (lost on restart, by
        design). Administrators only.
      x-token-scope: read
      responses:
        "200":
          description: Recent scans.
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/DiscoveryJobSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: startDiscoveryJob
      tags: [Discovery]
      summary: Start a network discovery scan
      description: >-
        Sweeps common ports and SNMP on every address of a network (at most 1024,
        a /22), then fingerprints what answers — without ever authenticating. A
        scan with `agent_id` is run by that relay agent on its own network; an
        agent too old to understand the command fails the job with a clear
        message. The SNMP community is a secret, never logged nor returned.
        Administrators only.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscoveryJobRequest" }
      responses:
        "202":
          description: The scan has been queued.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: A scan is already running for this target.

  /api/discovery/jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getDiscoveryJob
      tags: [Discovery]
      summary: A discovery scan, hosts included
      description: >-
        The hosts fill in as the scan progresses; the UI polls every two seconds.
        Administrators only.
      x-token-scope: read
      responses:
        "200":
          description: The scan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: cancelDiscoveryJob
      tags: [Discovery]
      summary: Cancel a discovery scan
      x-token-scope: write
      responses:
        "204": { description: Cancelled. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/discovery/schedules:
    get:
      operationId: listNetscanSchedules
      tags: [Discovery]
      summary: Scheduled network scans
      description: >-
        Subnets scanned at a fixed interval, by the server or by a relay agent, with
        the counts of their inventory. Administrators only.
      x-token-scope: read
      responses:
        "200":
          description: The scheduled scans.
          content:
            application/json:
              schema:
                type: object
                required: [schedules]
                properties:
                  schedules:
                    type: array
                    items: { $ref: "#/components/schemas/NetscanSchedule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createNetscanSchedule
      tags: [Discovery]
      summary: Schedule a network scan
      description: >-
        The first completed scan of a subnet initializes the inventory without
        alerting. At most 1024 addresses (a /22), an interval of 5 minutes to 30
        days, 50 schedules. One schedule per subnet and scanner. Administrators only.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NetscanScheduleInput" }
      responses:
        "201":
          description: The scheduled scan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetscanSchedule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/discovery/schedules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      operationId: updateNetscanSchedule
      tags: [Discovery]
      summary: Change a scheduled network scan
      description: >-
        Changing the subnet or the scanner starts again from an empty inventory.
        Administrators only.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NetscanScheduleInput" }
      responses:
        "200":
          description: The scheduled scan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetscanSchedule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteNetscanSchedule
      tags: [Discovery]
      summary: Delete a scheduled network scan and its inventory
      x-token-scope: write
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/discovery/schedules/{id}/run:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: runNetscanSchedule
      tags: [Discovery]
      summary: Scan now
      description: >-
        Asks for a scan at the next cycle of the scheduler (a few seconds) without
        waiting for the interval. Ignored while a scan of this subnet is running.
        Administrators only.
      x-token-scope: write
      responses:
        "202": { description: Requested. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/discovery/inventory:
    get:
      operationId: getNetscanInventory
      tags: [Discovery]
      summary: Known devices and open ports
      description: >-
        The inventory built by the scheduled scans, unknown devices first. An unknown
        device or port stays reported (see the `netscan_new_device` and
        `netscan_new_port` alert rules) until it is marked as known. Administrators
        only.
      x-token-scope: read
      parameters:
        - name: schedule_id
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: Only the inventory of this scheduled scan.
      responses:
        "200":
          description: The inventory.
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/NetscanDevice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/discovery/inventory/known:
    post:
      operationId: markAllNetscanKnown
      tags: [Discovery]
      summary: Mark every unknown device and port as known
      x-token-scope: write
      parameters:
        - name: schedule_id
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: Only the inventory of this scheduled scan.
      responses:
        "200":
          description: How many items were unknown.
          content:
            application/json:
              schema:
                type: object
                required: [marked]
                properties:
                  marked: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/discovery/inventory/devices/{id}/known:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: markNetscanDeviceKnown
      tags: [Discovery]
      summary: Mark a device, and its ports, as known
      x-token-scope: write
      responses:
        "204": { description: Marked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/discovery/inventory/ports/{id}/known:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: markNetscanPortKnown
      tags: [Discovery]
      summary: Mark an open port as known
      x-token-scope: write
      responses:
        "204": { description: Marked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/onboarding:
    get:
      operationId: getOnboarding
      tags: [Onboarding]
      summary: Where the first-run guide stands
      x-token-scope: read
      responses:
        "200":
          description: Guide state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Onboarding" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: putOnboarding
      tags: [Onboarding]
      summary: Skip the guide or dismiss steps
      description: An omitted field keeps its stored value.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingPatch" }
      responses:
        "200":
          description: Guide state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Onboarding" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/instance:
    get:
      operationId: getInstance
      tags: [Onboarding]
      summary: Product mode and whether the setup wizard is done
      description: Public, so the interface can pick its layout before sign-in. Nothing else about the instance is disclosed here.
      security: []
      x-token-scope: public
      responses:
        "200":
          description: Product mode and setup state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicInstance" }

  /api/instance/settings:
    get:
      operationId: getInstanceSettings
      tags: [Onboarding]
      summary: Instance settings chosen in the setup wizard
      x-token-scope: read
      responses:
        "200":
          description: Instance settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: putInstanceSettings
      tags: [Onboarding]
      summary: Change the product mode, name, language or time zone, or finish the wizard
      description: An omitted field keeps its stored value. Switching the product mode only changes the interface; nothing is deleted.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstancePatch" }
      responses:
        "200":
          description: Instance settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/targets:
    get:
      operationId: listTargets
      tags: [Devices]
      summary: Every device
      x-token-scope: read
      responses:
        "200":
          description: Devices.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Target" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createTarget
      tags: [Devices]
      summary: Add a device
      description: Profile detection starts in the background for SNMP.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TargetPayload" }
            example:
              name: Core switch
              address: 192.168.1.10
              kind: snmp
              interval_secs: 60
              tags: {}
              credential: { type: snmp_community, community: public }
      responses:
        "201":
          description: The device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Target" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/targets/import:
    post:
      operationId: importTargets
      tags: [Devices]
      summary: Import websites from a CSV
      description: >-
        Creates one `website` device per CSV row. Body: `text/csv`, or JSON
        `{"csv": "..."}`. A header row is required; columns are `url`
        (required), `name`, `folder`, `tags` (`k=v;k=v`), `interval`
        (`300`, `5m`, `1h`), `expect_text` and `category` (free text, stored
        as the `category` option). At most 1000 rows. Without `folder`, the
        folder is `Websites/<category>` (the given category, else one guessed
        from the page: E-commerce, Blog, Web app, Showcase), otherwise
        `Websites/<platform>` (platform detected by one GET per site, 4 at a
        time, 10 s each) or `Websites/Other`. Rows
        already monitored are skipped and reported. With `dry_run=true`
        nothing is created and rows come back with status `ok`. Admin only.
      x-token-scope: write
      parameters:
        - name: dry_run
          in: query
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
          application/json:
            schema:
              type: object
              required: [csv]
              properties:
                csv: { type: string }
      responses:
        "200":
          description: Preview (dry run).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetImportReport" }
        "201":
          description: Import done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetImportReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/targets/test:
    post:
      operationId: testTargetConnection
      tags: [Devices]
      summary: Probe a device once without saving it
      description: >-
        Reads the identity of an SNMP device once with the submitted address and
        credentials and reports the result; nothing is stored. The device answers
        with its `sysName` / `sysDescr`. A failed probe is a `200` with `ok: false`
        and the probe's message. SNMP only (other kinds are a `400`), and not
        available through a relay.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TargetTestRequest" }
      responses:
        "200":
          description: The outcome of the probe.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetTestReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/targets/import/kuma:
    post:
      operationId: importKuma
      tags: [Devices]
      summary: Import monitors from an Uptime Kuma backup
      description: >-
        Body: the JSON file exported by Uptime Kuma 1.x (Settings, Backup,
        Export; version 2 has no backup export), at most 4 MiB and 2000
        monitors. `http`, `keyword` and `json-query` monitors become `http`
        devices, `ping` becomes `ping`, `port` becomes `tcp`, `dns` becomes
        `dns`, `push` becomes a `push` heartbeat (with a new URL); groups
        become folders and tags become device tags. Other types, upside-down
        monitors and devices already monitored are skipped with a reason.
        Notifications, credentials, headers and request bodies are never
        imported. With `dry_run=true` nothing is created and rows come back
        with status `ok`. Admin only.
      x-token-scope: write
      parameters:
        - name: dry_run
          in: query
          schema: { type: boolean, default: false }
        - name: rows
          in: query
          description: >-
            Comma-separated row numbers of the preview to import (the others are
            left out of the answer). Absent: every row.
          schema: { type: string, example: "1,4,5" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monitorList]
              properties:
                version: { type: string }
                notificationList: { type: array, items: { type: object } }
                monitorList: { type: array, items: { type: object } }
      responses:
        "200":
          description: Preview (dry run).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KumaImportReport" }
        "201":
          description: Import done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KumaImportReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { description: The file is larger than 4 MiB. }

  /api/targets/import/kuma-db:
    post:
      operationId: importKumaDb
      tags: [Devices]
      summary: Import monitors from an Uptime Kuma database (kuma.db)
      description: >-
        Body: the raw SQLite file `data/kuma.db` of Uptime Kuma 1.x or 2.x
        (`Content-Type: application/octet-stream`), at most 512 MiB. It is
        written to a temporary file, read once in read-only mode (never attached
        to DumbMonit's database) and deleted afterwards. Monitors, groups,
        tags and intervals are mapped exactly as for `/api/targets/import/kuma`;
        notifications, credentials, headers and request bodies are never read
        into DumbMonit. Rows are sorted by device type, folder, then name, and
        numbered in that order, so a preview (`dry_run=true`) and the import of
        the same file agree on the numbers given to `rows`. Uptime Kuma 2 on
        MariaDB cannot be read. Admin only.
      x-token-scope: write
      parameters:
        - name: dry_run
          in: query
          schema: { type: boolean, default: false }
        - name: rows
          in: query
          description: >-
            Comma-separated row numbers of the preview to import (the others are
            left out of the answer). Absent: every row.
          schema: { type: string, example: "1,4,5" }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Preview (dry run).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KumaImportReport" }
        "201":
          description: Import done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KumaImportReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/targets/import/uptimerobot:
    post:
      operationId: importUptimeRobot
      tags: [Devices]
      summary: Import monitors from UptimeRobot
      description: >-
        Body: `{"api_key"}` (a read-only API key, used once to call UptimeRobot's
        `getMonitors` and never stored) or `{"csv"}` (the export of the
        dashboard, columns recognised by title: Friendly Name, URL / IP, Type,
        Port, Interval, Keyword). HTTP(s) and keyword monitors become `http`
        devices, ping becomes `ping`, port becomes `tcp`, heartbeat becomes a
        `push` heartbeat (with a new URL). Paused monitors stay paused.
        Contacts, credentials, headers and request bodies are never imported.
        Same preview / `rows` contract as `/api/targets/import/kuma`, at most 2000
        monitors. Admin only.
      x-token-scope: write
      parameters:
        - name: dry_run
          in: query
          schema: { type: boolean, default: false }
        - name: rows
          in: query
          description: >-
            Comma-separated row numbers of the preview to import. Absent: every row.
          schema: { type: string, example: "1,4,5" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api_key: { type: string, description: A read-only UptimeRobot API key. }
                csv: { type: string, description: The CSV exported from the dashboard. }
      responses:
        "200":
          description: Preview (dry run).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KumaImportReport" }
        "201":
          description: Import done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KumaImportReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { description: UptimeRobot is unreachable or answered with an error. }

  /api/targets/import/gatus:
    post:
      operationId: importGatus
      tags: [Devices]
      summary: Import endpoints from a Gatus configuration
      description: >-
        Body: `{"yaml"}`, the content of Gatus's `config.yaml`. `endpoints` with an
        `http(s)://` URL become `http` devices (status and `[BODY].path`
        conditions are kept as options, the others are listed in the row's
        message), `tcp://` becomes `tcp`, `icmp://` becomes `ping`, endpoints with
        a `dns:` block become `dns`; `external-endpoints` become `push`
        heartbeats (with a new URL). `group` becomes the folder. Headers, bodies
        and alert settings are never imported. Same preview / `rows` contract as
        `/api/targets/import/kuma`. Admin only.
      x-token-scope: write
      parameters:
        - name: dry_run
          in: query
          schema: { type: boolean, default: false }
        - name: rows
          in: query
          schema: { type: string, example: "1,4,5" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [yaml]
              properties:
                yaml: { type: string }
      responses:
        "200":
          description: Preview (dry run).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KumaImportReport" }
        "201":
          description: Import done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KumaImportReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/targets/import/healthchecks:
    post:
      operationId: importHealthchecks
      tags: [Devices]
      summary: Import checks from Healthchecks.io
      description: >-
        Body: `{"api_key", "base_url"?}`. The key is used once against
        `GET /api/v3/checks/` of healthchecks.io (or of the self-hosted
        `base_url`, which goes through the same outbound guard as notification
        channels) and is never stored. Each check becomes a `push` heartbeat whose
        expected interval is the check's `timeout` (or an approximation of its
        cron `schedule`) and whose grace time is kept; tags become device tags.
        The monitor gets a new push URL: the row's message recalls the old ping
        URL (visible with a read-write key) so the job can be updated or the old
        address redirected. Same preview / `rows` contract as
        `/api/targets/import/kuma`. Admin only.
      x-token-scope: write
      parameters:
        - name: dry_run
          in: query
          schema: { type: boolean, default: false }
        - name: rows
          in: query
          schema: { type: string, example: "1,4,5" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              properties:
                api_key: { type: string }
                base_url: { type: string, description: "Self-hosted server, e.g. `https://healthchecks.example.org`. Default: healthchecks.io." }
      responses:
        "200":
          description: Preview (dry run).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KumaImportReport" }
        "201":
          description: Import done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KumaImportReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { description: Healthchecks is unreachable or answered with an error. }

  /api/targets/{id}/release:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    post:
      operationId: releaseManagedTarget
      tags: [Devices]
      summary: Release a monitor managed by Docker labels
      description: >-
        Hands a monitor created from `dumbmonit.*` container labels back to
        manual management: it stops following the labels and can be edited and
        deleted. Until then, `PUT` (other than pausing) and `DELETE` answer `409`.
        Admin only.
      x-token-scope: write
      responses:
        "204": { description: Released. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/summary:
    get:
      operationId: getSummary
      tags: [Devices]
      summary: Flat status counters for dashboards (Homepage, Homarr…)
      description: >-
        Compact counters in a shape that Homepage's `customapi` widget reads by
        path (`devices.down`, `alerts.firing`): the same figures as the MCP
        `get_status` tool. A `read` API token is enough.
      x-token-scope: read
      responses:
        "200":
          description: Counters and an overall verdict.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/targets/reorder:
    post:
      operationId: reorderTargets
      tags: [Devices]
      summary: Reorder devices
      description: >-
        Sets the manual rank of each listed device to its index in `order`
        (0, 1, 2…). Devices left out keep their rank: a local reorder (one
        folder, one Up/Down click) does not need to know every other device's
        rank — `/targets` only ever compares rank between devices of the same
        state tier and folder.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order]
              properties:
                order:
                  type: array
                  items: { type: integer, format: int64 }
      responses:
        "204": { description: Devices reordered. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/targets/folders/rename:
    post:
      operationId: renameTargetFolder
      tags: [Devices]
      summary: Rename a folder
      description: >-
        Moves every device filed under folder `from` to folder `to`. Status
        pages that ticked the folder follow the new name in the same
        transaction.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { type: string }
                to: { type: string, maxLength: 60 }
      responses:
        "204": { description: Folder renamed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/targets/{id}:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    get:
      operationId: getTarget
      tags: [Devices]
      summary: One device
      x-token-scope: read
      responses:
        "200":
          description: The device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Target" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateTarget
      tags: [Devices]
      summary: Replace a device
      description: >-
        Omitting `credential` keeps the stored secret; omitting `profile_id` keeps
        the detected profile (`""` clears it); omitting `via_agent` keeps the
        relay (`null` goes back to direct probing). `enabled: false` clears the
        device's alerts without notifying.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TargetPayload" }
      responses:
        "200":
          description: The device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Target" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteTarget
      tags: [Devices]
      summary: Delete a device
      description: Clears its alerts without notifying and deletes its time series (best effort).
      x-token-scope: write
      responses:
        "204": { description: Device deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/targets/{id}/probe-locations:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    get:
      operationId: getProbeLocations
      tags: [Devices]
      summary: State and latency per probe location
      description: >-
        For a monitor probed from several locations: the last quorum decision and
        each location's last result. A monitor probed from one place returns
        `unknown` with no locations.
      x-token-scope: read
      responses:
        "200":
          description: Quorum decision and locations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeLocationsReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/targets/{id}/probe:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    post:
      operationId: probeTarget
      tags: [Devices]
      summary: Probe a device now
      description: >-
        Through its relay agent when the device has one (`409` when a probe is
        already in flight, `400 Timed out: relay agent …` when it does not answer).
      x-token-scope: write
      responses:
        "200":
          description: What was measured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/targets/{id}/discover:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    post:
      operationId: rediscoverTarget
      tags: [Devices]
      summary: Re-run profile detection
      x-token-scope: write
      responses:
        "200":
          description: The detected profile, or `null`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/targets/{id}/rules:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    get:
      operationId: listTargetRules
      tags: [Rules]
      summary: Alert rules that watch a device
      description: >-
        The rules whose query reads a metric the device has written in the last
        24 hours, with whether each is turned off for this device (a rule
        override with `enabled: false`) and firing on it now.
      x-token-scope: read
      responses:
        "200":
          description: The device's rules.
          content:
            application/json:
              schema:
                type: object
                required: [status, rules]
                properties:
                  status:
                    type: string
                    enum: [ok, no_data, unavailable]
                    description: >-
                      `no_data`: nothing written in the last 24 hours;
                      `unavailable`: VictoriaMetrics did not answer.
                  rules:
                    type: array
                    items:
                      type: object
                      required: [id, uid, name, description, severity, enabled, ignored, custom_threshold, firing]
                      properties:
                        id: { type: integer, format: int64 }
                        uid: { type: string }
                        name: { type: string }
                        description: { type: string }
                        severity: { type: string, enum: [info, warning, critical] }
                        enabled: { type: boolean, description: Enabled for every device. }
                        ignored: { type: boolean, description: Turned off for this device. }
                        custom_threshold: { type: boolean, description: A threshold is set for this device. }
                        firing: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- mesures
  /api/metrics/query:
    get:
      operationId: queryMetrics
      tags: [Metrics]
      summary: Instant MetricsQL query
      description: Each series carries a single `[timestamp, "value"]` pair in `values`.
      x-token-scope: read
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string }
          example: avg by (target, host) (dumbmonit_cpu_usage_percent)
      responses:
        "200":
          description: Series, in the Prometheus shape.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Series" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/metrics/query_range:
    get:
      operationId: queryMetricsRange
      tags: [Metrics]
      summary: Range MetricsQL query
      description: >-
        `start` and `end` are milliseconds since the epoch (400 days at most
        between them); `step` is in seconds and is widened so that a series
        never exceeds 2,000 points.
      x-token-scope: read
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string }
        - name: start
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: end
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: step
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Series, in the Prometheus shape.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Series" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }

  # ---------------------------------------------------------------- alertes
  /api/alerts:
    get:
      operationId: listActiveAlerts
      tags: [Alerts]
      summary: Active alerts
      description: >-
        Pending, firing, suppressed and recently resolved. `phase` is the
        engine's state; `effective_phase` is what to show (`suppressed` when a
        parent device is unreachable, named by `suppressed_by`). Alerts of
        deleted or paused devices are never listed. Dismissed alerts are left
        out unless `dismissed=true`, which lists only them.
      x-token-scope: read
      parameters:
        - name: target_id
          in: query
          description: Only the alerts of this device.
          schema: { type: integer }
        - name: dismissed
          in: query
          description: >-
            `true`: only the dismissed alerts that are still active (to restore
            one). Default: dismissed alerts are not listed.
          schema: { type: boolean }
      responses:
        "200":
          description: Alerts.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActiveAlert" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/alerts/history:
    get:
      operationId: listAlertHistory
      tags: [Alerts]
      summary: Alert phase transitions
      x-token-scope: read
      parameters:
        - name: since
          in: query
          description: RFC 3339 lower bound; the last seven days by default.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1 }
        - name: dismissed
          in: query
          description: >-
            False (default): entries cleared with the dismiss endpoints below
            are left out. True includes them — nothing is ever destroyed by a
            "clear", only hidden from the active view.
          schema: { type: boolean }
      responses:
        "200":
          description: Transitions, most recent first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlertHistoryEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/alerts/history/dismiss-resolved:
    post:
      operationId: dismissResolvedAlertHistory
      tags: [Alerts]
      summary: "Clear all resolved history entries"
      description: >-
        Marks every not-yet-cleared `resolved` transition as dismissed: they
        leave the default history view, the rows stay in the database.
      x-token-scope: write
      x-roles: [admin, operator]
      responses:
        "200":
          description: How many entries were cleared.
          content:
            application/json:
              schema:
                type: object
                required: [dismissed]
                properties:
                  dismissed: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/alerts/history/{id}/dismiss:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: dismissAlertHistoryEntry
      tags: [Alerts]
      summary: Clear one resolved history entry
      description: >-
        Only a `resolved` transition can be cleared: an active one still
        needs attention. The row stays in the database, only hidden from the
        default history view.
      x-token-scope: write
      x-roles: [admin, operator]
      responses:
        "204": { description: Entry cleared. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/alerts/{fingerprint}/ack:
    parameters:
      - name: fingerprint
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: acknowledgeAlert
      tags: [Alerts]
      summary: Acknowledge an alert
      description: >-
        Reminders and escalations pause until `until` (or for `duration_secs`;
        neither means 4 hours, at most 30 days). `{"until": null}` lifts the
        acknowledgement. The resolution is still notified. Audited.
      x-token-scope: write
      x-roles: [admin, operator]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AckRequest" }
      responses:
        "200":
          description: The alert.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActiveAlert" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: unacknowledgeAlert
      tags: [Alerts]
      summary: Lift an acknowledgement
      x-token-scope: write
      x-roles: [admin, operator]
      responses:
        "200":
          description: The alert.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActiveAlert" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/alerts/{fingerprint}/dismiss:
    parameters:
      - name: fingerprint
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: dismissAlert
      tags: [Alerts]
      summary: Dismiss an alert
      description: >-
        "Got it": the current occurrence leaves the active alerts (list,
        overview, wall, counters) and sends nothing more — no reminder, no
        escalation, no resolution — for as long as the condition lasts. Once the
        condition clears, the dismissal ends with it: if it comes back, that is
        a new alert, notified as usual. Its resolution is recorded in the
        history as "dismissed by …". Audited.
      x-token-scope: write
      x-roles: [admin, operator]
      responses:
        "200":
          description: The alert.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActiveAlert" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: undismissAlert
      tags: [Alerts]
      summary: Restore a dismissed alert
      description: Undo a dismissal while the alert is still active. Audited.
      x-token-scope: write
      x-roles: [admin, operator]
      responses:
        "200":
          description: The alert.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActiveAlert" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/alerts/rules:
    get:
      operationId: listRules
      tags: [Rules]
      summary: Every alert rule
      x-token-scope: read
      responses:
        "200":
          description: Rules, with their per-device overrides.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Rule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createRule
      tags: [Rules]
      summary: Create an alert rule
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RulePayload" }
      responses:
        "201":
          description: The rule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/alerts/rules/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updateRule
      tags: [Rules]
      summary: Update an alert rule
      description: A built-in rule keeps its query.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RulePayload" }
      responses:
        "200":
          description: The rule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteRule
      tags: [Rules]
      summary: Delete an alert rule
      description: Built-in rules cannot be deleted — disable them instead.
      x-token-scope: write
      responses:
        "204": { description: Rule deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/alerts/rules/{id}/enable:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: setRuleEnabled
      tags: [Rules]
      summary: Enable or disable an alert rule
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnableRequest" }
      responses:
        "200":
          description: The rule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/alerts/overrides:
    get:
      operationId: listOverrides
      tags: [Rules]
      summary: Per-device rule overrides
      x-token-scope: read
      parameters:
        - name: target_id
          in: query
          description: Only the overrides of this device.
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Overrides.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RuleOverride" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/alerts/rules/{id}/overrides:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listRuleOverrides
      tags: [Rules]
      summary: The overrides of one rule
      x-token-scope: read
      responses:
        "200":
          description: Overrides.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RuleOverride" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/alerts/rules/{id}/overrides/{target_id}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: target_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      operationId: putRuleOverride
      tags: [Rules]
      summary: Create or replace an override for one device
      description: Each field is optional; `null` means "as the rule". An empty override is removed.
      x-token-scope: write
      x-roles: [admin, operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OverridePayload" }
      responses:
        "200":
          description: The override.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuleOverride" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteRuleOverride
      tags: [Rules]
      summary: Remove an override
      x-token-scope: write
      x-roles: [admin, operator]
      responses:
        "204": { description: Override removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/alerts/silences:
    get:
      operationId: listSilences
      tags: [Silences]
      summary: Every maintenance window
      x-token-scope: read
      responses:
        "200":
          description: Windows, with `active_now`, `active_until` and `next_start_at` computed by the server.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Silence" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createSilence
      tags: [Silences]
      summary: Create a maintenance window
      x-token-scope: write
      x-roles: [admin, operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SilencePayload" }
            example:
              name: Sunday backups
              comment: NAS is busy
              target_id: 4
              matchers: {}
              schedule: { kind: weekly, days: [6], start_minute: 120, end_minute: 240, timezone: Europe/Paris }
              enabled: true
      responses:
        "201":
          description: The window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Silence" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/alerts/silences/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      operationId: deleteSilence
      tags: [Silences]
      summary: Delete a maintenance window
      x-token-scope: write
      x-roles: [admin, operator]
      responses:
        "204": { description: Window deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------- notifications
  /api/notify/kinds:
    get:
      operationId: listChannelKinds
      tags: [Notifications]
      summary: Every notification channel type and its fields
      x-token-scope: read
      responses:
        "200":
          description: Channel types.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChannelKind" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/notify/channels:
    get:
      operationId: listChannels
      tags: [Notifications]
      summary: Every notification channel
      description: Secrets are never returned (`has_secret`).
      x-token-scope: read
      responses:
        "200":
          description: Channels.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Channel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createChannel
      tags: [Notifications]
      summary: Create a notification channel
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelPayload" }
            example:
              name: Ops Discord
              kind: discord
              enabled: true
              settings: { username: DumbMonit }
              secrets: { webhook_url: "https://discord.com/api/webhooks/…" }
      responses:
        "201":
          description: The channel.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/notify/channels/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updateChannel
      tags: [Notifications]
      summary: Update a notification channel
      description: >-
        Omitting `secrets` keeps the stored ones; `"secrets": {}` clears them.
        Otherwise secrets are merged by key: a key sent replaces its value, a
        key left out is kept, and `null` or `""` clears it. Changing the kind
        or the destination replaces the whole set instead.
        In `policy`, omitting `matcher` keeps the routing filter and
        `"matcher": null` clears it.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelPayload" }
      responses:
        "200":
          description: The channel.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteChannel
      tags: [Notifications]
      summary: Delete a notification channel
      x-token-scope: write
      responses:
        "204": { description: Channel deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/notify/channels/{id}/test:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: testChannel
      tags: [Notifications]
      summary: Send a test message through a channel
      x-token-scope: write
      responses:
        "200":
          description: Whether the message left.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelTestReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/webpush:
    get:
      operationId: getWebPush
      tags: [Notifications]
      summary: Web Push key and the signed-in account's devices
      description: The VAPID public key to subscribe with (`applicationServerKey`), generated at first start. The private key is never returned. Only the signed-in account's devices are listed, without their endpoint or keys.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: Key and devices.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebPushOverview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/webpush/subscriptions:
    post:
      operationId: subscribeWebPush
      tags: [Notifications]
      summary: Subscribe this browser to Web Push
      description: Body is `PushSubscription.toJSON()`. The endpoint must be HTTPS on a public address (private, loopback and link-local addresses are refused). The same endpoint subscribing again replaces its row. Allowed for viewers too.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebPushSubscription" }
      responses:
        "201":
          description: The subscribed device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebPushDevice" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/webpush/subscriptions/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      operationId: deleteWebPushDevice
      tags: [Notifications]
      summary: Remove one of the signed-in account's devices
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "204": { description: Device removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/webpush/test:
    post:
      operationId: testWebPush
      tags: [Notifications]
      summary: Send a test notification to the signed-in account's devices
      description: Every device of the account, or the one named by `id`. Expired subscriptions (404/410 from the push service) are removed on the way.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer, description: "One device only." }
      responses:
        "200":
          description: What the push services answered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebPushTestReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/notify/policy:
    get:
      operationId: getNotifyPolicy
      tags: [Notifications]
      summary: The global notification policy
      x-token-scope: read
      responses:
        "200":
          description: The policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotifyPolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: putNotifyPolicy
      tags: [Notifications]
      summary: Update the global notification policy
      description: 'Every field is optional; an omitted field keeps its value. `"escalate_channel": null` switches escalation off.'
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotifyPolicyUpdate" }
      responses:
        "200":
          description: The policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotifyPolicy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/notify/match-preview:
    post:
      operationId: previewChannelMatcher
      tags: [Notifications]
      summary: Which devices a channel routing filter selects
      description: Read-only, but a `POST` because the filter is a JSON body; needs the `write` scope like every `POST`.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatchPreviewRequest" }
      responses:
        "200":
          description: The preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ------------------------------------------------------- pages de statut
  /api/status-pages:
    get:
      operationId: listStatusPages
      tags: [Status pages]
      summary: Every status page with its items
      x-token-scope: read
      responses:
        "200":
          description: Pages.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StatusPageView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createStatusPage
      tags: [Status pages]
      summary: Create a status page
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusPagePayload" }
      responses:
        "201":
          description: The page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusPageView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/status-pages/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getStatusPage
      tags: [Status pages]
      summary: One status page with its items
      x-token-scope: read
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusPageView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateStatusPage
      tags: [Status pages]
      summary: Replace a status page
      description: >-
        A full replacement: `title` is required and every omitted field goes back
        to its default — except `accent`, `footer_text`, `homepage_url`,
        `subscribe_channel_id` and `domain`, which keep their stored value when omitted.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusPagePayload" }
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusPageView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteStatusPage
      tags: [Status pages]
      summary: Delete a status page
      description: The public URL stops answering.
      x-token-scope: write
      responses:
        "204": { description: Page deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/status-pages/{id}/items:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: setStatusPageItems
      tags: [Status pages]
      summary: Replace the devices shown on a page
      description: The full ordered list (200 at most). An empty label takes the device's name.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/StatusPageItemInput" }
      responses:
        "200":
          description: The items, in display order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StatusPageItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/status-pages/{id}/access:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: setStatusPageAccess
      tags: [Status pages]
      summary: Choose who can read a page
      description: >-
        `public` (anyone with the link), `password` (a password of its own,
        hashed with Argon2id and never returned) or `users` (a signed-in DumbMonit
        account, local, LDAP or SSO, on the main address only). A page that is not
        public is never indexed or listed in the sitemap, and its document,
        badges, RSS and iCal feeds, logo and day detail follow the same access.
        With `password`, the field is required the first time and kept when
        omitted afterwards; changing it ends every access cookie already issued.
        Any other mode erases the stored password.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [public, password, users] }
                password: { type: string, minLength: 8, maxLength: 200 }
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusPageView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/status-pages/{id}/logo:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getStatusPageLogo
      tags: [Status pages]
      summary: The page's logo (editor preview, drafts included)
      x-token-scope: read
      responses:
        "200":
          description: The image.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: uploadStatusPageLogo
      tags: [Status pages]
      summary: Upload the page's logo
      description: PNG, JPEG or WebP, recognised by content, 256 KiB at most.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogoUpload" }
      responses:
        "204": { description: Logo stored. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteStatusPageLogo
      tags: [Status pages]
      summary: Remove the page's logo
      x-token-scope: write
      responses:
        "204": { description: Logo removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/status-pages/{id}/subscribers:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listStatusPageSubscribers
      tags: [Status pages]
      summary: Subscribers of a page
      description: >-
        Admin accounts and `write` tokens only (personal data). Email, SMS, webhook and Slack
        subscribers are listed together; phone numbers and URLs are masked, and tokens and
        secrets never leave the server.
      x-token-scope: read
      responses:
        "200":
          description: Subscribers.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Subscriber" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/status-pages/{id}/subscribers.csv:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: exportStatusPageSubscribers
      tags: [Status pages]
      summary: Export the subscribers of a page as CSV
      description: >-
        Admin accounts and `write` tokens only. Columns: type, destination, status,
        subscribed_at, services. Webhook and Slack URLs stay masked.
      x-token-scope: read
      responses:
        "200":
          description: CSV file.
          content:
            text/csv: { schema: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/status-pages/{id}/subscription:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getStatusPageSubscription
      tags: [Status pages]
      summary: Subscription channels open on a page (besides email)
      x-token-scope: read
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusSubscriptionSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: setStatusPageSubscription
      tags: [Status pages]
      summary: Open or close the SMS, webhook and Slack subscriptions of a page
      description: >-
        Email is chosen with the page itself (`subscribe_channel_id`). SMS needs a Vonage, Telnyx
        or ASPSMS notification channel; webhook and Slack need nothing, the visitor gives their URL.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusSubscriptionSettings" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusSubscriptionSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/status-pages/{id}/subscribers/{subscriber}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: subscriber
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      operationId: removeStatusPageSubscriber
      tags: [Status pages]
      summary: Remove a subscriber
      x-token-scope: write
      responses:
        "204": { description: Subscriber removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ------------------------------------------------- rapports périodiques
  /api/reports/schedules:
    get:
      operationId: listReportSchedules
      tags: [Reports]
      summary: Every periodic email report
      description: >-
        Administrators only, even for reading: the response lists the
        recipients' addresses.
      x-token-scope: read
      responses:
        "200":
          description: Report schedules.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReportSchedule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createReportSchedule
      tags: [Reports]
      summary: Create a periodic email report
      description: >-
        Omitted fields take their default: weekly, Monday at 8:00, UTC. A new
        schedule never sends a report for a slot that already passed.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportSchedulePayload" }
      responses:
        "201":
          description: The schedule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportSchedule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/reports/schedules/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getReportSchedule
      tags: [Reports]
      summary: One periodic email report
      x-token-scope: read
      responses:
        "200":
          description: The schedule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportSchedule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateReportSchedule
      tags: [Reports]
      summary: Replace a periodic email report
      description: >-
        A full replacement. Changing the frequency, day, hour, timezone or
        turning the report on re-arms it: a slot that already passed is not sent.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportSchedulePayload" }
      responses:
        "200":
          description: The schedule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportSchedule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteReportSchedule
      tags: [Reports]
      summary: Delete a periodic email report
      x-token-scope: write
      responses:
        "204": { description: Schedule deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/reports/schedules/{id}/send-test:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: sendReportPreview
      tags: [Reports]
      summary: Send a preview of the report now
      description: >-
        Sends the report for the current period to the saved recipients, marked
        as a preview. It does not change the schedule: nothing is recorded as
        sent. One preview per schedule every 30 seconds.
      x-token-scope: write
      responses:
        "200":
          description: How many recipients were reached.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportPreviewResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/reports/sla:
    get:
      operationId: downloadSlaReport
      tags: [Reports]
      summary: Availability (SLA) report of a chosen period
      description: >-
        Builds the report on the spot: availability per monitor and per group
        against the period of the same length before it, incidents, response
        times (mean and 95th percentile) and, with `objective`, whether each
        monitor met it. Without `from` and `to`, the previous calendar month.
        `from` and `to` are inclusive days in `tz`, one year at most; a period
        that is not over stops at now. Administrators only, except in MSP
        mode, where a member of a client reads the report of that client
        (`client`), and of nothing else.
      x-token-scope: read
      parameters:
        - { name: from, in: query, schema: { type: string, format: date }, description: First day included. }
        - { name: to, in: query, schema: { type: string, format: date }, description: Last day included; today when omitted. }
        - { name: tz, in: query, schema: { type: string, default: UTC }, description: IANA timezone of the period and of the dates shown. }
        - name: format
          in: query
          schema: { type: string, enum: [pdf, csv, incidents_csv], default: pdf }
        - { name: objective, in: query, schema: { type: number, exclusiveMinimum: 0, maximum: 100 }, description: Availability objective in percent. }
        - { name: page, in: query, schema: { type: integer, format: int64 }, description: Status page whose title heads the report. }
        - { name: title, in: query, schema: { type: string, maxLength: 120 }, description: Report name shown under the header. }
        - { name: client, in: query, schema: { type: integer, format: int64 }, description: "MSP mode: the client reported on (its targets only, its name and logo). Required for a member of several clients." }
      responses:
        "200":
          description: The file, as an attachment.
          content:
            application/pdf: { schema: { type: string, format: binary } }
            text/csv: { schema: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/calendar/maintenance:
    get:
      operationId: getMaintenanceCalendarToken
      tags: [Status pages]
      summary: Token and address of the private maintenance calendar
      description: >-
        The token is created on first use. Administrators only: anyone holding
        the address can read every announced maintenance.
      x-token-scope: read
      responses:
        "200":
          description: The token and the feed path.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceCalendar" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/calendar/maintenance/rotate:
    post:
      operationId: rotateMaintenanceCalendarToken
      tags: [Status pages]
      summary: Replace the private calendar token
      description: The previous address stops working at once.
      x-token-scope: write
      responses:
        "200":
          description: The new token and the feed path.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceCalendar" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/calendar/maintenance.ics:
    get:
      operationId: getMaintenanceCalendar
      tags: [Public status]
      summary: Every maintenance as an iCalendar feed (private, token)
      description: >-
        RFC 5545 feed of the announced maintenance from 90 days back to the far
        future, for a calendar app to subscribe to. The token travels in the
        address and is the only protection: treat the URL as a secret. An
        unknown token answers 404.
      security: []
      x-token-scope: public
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: iCalendar.
          content:
            text/calendar:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/incidents:
    get:
      operationId: listIncidents
      tags: [Incidents]
      summary: Every incident and maintenance announcement, with its updates
      x-token-scope: read
      responses:
        "200":
          description: Incidents.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IncidentView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createIncident
      tags: [Incidents]
      summary: Open an incident or announce a maintenance
      description: "`body` becomes the first update."
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentPayload" }
      responses:
        "201":
          description: The incident.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/incidents/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updateIncident
      tags: [Incidents]
      summary: Update an incident
      description: An omitted field keeps its value.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentPayload" }
      responses:
        "200":
          description: The incident.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteIncident
      tags: [Incidents]
      summary: Delete an incident
      x-token-scope: write
      responses:
        "204": { description: Incident deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/incidents/{id}/updates:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listIncidentUpdates
      tags: [Incidents]
      summary: The timeline of an incident
      x-token-scope: read
      responses:
        "200":
          description: Updates, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IncidentUpdate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: addIncidentUpdate
      tags: [Incidents]
      summary: Post an update and move the incident to its status
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentUpdatePayload" }
      responses:
        "201":
          description: The incident.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # -------------------------------------------------- pages de statut publiques
  /api/public/status/{slug}:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: getPublicStatus
      tags: [Public status]
      summary: The document a published status page is built from
      description: >-
        A page in `password` or `users` access mode answers 401 with an `access`
        field (`password` or `users`) until the visitor unlocks it; badges, RSS,
        iCal, logo and day detail of that page do the same.
      security: []
      x-token-scope: public
      responses:
        "200":
          description: The page, its services and incidents.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicStatus" }
        "401": { $ref: "#/components/responses/PageAccessRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/public/status/{slug}/badge.svg:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: getPublicStatusBadge
      tags: [Public status]
      summary: Overall status badge
      security: []
      x-token-scope: public
      responses:
        "200": { $ref: "#/components/responses/Svg" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/public/status/{slug}/banner.js:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: getPublicStatusBannerScript
      tags: [Public status]
      summary: Script of the status banner for third-party websites
      security: []
      x-token-scope: public
      responses:
        "200":
          description: JavaScript, to include with a script tag.
          content:
            application/javascript:
              schema: { type: string }

  /api/public/status/{slug}/rss:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: getPublicStatusRss
      tags: [Public status]
      summary: Incidents as an RSS feed
      security: []
      x-token-scope: public
      responses:
        "200":
          description: RSS 2.0.
          content:
            application/rss+xml:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/public/status/{slug}/maintenance.ics:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: getPublicStatusMaintenanceCalendar
      tags: [Public status]
      summary: The page's maintenance as an iCalendar feed
      description: >-
        RFC 5545 feed of the maintenance announced on the page (and those for
        every page), from 90 days back to the far future. It follows the page's
        access mode.
      security: []
      x-token-scope: public
      responses:
        "200":
          description: iCalendar.
          content:
            text/calendar:
              schema: { type: string }
        "401": { $ref: "#/components/responses/PageAccessRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/public/status/{slug}/access:
    parameters:
      - $ref: "#/components/parameters/Slug"
    post:
      operationId: unlockPublicStatus
      tags: [Public status]
      summary: Trade a private page's password for its access cookie
      description: >-
        For a page in `password` mode. The cookie (`dm_page_<id>`, HttpOnly,
        12 hours) is signed with a key derived from the instance secret and bound
        to the page and to the current password. Attempts are counted per address
        and per page: after a few mistakes, answers 429 until the delay passes.
      security: []
      x-token-scope: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200":
          description: Unlocked; the access cookie is set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [unlocked] }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/public/status/{slug}/day/{date}:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - name: date
        in: path
        required: true
        description: A UTC day, `YYYY-MM-DD`, within the last 90 days.
        schema: { type: string }
    get:
      operationId: getPublicStatusDay
      tags: [Public status]
      summary: One day of a status page, hour by hour
      description: >-
        Per service (public name only): availability of each of the 24 UTC hours
        and the outages of the day with their start and end, plus the
        announcements that touch the day.
      security: []
      x-token-scope: public
      responses:
        "200":
          description: The day.
          content:
            application/json:
              schema:
                type: object
                properties:
                  date: { type: string }
                  services:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        label: { type: string }
                        hours:
                          type: array
                          items: { type: [number, "null"] }
                        outages:
                          type: array
                          items:
                            type: object
                            properties:
                              from: { type: string }
                              to: { type: string }
                              minutes: { type: integer }
                  incidents:
                    type: array
                    items:
                      type: object
                      properties:
                        title: { type: string }
                        kind: { type: string }
                        status: { type: string }
                        starts_at: { type: string }
                        ends_at: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/public/status/{slug}/uptime.svg:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/BadgeDays"
    get:
      operationId: getPublicUptimeBadge
      tags: [Public status]
      summary: Mean uptime badge
      security: []
      x-token-scope: public
      responses:
        "200": { $ref: "#/components/responses/Svg" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/public/status/{slug}/response.svg:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: getPublicResponseBadge
      tags: [Public status]
      summary: Mean response time badge
      security: []
      x-token-scope: public
      responses:
        "200": { $ref: "#/components/responses/Svg" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/public/status/{slug}/components/{key}/badge.svg:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/ComponentKey"
    get:
      operationId: getPublicComponentBadge
      tags: [Public status]
      summary: Status badge of one service
      security: []
      x-token-scope: public
      responses:
        "200": { $ref: "#/components/responses/Svg" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/public/status/{slug}/components/{key}/uptime.svg:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/ComponentKey"
      - $ref: "#/components/parameters/BadgeDays"
    get:
      operationId: getPublicComponentUptimeBadge
      tags: [Public status]
      summary: Uptime badge of one service
      security: []
      x-token-scope: public
      responses:
        "200": { $ref: "#/components/responses/Svg" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/public/status/{slug}/components/{key}/response.svg:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/ComponentKey"
    get:
      operationId: getPublicComponentResponseBadge
      tags: [Public status]
      summary: Response time badge of one service
      security: []
      x-token-scope: public
      responses:
        "200": { $ref: "#/components/responses/Svg" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/public/status/{slug}/logo:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: getPublicStatusLogo
      tags: [Public status]
      summary: The page's logo
      description: Cacheable for a day; the document's `logo_url` carries a version.
      security: []
      x-token-scope: public
      responses:
        "200":
          description: The image.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/public/status/{slug}/subscribe:
    parameters:
      - $ref: "#/components/parameters/Slug"
    post:
      operationId: subscribeToStatus
      tags: [Public status]
      summary: Subscribe to a page's announcements
      description: >-
        By email (default), SMS, signed webhook or Slack, as far as the page offers them
        (`page.subscribe_kinds`). Double opt-in: email and Slack get a link, SMS a code (confirm it
        with `confirm-code`), a webhook a signed request carrying the confirmation link; its HMAC
        secret is returned once in this response. Always `202` with the same message, whatever the
        destination's state. On a private page the visitor must already have access. At most five
        requests per client (three for SMS), forty per page and sixty in all per 15 minutes.
      security: []
      x-token-scope: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [email, sms, webhook, slack], default: email }
                email: { type: string, format: email, description: "For `email`." }
                phone: { type: string, description: "E.164 number, for `sms`." }
                url: { type: string, description: "For `webhook` (http/https) and `slack` (incoming webhook URL)." }
                components:
                  type: array
                  items: { type: string }
                  description: Public keys of the services to follow (`groups[].items[].key`); omitted or empty means all.
      responses:
        "202":
          description: Confirmation pending.
          content:
            application/json:
              schema:
                type: object
                required: [status, confirm, message]
                properties:
                  status: { type: string, enum: [pending] }
                  confirm: { type: string, enum: [link, code, signed_request] }
                  message: { type: string }
                  secret: { type: string, description: "Webhook only, shown once: the HMAC-SHA256 key that signs every request (`X-DumbMonit-Signature: sha256=<hex of HMAC(secret, timestamp + '.' + body)>`, `X-DumbMonit-Timestamp`)." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/public/alert-action/inspect:
    post:
      operationId: inspectAlertAction
      tags: [Public status]
      summary: Describe a notification action link
      description: |
        Read-only: what the signed link from a notification would do (acknowledge, snooze for one
        hour, or dismiss) and which of its alerts are still active. Called by the `/alert-action#<token>` page,
        which reads the token from the URL fragment so it never reaches a server log. Any refused
        token (forged, altered, expired, or action links switched off) gets the same `404`; repeated
        refusals from one client get `429`. Requires `X-Requested-With: DumbMonit`.
      security: []
      x-token-scope: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertActionToken" }
      responses:
        "200":
          description: What the link would do.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertActionView" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/public/alert-action:
    post:
      operationId: executeAlertAction
      tags: [Public status]
      summary: Run a notification action link
      description: |
        Acknowledges the link's still-active alerts until they resolve (`ack`) or for one hour
        (`snooze`, which never shortens a longer acknowledgement), or dismisses them (`dismiss`: hidden
        and silent until they resolve), as "via notification link", and records it in the audit log. Each link works once (`409` afterwards) and for 24 hours. `404`
        when the token is refused or none of its alerts is still active.
        Requires `X-Requested-With: DumbMonit`.
      security: []
      x-token-scope: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertActionToken" }
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertActionResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/public/status/{slug}/confirm:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/SubscriptionToken"
    post:
      operationId: confirmStatusSubscription
      tags: [Public status]
      summary: Confirm a subscription
      security: []
      x-token-scope: public
      responses:
        "200":
          description: "`{\"status\": \"confirmed\"}`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusMessage" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/public/status/{slug}/confirm-code:
    parameters:
      - $ref: "#/components/parameters/Slug"
    post:
      operationId: confirmStatusSmsSubscription
      tags: [Public status]
      summary: Confirm an SMS subscription with the code received
      description: Five tries, 15 minutes. Wrong or expired code gives `400`.
      security: []
      x-token-scope: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string }
      responses:
        "200":
          description: "`{\"status\": \"confirmed\"}`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusMessage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/public/status/{slug}/unsubscribe:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/SubscriptionToken"
    post:
      operationId: unsubscribeFromStatus
      tags: [Public status]
      summary: Remove a subscription
      description: The body is ignored — the RFC 8058 one-click target of `List-Unsubscribe`. Always `200`.
      security: []
      x-token-scope: public
      responses:
        "200":
          description: "`{\"status\": \"unsubscribed\"}`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusMessage" }
        "404": { $ref: "#/components/responses/NotFound" }

  # -------------------------------------------------------------- agents
  /api/agent/tokens:
    get:
      operationId: listAgentTokens
      tags: [Agents]
      summary: Every agent enrolment token (admin only)
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: Enrolment tokens.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AgentToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createAgentToken
      tags: [Agents]
      summary: Create an agent enrolment token
      description: >-
        Administrator session only. Single use unless `reusable`. The response is
        the only time the secret is shown, with ready-to-paste install commands.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentTokenCreate" }
      responses:
        "201":
          description: Token created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedAgentToken" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/agent/tokens/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      operationId: revokeAgentToken
      tags: [Agents]
      summary: Revoke an agent enrolment token
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "204": { description: Token revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/agent/tokens/{id}/close:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: closeAgentToken
      tags: [Agents]
      summary: Stop new enrolments with a token
      description: >-
        Administrator only. Moves the enrolment deadline to now: machines already
        enrolled with the token keep reporting, unlike a revocation.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "204": { description: Enrolments closed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/agent/ad-kit:
    post:
      operationId: createAgentAdKit
      tags: [Agents]
      summary: Create an Active Directory deployment kit
      description: >-
        Administrator only. Creates a reusable enrolment token limited to an Active
        Directory domain (machines must report a fully qualified name in it, and are
        filed in the folder "Active Directory <domain>" with the tag `ad`), and returns
        `Deploy-DumbMonit.ps1`, to run once on a domain controller: it creates a group
        policy that installs the agent on the servers of the chosen OU. The token is
        shown this time only, and the script carries it.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentAdKitCreate" }
      responses:
        "201":
          description: Token and deployment script.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedAgentAdKit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/agent/install:
    get:
      operationId: getAgentInstallParams
      tags: [Agents]
      summary: Parameters of the agent install command, without a token
      description: >-
        The single source of the install commands: web URL, URL and CA
        fingerprint of the encrypted agent channel, binary checksums, and the
        Unix and PowerShell commands with `{TOKEN}` to replace. Deployment
        generators (GPO, Ansible) read this instead of rebuilding the command.
      x-token-scope: read
      parameters:
        - name: base_url
          in: query
          required: false
          schema: { type: string }
          description: The URL machines reach this server at; the listen address by default.
      responses:
        "200":
          description: Install parameters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentInstallParams" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/agent/tls:
    get:
      operationId: getAgentChannel
      tags: [Agents]
      summary: State of the encrypted agent channel (admin only)
      description: >-
        TLS 1.3 with client certificates and X25519MLKEM768 key exchange on the
        agent port. Lists the channel each agent last reported through.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: Channel state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentChannel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: setAgentChannel
      tags: [Agents]
      summary: Require the encrypted agent channel
      description: >-
        With `required`, agents reporting through the plain channel of the web
        port are refused (up-to-date agents switch by themselves).
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [required]
              properties:
                required: { type: boolean }
      responses:
        "200":
          description: Channel state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentChannel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/agent/tls/rotation:
    post:
      operationId: startAgentCaRotation
      tags: [Agents]
      summary: Start rotating the agent certificate authority
      description: >-
        Creates the next authority. Agents pin it at their next encrypted
        report; it signs nothing until the rotation is completed.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: Channel state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentChannel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: cancelAgentCaRotation
      tags: [Agents]
      summary: Cancel a rotation of the agent certificate authority
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "204": { description: Rotation cancelled. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/agent/tls/rotation/complete:
    post:
      operationId: completeAgentCaRotation
      tags: [Agents]
      summary: Complete a rotation of the agent certificate authority
      description: >-
        The next authority becomes active and signs the server certificate.
        Agents that have not pinned it yet must be reinstalled.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: Channel state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentChannel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/agent/updates:
    get:
      operationId: getAgentUpdates
      tags: [Agents]
      summary: Automatic agent updates (admin only)
      description: >-
        Settings, the agent binaries this server ships (with their signature
        state), the canary rollout gate and, for each agent, its version and
        update status. This is the agent binary itself, not Docker containers.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: Update state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentUpdates" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: setAgentUpdates
      tags: [Agents]
      summary: Change the automatic agent update settings
      description: >-
        Omitted fields are unchanged. `allow_unsigned` lets agents install
        unsigned builds (development), over the encrypted agent channel only.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentUpdateSettingsChange" }
      responses:
        "200":
          description: Update state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentUpdates" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/agent/updates/all:
    post:
      operationId: updateAllAgentsNow
      tags: [Agents]
      summary: Update every outdated agent now
      description: >-
        Every agent able to replace itself and older than this server's build
        gets the update at its next report, outside the window and the canary
        rollout, and retries a version that failed.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: Update state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentUpdates" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/agent/updates/{id}:
    put:
      operationId: setAgentUpdate
      tags: [Agents]
      summary: Per-agent update settings
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: [boolean, "null"]
                  description: Forced for this agent; null follows the global setting; omitted is unchanged.
                canary: { type: boolean, description: Updated before the others. }
      responses:
        "200":
          description: Update state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentUpdates" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/agent/updates/{id}/now:
    post:
      operationId: updateAgentNow
      tags: [Agents]
      summary: Update this agent now
      description: >-
        The agent gets the update at its next report, outside the window and
        the canary rollout, and retries a version that failed once. With
        `allow_downgrade`, an agent newer than this server installs the
        server's build.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                allow_downgrade: { type: boolean, default: false }
      responses:
        "200":
          description: Update state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentUpdates" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/relays:
    get:
      operationId: listRelays
      tags: [Agents]
      summary: Every agent machine as a possible relay
      description: Declared relays first, then by name.
      x-token-scope: read
      responses:
        "200":
          description: Agent machines.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Relay" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/topology:
    get:
      operationId: getTopology
      tags: [Devices]
      summary: Topology map of the monitored infrastructure
      description: |
        Nodes and links derived from what the server already knows, then the corrections made by
        hand on the map and the rules learned from them (see `/api/topology/corrections`).
        Each link carries its `source`: `parent` (declared dependency, the one alert
        suppression follows), `service` (a service an agent found, hanging from its machine),
        `relay` (the relay agent that polls the device), `hypervisor`
        (a hypervisor and its guests, from the latest Proxmox, XCP-ng, Nutanix, vSphere or
        libvirt metrics; on a Proxmox cluster the guests hang from a `pve_node` node, one per
        Proxmox node, itself linked to the cluster), `hosted` (a device whose IP address is one
        the hypervisor reports for a guest — Proxmox guest agent, container interfaces, static
        configuration, VMware Tools — drawn under that guest; an address several guests report
        is ignored and a declared parent wins; when a guest's name matches no device, the only
        machine-level device at its address, such as an agent, ping or SNMP monitor, stands for
        the guest instead of a duplicate node), `lldp` (an LLDP neighbour seen by an SNMP
        switch), `l2` (a layer-2 link read from switch tables: LLDP/CDP neighbours between
        switches, or a host on an access port found through the bridge forwarding table and
        ARP; trunks and LAG members never carry hosts), `samehost` (a PBS and a Proxmox VE monitor that point at the same machine),
        `backup` (a Proxmox VE whose `pbs` storage targets a monitored PBS server) and
        `firewall` (a device whose address falls in a network a monitored firewall of the same
        site serves, when nothing else attaches it). A pair of
        nodes is linked once, by the surest source. A guest or neighbour is linked to a
        monitored device only when its name designates exactly one device; a guest that
        matches none becomes its own node (`target_id` null), an unknown LLDP neighbour is
        left out. Each device node carries the `subnet` it sits in (from its IP address and the
        networks the site's firewalls know, else its /24; none for a public address or a host
        name) and, when a firewall says so, that network's `vlan` and `vlan_name`.
        Device addresses are not included; only the addresses a hypervisor reports for its guests
        are (`ips`). States are read from `GET /api/targets`.
        A node's `site` is found without configuration: the location the device is placed at
        (a remote location gives its site, the main-site location gives none), else the
        device's `site` tag (except on
        UniFi, where it names the controller site), else the site its agent or relay agent
        declares, else the name of the relay agent that polls it (`site_source` says which).
      x-token-scope: read
      responses:
        "200":
          description: The map.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Topology" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/topology/corrections:
    get:
      operationId: listTopologyCorrections
      tags: [Devices]
      summary: Corrections made by hand on the topology map
      description: |
        Oldest first. `GET /api/topology` returns them too, already applied.
      x-token-scope: read
      responses:
        "200":
          description: The corrections.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TopologyCorrection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createTopologyCorrection
      tags: [Devices]
      summary: Correct the topology map
      description: |
        `forbid`: the link `from` → `to` of type `source` is wrong and is never deduced again
        (either direction). Marking a declared `parent` link wrong also clears the device's
        declared parent. `link`: a link of type `source` is drawn between the two nodes, and
        only that one. `parent`: `from` becomes the parent of `to` on the map; with
        `use_for_alerts` (default true, devices only) it also becomes the device's declared
        parent, the one alert suppression follows (refused when it would make a loop). `site`
        and `group`: the node's site (`value`, empty for the main site) and grouping on the map.
        A correction replaces the previous one on the same node (`parent`, `site`, `group`) or
        the same pair (`forbid`, `link`); those are returned in `replaced`, so an undo can
        bring them back.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TopologyCorrectionInput" }
      responses:
        "201":
          description: The correction, and the ones it replaced.
          content:
            application/json:
              schema:
                type: object
                required: [correction, replaced]
                properties:
                  correction: { $ref: "#/components/schemas/TopologyCorrection" }
                  replaced:
                    type: array
                    items: { $ref: "#/components/schemas/TopologyCorrection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/topology/corrections/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      operationId: deleteTopologyCorrection
      tags: [Devices]
      summary: Take a map correction back
      description: |
        A declared parent the correction changed goes back to what it was, unless it was
        changed again since.
      x-token-scope: write
      responses:
        "204": { description: Correction removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/topology/rules:
    get:
      operationId: listTopologyRules
      tags: [Devices]
      summary: Map rules, accepted or declined
      description: |
        Each with `matches`, the links it sets or removes on today's map.
      x-token-scope: read
      responses:
        "200":
          description: The rules.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TopologyRule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: saveTopologyRule
      tags: [Devices]
      summary: Accept or decline a map rule
      description: |
        Usually a suggestion from `GET /api/topology/suggestions`, sent back with `status`.
        `active`: applied to present and future devices of its scope. `dismissed`: never
        suggested again. The same rule (same scope and effect) only changes status.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TopologyRuleInput" }
      responses:
        "201":
          description: The rule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TopologyRule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/topology/rules/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      operationId: deleteTopologyRule
      tags: [Devices]
      summary: Remove a map rule
      description: It stops applying; a declined rule removed can be suggested again.
      x-token-scope: write
      responses:
        "204": { description: Rule removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/topology/suggestions:
    get:
      operationId: listTopologySuggestions
      tags: [Devices]
      summary: Rules the corrections suggest
      description: |
        Deterministic: a wrong link of a type towards a device of a subnet with at least two
        devices suggests forbidding that type of link for the whole subnet; two re-parentings
        or more under the same parent of devices at one address suggest "what is at this
        address depends on it" (limited to their device type when they share one); of devices
        of one subnet, "this subnet depends on it". A suggestion another correction contradicts
        is not made; accepted and declined rules are not suggested again. Never applied until
        accepted.
      x-token-scope: read
      responses:
        "200":
          description: The suggestions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TopologySuggestion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/metrics/catalog:
    get:
      operationId: getMetricsCatalog
      tags: [Dashboards]
      summary: Live `dumbmonit_*` metrics and their labels
      description: |
        The metrics written during the last hour, with how many series each has and a few
        values of each label. Feeds the metrics explorer's name completion.
      x-token-scope: read
      responses:
        "200":
          description: The catalogue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricsCatalog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/dashboards:
    get:
      operationId: listDashboards
      tags: [Dashboards]
      summary: Shared dashboards and the caller's own
      description: A token sees the shared dashboards only.
      x-token-scope: read
      responses:
        "200":
          description: Dashboards, shared first, then by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Dashboard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createDashboard
      tags: [Dashboards]
      summary: Create a dashboard
      description: |
        Any account may create personal dashboards (`shared: false`, owned by the caller;
        tokens cannot). Shared dashboards are created by administrators or `write` tokens.
        Names are unique among shared dashboards and per owner.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DashboardInput" }
      responses:
        "201":
          description: The dashboard.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/dashboards/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getDashboard
      tags: [Dashboards]
      summary: One dashboard
      description: Another account's personal dashboard answers 404.
      x-token-scope: read
      responses:
        "200":
          description: The dashboard.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateDashboard
      tags: [Dashboards]
      summary: Replace a dashboard
      description: |
        The owner changes a personal dashboard; administrators change shared ones and are the
        only ones who can turn sharing on or off.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DashboardInput" }
      responses:
        "200":
          description: The dashboard.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteDashboard
      tags: [Dashboards]
      summary: Delete a dashboard
      x-token-scope: write
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/locations:
    get:
      operationId: listLocations
      tags: [Devices]
      summary: Locations of the world map, with the devices each one gathers
      description: |
        A device finds its location from the most explicit to the most deduced: its
        assignment (`location_id` on the device), then the location that stands for its
        remote site (the site the topology map deduces: `site` tag, agent, relay agent),
        then the location marked `main_site` when it has no remote site. Each member says
        which (`source`). `sites` lists the remote sites the topology knows, `unplaced`
        the devices no location gathers. States are read from `GET /api/targets`.
      x-token-scope: read
      responses:
        "200":
          description: Locations, known sites and unplaced devices.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Locations" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createLocation
      tags: [Devices]
      summary: Create a location
      description: Marking it `main_site` takes the mark from any other location.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationInput" }
      responses:
        "201":
          description: The location (no members yet).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Location" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/locations/assign:
    post:
      operationId: assignLocation
      tags: [Devices]
      summary: Place devices at a location, or take them off
      description: >-
        Sets `location_id` on every listed device; `null` removes the assignment, and the
        device falls back on its site. Unknown device ids are skipped.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [location_id, target_ids]
              properties:
                location_id: { type: [integer, "null"], format: int64 }
                target_ids:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items: { type: integer, format: int64 }
      responses:
        "200":
          description: How many devices were updated.
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/locations/geocode:
    get:
      operationId: geocodeLocation
      tags: [Devices]
      summary: Find a place for a location (Open-Meteo geocoding)
      description: Administrators only. The server asks Open-Meteo; the browser never does.
      x-token-scope: read
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 80 }
        - name: lang
          in: query
          schema: { type: string, description: Two-letter language of the names. }
      responses:
        "200":
          description: Up to eight places.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WallPlace" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502":
          description: The geocoding service did not answer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/locations/basemap:
    get:
      operationId: getBasemap
      tags: [Devices]
      summary: Background of the world map
      x-token-scope: read
      responses:
        "200":
          description: The basemap; `offline` when never set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Basemap" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: putBasemap
      tags: [Devices]
      summary: Choose the background of the world map
      description: |
        `offline` (default): the Natural Earth outlines built into the interface, no request
        leaves the browser. `osm`: OpenStreetMap tiles (address and attribution are set by
        the server). `custom`: a `{z}/{x}/{y}` tile address on a plain host (no `{s}`), with
        its attribution. The tile origin is added to the interface's `img-src` policy.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Basemap" }
      responses:
        "200":
          description: The basemap as saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Basemap" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/locations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      operationId: updateLocation
      tags: [Devices]
      summary: Edit a location
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationInput" }
      responses:
        "200":
          description: The location (members are read with `GET /api/locations`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Location" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteLocation
      tags: [Devices]
      summary: Delete a location
      description: Its devices stay, without a location.
      x-token-scope: write
      responses:
        "204": { description: Location deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/targets/{id}/agent:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    get:
      operationId: getAgentHost
      tags: [Agents]
      summary: The machine as its agent last described it
      description: "`404` when the device is not an `agent` device, or until an agent has reported."
      x-token-scope: read
      responses:
        "200":
          description: The machine.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentHost" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/targets/{id}/agent/rebind:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    post:
      operationId: allowAgentRebind
      tags: [Agents]
      summary: Let this machine bind itself again for one hour
      description: The way back in after a reinstall lost the agent's secret. The window closes as soon as it is used.
      x-token-scope: write
      responses:
        "200":
          description: The window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RebindWindow" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/targets/{id}/agent/relay:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    put:
      operationId: setAgentRelay
      tags: [Agents]
      summary: Switch this agent's relay mode on or off
      description: "The agent applies it on the fly at its next report, without a restart. `relay: true` in its agent.yaml wins (`relay_local`); an agent too old to follow it says `relay_control: false`."
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
                site: { type: [string, "null"], maxLength: 80, description: Site of this relay. }
      responses:
        "200":
          description: The machine after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentHost" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/targets/{id}/agent/modules:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    get:
      operationId: listAgentModules
      tags: [Agents]
      summary: Services the agent can detect on this machine, found or not
      description: "Each found service (Docker, Plakar, restic/Borg, ZFS, libvirt, WireGuard, IPsec, speed test) is its own `agent_service` device under the machine. `404` when the device is not an `agent` device."
      x-token-scope: read
      responses:
        "200":
          description: Every known module, in a fixed order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AgentModule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/targets/{id}/agent/modules/{module}:
    parameters:
      - $ref: "#/components/parameters/TargetId"
      - name: module
        in: path
        required: true
        schema: { type: string }
        description: Module id, such as `docker` or `zfs`.
    put:
      operationId: setAgentModule
      tags: [Agents]
      summary: Tick or untick a module
      description: "Unticking deletes the service's device and drops its readings (the agent is told in its next acknowledgement and stops collecting it). Ticking creates the device, even before the agent finds the service."
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: The module after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentModule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/targets/{id}/agent/event-rules:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    get:
      operationId: listAgentEventRules
      tags: [Agents]
      summary: Windows event log rules of an agent machine
      description: "The machine's rules, with their counters, and the suggested examples (never created on their own). The rules reach the agent in the acknowledgement of its next batch; only a Windows agent reads them (`supported`). `404` when the device is not an `agent` device."
      x-token-scope: read
      responses:
        "200":
          description: Rules, rate limit and examples.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentEventRules" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createAgentEventRule
      tags: [Agents]
      summary: Add a Windows event log rule
      description: "At least an event ID, a source or a level is required. Every matching event raises the built-in alert of the rule's severity (`windows_event_critical`, `windows_event_warning`, `windows_event_info`) on the machine."
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentEventRuleInput" }
      responses:
        "201":
          description: The new rule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentEventRule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/targets/{id}/agent/event-rules/{rule_id}:
    parameters:
      - $ref: "#/components/parameters/TargetId"
      - name: rule_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
        description: Event log rule id.
    put:
      operationId: updateAgentEventRule
      tags: [Agents]
      summary: Replace a Windows event log rule
      description: Its counters are kept.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentEventRuleInput" }
      responses:
        "200":
          description: The rule after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentEventRule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteAgentEventRule
      tags: [Agents]
      summary: Delete a Windows event log rule
      description: The events already received stay in the machine's history.
      x-token-scope: write
      responses:
        "204": { description: Rule deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/targets/{id}/agent/events:
    parameters:
      - $ref: "#/components/parameters/TargetId"
      - name: limit
        in: query
        required: false
        schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        description: Number of events to return.
    get:
      operationId: listAgentEvents
      tags: [Agents]
      summary: Latest Windows events matched by the machine's rules
      description: Newest first. The server keeps the last 500 events of each machine.
      x-token-scope: read
      responses:
        "200":
          description: Received events.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AgentEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/targets/{id}/containers:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    get:
      operationId: listContainers
      tags: [Containers]
      summary: Containers of an agent machine (or its Docker device), from its last batch
      x-token-scope: read
      responses:
        "200":
          description: Containers.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Container" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/targets/{id}/containers/{name}/policy:
    parameters:
      - $ref: "#/components/parameters/TargetId"
      - $ref: "#/components/parameters/ContainerName"
    put:
      operationId: setContainerPolicy
      tags: [Containers]
      summary: Set a container's automatic actions
      description: Every field is optional; an omitted field keeps its stored value.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContainerPolicyPatch" }
      responses:
        "200":
          description: The full policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContainerPolicy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/targets/{id}/containers/{name}/restart:
    parameters:
      - $ref: "#/components/parameters/TargetId"
      - $ref: "#/components/parameters/ContainerName"
    post:
      operationId: restartContainer
      tags: [Containers]
      summary: Queue a container restart
      description: >-
        `404` when the container is not in the agent's inventory; `409` when the
        same command is already queued or running, or when the agent cannot run
        commands.
      x-token-scope: write
      responses:
        "201":
          description: The queued command.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Command" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/targets/{id}/containers/{name}/update:
    parameters:
      - $ref: "#/components/parameters/TargetId"
      - $ref: "#/components/parameters/ContainerName"
    post:
      operationId: updateContainer
      tags: [Containers]
      summary: Queue a container image update
      description: "`prune` defaults to the container's policy. Same status codes as a restart."
      x-token-scope: write
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                prune: { type: boolean, description: Remove the old image once updated. }
      responses:
        "201":
          description: The queued command.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Command" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/targets/{id}/commands:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    get:
      operationId: listCommands
      tags: [Containers]
      summary: The last 20 commands of an agent machine
      x-token-scope: read
      responses:
        "200":
          description: Commands, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Command" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/targets/{id}/commands/{command_id}:
    parameters:
      - $ref: "#/components/parameters/TargetId"
      - name: command_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      operationId: cancelCommand
      tags: [Containers]
      summary: Cancel a queued command
      description: "`409` once the agent has picked it up or when it is already closed."
      x-token-scope: write
      responses:
        "204": { description: Command cancelled. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ---------------------------------------------------------- heartbeats
  /api/push/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: The heartbeat's secret token — the URL is the credential.
        schema: { type: string }
      - name: status
        in: query
        description: "`up` (default) or `down`: the job reports its own failure (Uptime Kuma compatible)."
        schema: { type: string, enum: [up, down] }
      - name: msg
        in: query
        description: Free text, kept truncated to 500 characters.
        schema: { type: string }
      - name: exit_code
        in: query
        description: "The job's exit code. Non-zero is a failure."
        schema: { type: integer, minimum: 0 }
    get:
      operationId: pushHeartbeatGet
      tags: [Heartbeats]
      summary: Record a heartbeat
      description: At most sixty calls a minute per token. A plain call is a successful run of unknown duration (`status=down` or a non-zero `exit_code` make it a failure).
      security: []
      x-token-scope: public
      responses:
        "204": { description: Heartbeat recorded. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: pushHeartbeatPost
      tags: [Heartbeats]
      summary: Record a heartbeat
      description: Same as the `GET`; the body (up to 256 KiB) is the output of the job, kept truncated to its last 10 KiB.
      security: []
      x-token-scope: public
      requestBody:
        required: false
        content:
          text/plain:
            schema: { type: string }
      responses:
        "204": { description: Heartbeat recorded. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { description: Body larger than 256 KiB. }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/push/{token}/{action}:
    parameters:
      - name: token
        in: path
        required: true
        description: The heartbeat's secret token — the URL is the credential.
        schema: { type: string }
      - name: action
        in: path
        required: true
        description: "`start` opens a run, `success` and `fail` close it, and a number is the job's exit code (0 is a success, anything else a failure). Anything else is a `404`."
        schema: { type: string }
      - name: status
        in: query
        description: "`up` (default) or `down`, on `success` only."
        schema: { type: string, enum: [up, down] }
      - name: msg
        in: query
        description: Free text, kept truncated to 500 characters; also the output when the body is empty.
        schema: { type: string }
      - name: exit_code
        in: query
        description: "The job's exit code, on `success` and `fail`."
        schema: { type: integer, minimum: 0 }
    get:
      operationId: pushRunGet
      tags: [Heartbeats]
      summary: Record the start or the end of a run
      description: At most sixty calls a minute per token, shared with the plain call.
      security: []
      x-token-scope: public
      responses:
        "204": { description: Run recorded. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: pushRunPost
      tags: [Heartbeats]
      summary: Record the start or the end of a run
      description: Same as the `GET`; the body (up to 256 KiB) is the output of the job, kept truncated to its last 10 KiB.
      security: []
      x-token-scope: public
      requestBody:
        required: false
        content:
          text/plain:
            schema: { type: string }
      responses:
        "204": { description: Run recorded. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { description: Body larger than 256 KiB. }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/targets/{id}/push:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    get:
      operationId: getPushMonitor
      tags: [Heartbeats]
      summary: The monitor of a heartbeat device, token included
      description: Created on first read. `400` when the device is not a heartbeat.
      x-token-scope: read
      responses:
        "200":
          description: The monitor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushMonitor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/targets/{id}/push/runs:
    parameters:
      - $ref: "#/components/parameters/TargetId"
      - name: limit
        in: query
        description: Runs per page, 50 by default and 100 at most.
        schema: { type: integer, minimum: 1, maximum: 100 }
      - name: before
        in: query
        description: The `next_before` of the previous page.
        schema: { type: integer, format: int64 }
    get:
      operationId: listPushRuns
      tags: [Heartbeats]
      summary: Run history of a heartbeat device
      description: Newest first. Only the latest 200 runs of the last 90 days are kept. `400` when the device is not a heartbeat.
      x-token-scope: read
      responses:
        "200":
          description: One page of runs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushRunsPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/targets/{id}/push/regenerate:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    post:
      operationId: regeneratePushToken
      tags: [Heartbeats]
      summary: Issue a new heartbeat token
      description: The previous URL answers `404` from then on.
      x-token-scope: write
      responses:
        "200":
          description: The monitor, with its new token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushMonitor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------- changements d'un site
  /api/targets/{id}/webchange/pages:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    get:
      operationId: listWebchangePages
      tags: [Website changes]
      summary: Pages followed by a website watch
      description: >-
        Every page seen by the checks of a `webchange` device, removed pages
        included (with their last error). `screenshots_available` is true when
        a browser is configured (`DUMBMONIT_BROWSER_URL`) and answers.
        `404` when the device is not a website watch.
      x-token-scope: read
      responses:
        "200":
          description: The pages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebchangePages" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/targets/{id}/webchange/changes:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    get:
      operationId: listWebchangeChanges
      tags: [Website changes]
      summary: Changes found on a watched website, newest first
      description: The last hundred changes are kept per device.
      x-token-scope: read
      parameters:
        - name: url
          in: query
          required: false
          description: Only the changes of this exact page address.
          schema: { type: string }
        - name: kind
          in: query
          required: false
          description: Only this kind of change.
          schema: { type: string, enum: [changed, new_page, removed_page] }
        - name: before
          in: query
          required: false
          description: Only the changes older than the one with this id (the last one received), to read the list page by page.
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          required: false
          description: How many changes to return, 1 to 200.
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: The changes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WebchangeChange" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/targets/{id}/webchange/changes/{change_id}:
    parameters:
      - $ref: "#/components/parameters/TargetId"
      - name: change_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getWebchangeChange
      tags: [Website changes]
      summary: One change, with both versions and the line diff
      description: >-
        The diff keeps three lines of context around each modification; longer
        unchanged runs are collapsed into one `skip` line whose `count` says how
        many lines it hides.
      x-token-scope: read
      responses:
        "200":
          description: The change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebchangeChangeDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/targets/{id}/webchange/snapshots/{snapshot_id}/screenshot:
    parameters:
      - $ref: "#/components/parameters/TargetId"
      - name: snapshot_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getWebchangeScreenshot
      tags: [Website changes]
      summary: The screenshot of a snapshot
      description: >-
        A JPEG image, cacheable forever by the browser (a snapshot never
        changes). `404` when the snapshot has no screenshot or belongs to
        another device.
      x-token-scope: read
      responses:
        "200":
          description: The image.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/targets/{id}/webchange/check:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    post:
      operationId: checkWebchangeNow
      tags: [Website changes]
      summary: Check a watched website now
      description: >-
        Starts a check in the background and answers at once. `started` is
        false when a check is already running: that one stands for this request.
      x-token-scope: write
      responses:
        "202":
          description: The check is running.
          content:
            application/json:
              schema:
                type: object
                required: [started]
                properties:
                  started: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/targets/{id}/netconfig:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    get:
      operationId: getNetconfig
      tags: [Network configuration backups]
      summary: Backup state, SSH host key and versions of a device
      description: >-
        Open to every role: dates, sizes and line counts only, never the text
        of a configuration. `can_read` and `can_reveal` say what the caller may
        open next.
      x-token-scope: read
      responses:
        "200":
          description: The overview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetconfigOverview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/targets/{id}/netconfig/versions/{version_id}:
    parameters:
      - $ref: "#/components/parameters/TargetId"
      - name: version_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
      - name: unmasked
        in: query
        required: false
        description: Show secrets in clear. Administrators signed in to the web interface only (never an API token); recorded in the audit log.
        schema: { type: boolean, default: false }
    get:
      operationId: getNetconfigVersion
      tags: [Network configuration backups]
      summary: The text of one version, secrets masked
      description: >-
        Operator or administrator role (or a `write` token). Each secret is
        replaced by `<masked:xxxxxx>`, a short fingerprint keyed with the
        instance secret.
      x-token-scope: read
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetconfigVersionContent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/targets/{id}/netconfig/versions/{version_id}/download:
    parameters:
      - $ref: "#/components/parameters/TargetId"
      - name: version_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: downloadNetconfigVersion
      tags: [Network configuration backups]
      summary: Download a raw version
      description: >-
        The configuration as read from the device, secrets in clear, as a text
        attachment. Administrators signed in to the web interface only: an API
        token is refused. Recorded in the audit log.
      x-token-scope: read
      responses:
        "200":
          description: The configuration.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/targets/{id}/netconfig/diff:
    parameters:
      - $ref: "#/components/parameters/TargetId"
      - name: to
        in: query
        required: true
        schema: { type: integer, format: int64 }
      - name: from
        in: query
        required: false
        description: Defaults to the version before `to`.
        schema: { type: integer, format: int64 }
      - name: unmasked
        in: query
        required: false
        description: Same rule as for a version.
        schema: { type: boolean, default: false }
    get:
      operationId: compareNetconfigVersions
      tags: [Network configuration backups]
      summary: Line diff between two versions
      description: >-
        Computed on the masked texts: a changed secret shows as a changed line
        without being revealed. Three lines of context around each change,
        longer unchanged runs collapsed into one `skip` line.
      x-token-scope: read
      responses:
        "200":
          description: The diff.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetconfigCompare" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/targets/{id}/netconfig/fetch:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    post:
      operationId: fetchNetconfigNow
      tags: [Network configuration backups]
      summary: Back up a device now
      description: >-
        Starts a backup in the background and answers at once. `started` is
        false when one is already running.
      x-token-scope: write
      responses:
        "202":
          description: The backup is running.
          content:
            application/json:
              schema:
                type: object
                required: [started]
                properties:
                  started: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/targets/{id}/netconfig/host-key/accept:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    post:
      operationId: acceptNetconfigHostKey
      tags: [Network configuration backups]
      summary: Accept the new SSH host key a device presents
      description: >-
        `fingerprint` must be the key the device presented last (`changed_to`);
        if another one was seen since, `409` and nothing changes.
        Administrators signed in to the web interface only; recorded in the
        audit log. A backup starts right after.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fingerprint]
              properties:
                fingerprint: { type: string, examples: ["SHA256:Nh0Me49Zh9fDw/VYUfq43IJmI1T+XrjiYONPND8GzaM"] }
      responses:
        "204": { description: The key is now the remembered one. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/targets/{id}/website:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    get:
      operationId: getWebsiteOverview
      tags: [Websites]
      summary: Last reading of a website, its tracked metadata and their state
      description: >-
        The last reading of a `website` device (final address, redirect chain,
        status, platform, SEO metadata) and, for every tracked field, its
        confirmed value, a different value seen once and waiting for the next
        check (`pending`), and the date of its last confirmed change. Every
        field is null or empty before the first reading. `404` when the device
        is not a `website`.
      x-token-scope: read
      responses:
        "200":
          description: The reading.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebsiteOverview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/targets/{id}/website/changes:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    get:
      operationId: listWebsiteChanges
      tags: [Websites]
      summary: Confirmed metadata changes of a website, newest first
      description: >-
        A change is recorded once two checks in a row have seen the new value.
        The last two hundred changes are kept per device.
      x-token-scope: read
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: The changes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WebsiteChange" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ------------------------------------------------------ paquets d'intégration
  /api/packs:
    get:
      operationId: listPacks
      tags: [Integration packs]
      summary: Installed integration packs
      description: Administrator session, or any API token.
      x-token-scope: read
      responses:
        "200":
          description: Packs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Pack" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: installPack
      tags: [Integration packs]
      summary: Install or update an integration pack
      description: >-
        The body is the pack's YAML as is, or `{"yaml": "…"}` in JSON. `201` when
        created, `200` when updated or unchanged. `400` lists every validation
        error.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/yaml:
            schema: { type: string }
          text/plain:
            schema: { type: string }
          application/json:
            schema:
              type: object
              required: [yaml]
              additionalProperties: false
              properties:
                yaml: { type: string }
      responses:
        "201":
          description: Pack installed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackInstallReport" }
        "200":
          description: Pack updated or unchanged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackInstallReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/packs/{id}:
    parameters:
      - $ref: "#/components/parameters/PackId"
    get:
      operationId: getPack
      tags: [Integration packs]
      summary: One integration pack
      x-token-scope: read
      responses:
        "200":
          description: The pack.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pack" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: uninstallPack
      tags: [Integration packs]
      summary: Uninstall an integration pack, with its rules
      description: "`409` while devices use it."
      x-token-scope: write
      responses:
        "204": { description: Pack uninstalled. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/packs/{id}/enable:
    parameters:
      - $ref: "#/components/parameters/PackId"
    put:
      operationId: enablePack
      tags: [Integration packs]
      summary: Register the pack's device type
      x-token-scope: write
      responses:
        "200":
          description: The pack.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pack" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/packs/{id}/disable:
    parameters:
      - $ref: "#/components/parameters/PackId"
    put:
      operationId: disablePack
      tags: [Integration packs]
      summary: Withdraw the pack's device type
      description: Devices, history and rules stay.
      x-token-scope: write
      responses:
        "200":
          description: The pack.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pack" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ------------------------------------------------------------ sauvegarde
  /api/logs:
    get:
      operationId: getLogs
      tags: [Logs]
      summary: Server log files kept on disk, retention and size cap
      description: Administrator session only. Files are daily (UTC) JSON lines in `/data/logs`; past days are gzip-compressed.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: Local log storage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogsOverview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/logs/settings:
    put:
      operationId: putLogsSettings
      tags: [Logs]
      summary: Change the retention (days) and the total size cap (MB)
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogsSettingsRequest" }
      responses:
        "200":
          description: Local log storage, with the new settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogsOverview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/logs/search:
    get:
      operationId: searchLogs
      tags: [Logs]
      summary: Search the server logs kept by the embedded VictoriaLogs (LogsQL filters)
      description: >-
        Newest first. Only filters are accepted (no `|` pipes); the period, the
        minimum level and the server's own stream are added by the server.
        `source` picks the stream: the server itself (`server`), lines collected
        by agents (`agent`), the built-in syslog server (`syslog`), SNMP traps
        (`trap`) or all of them (`all`). `target` keeps one device's lines.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      parameters:
        - { name: query, in: query, schema: { type: string, default: "*" } }
        - { name: start, in: query, description: Start of the period (ms), schema: { type: integer } }
        - { name: end, in: query, description: End of the period (ms), schema: { type: integer } }
        - { name: level, in: query, schema: { type: string, enum: [error, warn, info, debug], default: info } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 } }
        - { name: source, in: query, schema: { type: string, enum: [server, agent, syslog, trap, all], default: server } }
        - { name: target, in: query, description: Device id, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Matching log entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogSearchResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/logs/inputs:
    get:
      operationId: getLogInputs
      tags: [Logs]
      summary: State of the syslog server and the SNMP trap receiver
      description: Both are off unless the environment turns them on (`DUMBMONIT_SYSLOG_ENABLED`, `DUMBMONIT_TRAPS_ENABLED`).
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: Receivers and counters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogInputs" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/logs/agents/{id}:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    get:
      operationId: getAgentLogs
      tags: [Logs]
      summary: Log collection setting of an agent device
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: The setting, and when lines last arrived.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentLogs" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: setAgentLogs
      tags: [Logs]
      summary: Turn log collection on or off for an agent, and choose what it reads
      description: The agent applies it on the fly at its next report. `DUMBMONIT_AGENT_LOGS=off` on the machine forbids collection there whatever this says.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentLogsSetting" }
      responses:
        "200":
          description: The setting after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentLogs" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/system/storage:
    get:
      operationId: getStorage
      tags: [Storage]
      summary: Retentions, long-term history, embedded log store and disk usage
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: Storage state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: putStorage
      tags: [Storage]
      summary: Change retentions and turn the long-term history or the log store on or off
      description: >-
        A changed retention restarts the embedded process concerned (a few
        seconds without writes, retried by the write buffer). `restarted` lists
        what was restarted, started or stopped.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorageUpdate" }
      responses:
        "200":
          description: Storage state after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/logs/export:
    get:
      operationId: exportLogs
      tags: [Logs]
      summary: Download the last N days of server logs as a .tar.gz archive
      description: >-
        Streamed. The archive holds one file per day (`.log` for today, `.log.gz`
        before) and `audit.jsonl`, the audit log entries of the period.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      parameters:
        - $ref: "#/components/parameters/LogDays"
      responses:
        "200":
          description: The archive, as an attachment.
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/gzip:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/logs/export/estimate:
    get:
      operationId: estimateLogsExport
      tags: [Logs]
      summary: Estimated size of the archive for N days, before downloading it
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      parameters:
        - $ref: "#/components/parameters/LogDays"
      responses:
        "200":
          description: Period, number of files and estimated compressed size.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogsEstimate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/logs/kinds:
    get:
      operationId: listLogDestinationKinds
      tags: [Logs]
      summary: Log destination types and the fields each one asks for
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: The catalog, in menu order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LogDestinationKind" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/logs/destinations:
    get:
      operationId: listLogDestinations
      tags: [Logs]
      summary: Log destinations, with their delivery counters
      description: Secrets are never returned, only `has_secret`.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: The destinations.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LogDestination" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createLogDestination
      tags: [Logs]
      summary: Add a log destination
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogDestinationRequest" }
      responses:
        "201":
          description: The destination.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogDestination" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/logs/destinations/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updateLogDestination
      tags: [Logs]
      summary: Change a log destination
      description: >-
        `secrets` omitted or `null` keeps the stored secrets, `{}` clears them.
        Changing the address (or the type) of a destination that has a secret
        requires sending the secrets again.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogDestinationRequest" }
      responses:
        "200":
          description: The destination.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogDestination" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteLogDestination
      tags: [Logs]
      summary: Remove a log destination
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/logs/destinations/{id}/test:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: testLogDestination
      tags: [Logs]
      summary: Send one test record to a log destination, now
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: Whether the record was accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelTestReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/backup:
    get:
      operationId: getBackupStatus
      tags: [Backup]
      summary: What a backup bundle would contain, and the scheduled backups
      description: Administrator session only.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: Backup state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: exportBackup
      tags: [Backup]
      summary: Export an encrypted backup bundle
      description: >-
        Returns the bundle itself as a JSON file: a cleartext header and a payload
        encrypted with AES-256-GCM under a key derived from the passphrase by
        Argon2id (at least 16 characters). It carries every credential of the
        instance, which is why tokens are refused.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupExportRequest" }
      responses:
        "200":
          description: The bundle, as an attachment.
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/backup/restore:
    post:
      operationId: restoreBackup
      tags: [Backup]
      summary: Restore a backup bundle (dry run unless `apply`)
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupRestoreRequest" }
      responses:
        "200":
          description: Per-section report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestoreReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/backup/local:
    post:
      operationId: runLocalBackup
      tags: [Backup]
      summary: Write one scheduled-style local backup now
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: The scheduled backups' state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalBackupStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/config/plan:
    post:
      operationId: planConfig
      tags: [Configuration files]
      summary: What a configuration file would change (nothing is written)
      description: >-
        Send the file as `yaml` or the same document as `config` (JSON). The
        plan names the fields that differ, never their values. Secret references
        (`${NAME}`) that were not resolved are listed in `unresolved` and assumed
        unchanged.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigRequest" }
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigPlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/config/apply:
    post:
      operationId: applyConfig
      tags: [Configuration files]
      summary: Apply a configuration file, in one transaction
      description: >-
        Creates and updates what the file declares, marks it as managed by file,
        and with `prune` deletes managed objects that are no longer declared.
        Any refused entry (unknown reference, invalid value) cancels everything.
        Unresolved secret references are refused: resolve them first (the
        command-line tool does).
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigRequest" }
      responses:
        "200":
          description: What was done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigPlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/config/export:
    get:
      operationId: exportConfig
      tags: [Configuration files]
      summary: Export the instance as a configuration file
      description: >-
        YAML by default, `?format=json` for an object holding the YAML, the
        document and the variables to define. Secrets are replaced by references
        (`${DUMBMONIT_...}`), never exported. Monitors created by Docker labels
        or discovered by agents, and built-in rules, are left out.
      x-token-scope: read
      parameters:
        - { name: format, in: query, required: false, schema: { type: string, enum: [yaml, json] } }
      responses:
        "200":
          description: The configuration file.
          content:
            application/yaml:
              schema: { type: string }
            application/json:
              schema: { $ref: "#/components/schemas/ConfigExport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/config/status:
    get:
      operationId: getConfigStatus
      tags: [Configuration files]
      summary: Watched directory and objects managed by file
      x-token-scope: read
      responses:
        "200":
          description: State.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/config/release:
    post:
      operationId: releaseConfig
      tags: [Configuration files]
      summary: Hand every file-managed object back to manual management
      description: Deletes nothing; the next apply adopts the declared objects again.
      x-token-scope: write
      responses:
        "200":
          description: How many markers were removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  released: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ----------------------------------------------------- auto-surveillance
  /api/self-monitoring:
    get:
      operationId: getSelfMonitoring
      tags: [Self-monitoring]
      summary: Health of DumbMonit itself and the heartbeat setting
      description: >-
        The three conditions of a heartbeat (scheduler running, database
        answering, VictoriaMetrics reachable), the data volume, the database
        size, restarts of the embedded VictoriaMetrics, and the heartbeat
        setting. The heartbeat URL itself is never returned, only its host.
      x-token-scope: read
      responses:
        "200":
          description: The current state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SelfMonitoring" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/self-monitoring/heartbeat:
    put:
      operationId: setHeartbeat
      tags: [Self-monitoring]
      summary: Configure the outgoing heartbeat
      description: >-
        `url` omitted keeps the stored URL, an empty string clears it. Turning
        the heartbeat on needs a URL. The interval is 30 to 3600 seconds.
        Administrators only.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HeartbeatUpdate" }
      responses:
        "200":
          description: The new setting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Heartbeat" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/self-monitoring/heartbeat/test:
    post:
      operationId: testHeartbeat
      tags: [Self-monitoring]
      summary: Send one heartbeat now
      description: >-
        A plain "up" call to `url`, or to the stored URL when `url` is absent,
        whatever the engine's health. Errors never quote the URL.
        Administrators only.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: [string, "null"] }
      responses:
        "200":
          description: Whether the service accepted the call.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HeartbeatTestResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }


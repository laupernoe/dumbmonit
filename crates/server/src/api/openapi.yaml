        "403": { $ref: "#/components/responses/Forbidden" }

  /api/security/cves/inventory:
    get:
      operationId: getCveInventory
      tags: [Security]
      summary: Inventoried software components and where their CVEs come from
      x-token-scope: read
      parameters:
        - { name: target, in: query, schema: { type: integer } }
      responses:
        "200":
          description: One row per device and component.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CveInventory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/security/cves/settings:
    get:
      operationId: getCveSettings
      tags: [Security]
      summary: Is the CVE scan turned on
      description: >-
        Off by default: while off, nothing is sent to NVD, OSV.dev, the Debian
        security tracker or CISA. The NVD API key is never returned.
      x-token-scope: read
      responses:
        "200":
          description: The current setting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CveSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: setCveSettings
      tags: [Security]
      summary: Turn the CVE scan on or off, set the NVD API key
      description: >-
        `nvd_api_key` omitted keeps the stored key, an empty string clears it.
        Turning the scan on starts a first scan. Administrators only.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CveSettingsInput" }
      responses:
        "200":
          description: The new setting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CveSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/security/cves/refresh:
    post:
      operationId: refreshCves
      tags: [Security]
      summary: Re-read every source and recompute the verdicts now
      description: Runs in the background; poll the summary for `refreshing`. Administrators only.
      x-token-scope: write
      responses:
        "202":
          description: The refresh is queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  refreshing: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/security/cves/ignores:
    post:
      operationId: ignoreCve
      tags: [Security]
      summary: Accept the risk of one CVE on one device
      description: >-
        The CVE is no longer counted nor alerted on for this device; it stays
        listed with `ignored: true`. Administrators only.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_id, cve_id]
              properties:
                target_id: { type: integer }
                cve_id: { type: string, examples: [CVE-2024-6387] }
                note: { type: string, maxLength: 500 }
      responses:
        "204": { description: Ignored. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/security/cves/ignores/{target_id}/{cve_id}:
    parameters:
      - { name: target_id, in: path, required: true, schema: { type: integer } }
      - { name: cve_id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: unignoreCve
      tags: [Security]
      summary: Stop ignoring a CVE on a device
      x-token-scope: write
      responses:
        "204": { description: Counted and alerted on again. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ------------------------------------------------------------- assistants
  /api/mcp:
    get:
      operationId: describeMcpEndpoint
      tags: [Assistants]
      summary: Explains the MCP endpoint (405)
      description: There is no server-sent stream; the body only says what this endpoint is.
      security: []
      x-token-scope: public
      responses:
        "405":
          description: Method not allowed; `Allow` names `POST`.
          headers:
            Allow:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpEndpointInfo" }
    delete:
      operationId: deleteMcpSession
      tags: [Assistants]
      summary: Session termination is not supported (405)
      description: The server is stateless and issues no `Mcp-Session-Id`, so there is nothing to terminate.
      security: []
      x-token-scope: public
      responses:
        "405":
          description: Method not allowed; `Allow` names `POST`.
          headers:
            Allow:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpEndpointInfo" }
    post:
      operationId: callMcp
      tags: [Assistants]
      summary: Model Context Protocol server (Streamable HTTP, JSON-RPC 2.0)
      description: |
        One JSON-RPC 2.0 request or notification per `POST`, answered in
        `application/json` (no SSE stream, no session).

        Protocol revisions:

        - **2026-07-28** (stateless): every request carries
          `params._meta["io.modelcontextprotocol/protocolVersion"]` and
          `clientCapabilities`, plus the `MCP-Protocol-Version`, `Mcp-Method`
          and (for `tools/call`) `Mcp-Name` headers, which must match the body
          (`400` with error `-32020` otherwise). `server/discover` lists the
          supported versions; an unsupported one gets `400` with error
          `-32022`; an unknown method `404` with `-32601`.
        - **2025-11-25**, **2025-06-18**, **2025-03-26**: the `initialize`
          handshake, then `tools/list` and `tools/call`; `ping` is answered.

        A notification is acknowledged with `202` and no body. The API token's
        scope applies tool by tool: a `read` token can call every read tool and
        gets an explanatory tool error (`isError: true`) from a write tool. The
        28 tools are documented at
        <https://dumbmonit.readthedocs.io/en/latest/using/assistant/>.
      x-token-scope: read
      parameters:
        - name: MCP-Protocol-Version
          in: header
          schema: { type: string, examples: ["2026-07-28"] }
        - name: Mcp-Method
          in: header
          schema: { type: string }
        - name: Mcp-Name
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JsonRpcRequest" }
            example:
              jsonrpc: "2.0"
              id: 1
              method: tools/call
              params:
                name: get_status
                arguments: {}
                _meta:
                  io.modelcontextprotocol/protocolVersion: "2026-07-28"
                  io.modelcontextprotocol/clientCapabilities: {}
      responses:
        "200":
          description: A JSON-RPC response (result or error).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonRpcResponse" }
        "202": { description: 'Notification accepted, no body.' }
        "400":
          description: Malformed request, header mismatch or unsupported protocol version (JSON-RPC error body).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonRpcResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Unknown method on a 2026-07-28 request (JSON-RPC error `-32601`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonRpcResponse" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ------------------------------------------- compatibilité Prometheus (hors /api)
  /metrics:
    get:
      operationId: getInstanceMetrics
      tags: [Prometheus compatibility]
      summary: Health of the instance itself, Prometheus text format
      description: >-
        Scheduler, probes, writes, alerting, notifications, agents, database,
        VictoriaMetrics — a few dozen series, never one per device. Public when
        `DUMBMONIT_METRICS_PUBLIC=true`.
      x-token-scope: read
      responses:
        "200":
          description: Prometheus exposition format.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /federate:
    get:
      operationId: federateMetrics
      tags: [Prometheus compatibility]
      summary: The measurements, Prometheus text format
      description: >-
        `400` beyond 8 MiB, with what to narrow. Public when
        `DUMBMONIT_METRICS_PUBLIC=true`.
      x-token-scope: read
      parameters:
        - name: match[]
          in: query
          description: Series selector (repeatable, 10 at most; `{__name__=~"dumbmonit_.*"}` by default).
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: max_lookback
          in: query
          description: Window the last point is looked for in (`5m` by default).
          schema: { type: string }
      responses:
        "200":
          description: Prometheus exposition format.
          content:
            text/plain:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /prometheus/api/v1/{route}:
    parameters:
      - name: route
        in: path
        required: true
        description: >-
          One of `query`, `query_range`, `query_exemplars`, `series`, `labels`,
          `label/{name}/values`, `metadata`, `status/buildinfo`; anything else is
          `404`. Lets Grafana use `http://…/prometheus` as a Prometheus data source.
        schema: { type: string }
    get:
      operationId: prometheusApiGet
      tags: [Prometheus compatibility]
      summary: Read half of the Prometheus HTTP API, relayed to the store
      description: Public when `DUMBMONIT_METRICS_PUBLIC=true`.
      x-token-scope: read
      responses:
        "200":
          description: The Prometheus API response.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: prometheusApiPost
      tags: [Prometheus compatibility]
      summary: Same as the GET, with form-encoded parameters
      description: Read-only despite the method, hence the `read` scope.
      x-token-scope: read
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, additionalProperties: { type: string } }
      responses:
        "200":
          description: The Prometheus API response.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/otlp/v1/metrics:
    post:
      operationId: receiveOtlpMetrics
      tags: [OpenTelemetry]
      summary: Receive OpenTelemetry metrics
      description: >-
        OTLP/HTTP `ExportMetricsServiceRequest`, protobuf or JSON, optionally gzip (8 MiB, 32 MiB decompressed). Gauges, cumulative sums and histograms become `dumbmonit_*` series under the target. Delta temporality, exponential histograms and out-of-range timestamps are refused point by point and counted in `partialSuccess.rejectedDataPoints`.
      x-token-scope: write
      parameters:
        - name: X-DumbMonit-Target
          in: header
          description: Id of the target the data is written under (or the `target` query parameter).
          schema: { type: integer }
        - name: target
          in: query
          description: Same as the header, for exporters that cannot set one.
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema: { type: string, format: binary }
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Accepted; `partialSuccess` states what was not stored.
          content:
            application/x-protobuf:
              schema: { type: string, format: binary }
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415":
          description: Neither protobuf nor JSON, or an unsupported `Content-Encoding`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/otlp/v1/logs:
    post:
      operationId: receiveOtlpLogs
      tags: [OpenTelemetry]
      summary: Receive OpenTelemetry logs
      description: >-
        OTLP/HTTP `ExportLogsServiceRequest`, relayed unchanged to the embedded VictoriaLogs with the field `target`. `503` while log storage is disabled, `502` when VictoriaLogs does not answer.
      x-token-scope: write
      parameters:
        - name: X-DumbMonit-Target
          in: header
          description: Id of the target the data is written under (or the `target` query parameter).
          schema: { type: integer }
        - name: target
          in: query
          description: Same as the header, for exporters that cannot set one.
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema: { type: string, format: binary }
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Accepted by VictoriaLogs.
          content:
            application/x-protobuf:
              schema: { type: string, format: binary }
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415":
          description: Neither protobuf nor JSON, or an unsupported `Content-Encoding`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { description: VictoriaLogs did not answer. }
        "503": { description: Log storage is not enabled. }
  /api/wall/news:
    get:
      operationId: getWallNews
      tags: [Wall news]
      summary: Headlines for the walls
      description: >-
        The latest headlines of the configured RSS/Atom feeds (read by the
        server, cached five minutes). Off by default. Walls poll it every five
        minutes.
      x-token-scope: read
      responses:
        "200":
          description: Headlines and feed problems.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WallNews" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/wall/news/settings:
    get:
      operationId: getWallNewsSettings
      tags: [Wall news]
      summary: Wall news settings
      x-token-scope: read
      responses:
        "200":
          description: The settings (defaults while never saved).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WallNewsSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: putWallNewsSettings
      tags: [Wall news]
      summary: Save the wall news settings
      description: >-
        At most eight feeds (http or https). Fields of the former pictures
        (`gallery`) and live video (`video`, `video_url`…) are accepted and
        ignored.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WallNewsSettings" }
      responses:
        "200":
          description: The settings as saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WallNewsSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/wall/news/presets:
    get:
      operationId: getWallNewsPresets
      tags: [Wall news]
      summary: News sources offered per country
      x-token-scope: read
      responses:
        "200":
          description: Countries with their feeds and live channels.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WallNewsCountry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/wall/news/test:
    post:
      operationId: testWallNewsFeed
      tags: [Wall news]
      summary: Read a feed once and show its first headline
      description: Uncached; refuses internal addresses like every wall fetch.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Whether the feed could be read, and why not.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WallNewsTest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/wall/widgets:
    get:
      operationId: getWallWidgets
      tags: [Wall widgets]
      summary: The widgets' data for the walls
      description: >-
        One section per widget turned on (`null` otherwise). The server reads
        the sources and caches them (coins 60 s, stocks 5 min, weather 15 min,
        rates and CVEs 1 h, AI usage 15 min); a source that fails keeps its last value for a few
        hours, with `error` set. Walls poll it every minute.
      x-token-scope: read
      responses:
        "200":
          description: The sections.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WallWidgets" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/wall/widgets/settings:
    get:
      operationId: getWallWidgetsSettings
      tags: [Wall widgets]
      summary: Wall widgets settings
      x-token-scope: read
      responses:
        "200":
          description: The settings (defaults while never saved), and whether API keys are set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WallWidgetsSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: putWallWidgetsSettings
      tags: [Wall widgets]
      summary: Save the wall widgets settings
      description: >-
        An omitted field takes its default. `secrets` sets the optional API
        keys: an omitted key is kept, an empty string clears it. Keys are
        stored encrypted and never returned.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/WallWidgetsSettings" }
                - type: object
                  properties:
                    secrets:
                      type: object
                      properties:
                        finnhub: { type: string, maxLength: 200 }
                        coingecko: { type: string, maxLength: 200, description: A CoinGecko Demo key. }
                        anthropic: { type: string, maxLength: 200, description: "An Anthropic Admin API key (sk-ant-admin…), organizations only." }
                        openai: { type: string, maxLength: 200, description: An OpenAI organization admin key. }
      responses:
        "200":
          description: The settings as saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WallWidgetsSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/wall/widgets/catalog:
    get:
      operationId: getWallWidgetsCatalog
      tags: [Wall widgets]
      summary: Coins and currencies offered
      x-token-scope: read
      responses:
        "200":
          description: The coins (CoinGecko ids), their display currencies and the exchange-rate currencies.
          content:
            application/json:
              schema:
                type: object
                required: [coins, coin_currencies, fx_currencies]
                properties:
                  coins:
                    type: array
                    items:
                      type: object
                      required: [id, symbol, name]
                      properties:
                        id: { type: string }
                        symbol: { type: string }
                        name: { type: string }
                  coin_currencies: { type: array, items: { type: string } }
                  fx_currencies: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/wall/widgets/places:
    get:
      operationId: searchWallWidgetsPlaces
      tags: [Wall widgets]
      summary: Find a place for the weather (Open-Meteo geocoding)
      x-token-scope: read
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 80 }
        - name: lang
          in: query
          schema: { type: string, description: Two-letter language of the names. }
      responses:
        "200":
          description: Up to eight places.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WallPlace" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502":
          description: The geocoding service did not answer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/music/now:
    get:
      operationId: getWallMusic
      tags: [Wall music]
      summary: What the walls play
      description: >-
        What plays on the connected Spotify account, wherever it plays (read
        from Spotify at most every few seconds, shared by every caller), and
        the link the walls play. Walls poll it every five seconds.
      x-token-scope: read
      responses:
        "200":
          description: Spotify playback and the shared link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WallMusic" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/music/link:
    put:
      operationId: playOnWall
      tags: [Wall music]
      summary: Every wall plays this Spotify, Deezer or YouTube link
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [link]
              properties:
                link: { type: string, maxLength: 500 }
      responses:
        "200":
          description: The link now on the walls.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WallLink" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: stopWallLink
      tags: [Wall music]
      summary: The walls stop the embedded player
      x-token-scope: write
      responses:
        "204": { description: Stopped. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/music/spotify:
    get:
      operationId: getSpotifyAccount
      tags: [Wall music]
      summary: The connected Spotify account, never a token
      x-token-scope: read
      responses:
        "200":
          description: Connection state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpotifyAccount" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: disconnectSpotify
      tags: [Wall music]
      summary: Disconnect Spotify and forget its tokens
      x-token-scope: write
      responses:
        "204": { description: Disconnected. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/music/spotify/authorize:
    post:
      operationId: startSpotifyConnection
      tags: [Wall music]
      summary: Start connecting Spotify
      description: >-
        Administrator session only. Returns Spotify's approval URL (PKCE, valid
        ten minutes, once). `redirect_uri` is `http://127.0.0.1:8888/callback`
        or `https://<origin of the page>/api/music/spotify/callback`.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, redirect_uri]
              properties:
                client_id: { type: string }
                redirect_uri: { type: string }
      responses:
        "200":
          description: Where to send the browser.
          content:
            application/json:
              schema:
                type: object
                required: [authorize_url, redirect_uri, expires_in]
                properties:
                  authorize_url: { type: string }
                  redirect_uri: { type: string }
                  expires_in: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/music/spotify/complete:
    post:
      operationId: completeSpotifyConnection
      tags: [Wall music]
      summary: Finish a loopback connection with the address the browser landed on
      description: Administrator session only, the one that started the connection.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
      responses:
        "200":
          description: The connected account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpotifyAccount" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/music/spotify/token:
    get:
      operationId: getSpotifyToken
      tags: [Wall music]
      summary: A short-lived Spotify access token for the wall's player
      description: >-
        Browser sessions only (any role): the wall's Web Playback SDK needs it.
        API tokens are refused.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: The access token (never cached).
          content:
            application/json:
              schema:
                type: object
                required: [access_token, expires_in]
                properties:
                  access_token: { type: string }
                  expires_in: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/music/speaker:
    get:
      operationId: getWallSpeaker
      tags: [Wall music]
      summary: The wall's Spotify speaker, as Settings shows it
      description: >-
        The speaker name, the connected account, whether it has Premium (when
        Spotify or a wall said so), the account's Spotify Connect devices right
        now, whether the speaker is among them, and what each wall reported in
        the last fifteen minutes (browser, phase, problem).
      x-token-scope: read
      responses:
        "200":
          description: The speaker's state (never cached).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WallSpeaker" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: setWallSpeakerName
      tags: [Wall music]
      summary: Rename the speaker every wall announces (admin)
      description: >-
        `null` or an empty name goes back to "DumbMonit Wall". Walls pick the
        new name up within a few seconds.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: [string, "null"], maxLength: 64 }
      responses:
        "200":
          description: The name now in use.
          content:
            application/json:
              schema:
                type: object
                required: [speaker_name]
                properties:
                  speaker_name: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/music/speaker/report:
    post:
      operationId: reportWallSpeaker
      tags: [Wall music]
      summary: A wall reports its speaker's state
      description: >-
        Browser sessions only: sent by the wall every minute and on every
        change. The reply says whether Spotify lists the wall's device
        (`null` when it cannot be checked).
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display, name, phase]
              properties:
                display: { type: string, description: "Random id kept by the wall's browser (8–64 letters, digits, dashes)." }
                name: { type: string }
                phase: { type: string, enum: [off, unsupported, starting, ready, error] }
                activated: { type: boolean }
                device_id: { type: [string, "null"] }
                problem: { type: [string, "null"] }
                browser: { type: [string, "null"] }
                premium: { type: [boolean, "null"] }
      responses:
        "200":
          description: Whether Spotify lists this wall.
          content:
            application/json:
              schema:
                type: object
                required: [listed]
                properties:
                  listed: { type: [boolean, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/music/speaker/play:
    post:
      operationId: playOnWallSpeaker
      tags: [Wall music]
      summary: Play the account on the wall's speaker
      description: >-
        Browser sessions only (any role: the wall already holds a token that
        can do this). Transfers the account's playback to `device_id`, or to
        the device named like the speaker, and resumes it — "Play here" on the
        wall, "Test sound" in Settings.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                device_id: { type: [string, "null"] }
      responses:
        "200":
          description: Spotify now plays there.
          content:
            application/json:
              schema:
                type: object
                required: [device_id, speaker_name]
                properties:
                  device_id: { type: string }
                  speaker_name: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ---------------------------------------------------------- on-call
  /api/oncall/people:
    get:
      operationId: listOnCallPeople
      tags: [On-call]
      summary: Accounts that can be on call (name and on-call state; login, role and contact count for administrators and the person themselves)
      x-token-scope: read
      responses:
        "200":
          description: Accounts.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OnCallPerson" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/runbooks:
    get:
      operationId: listRunbooks
      tags: [Remediation]
      summary: Every runbook, with its links
      x-token-scope: read
      responses:
        "200":
          description: Runbooks, by title.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Runbook" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createRunbook
      tags: [Remediation]
      summary: Create a runbook (admin)
      description: >-
        Markdown text linked to alert rules (by uid), folders or device kinds. The
        interface escapes any HTML: the text is never rendered as markup. Audited.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunbookInput" }
      responses:
        "201":
          description: The runbook.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Runbook" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/runbooks/match:
    get:
      operationId: matchRunbooks
      tags: [Remediation]
      summary: Runbooks that apply to a rule and a device
      x-token-scope: read
      parameters:
        - { name: rule_uid, in: query, schema: { type: string } }
        - { name: target_id, in: query, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Matching runbooks.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Runbook" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/runbooks/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getRunbook
      tags: [Remediation]
      summary: One runbook
      x-token-scope: read
      responses:
        "200":
          description: The runbook.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Runbook" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateRunbook
      tags: [Remediation]
      summary: Replace a runbook and its links (admin)
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunbookInput" }
      responses:
        "200":
          description: The runbook.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Runbook" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteRunbook
      tags: [Remediation]
      summary: Delete a runbook (admin)
      x-token-scope: write
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/remediation/kinds:
    get:
      operationId: listRemediationKinds
      tags: [Remediation]
      summary: The closed catalogue of action kinds and their fields
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: Action kinds.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/RemediationKind" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/remediation/actions:
    get:
      operationId: listRemediationActions
      tags: [Remediation]
      summary: Defined remediation actions (secrets never returned)
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: Actions, by name.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/RemediationAction" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createRemediationAction
      tags: [Remediation]
      summary: Define an action (admin)
      description: >-
        `kind` is one of the catalogue (`GET /api/remediation/kinds`); unknown fields are
        refused. No field carries a shell command: a script is named, and only runs if the
        machine declares it in its own actions folder. Audited.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:

      responses:
        "200": { $ref: "#/components/responses/Svg" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/public/status/{slug}/response.svg:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: getPublicResponseBadge
      tags: [Public status]
      summary: Mean response time badge
      security: []
      x-token-scope: public
      responses:
        "200": { $ref: "#/components/responses/Svg" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/public/status/{slug}/components/{key}/badge.svg:
    parameters:
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/ComponentKey"
    get:
      operationId: getPublicComponentBadge

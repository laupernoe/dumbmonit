            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /federate:
    get:
      operationId: federateMetrics
      tags: [Prometheus compatibility]
      summary: The measurements, Prometheus text format
      description: >-
        `400` beyond 8 MiB, with what to narrow. Public when
        `DUMBMONIT_METRICS_PUBLIC=true`.
      x-token-scope: read
      parameters:
        - name: match[]
          in: query
          description: Series selector (repeatable, 10 at most; `{__name__=~"dumbmonit_.*"}` by default).
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: max_lookback
          in: query
          description: Window the last point is looked for in (`5m` by default).
          schema: { type: string }
      responses:
        "200":
          description: Prometheus exposition format.
          content:
            text/plain:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /prometheus/api/v1/{route}:
    parameters:
      - name: route
        in: path
        required: true
        description: >-
          One of `query`, `query_range`, `query_exemplars`, `series`, `labels`,
          `label/{name}/values`, `metadata`, `status/buildinfo`; anything else is
          `404`. Lets Grafana use `http://…/prometheus` as a Prometheus data source.
        schema: { type: string }
    get:
      operationId: prometheusApiGet
      tags: [Prometheus compatibility]
      summary: Read half of the Prometheus HTTP API, relayed to the store
      description: Public when `DUMBMONIT_METRICS_PUBLIC=true`.
      x-token-scope: read
      responses:
        "200":
          description: The Prometheus API response.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: prometheusApiPost
      tags: [Prometheus compatibility]
      summary: Same as the GET, with form-encoded parameters
      description: Read-only despite the method, hence the `read` scope.
      x-token-scope: read
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, additionalProperties: { type: string } }
      responses:
        "200":
          description: The Prometheus API response.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/music/now:
    get:
      operationId: getWallMusic
      tags: [Wall music]
      summary: What the walls play
      description: >-
        What plays on the connected Spotify account, wherever it plays (read
        from Spotify at most every few seconds, shared by every caller), and
        the link the walls play. Walls poll it every five seconds.
      x-token-scope: read
      responses:
        "200":
          description: Spotify playback and the shared link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WallMusic" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/music/link:
    put:
      operationId: playOnWall
      tags: [Wall music]
      summary: Every wall plays this Spotify, Deezer or YouTube link
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [link]
              properties:
                link: { type: string, maxLength: 500 }
      responses:
        "200":
          description: The link now on the walls.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WallLink" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: stopWallLink
      tags: [Wall music]
      summary: The walls stop the embedded player
      x-token-scope: write
      responses:
        "204": { description: Stopped. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/music/spotify:
    get:
      operationId: getSpotifyAccount
      tags: [Wall music]
      summary: The connected Spotify account, never a token
      x-token-scope: read
      responses:
        "200":
          description: Connection state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpotifyAccount" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: disconnectSpotify
      tags: [Wall music]
      summary: Disconnect Spotify and forget its tokens
      x-token-scope: write
      responses:
        "204": { description: Disconnected. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/music/spotify/authorize:
    post:
      operationId: startSpotifyConnection
      tags: [Wall music]
      summary: Start connecting Spotify
      description: >-
        Administrator session only. Returns Spotify's approval URL (PKCE, valid
        ten minutes, once). `redirect_uri` is `http://127.0.0.1:8888/callback`
        or `https://<origin of the page>/api/music/spotify/callback`.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, redirect_uri]
              properties:
                client_id: { type: string }
                redirect_uri: { type: string }
      responses:
        "200":
          description: Where to send the browser.
          content:
            application/json:
              schema:
                type: object
                required: [authorize_url, redirect_uri, expires_in]
                properties:
                  authorize_url: { type: string }
                  redirect_uri: { type: string }
                  expires_in: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/music/spotify/complete:
    post:
      operationId: completeSpotifyConnection
      tags: [Wall music]
      summary: Finish a loopback connection with the address the browser landed on
      description: Administrator session only, the one that started the connection.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
      responses:
        "200":
          description: The connected account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpotifyAccount" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/music/spotify/token:
    get:
      operationId: getSpotifyToken
      tags: [Wall music]
      summary: A short-lived Spotify access token for the wall's player
      description: >-
        Browser sessions only (any role): the wall's Web Playback SDK needs it.
        API tokens are refused.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: The access token (never cached).
          content:
            application/json:
              schema:
                type: object
                required: [access_token, expires_in]
                properties:
                  access_token: { type: string }
                  expires_in: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/music/speaker:
    get:
      operationId: getWallSpeaker
      tags: [Wall music]
      summary: The wall's Spotify speaker, as Settings shows it
      description: >-
        The speaker name, the connected account, whether it has Premium (when
        Spotify or a wall said so), the account's Spotify Connect devices right
        now, whether the speaker is among them, and what each wall reported in
        the last fifteen minutes (browser, phase, problem).
      x-token-scope: read
      responses:
        "200":
          description: The speaker's state (never cached).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WallSpeaker" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: setWallSpeakerName
      tags: [Wall music]
      summary: Rename the speaker every wall announces (admin)
      description: >-
        `null` or an empty name goes back to "DumbMonit Wall". Walls pick the
        new name up within a few seconds.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: [string, "null"], maxLength: 64 }
      responses:
        "200":
          description: The name now in use.
          content:
            application/json:
              schema:
                type: object
                required: [speaker_name]
                properties:
                  speaker_name: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/music/speaker/report:
    post:
      operationId: reportWallSpeaker
      tags: [Wall music]
      summary: A wall reports its speaker's state
      description: >-
        Browser sessions only: sent by the wall every minute and on every
        change. The reply says whether Spotify lists the wall's device
        (`null` when it cannot be checked).
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display, name, phase]
              properties:
                display: { type: string, description: "Random id kept by the wall's browser (8–64 letters, digits, dashes)." }
                name: { type: string }
                phase: { type: string, enum: [off, unsupported, starting, ready, error] }
                activated: { type: boolean }
                device_id: { type: [string, "null"] }
                problem: { type: [string, "null"] }
                browser: { type: [string, "null"] }
                premium: { type: [boolean, "null"] }
      responses:
        "200":
          description: Whether Spotify lists this wall.
          content:
            application/json:
              schema:
                type: object
                required: [listed]
                properties:
                  listed: { type: [boolean, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/music/speaker/play:
    post:
      operationId: playOnWallSpeaker
      tags: [Wall music]
      summary: Play the account on the wall's speaker
      description: >-
        Browser sessions only (any role: the wall already holds a token that
        can do this). Transfers the account's playback to `device_id`, or to
        the device named like the speaker, and resumes it — "Play here" on the
        wall, "Test sound" in Settings.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                device_id: { type: [string, "null"] }
      responses:
        "200":
          description: Spotify now plays there.
          content:
            application/json:
              schema:
                type: object
                required: [device_id, speaker_name]
                properties:
                  device_id: { type: string }
                  speaker_name: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: dmt_…
      description: >-
        API token created in Settings → API & assistants. `read` scope: every
        `GET`; `write` scope: also `POST`, `PUT`, `DELETE`. Never valid on
        operations marked `x-token-scope: none`. 120 calls per minute per token.
    cookieAuth:
      type: apiKey
      in: cookie
      name: dumbmonit_session
      description: >-
        Session opened by `POST /api/auth/login`. State-changing requests must
        also carry `X-Requested-With: DumbMonit`.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    TargetId:
      name: id
      in: path
      required: true
      description: Device id.
      schema: { type: integer, format: int64 }
    PackId:
      name: id
      in: path
      required: true
      description: Pack id, as declared in its YAML.
      schema: { type: string }
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9-]{2,40}$" }
    ComponentKey:
      name: key
      in: path
      required: true
      description: The service's `key` in the public document (its label in URL form).
      schema: { type: string }
    BadgeDays:
      name: days
      in: query
      description: Window of the mean, `400` beyond the page's history.
      schema: { type: integer, enum: [1, 7, 30, 90], default: 30 }
    SubscriptionToken:
      name: token
      in: query
      required: true
      description: The token from the confirmation or update email.
      schema: { type: string }
    ContainerName:
      name: name
      in: path
      required: true
      description: Container name, as Docker reports it.
      schema: { type: string, maxLength: 128 }
    FailureDays:
      name: days
      in: query
      description: How far back to look.
      schema: { type: integer, minimum: 1 }

  headers:
    RetryAfter:
      description: Seconds to wait before trying again.
      schema: { type: integer }
    RateLimitLimit:
      description: Calls allowed per minute for this token.
      schema: { type: integer }
    RateLimitRemaining:
      description: Calls left in the current window.
      schema: { type: integer }
    RateLimitReset:
      description: Seconds until the window resets.
      schema: { type: integer }
    WwwAuthenticate:
      description: "`Bearer` (with `error=\"invalid_token\"` for an expired token)."
      schema: { type: string }

  responses:
    BadRequest:
      description: The request is malformed or invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: No valid session or API token (unknown, revoked or expired token).
      headers:
        WWW-Authenticate: { $ref: "#/components/headers/WwwAuthenticate" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: >-
        Not allowed: viewer, operator outside alert handling, or `read` token
        on a write operation, token on a
        session-only operation or from a network it is not allowed from,
        missing `X-Requested-With: DumbMonit` on a cookie write.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Unknown id.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Not possible in the current state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limited.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
        RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
        RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
        RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Svg:
      description: An SVG badge, `Cache-Control public, max-age=60`.
      content:
        image/svg+xml:
          schema: { type: string }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: Human-readable message. }

    StatusMessage:
      type: object
      required: [status]
      properties:
        status: { type: string }
        message: { type: string }

    # ----------------------------------------------------------- santé
    Health:
      type: object
      required: [status, version, database, victoria]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        build: { type: string, description: 'Short commit the server was built from; absent from local builds.' }
        database: { $ref: "#/components/schemas/ComponentHealth" }
        victoria: { $ref: "#/components/schemas/ComponentHealth" }
        demo: { type: boolean, description: 'Demonstration mode, every write refused.' }
    ComponentHealth:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        error: { type: string }
        embedded: { type: boolean, description: "VictoriaMetrics only: `true` when the server runs its own." }

    # ----------------------------------------------------------- comptes
    Role:
      type: string
      enum: [admin, operator, viewer]
      description: >-
        `admin` does everything; `operator` reads everything and handles
        alerts (operations marked `x-roles: [admin, operator]`); `viewer`
        reads.
    User:
      type: object
      required: [id, username, display_name, role, auth, disabled, totp_enabled, created_at]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        auth: { type: string, enum: [password, oidc] }
        disabled: { type: boolean }
        totp_enabled: { type: boolean }
        created_at: { type: string }
        last_login_at: { type: [string, "null"] }
    AuthStatus:
      type: object
      required: [configured, authenticated, oidc, demo]
      properties:
        configured: { type: boolean, description: "`false` on a fresh instance." }
        authenticated: { type: boolean }
        user: { $ref: "#/components/schemas/User" }
        oidc:
          type: object
          required: [enabled, provider_name, login_url]
          properties:
            enabled: { type: boolean }
            provider_name: { type: string }
            login_url: { type: string }
        demo: { type: boolean }
    SetupRequest:
      type: object
      required: [setup_code, password]
      properties:
        setup_code:
          type: string
          writeOnly: true
          description: One-time code printed in the server logs at startup (or `DUMBMONIT_SETUP_CODE`). Case, dashes and spaces are ignored.
        username: { type: string, default: admin }
        password: { type: string, minLength: 12, writeOnly: true }
    LoginRequest:
      type: object
      required: [password]
      properties:
        username: { type: string }
        password: { type: string, writeOnly: true }
    TotpChallenge:
      type: object
      required: [totp_required, pending]
      properties:
        totp_required: { type: boolean, const: true }
        pending: { type: string, description: 'Ticket valid five minutes, dead after five wrong codes.' }
    TotpLoginRequest:
      type: object
      required: [pending, code]
      properties:
        pending: { type: string }
        code: { type: string, description: A six-digit code or a recovery code. }
    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, writeOnly: true }
        new_password: { type: string, writeOnly: true }
    PasswordConfirmation:
      type: object
      required: [password]
      properties:
        password: { type: string, writeOnly: true }
    TotpStatus:
      type: object
      required: [enabled, pending, recovery_codes_left]
      properties:
        enabled: { type: boolean }
        pending: { type: boolean }
        recovery_codes_left: { type: integer }
    TotpEnrolment:
      type: object
      required: [secret, otpauth_uri, issuer, account]
      properties:
        secret: { type: string, description: Base32. }
        otpauth_uri: { type: string }
        issuer: { type: string }
        account: { type: string }
    TotpCode:
      type: object
      required: [code]
      properties:
        code: { type: string }
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items: { type: string }
    AuditEntry:
      type: object
      required: [id, at, action]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string }
        actor: { type: [string, "null"] }
        action: { type: string, examples: [login, login.failed, token.created, user.updated] }
        subject: { type: [string, "null"] }
        ip: { type: [string, "null"] }
    OidcConfig:
      type: object
      properties:
        source: { type: string, enum: [settings, env, none] }
        enabled: { type: boolean }
        env_available: { type: boolean }
        issuer: { type: string }
        client_id: { type: string }
        has_client_secret: { type: boolean }
        provider_name: { type: string }
        scopes: { type: string }
        auto_create: { type: boolean }
        admin_groups:
          type: array
          items: { type: string }
        operator_groups:
          type: array
          items: { type: string }
          description: Members who are not in an admin group become operators.
        groups_claim: { type: string }
        public_url: { type: string }
        redirect_uri: { type: string }
    OidcConfigUpdate:
      type: object
      required: [issuer, client_id]
      properties:
        issuer: { type: string }
        client_id: { type: string }
        client_secret: { type: [string, "null"], writeOnly: true, description: Absent or empty keeps the stored one. }
        provider_name: { type: string }
        scopes: { type: string }
        auto_create: { type: boolean, default: true }
        admin_groups:
          type: array
          items: { type: string }
        operator_groups:
          type: array
          items: { type: string }
          description: Members who are not in an admin group become operators.
        groups_claim: { type: string }
        public_url: { type: string }
    OidcTestRequest:
      type: object
      properties:
        issuer: { type: string, description: Defaults to the effective configuration's issuer. }
    OidcTestReport:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        error: { type: string }
        discovery: { type: object, additionalProperties: true }
    UserCreate:
      type: object
      required: [username, role]
      properties:
        username: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        password: { type: string, writeOnly: true }
    UserUpdate:
      type: object
      properties:
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        disabled: { type: boolean }
        password: { type: string, writeOnly: true }

    # ----------------------------------------------------------- jetons
    TokenScope:
      type: string
      enum: [read, write]
      description: "`read`: every `GET`. `write`: also `POST`, `PUT`, `DELETE`."
    ApiToken:
      type: object
      required: [id, name, prefix, scope, created_at, created_by, expires_at, expired, allowed_networks, last_used_at, last_used_ip, revoked_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        prefix: { type: string, description: "Start of the token (`dmt_` and a few characters), to recognise it.", examples: [dmt_3f9a1c2b] }
        scope: { $ref: "#/components/schemas/TokenScope" }
        created_at: { type: string, format: date-time }
        created_by: { type: [string, "null"], description: Account that created the token. }
        expires_at: { type: [string, "null"], format: date-time, description: "`null`: never expires." }
        expired: { type: boolean }
        allowed_networks:
          type: array
          description: Networks the token may be used from (normalised CIDR); empty means anywhere.
          items: { type: string, examples: ["192.168.1.0/24"] }
        last_used_at: { type: [string, "null"], format: date-time, description: Updated at most once a minute. }
        last_used_ip: { type: [string, "null"] }
        revoked_at: { type: [string, "null"], format: date-time }
    ApiTokenCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        scope: { $ref: "#/components/schemas/TokenScope", default: read }
        expires_in_days:
          type: [integer, "null"]
          minimum: 1
          maximum: 3650
          description: 'Absent or `null`: never expires.'
        allowed_networks:
          type: array
          maxItems: 32
          description: CIDR networks or single addresses; absent or empty means anywhere.
          items: { type: string }
    CreatedApiToken:
      allOf:
        - $ref: "#/components/schemas/ApiToken"
        - type: object
          required: [secret]
          properties:
            secret: { type: string, description: "The token in clear — shown once, never again.", examples: ["dmt_…"] }
    AgentToken:
      type: object
      required: [id, name, prefix, created_at, uses]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        prefix: { type: string }
        created_at: { type: string }
        last_used_at: { type: [string, "null"] }
        revoked_at: { type: [string, "null"] }
        max_uses: { type: [integer, "null"], description: "`null` for a fleet token." }
        uses: { type: integer }
        expires_at: { type: [string, "null"], description: Enrolments stop after it; enrolled machines keep reporting. }
    AgentTokenCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        base_url: { type: string, description: The URL agents will use; the listen address by default. }
        reusable: { type: boolean, default: false, description: 'Without it, the token enrols one machine.' }
        max_uses: { type: [integer, "null"], minimum: 1 }
        expires_in_days: { type: [integer, "null"], minimum: 1 }
    CreatedAgentToken:
      allOf:
        - $ref: "#/components/schemas/AgentToken"
        - type: object
          required: [secret, install_linux, install_windows]
          properties:
            secret: { type: string, description: Shown once. }
            install_linux: { type: string }
            install_windows: { type: string }

    # -------------------------------------------------- types d'équipement
    KindDescription:
      type: object
      required: [kind, label, summary, examples, credential_types, credentials, address_hint, default_port, setup, options]
      properties:
        kind: { type: string }
        label: { type: string }
        summary: { type: string }
        examples:
          type: array
          items: { type: string }
        credential_types:
          type: array
          description: The `type` values of `credentials`, in order of preference.
          items: { type: string }
        credentials:
          type: array
          items: { $ref: "#/components/schemas/CredentialDescription" }
        address_hint: { type: string }
        default_port: { type: integer, description: "0 when there is none." }
        setup: { $ref: "#/components/schemas/SetupDescription" }
        options:
          type: array
          description: Settings read from the device's `tags`, in display order.
          items: { $ref: "#/components/schemas/OptionDescription" }
    SetupDescription:
      type: object
      properties:
        title: { type: string }
        steps:
          type: array
          items: { type: string }
        warning: { type: string }
        doc_url: { type: string }
    OptionDescription:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        help: { type: string }
        placeholder: { type: string }
        default: { type: string }
        required: { type: boolean }
        input: { type: string }
        choices:
          type: array
          items: { type: string }
        group: { type: string, description: "Sub-heading under \"More options\"; empty: the UI falls back to a generic key-prefix heuristic." }
    CredentialDescription:
      type: object
      properties:
        kind: { type: string }
        label: { type: string }
        help: { type: string }
        fields:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              help: { type: string }
              placeholder: { type: string }
              input: { type: string }
              choices:
                type: array
                items: { type: string }
              required: { type: boolean }

    DiscoveryRequest:
      type: object
      required: [cidr]
      properties:
        cidr: { type: string, examples: ["192.168.1.0/24"] }
        community: { type: string, default: public, writeOnly: true }
        port: { type: integer, default: 161 }
        timeout_ms: { type: integer, minimum: 100, maximum: 10000 }
    DiscoveryResult:
      type: object
      required: [devices, scanned]
      properties:
        scanned: { type: integer, description: Addresses probed. }
        devices:
          type: array
          items:
            type: object
            required: [address]
            properties:
              address: { type: string }
              sysdescr: { type: [string, "null"] }
              sysname: { type: [string, "null"] }
              sysobjectid: { type: [string, "null"] }
              suggested_profile: { type: [string, "null"] }

    Onboarding:
      type: object
      required: [skipped, complete, dismissed, has_target, has_channel, notification_confirmed]
      properties:
        skipped: { type: boolean }
        complete: { type: boolean, description: Latched; never goes back to false. }
        completed_at: { type: [string, "null"] }
        dismissed:
          type: array
          items: { type: string, enum: [device, channel, test] }
        has_target: { type: boolean }
        has_channel: { type: boolean }
        notification_confirmed: { type: boolean }
    OnboardingPatch:
      type: object
      properties:
        skipped: { type: boolean }
        dismissed:
          type: array
          items: { type: string, enum: [device, channel, test] }

    # ---------------------------------------------------------- équipements
    Target:
      type: object
      required: [id, name, address, kind, interval_secs, enabled, tags, credential_kind]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        address: { type: string }
        kind: { type: string, description: "A kind from `GET /api/collectors` (`snmp`, `proxmox`, `agent`, `http`, `pack.<id>`…)." }
        profile_id: { type: [string, "null"] }
        parent_id: { type: [integer, "null"], format: int64 }
        via_agent: { type: [integer, "null"], format: int64, description: Relay agent probing this device; `null` means the server. }
        interval_secs: { type: integer }
        enabled: { type: boolean }
        tags:
          type: object
          additionalProperties: { type: string }
        credential_kind: { type: string, description: A label — the secret itself is never returned. }
        group_name: { type: string, description: "Flat folder shown on `/targets`; empty: no folder." }
        position: { type: integer, format: int64, description: "Manual rank, tiebreaking only within the same state and folder." }
        last_probe_at: { $ref: "#/components/schemas/NullableServerTimestamp" }
        last_error: { type: [string, "null"] }
        error_kind:
          type: [string, "null"]
          enum: [down, config, null]
          description: "`down`: the device did not answer; `config`: our side (credentials, address, option)."
    NullableServerTimestamp:
      type: [string, "null"]
      description: UTC timestamp without suffix (`2026-08-31 20:15:00`), or `null`.
    TargetPayload:
      type: object
      required: [name, address, kind]
      properties:
        name: { type: string, maxLength: 200 }
        address: { type: string, maxLength: 253 }
        kind: { type: string }
        profile_id: { type: [string, "null"], description: "Absent on `PUT` keeps the detected profile; `\"\"` clears it." }
        parent_id: { type: [integer, "null"], format: int64 }
        via_agent: { type: [integer, "null"], format: int64, description: "Absent on `PUT` keeps the relay; `null` means direct probing." }
        interval_secs: { type: integer, minimum: 10, default: 60 }
        enabled: { type: boolean, default: true }
        tags:
          type: object
          description: Type options go here under their key.
          additionalProperties: { type: string }
        group_name: { type: string, description: "Flat folder shown on `/targets`. Absent or empty: no folder." }
        credential:
          $ref: "#/components/schemas/CredentialInput"
          description: 'Absent on `PUT` keeps the stored secret; `{"type": "none"}` clears it.'
    CredentialInput:
      description: A device credential. Accepted on input only — never returned.
      writeOnly: true
      oneOf:
        - type: object
          required: [type]
          properties:
            type: { const: none }
        - type: object
          required: [type, community]
          properties:
            type: { const: snmp_community }
            community: { type: string }
        - type: object
          required: [type, username]
          properties:
            type: { const: snmp_v3 }
            username: { type: string }
            auth:
              type: [object, "null"]
              required: [protocol, passphrase]
              properties:
                protocol: { type: string, enum: [md5, sha1, sha224, sha256, sha384, sha512] }
                passphrase: { type: string }
            privacy:
              type: [object, "null"]
              required: [protocol, passphrase]
              properties:
                protocol: { type: string, enum: [des, aes128, aes192, aes256] }
                passphrase: { type: string }
            context: { type: [string, "null"] }
        - type: object
          required: [type]
          description: "`token`, or the two halves `token_id` and `secret` that the server joins into `user@realm!name=secret` for Proxmox VE and PBS."
          properties:
            type: { const: api_token }
            token: { type: string }
            token_id: { type: string }
            secret: { type: string }
        - type: object
          required: [type, username, password]
          properties:
            type: { const: username_password }
            username: { type: string }
            password: { type: string }
    ProbeReport:
      type: object
      required: [sample_count, series]
      properties:
        sample_count: { type: integer }
        series:
          type: array
          description: Series keys as the collector produced them, without the `dumbmonit_` prefix.
          items: { type: string }
    DiscoveryReport:
      type: object
      required: [profile_id]
      properties:
        profile_id: { type: [string, "null"] }

    Series:
      type: object
      required: [metric, values]
      properties:
        metric:
          type: object
          additionalProperties: { type: string }
        values:
          type: array
          description: "`[timestamp_seconds, \"value\"]` pairs."
          items:
            type: array
            prefixItems:
              - { type: number }
              - { type: string }
            minItems: 2
            maxItems: 2

    # -------------------------------------------------------------- alertes
    Severity:
      type: string
      enum: [info, warning, critical]
      description: Internal severity. The UI words are info, advisory (warning) and warning (critical).
    Phase:
      type: string
      enum: [ok, pending, firing, resolved]
    EffectivePhase:
      type: string
      enum: [ok, pending, firing, resolved, suppressed]
    ActiveAlert:
      type: object
      required: [fingerprint, rule_uid, rule_name, severity, series_key, labels, phase, effective_phase, suppressed, silenced, learning, acked, notify_count]
      properties:
        fingerprint: { type: string }
        rule_uid: { type: string }
        rule_name: { type: string, description: Empty if the rule was deleted meanwhile. }
        severity: { $ref: "#/components/schemas/Severity" }
        target_id: { type: [integer, "null"], format: int64 }
        series_key: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
        phase: { $ref: "#/components/schemas/Phase" }
        effective_phase: { $ref: "#/components/schemas/EffectivePhase" }
        suppressed: { type: boolean }
        suppressed_by: { type: [integer, "null"], format: int64, description: The unreachable parent device. }
        silenced: { type: boolean }
        learning: { type: boolean, description: Baseline rules stay silent for 14 days. }
        acked: { type: boolean }
        acked_until: { type: [string, "null"], format: date-time }
        acked_by: { type: [string, "null"], description: "An account, or `token:<name>`." }
        ack_note: { type: [string, "null"] }
        value: { type: [number, "null"] }
        score: { type: [number, "null"] }
        condition_since: { type: [string, "null"], format: date-time }
        firing_since: { type: [string, "null"], format: date-time }
        last_eval_at: { type: [string, "null"], format: date-time }
        last_notified_at: { type: [string, "null"], format: date-time }
        notify_count: { type: integer }
    AckRequest:
      type: object
      description: "`until` or `duration_secs` (not both); neither means 4 hours; `{\"until\": null}` lifts it."
      properties:
        until: { type: [string, "null"], description: "RFC 3339, or `YYYY-MM-DD HH:MM:SS` in UTC; at most 30 days ahead." }
        duration_secs: { type: integer, minimum: 1 }
        note: { type: string }
    AlertHistoryEntry:
      type: object
      required: [id, fingerprint, rule_uid, from_phase, to_phase, severity, notified, reason, at, dismissed]
      properties:
        id: { type: integer, format: int64 }
        fingerprint: { type: string }
        rule_uid: { type: string }
        target_id: { type: [integer, "null"], format: int64 }
        from_phase: { $ref: "#/components/schemas/Phase" }
        to_phase: { $ref: "#/components/schemas/Phase" }
        severity: { $ref: "#/components/schemas/Severity" }
        value: { type: [number, "null"] }
        notified: { type: boolean }
        reason: { type: string, description: "Empty, or why nothing was sent (`learning: would have fired`, `maintenance window`…)." }
        at: { type: string, format: date-time }
        dismissed: { type: boolean, description: "Cleared from the active view by the user; the row is kept." }

    TargetSelector:
      oneOf:
        - type: object
          required: [kind]
          properties:
            kind: { const: all }
        - type: object
          required: [kind, ids]
          properties:
            kind: { const: ids }
            ids:
              type: array
              items: { type: integer, format: int64 }
        - type: object
          required: [kind, labels]
          properties:
            kind: { const: labels }
            labels:
              type: object
              additionalProperties: { type: string }
    AnomalyParams:
      type: object
      properties:
        k: { type: number, default: 3.5 }
        alpha: { type: number, default: 0.05 }
        mad_floor_abs: { type: number, default: 0.000001 }
        mad_floor_rel: { type: number, default: 0.01 }
        min_samples: { type: integer, default: 3 }
    Operator:
      type: string
      enum: [">", ">=", "<", "<="]
    Rule:
      type: object
      required: [id, uid, name, description, kind, query, operator, threshold, for_secs, severity, selector, channels, params, unit, enabled, builtin, overrides]
      properties:
        id: { type: integer, format: int64 }
        uid: { type: string }
        name: { type: string }
        description: { type: string }
        kind: { type: string, enum: [threshold, anomaly, predict] }
        query: { type: string }
        operator: { $ref: "#/components/schemas/Operator" }
        threshold: { type: number }
        clear_threshold: { type: [number, "null"], description: Hysteresis; `null` without. }
        for_secs: { type: integer }
        severity: { $ref: "#/components/schemas/Severity" }
        selector: { $ref: "#/components/schemas/TargetSelector" }
        channels:
          type: array
          description: Channel ids; empty means every enabled channel.
          items: { type: integer, format: int64 }
        params: { $ref: "#/components/schemas/AnomalyParams" }
        unit: { type: string }
        repeat_secs: { type: [integer, "null"] }
        escalate_after_secs: { type: [integer, "null"] }
        enabled: { type: boolean }
        builtin: { type: boolean }
        overrides:
          type: array
          items: { $ref: "#/components/schemas/RuleOverride" }
    RulePayload:
      type: object
      required: [name, query]
      properties:
        uid: { type: string, description: Derived from the name when absent. }
        name: { type: string }
        description: { type: string }
        kind: { type: string, enum: [threshold, anomaly, predict] }
        query: { type: string }
        operator: { $ref: "#/components/schemas/Operator" }
        threshold: { type: number }
        clear_threshold: { type: [number, "null"] }
        for_secs: { type: integer, minimum: 0 }
        severity: { $ref: "#/components/schemas/Severity" }
        selector: { $ref: "#/components/schemas/TargetSelector" }
        channels:
          type: array
          items: { type: integer, format: int64 }
        params: { $ref: "#/components/schemas/AnomalyParams" }
        unit: { type: string }
        repeat_secs: { type: [integer, "null"] }
        escalate_after_secs: { type: [integer, "null"] }
        enabled: { type: boolean }
    EnableRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    RuleOverride:
      type: object
      required: [rule_uid, target_id]
      properties:
        rule_uid: { type: string }
        target_id: { type: integer, format: int64 }
        threshold: { type: [number, "null"] }
        clear_threshold: { type: [number, "null"] }
        enabled: { type: [boolean, "null"], description: "`false` removes the device from the rule." }
    OverridePayload:
      type: object
      properties:
        threshold: { type: [number, "null"] }
        clear_threshold: { type: [number, "null"] }
        enabled: { type: [boolean, "null"] }

    Schedule:
      description: >-
        Days are 0 = Monday … 6 = Sunday (1–31 for a monthly `days`); minutes are
        since local midnight (0–1439). On a recurring schedule, `timezone` (IANA)
        wins over `utc_offset_minutes`.
      oneOf:
        - type: object
          required: [kind, starts_at, ends_at]
          properties:
            kind: { const: once }
            starts_at: { type: string, format: date-time }
            ends_at: { type: string, format: date-time }
        - type: object
          required: [kind, days, start_minute, end_minute]
          properties:
            kind: { const: weekly }
            days:
              type: array
              items: { type: integer, minimum: 0, maximum: 6 }
            start_minute: { type: integer, minimum: 0, maximum: 1439 }
            end_minute: { type: integer, minimum: 0, maximum: 1440 }
            utc_offset_minutes: { type: integer, default: 0 }
            timezone: { type: string, examples: [Europe/Paris] }
        - type: object
          required: [kind, start_minute, duration_minutes]
          properties:
            kind: { const: monthly }
            days:
              type: array
              items: { type: integer, minimum: 1, maximum: 31 }
            nth_weekdays:
              type: array
              items:
                type: object
                required: [nth, weekday]
                properties:
                  nth: { type: integer, description: "1 to 5, or -1 for the last one of the month." }
                  weekday: { type: integer, minimum: 0, maximum: 6 }
            start_minute: { type: integer, minimum: 0, maximum: 1439 }
            duration_minutes: { type: integer, minimum: 1 }
            utc_offset_minutes: { type: integer, default: 0 }
            timezone: { type: string }
    Silence:
      type: object
      required: [id, name, comment, matchers, schedule, enabled, active_now]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        comment: { type: string }
        target_id: { type: [integer, "null"], format: int64 }
        matchers:
          type: object
          additionalProperties: { type: string }
        schedule: { $ref: "#/components/schemas/Schedule" }
        enabled: { type: boolean }
        active_now: { type: boolean }
        active_until: { type: [string, "null"], format: date-time }
        next_start_at: { type: [string, "null"], format: date-time }
    SilencePayload:
      type: object
      required: [name, schedule]
      properties:
        name: { type: string }
        comment: { type: string }
        target_id: { type: [integer, "null"], format: int64, description: "`null` with no matchers: the whole instance." }
        matchers:
          type: object
          additionalProperties: { type: string }
        schedule: { $ref: "#/components/schemas/Schedule" }
        enabled: { type: boolean, default: true }

    # -------------------------------------------------------- notifications
    MatchCondition:
      oneOf:
        - type: object
          required: [field, key, value]
          properties:
            field: { const: tag }
            key: { type: string }
            value: { type: string }
        - type: object
          required: [field, value]
          properties:
            field: { const: kind }
            value: { type: string }
        - type: object
          required: [field, value]
          properties:
            field: { const: rule }
            value: { type: string }
    ChannelMatcher:
      type: object
      description: Routing filter (12 conditions at most). Empty means the channel receives everything.
      properties:
        include:
          type: array
          items: { $ref: "#/components/schemas/MatchCondition" }
        exclude:
          type: array
          items: { $ref: "#/components/schemas/MatchCondition" }
    ChannelPolicy:
      type: object
      properties:
        min_severity: { $ref: "#/components/schemas/Severity" }
        notify_resolved: { type: boolean }
        min_interval_secs: { type: integer, minimum: 0 }
        quiet_hours:
          description: A weekly schedule, or `null`.
          oneOf:
            - $ref: "#/components/schemas/Schedule"
            - type: "null"
        matcher: { $ref: "#/components/schemas/ChannelMatcher" }
    ChannelKind:
      type: object
      required: [kind, label, summary, doc_url, settings, secrets]
      properties:
        kind: { type: string }
        label: { type: string }
        summary: { type: string }
        doc_url: { type: string }
        settings:
          type: array
          items: { $ref: "#/components/schemas/ChannelField" }
        secrets:
          type: array
          items: { $ref: "#/components/schemas/ChannelField" }
    ChannelField:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        required: { type: boolean }
        input: { type: string, enum: [text, url, number, boolean, select, textarea, password] }
        help: { type: string }
        placeholder: { type: string }
        options:
          type: array
          items: { type: string }
        shape: { type: string, enum: [scalar, list, object] }
        default: { type: string }
        destination:
          type: boolean
          description: The field says where the secrets go; changing it on update requires `secrets` in the same request.
    Channel:
      type: object
      required: [id, name, kind, enabled, settings, has_secret, policy]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { type: string }
        enabled: { type: boolean }
        settings: { type: object, additionalProperties: true }
        has_secret: { type: boolean, description: Secrets are never returned. }
        last_error: { type: [string, "null"] }
        last_sent_at: { type: [string, "null"] }
        policy: { $ref: "#/components/schemas/ChannelPolicy" }
    ChannelPayload:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind: { type: string }
        enabled: { type: boolean }
        settings: { type: object, additionalProperties: true, description: Non-secret settings; secret keys are refused here. }
        secrets:
          type: [object, "null"]
          additionalProperties: true
          writeOnly: true
          description: "Absent or `null` on `PUT` keeps the stored secrets; `{}` clears them."
        policy:
          type: [object, "null"]
          description: Each field optional; absent keeps the stored policy.
          properties:
            min_severity: { $ref: "#/components/schemas/Severity" }
            notify_resolved: { type: boolean }
            min_interval_secs: { type: integer, minimum: 0 }
            quiet_hours: { description: "A weekly schedule; `null` clears it." }
            matcher: { description: "A `ChannelMatcher`; `null` or `{}` clears it." }
    ChannelTestReport:
      type: object
      required: [ok, message]
      properties:
        ok: { type: boolean }
        message: { type: string }
    WebPushDevice:
      type: object
      required: [id, device, push_service, fingerprint, created_at, last_success_at, last_error]
      properties:
        id: { type: integer }
        device: { type: string, description: "Readable label from the User-Agent, e.g. \"Firefox on Android\"." }
        push_service: { type: string, description: "Host of the browser's push service." }
        fingerprint: { type: string, description: "First 16 hex characters of SHA-256(endpoint)." }
        created_at: { type: string }
        last_success_at: { type: [string, "null"] }
        last_error: { type: [string, "null"] }
    WebPushOverview:
      type: object
      required: [public_key, devices]
      properties:
        public_key: { type: string, description: "VAPID public key, base64url (uncompressed P-256 point)." }
        devices:
          type: array
          items: { $ref: "#/components/schemas/WebPushDevice" }
    WebPushSubscription:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, format: uri }
        expirationTime: { type: [integer, "null"] }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string, description: "base64url, 65 bytes." }
            auth: { type: string, description: "base64url, 16 bytes." }
    WebPushTestReport:
      type: object
      required: [ok, delivered, failed, removed, message]
      properties:
        ok: { type: boolean }
        delivered: { type: integer }
        failed: { type: integer }
        removed: { type: integer, description: "Expired subscriptions removed." }
        message: { type: string }
    NotifyPolicy:
      type: object
      required: [batch_window_secs, max_per_hour, flap_events, flap_window_secs, flap_hold_secs, public_url, escalate_after_secs, escalate_channel]
      properties:
        batch_window_secs: { type: integer, description: "0: send at once." }
        max_per_hour: { type: integer, description: "Per channel; 0: unlimited." }
        flap_events: { type: integer }
        flap_window_secs: { type: integer }
        flap_hold_secs: { type: integer, description: "0: no flap detection." }
        public_url: { type: string, description: "Links in messages; empty: `DUMBMONIT_PUBLIC_URL`." }
        escalate_after_secs: { type: integer, description: "0: no escalation." }
        escalate_channel: { type: [integer, "null"], format: int64 }
    NotifyPolicyUpdate:
      type: object
      properties:
        batch_window_secs: { type: integer }
        max_per_hour: { type: integer }
        flap_events: { type: integer }
        flap_window_secs: { type: integer }
        flap_hold_secs: { type: integer }
        public_url: { type: string }
        escalate_after_secs: { type: integer }
        escalate_channel: { type: [integer, "null"], format: int64 }
    MatchPreviewRequest:
      type: object
      required: [matcher]
      properties:
        matcher: { $ref: "#/components/schemas/ChannelMatcher" }
    MatchPreview:
      type: object
      required: [devices, matched, total, rules, excluded_rules]
      properties:
        devices:
          type: array
          items:
            type: object
            required: [id, name, kind, tags, matched]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
              kind: { type: string }
              tags:
                type: object
                additionalProperties: { type: string }
              matched: { type: boolean }
        matched: { type: integer }
        total: { type: integer }
        rules:
          type: array
          items: { type: string }
        excluded_rules:
          type: array
          items: { type: string }

    # ----------------------------------------------------- pages de statut
    StatusPageView:
      type: object
      required: [id, slug, title, description, published, theme, show_uptime_days, created_at, updated_at, accent, footer_text, homepage_url, items]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string }
        title: { type: string }
        description: { type: string }
        published: { type: boolean }
        theme: { type: string, enum: [auto, light, dark] }
        show_uptime_days: { type: integer, minimum: 7, maximum: 90 }
        created_at: { type: string }
        updated_at: { type: string }
        accent: { type: string, enum: [default, blue, teal, violet, rose, amber] }
        footer_text: { type: string }
        homepage_url: { type: string }
        logo_type: { type: [string, "null"], enum: [image/png, image/jpeg, image/webp, null] }
        subscribe_channel_id: { type: [integer, "null"], format: int64 }
        domain: { type: [string, "null"], description: "Public host name serving this page at `/`; `null` for none." }
        items:
          type: array
          items: { $ref: "#/components/schemas/StatusPageItem" }
    StatusPageItem:
      type: object
      required: [id, page_id, target_id, label, group_name, position]
      properties:
        id: { type: integer, format: int64 }
        page_id: { type: integer, format: int64 }
        target_id: { type: integer, format: int64 }
        label: { type: string }
        group_name: { type: string }
        position: { type: integer }
    StatusPageItemInput:
      type: object
      required: [target_id]
      properties:
        target_id: { type: integer, format: int64 }
        label: { type: string, maxLength: 80 }
        group_name: { type: string, maxLength: 60 }
    StatusPagePayload:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 120 }
        slug: { type: string, pattern: "^[a-z0-9-]{2,40}$", description: Derived from the title when omitted. }
        description: { type: string, maxLength: 1000 }
        published: { type: boolean, default: false }
        theme: { type: string, enum: [auto, light, dark], default: auto }
        show_uptime_days: { type: integer, minimum: 7, maximum: 90, default: 90 }
        accent: { type: string, enum: [default, blue, teal, violet, rose, amber] }
        footer_text: { type: string, maxLength: 280 }
        homepage_url: { type: string, maxLength: 300, description: "`http(s)://` or empty." }
        subscribe_channel_id: { type: [integer, "null"], format: int64, description: "An `smtp` channel; `null` turns email subscription off." }
        domain:
          type: [string, "null"]
          description: >-
            Public host name (`status.example.com`), lowercased; a scheme or trailing
            slash is stripped, a port or path is refused. Unique across pages and
            never the address of DumbMonit itself (409 / 400). `null` or `""`
            removes it. Requests whose `Host` is this name only reach this page.
    LogoUpload:
      type: object
      required: [data]
      properties:
        data: { type: string, description: "Base64, or a `data:` URL." }
    Subscriber:
      type: object
      required: [id, page_id, email, created_at]
      properties:
        id: { type: integer, format: int64 }
        page_id: { type: integer, format: int64 }
        email: { type: string }
        confirmed_at: { type: [string, "null"], description: "`null` while pending." }
        created_at: { type: string }
    Incident:
      type: object
      required: [id, title, kind, status, severity, starts_at, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        page_id: { type: [integer, "null"], format: int64 }
        title: { type: string }
        kind: { type: string, enum: [incident, maintenance] }
        status:
          type: string
          description: "Incident: investigating, identified, monitoring, resolved. Maintenance: scheduled, in_progress, completed."
        severity: { type: string, enum: [minor, major] }
        starts_at: { type: string }
        ends_at: { type: [string, "null"] }
        created_at: { type: string }
        updated_at: { type: string }
    IncidentUpdate:
      type: object
      required: [id, incident_id, status, body, created_at]
      properties:
        id: { type: integer, format: int64 }
        incident_id: { type: integer, format: int64 }
        status: { type: string }
        body: { type: string }
        created_at: { type: string }
    IncidentView:
      allOf:
        - $ref: "#/components/schemas/Incident"
        - type: object
          required: [updates]
          properties:
            updates:
              type: array
              items: { $ref: "#/components/schemas/IncidentUpdate" }
    IncidentPayload:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 160 }
        kind: { type: string, enum: [incident, maintenance] }
        status: { type: string }
        severity: { type: string, enum: [minor, major] }
        page_id: { type: [integer, "null"], format: int64 }
        starts_at: { type: string }
        ends_at: { type: [string, "null"] }
        body: { type: string, maxLength: 4000, description: 'First update, at creation only.' }
    IncidentUpdatePayload:
      type: object
      required: [body]
      properties:
        status: { type: string, description: Defaults to the incident's current status. }
        body: { type: string, maxLength: 4000 }
    PublicStatus:
      type: object
      required: [page, overall, generated_at, groups, incidents, maintenance]
      properties:
        page:
          type: object
          properties:
            slug: { type: string }
            title: { type: string }
            description: { type: string }
            theme: { type: string }
            show_uptime_days: { type: integer }
            updated_at: { type: string }
            accent: { type: string }
            footer_text: { type: string }
            homepage_url: { type: string }
            logo_url: { type: [string, "null"] }
            subscribe: { type: boolean }
        overall: { type: string }
        generated_at: { type: string }
        groups:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              items:
                type: array
                items:
                  type: object
                  properties:
                    key: { type: string }
                    label: { type: string }
                    state: { type: string }
                    uptime_24h: { type: [number, "null"] }
                    uptime_7d: { type: [number, "null"] }
                    uptime_30d: { type: [number, "null"] }
                    uptime_90d: { type: [number, "null"] }
                    latency_ms: { type: [number, "null"] }
                    history:
                      type: array
                      items:
                        type: object
                        properties:
                          date: { type: string }
                          uptime_pct: { type: [number, "null"] }
                          down_minutes: { type: [integer, "null"] }
                          incidents: { type: integer }
        incidents:
          type: array
          items: { $ref: "#/components/schemas/PublicIncident" }
        maintenance:
          type: array
          items: { $ref: "#/components/schemas/PublicIncident" }
    PublicIncident:
      type: object
      properties:
        title: { type: string }
        kind: { type: string }
        status: { type: string }
        severity: { type: string }
        starts_at: { type: string }
        ends_at: { type: [string, "null"] }
        updates:
          type: array
          items:
            type: object
            properties:
              status: { type: string }
              body: { type: string }
              created_at: { type: string }

    # ------------------------------------------------------- agents, conteneurs
    Relay:
      type: object
      required: [id, name, relay, relayed]
      properties:
        id: { type: integer, format: int64, description: Id of the `agent` device. }
        name: { type: string }
        site: { type: [string, "null"] }
        relay: { type: boolean, description: The agent declared `relay true` in its last batch. }
        last_seen_at: { type: [string, "null"] }
        relayed: { type: integer, description: Devices reached through this agent. }
    AgentHost:
      type: object
      required: [hostname, os, agent_version, commands_supported, relay, relayed, binding, bound]
      properties:
        hostname: { type: string }
        os: { type: string }
        os_version: { type: [string, "null"] }
        arch: { type: [string, "null"] }
        agent_version: { type: string }
        commands_supported: { type: boolean }
        relay: { type: boolean }
        site: { type: [string, "null"] }
        relayed: { type: integer }
        last_seen_at: { type: [string, "null"] }
        binding: { type: string, enum: [bound, pending, unsupported] }
        bound: { type: boolean }
        bound_at: { type: [string, "null"] }
        rebind_until: { type: [string, "null"] }
    RebindWindow:
      type: object
      required: [rebind_until, minutes]
      properties:
        rebind_until: { type: string }
        minutes: { type: integer }
    ContainerPolicy:
      type: object
      required: [auto_restart, auto_update, prune_old_image, only_in_maintenance]
      properties:
        auto_restart: { type: boolean }
        auto_update: { type: boolean }
        prune_old_image: { type: boolean }
        only_in_maintenance: { type: boolean }
    ContainerPolicyPatch:
      type: object
      properties:
        auto_restart: { type: boolean }
        auto_update: { type: boolean }
        prune_old_image: { type: boolean }
        only_in_maintenance: { type: boolean }
    Command:
      type: object
      required: [id, target_id, kind, args, status, created_at]
      properties:
        id: { type: integer, format: int64 }
        target_id: { type: integer, format: int64 }
        kind: { type: string, enum: [container.restart, container.update] }
        args: { type: object, additionalProperties: true }
        status: { type: string, enum: [queued, running, done, failed, cancelled, expired] }
        requested_by: { type: [string, "null"], description: "An account, `token:<name>`, or `policy`." }
        created_at: { type: string }
        started_at: { type: [string, "null"] }
        finished_at: { type: [string, "null"] }
        result: { type: [string, "null"], description: Truncated to the last 4 KB. }
    Container:
      type: object
      required: [name, image, up, health, restart_count, policy]
      properties:
        name: { type: string }
        image: { type: string }
        up: { type: boolean }
        health: { type: string }
        restart_count: { type: integer }
        uptime_seconds: { type: [integer, "null"] }
        image_age_seconds: { type: [integer, "null"] }
        update_available: { type: [boolean, "null"] }
        policy: { $ref: "#/components/schemas/ContainerPolicy" }
        last_command:
          oneOf:
            - $ref: "#/components/schemas/Command"
            - type: "null"

    PushMonitor:
      type: object
      required: [target_id, token, path, last_status, last_message, received_total, created_at, verdict]
      properties:
        target_id: { type: integer, format: int64 }
        token: { type: [string, "null"], description: "The secret of the heartbeat URL; `null` unless the caller is an admin (or holds a `write` token)." }
        path: { type: [string, "null"], description: "`/api/push/<token>`, relative to the server's address; `null` like `token`." }
        last_seen_at: { type: [string, "null"] }
        last_seen_age_secs: { type: [integer, "null"] }
        last_status: { type: string, enum: [up, down] }
        last_message: { type: string }
        received_total: { type: integer }
        created_at: { type: string }
        expected_interval_secs: { type: [integer, "null"] }
        grace_secs: { type: [integer, "null"] }
        settings_error: { type: [string, "null"] }
        verdict: { type: string, enum: [waiting, on_time, missed, reported_down] }

    WebchangePages:
      type: object
      required: [screenshots_available, pages]
      properties:
        screenshots_available: { type: boolean }
        pages:
          type: array
          items: { $ref: "#/components/schemas/WebchangePage" }

    WebchangePage:
      type: object
      required: [url, title, status, error, last_checked, last_changed, changes, latest_snapshot]
      properties:
        url: { type: string }
        title: { type: [string, "null"] }
        status: { type: [integer, "null"], description: "HTTP status of the last read; always 404 for a removed page, 410 or no longer linked included." }
        error: { type: [string, "null"], description: "Why the last read failed, or why the page counts as removed." }
        last_checked: { type: [string, "null"], description: "UTC, without suffix." }
        last_changed: { type: [string, "null"], description: "UTC, without suffix." }
        changes: { type: integer, description: Changes kept for this page. }
        latest_snapshot: { type: [integer, "null"], format: int64 }

    WebchangeChange:
      type: object
      required: [id, url, kind, detected_at, added, removed, before, after]
      properties:
        id: { type: integer, format: int64 }
        url: { type: string }
        kind: { type: string, enum: [changed, new_page, removed_page] }
        detected_at: { type: string, description: "UTC, without suffix." }
        added: { type: integer, description: Lines added. }
        removed: { type: integer, description: Lines removed. }
        before: { type: [integer, "null"], format: int64, description: Snapshot before the change. }
        after: { type: [integer, "null"], format: int64, description: Snapshot after the change. }

    WebchangeSnapshot:
      type: object
      required: [id, fetched_at, title, has_screenshot]
      properties:
        id: { type: integer, format: int64 }
        fetched_at: { type: string, description: "UTC, without suffix." }
        title: { type: [string, "null"] }
        has_screenshot: { type: boolean }

    WebchangeDiffLine:
      type: object
      required: [op, text, count]
      properties:
        op: { type: string, enum: [equal, insert, delete, skip] }
        text: { type: string, description: "Empty for `skip`." }
        count: { type: [integer, "null"], description: "Unchanged lines hidden by a `skip` line." }

    WebchangeChangeDetail:
      allOf:
        - $ref: "#/components/schemas/WebchangeChange"
        - type: object
          required: [before_snapshot, after_snapshot, diff]
          properties:
            before_snapshot:
              oneOf:
                - $ref: "#/components/schemas/WebchangeSnapshot"
                - type: "null"
            after_snapshot:
              oneOf:
                - $ref: "#/components/schemas/WebchangeSnapshot"
                - type: "null"
            diff:
              type: array
              items: { $ref: "#/components/schemas/WebchangeDiffLine" }

    Pack:
      type: object
      required: [id, version, label, summary, enabled, installed_at, sha256, metrics, rules, snmp_profiles, targets, warnings]
      properties:
        id: { type: string }
        version: { type: string }
        label: { type: string }
        summary: { type: string }
        kind: { type: [string, "null"], description: "`pack.<id>`; `null` for a pack with SNMP profiles only." }
        enabled: { type: boolean }
        installed_at: { type: string }
        sha256: { type: string }
        metrics:
          type: array
          items: { type: string }
        rules:
          type: array
          description: Uids of the rules it ships.
          items: { type: string }
        snmp_profiles:
          type: array
          items: { type: string }
        targets: { type: integer, description: Devices using it. }
        warnings:
          type: array
          items: { type: string }
        error: { type: [string, "null"], description: Set when the stored pack no longer passes validation. }
    PackInstallReport:
      type: object
      required: [outcome, pack, rules_added, restart_required]
      properties:
        outcome: { type: string, enum: [created, updated, unchanged] }
        pack: { $ref: "#/components/schemas/Pack" }
        rules_added: { type: integer }
        restart_required: { type: boolean, description: SNMP profiles take effect after a restart. }

    # ------------------------------------------------------------- sauvegarde
    BackupStatus:
      type: object
      required: [bundle_version, min_passphrase_length, contents, secret_source, secret_path, schedule]
      properties:
        bundle_version: { type: integer }
        min_passphrase_length: { type: integer }
        contents:
          type: array
          items:
            type: object
            properties:
              section: { type: string }
              description: { type: string }
              count: { type: integer }
        secret_source: { type: string, enum: [file, environment] }
        secret_path: { type: string }
        schedule: { $ref: "#/components/schemas/LocalBackupStatus" }
    LocalBackupStatus:
      type: object
      properties:
        enabled: { type: boolean }
        directory: { type: string }
        interval_hours: { type: integer }
        keep: { type: integer }
        includes_secret_key: { type: boolean }
        last_run:
          type: [object, "null"]
          properties:
            at: { type: string }
            ok: { type: boolean }
            file: { type: string }
            bytes: { type: integer }
            duration_ms: { type: integer }
            with_secret: { type: boolean }
            error: { type: [string, "null"] }
        files:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              bytes: { type: integer }
              at: { type: string }
              with_secret: { type: boolean }
        total_bytes: { type: integer }
        directory_error: { type: [string, "null"] }
    BackupExportRequest:
      type: object
      required: [passphrase]
      properties:
        passphrase: { type: string, minLength: 16, writeOnly: true }
        include_account_secrets: { type: boolean, default: false }
    BackupRestoreRequest:
      type: object
      required: [bundle, passphrase]
      properties:
        bundle: { type: object, additionalProperties: true }
        passphrase: { type: string, writeOnly: true }
        apply: { type: boolean, default: false, description: "`false`: dry run inside a transaction rolled back." }
    RestoreReport:
      type: object
      properties:
        applied: { type: boolean }
        created_at: { type: string }
        source_version: { type: string }
        sections:
          type: array
          items:
            type: object
            properties:
              section: { type: string }
              created: { type: integer }
              updated: { type: integer }
              skipped: { type: integer }
              notes:
                type: array
                items: { type: string }
        created: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }
        warnings:
          type: array
          items: { type: string }

    # ------------------------------------------ panneaux (premier niveau seulement)
    PanelObject:
      type: object
      description: >-
        A panel read from the device's last probe. Only the top-level properties
        are described here; see the HTTP API reference for the full shape.
      additionalProperties: true
    ProxmoxGuest:
      type: object
      additionalProperties: true
      properties:
        vmid: { type: integer }
        name: { type: string }
        node: { type: string }
        kind: { type: string, enum: [qemu, lxc] }
        status: { type: string }
        cpu_percent: { type: [number, "null"] }
        cpu_count: { type: [number, "null"] }
        memory_used_bytes: { type: [number, "null"] }
        memory_total_bytes: { type: [number, "null"] }
        memory_percent: { type: [number, "null"] }
        disk_used_bytes: { type: [number, "null"] }
        disk_total_bytes: { type: [number, "null"] }
        disk_percent: { type: [number, "null"] }
        uptime_seconds: { type: [number, "null"] }
        last_backup_age_seconds: { type: [number, "null"] }
        os: { type: [string, "null"] }
        ip: { type: [string, "null"] }
    ProxmoxNodes:
      type: object
      additionalProperties: true
      properties:
        nodes:
          type: array
          items: { $ref: "#/components/schemas/PanelObject" }
        fencing_state: { type: [string, "null"] }
        fencing_armed: { type: [boolean, "null"] }
    ProxmoxCeph:
      type: object
      additionalProperties: true
      properties:
        available: { type: boolean }
        health: { type: [number, "null"], description: "0 OK, 1 WARN, 2 ERR, 3 unknown." }
        health_status: { type: [string, "null"] }
        used_percent: { type: [number, "null"] }
        osds:
          type: array
          items: { $ref: "#/components/schemas/PanelObject" }
        pools:
          type: array
          items: { $ref: "#/components/schemas/PanelObject" }
        filesystems:
          type: array
          items: { type: string }
    PbsCalendar:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        days: { type: integer }
        offset_minutes: { type: integer }
        groups:
          type: array
          items: { $ref: "#/components/schemas/PanelObject" }
    PbsJobs:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        jobs:
          type: array
          items: { $ref: "#/components/schemas/PanelObject" }
    PbsHealth:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        version: { type: [string, "null"] }
        datastores: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        disks: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        zpools: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        services: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        certificates: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
    PbsTaskLog:
      type: object
      additionalProperties: true
      properties:
        upid: { type: string }
        lines:
          type: array
          items: { type: string }
    TaskFailure:
      type: object
      additionalProperties: true
      properties:
        upid: { type: string }
        remote: { type: string, description: PDM only. }
        worker_type: { type: string }
        kind: { type: string }
        worker_id: { type: string }
        datastore: { type: [string, "null"], description: PBS only. }
        node: { type: [string, "null"] }
        start: { type: [integer, "null"] }
        end: { type: [integer, "null"] }
        error: { type: [string, "null"] }
    PdmRemotes:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        version: { type: [string, "null"] }
        estate: { $ref: "#/components/schemas/PanelObject" }
        remotes:
          type: array
          items: { $ref: "#/components/schemas/PanelObject" }
    PdmHealth:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        version: { type: [string, "null"] }
        memory_used_percent: { type: [number, "null"] }
        rootfs_used_percent: { type: [number, "null"] }
        certificates: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
    PmgQueues:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        queues: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        total_messages: { type: number }
        stuck: { type: boolean }
    PmgTraffic:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }

[package]
name = "dumbmonit-agent"
description = "Agent système DumbMonit : collecte les métriques d'une machine et les pousse vers le serveur."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Distribué par image Docker, jamais sur crates.io.
publish = false

[[bin]]
name = "dumbmonit-agent"
path = "src/main.rs"

[dependencies]
dumbmonit-proto = { path = "../proto" }
# Les collecteurs du serveur, pour le mode relais : un agent posé dans un autre
# réseau interroge les équipements de son site à la place du serveur.
dumbmonit-collectors = { path = "../collectors" }

anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

# Runtime volontairement mono-thread et réduit au strict nécessaire : l'agent
# passe sa vie à dormir, un ordonnanceur multi-thread ne lui apporterait qu'un
# surcoût mémoire sur des machines parfois très modestes.
tokio = { version = "1", default-features = false, features = [
    "rt", "macros", "time", "signal", "net", "process", "io-util", "fs", "sync",
] }

# Sans « env-filter » : la dépendance à un moteur d'expressions régulières
# doublerait presque la taille du binaire pour un réglage que trois niveaux de
# journalisation couvrent amplement.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

# Mêmes réglages TLS que le serveur, pour ne pas entretenir deux configurations.
reqwest = { version = "0.13", default-features = false, features = [
    "json", "rustls", "gzip",
] }

# Canal chiffré vers le serveur : TLS 1.3, échange de clés hybride
# post-quantique, certificat client et autorité du serveur épinglée. Le même
# moteur aws-lc-rs que reqwest ; `rcgen` génère la paire de clés de l'agent sur
# la machine même — la clé privée ne la quitte jamais.
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
sha2 = "0.11"
hex = "0.4"
base64 = "0.23"

# Couche multiplateforme d'accès aux compteurs système.
sysinfo = { version = "0.39", default-features = false, features = [
    "system", "disk", "network",
] }

# Filtres d'interfaces et de points de montage. Sans les fonctionnalités par
# défaut (« perf », Unicode complet) : les noms filtrés font quelques
# caractères, et le moteur complet pèserait lourd dans un binaire qui se veut
# petit.
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }

# Sondes de température, hors Windows : `sysinfo` lit `/sys/class/hwmon` sous
# Linux, le SMC sous macOS et `dev.cpu.N.temperature` sous FreeBSD — les trois
# sources derrière une seule interface, sans dépendance supplémentaire. Windows
# en est exclu à dessein : la même fonctionnalité y ferait entrer tout le client
# WMI, pour une lecture qui exige de toute façon des droits d'administration.
[target.'cfg(not(windows))'.dependencies]
sysinfo = { version = "0.39", default-features = false, features = ["component"] }

[dev-dependencies]
# Répertoires jetables pour les tests du secret de liaison : ils écrivent un
# fichier et en vérifient les permissions, ce qui n'a de sens que sur un vrai
# système de fichiers.
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# Intégration au gestionnaire de services : point d'entrée du service, prise en
# charge de l'ordre d'arrêt, et interrogation de l'état des services surveillés.
windows-service = "0.8"
# Compteurs de performance (PDH) : files d'attente de MDaemon et compteurs
# listés dans `perf_counters` ; journal d'événements (`wevtapi`) pour les
# règles d'événements (`collect/eventlog`). Même version que celle qu'apporte
# déjà `windows-service`, pour ne pas faire entrer une seconde copie des
# liaisons.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_System_EventLog", "Win32_System_Performance",
] }

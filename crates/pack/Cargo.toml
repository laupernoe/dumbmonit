[package]
name = "dumbmonit-pack"
description = "Paquets d'intégration DumbMonit : format déclaratif, validation, extraction et collecteur."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Distribué par image Docker, jamais sur crates.io.
publish = false

[dependencies]
dumbmonit-proto = { path = "../proto" }
# Garde-fou d'adresses, racine d'URL d'une cible et catalogue SNMP : un paquet
# réutilise ce que les collecteurs compilés font déjà, sans le recopier.
dumbmonit-collectors = { path = "../collectors" }

async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

reqwest = { version = "0.13", default-features = false, features = [
    "rustls", "rustls-native-certs", "gzip",
] }
serde_yaml_ng = "0.10"
# Chemins JSONPath (RFC 9535) des métriques et des lignes découvertes. MIT.
serde_json_path = "0.7"
regex = "1"
# Version du paquet et version de DumbMonit qu'il exige.
semver = "1"
# Empreinte du YAML installé, affichée et comparée à la mise à jour.
sha2 = "0.11"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
axum = "0.8"

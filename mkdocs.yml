site_name: DumbMonit
site_description: Simple monitoring from homelabs to mid-sized companies. One container, one IP address, useful alerts in a minute.
site_url: https://dumbmonit.readthedocs.io/en/latest/
docs_dir: docs
exclude_docs: |
  requirements.txt

# One language per build, chosen by READTHEDOCS_LANGUAGE (English by default): see
# hooks/rtd_language.py. site_url, theme.language, the search language, the language
# switcher (extra.alternate) and the navigation titles are set there.
# Published twice: on the product website under /docs/ (DUMBMONIT_DOCS_BASE, built by
# .github/workflows/site.yml) and on Read the Docs as a mirror (the site_url below).
# The header carries the website's navigation (overrides/partials/header.html).
hooks:
  - hooks/rtd_language.py

validation:
  links:
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: Geist
    code: Geist Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  # The menu follows the application: one tab per entry of its left menu (Overview,
  # Monitors, Alerts, Status, Settings), the pages of the section on the left, an index
  # page per section (navigation.indexes: the first page of a section named index.md),
  # a breadcrumb, previous/next links at the foot of a page and a back-to-top button.
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - content.code.copy

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # Same slugs as GitHub, so the anchors the server catalogue points to
      # (notifications/#email-smtp, …) match.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

# The order follows the application (see web/src/lib/components/shell/nav.ts): Overview,
# Monitors (List, Map, Logs, Security), Alerts (Now, History, Rules, Automation, On-call),
# Status (Pages, Reports), Settings. A section's first page, named index.md, is its index.
# Section and page titles are translated in hooks/nav_translations.yml.

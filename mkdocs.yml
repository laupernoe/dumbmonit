site_name: DumbMonit
site_description: Simple monitoring for homelabs and small teams. One container, one IP address, useful alerts in a minute.
site_url: https://dumbmonit.readthedocs.io
repo_url: https://github.com/noekan/dumbmonit
repo_name: noekan/dumbmonit
edit_uri: edit/main/docs/
docs_dir: docs

validation:
  links:
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
copyright: Apache 2.0 — DumbMonit

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.tabs.link

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # Same slugs as GitHub, so the anchors the server catalogue points to
      # (notifications/#email-smtp, …) match.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

nav:
  - Home: index.md
  - Live demo: https://demo.dumbmonit.app
  - Install:
      - Docker: install/docker.md
      - Add your first device: install/first-device.md
      - Monitor a remote site: install/remote-site.md
      - Backup and restore: install/backup.md
      - Run a demo instance: install/demo.md
  - Devices:
      - Overview: devices/index.md
      - SNMP: devices/snmp.md
      - Proxmox VE: devices/proxmox.md
      - Proxmox Backup Server: devices/pbs.md
      - Proxmox Datacenter Manager: devices/pdm.md
      - Proxmox Mail Gateway: devices/pmg.md
      - VMware vSphere: devices/vsphere.md
      - Synology DSM: devices/synology.md
      - OPNsense: devices/opnsense.md
      - UniFi Network: devices/unifi.md
      - Home Assistant: devices/homeassistant.md
      - TrueNAS: devices/truenas.md
      - MikroTik RouterOS: devices/mikrotik.md
      - UPS with NUT: devices/nut.md
      - Server hardware (Redfish): devices/redfish.md
      - VictoriaMetrics and VictoriaLogs: devices/victoriametrics.md
      - Grafana Loki: devices/loki.md
      - Graylog: devices/graylog.md
      - Pi-hole: devices/pihole.md
      - AdGuard Home: devices/adguard.md
      - MDaemon Email Server: devices/mdaemon.md

site_name: DumbMonit
site_description: Simple monitoring from the homelab to the small business. One container, one IP address, useful alerts in a minute.
site_url: https://dumbmonit.readthedocs.io/en/latest/
repo_url: https://github.com/laupernoe/dumbmonit
repo_name: laupernoe/dumbmonit
edit_uri: edit/main/docs/
docs_dir: docs

# One language per build, chosen by READTHEDOCS_LANGUAGE (English by default): see
# hooks/rtd_language.py. site_url, theme.language, the search language, the language
# switcher (extra.alternate) and the navigation titles are set there.
hooks:
  - hooks/rtd_language.py

validation:
  links:
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
copyright: Apache 2.0 — DumbMonit

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.tabs.link

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # Same slugs as GitHub, so the anchors the server catalogue points to
      # (notifications/#email-smtp, …) match.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search


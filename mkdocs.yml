site_name: DumbMonit
site_description: Simple monitoring from the homelab to the small business. One container, one IP address, useful alerts in a minute.
site_url: https://dumbmonit.readthedocs.io
repo_url: https://github.com/laupernoe/dumbmonit
repo_name: laupernoe/dumbmonit
edit_uri: edit/main/docs/
docs_dir: docs

validation:
  links:
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
copyright: Apache 2.0 — DumbMonit

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.tabs.link

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # Same slugs as GitHub, so the anchors the server catalogue points to
      # (notifications/#email-smtp, …) match.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - i18n:
      docs_structure: suffix
      # A page without a translation is served in English, with a notice.
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          build: true
          default: true
        - locale: fr
          name: Français
          build: true
          nav_translations:
            Home: "Accueil"
            Live demo: "Démo en ligne"
            Install: "Installation"
            Devices: "Appareils"
            Integration packs: "Packs d'intégration"
            Alerting: "Alertes"
            Using DumbMonit: "Utiliser DumbMonit"
            Reference: "Référence"
            Development: "Développement"
            FAQ: "FAQ"

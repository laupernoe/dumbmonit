<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DumbMonit banner example</title>
</head>
<body>
  <h1>My website</h1>
  <p>Replace the address below with your DumbMonit server and the address
  (slug) of your published status page.</p>

  <!--
    data-position  top (default) | bottom
    data-show      issues (default: only when something is wrong) | always
    data-lang      en (default) | fr
  -->
  <script async
    src="https://monit.example.com/api/public/status/my-page/banner.js"
    data-position="top"
    data-show="issues"
    data-lang="en"></script>
</body>
</html>

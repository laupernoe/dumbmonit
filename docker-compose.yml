name: dumbmonit

services:
  dumbmonit:
    image: ghcr.io/laupernoe/dumbmonit:latest
    ports:
      - "8080:8080"
      # Encrypted agent channel (TLS 1.3 + client certificates). The only port
      # agents on other networks need; the web port can stay private.
      - "8443:8443"
      # Central logs (off by default; turn on with DUMBMONIT_SYSLOG_ENABLED /
      # DUMBMONIT_TRAPS_ENABLED under `environment`, and the log store in
      # Settings > System). Unprivileged ports: the container runs as non-root.
      # - "5514:5514/udp"   # syslog (RFC 3164 / 5424)
      # - "5514:5514/tcp"
      # - "1162:1162/udp"   # SNMP traps (v1 / v2c)
    volumes:
      - dumbmonit-data:/data
      # Or a host directory; on a SELinux host (Fedora, RHEL) add `:Z`:
      # - ./dumbmonit:/data:Z
    # environment:
    #   PUID: "1000"   # owner of the files in /data (default 65532)
    #   PGID: "1000"
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs: [/tmp]
    # Starts as root only to give /data to user 65532 (or PUID/PGID), then
    # drops root for good: a host directory works as it is. Remove `user` and
    # `cap_add` to run as 65532 from the start (the files must belong to it).
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"

volumes:
  dumbmonit-data:
    name: dumbmonit-data

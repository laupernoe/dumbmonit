# The DumbMonit agent as a container.
#
#   DUMBMONIT_AGENT_URL=https://monitor.example.org DUMBMONIT_AGENT_TOKEN=dmon_… \
#   docker compose -f docker-compose.agent.yml up -d
#
# Outbound only: nothing to open on this side. Options and trade-offs
# (host network, relay mode, private CA): docs/devices/agent.md.
name: dumbmonit-agent

services:
  agent:
    image: ghcr.io/laupernoe/dumbmonit-agent:latest
    environment:
      DUMBMONIT_AGENT_URL: ${DUMBMONIT_AGENT_URL:?set the server URL}
      DUMBMONIT_AGENT_TOKEN: ${DUMBMONIT_AGENT_TOKEN:?create a token in Settings › Agents}
      # The name shown in DumbMonit (a container's own hostname is random).
      DUMBMONIT_AGENT_HOSTNAME: ${DUMBMONIT_AGENT_HOSTNAME:-}
      # true = also run the probes of the devices assigned to this agent.
      DUMBMONIT_AGENT_RELAY: ${DUMBMONIT_AGENT_RELAY:-false}
      DUMBMONIT_AGENT_SITE: ${DUMBMONIT_AGENT_SITE:-}
      DUMBMONIT_AGENT_SECRET_FILE: /var/lib/dumbmonit-agent/agent-secret
    volumes:
      # Keeps the agent bound to its device when the container is recreated.
      - agent-state:/var/lib/dumbmonit-agent
      # Containers of this host. Remove to keep the agent off the Docker API.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Lets relayed ping monitors work without any capability.
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    restart: unless-stopped

volumes:
  agent-state:

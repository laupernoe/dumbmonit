# Contrôle des licences des dépendances.
#
# DumbMonit se veut « 100 % open source » au sens des licences approuvées par l'OSI.
# Ce fichier transforme cette promesse en test automatisé : une dépendance sous
# licence copyleft forte ou sous licence « source-available » fait échouer la CI.

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "0BSD",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Les crates du workspace se référencent par chemin, sans version : c'est voulu.
allow-wildcard-paths = true

# Avis de sécurité (base RustSec). La CI les vérifie : une dépendance vulnérable
# fait échouer le build tant qu'elle n'est pas mise à jour ou, faute de
# correctif, explicitement ignorée ici avec sa raison.
[advisories]
version = 2
ignore = [
    # crypto-bigint 0.5 (via p256 0.13) : branches dépendantes du secret. Le
    # correctif n'existe qu'en 0.7, que p256 0.14 utilise, mais web-push-native
    # 0.5 (dernière version) exige p256 0.13. Exposition : la signature VAPID
    # des notifications Web Push, déclenchée par le serveur lui-même, sans
    # mesure de temps possible depuis l'extérieur ; la PKI des agents signe
    # avec aws-lc-rs et n'utilise p256 que pour valider des clés publiques.
    # À retirer dès que web-push-native passe à p256 0.14.
    { id = "RUSTSEC-2026-0387", reason = "p256 0.13 imposé par web-push-native ; seule la signature VAPID interne est concernée" },
]

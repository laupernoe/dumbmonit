# Pare-feu Stormshield Network Security (SNS), par les MIB que Stormshield
# publie sous son numéro d'entreprise 1.3.6.1.4.1.11256 (STORMSHIELD-HA-MIB,
# STORMSHIELD-SYSTEM-MONITOR-MIB).
#
# Les OID viennent de ces MIB ; aucun relevé réel d'un boîtier n'a encore servi
# à les vérifier. Une série absente veut dire que le modèle (une machine
# virtuelle n'a ni ventilateur ni sonde de température) ou la version ne la
# publie pas.
#
# Les colonnes d'état de STORMSHIELD-HEALTH-MONITOR-MIB (1.3.6.1.4.1.11256.1.16)
# sont des chaînes dont les valeurs ne sont pas dans la MIB : elles ne sont pas
# lues ici.
id: stormshield
name: Stormshield SNS
match:
  sysobjectid:
    - 1.3.6.1.4.1.11256
  priority: 0

include: [if-mib]

metrics:
  # STORMSHIELD-HA-MIB, groupe snsHA (11256.1.11). Un boîtier hors haute
  # disponibilité publie un seul nœud.
  - name: stormshield_ha_nodes
    oid: 1.3.6.1.4.1.11256.1.11.1.0
    kind: gauge
    label: "HA nodes"
    view: "stat"

  - name: stormshield_ha_dead_nodes
    oid: 1.3.6.1.4.1.11256.1.11.2.0
    kind: gauge
    label: "HA nodes down"
    view: "stat"

  - name: stormshield_ha_active_nodes
    oid: 1.3.6.1.4.1.11256.1.11.3.0
    kind: gauge
    label: "HA nodes active"
    view: "stat"

  - name: stormshield_ha_links
    oid: 1.3.6.1.4.1.11256.1.11.5.0
    kind: gauge
    label: "HA links"
    view: "stat"

  - name: stormshield_ha_faulty_links
    oid: 1.3.6.1.4.1.11256.1.11.6.0
    kind: gauge
    label: "HA links faulty"
    view: "stat"

  # snsHASyncStatus : code brut de la MIB.
  - name: stormshield_ha_sync_status
    oid: 1.3.6.1.4.1.11256.1.11.8.0
    kind: gauge
    label: "HA sync"
    view: "stat"

  # snsHAQuality de chaque nœud (snsNodeTable), repéré par son numéro de série.
  - name: stormshield_ha_node_quality
    oid: 1.3.6.1.4.1.11256.1.11.7.1.7
    kind: gauge
    label: "HA node quality"
    entity: "serial"
    view: "stat"
    walk: true
    labels:
      serial: 1.3.6.1.4.1.11256.1.11.7.1.2
    filters:
      max_rows: 8

  # STORMSHIELD-SYSTEM-MONITOR-MIB, groupe snsSystemMonitor (11256.1.10).
  # Température de chaque processeur (snsCpuTable), en °C.
  - name: stormshield_cpu_temperature_celsius
    oid: 1.3.6.1.4.1.11256.1.10.7.1.2
    kind: gauge
    label: "CPU temperature"
    unit: "°C"
    entity: "cpu"
    view: "timeseries"
    view_title: "CPU temperature"
    walk: true
    labels:
      cpu: 1.3.6.1.4.1.11256.1.10.7.1.1
    filters:
      max_rows: 16

  # Vitesse de chaque ventilateur (snsFanTable), en tr/min.
  - name: stormshield_fan_rpm
    oid: 1.3.6.1.4.1.11256.1.10.9.1.4
    kind: gauge
    label: "Fan speed"
    unit: "rpm"
    view: "stat"
    walk: true
    labels:
      fan: 1.3.6.1.4.1.11256.1.10.9.1.2
    filters:
      max_rows: 16

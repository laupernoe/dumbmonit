# Pare-feu WatchGuard Firebox (Fireware), par les MIB que WatchGuard publie
# sous son numéro d'entreprise 1.3.6.1.4.1.3097.
#
# Les OID viennent des MIB de WatchGuard (WATCHGUARD-SYSTEM-STATISTICS-MIB,
# WATCHGUARD-IPSEC-TUNNEL-MIB, WATCHGUARD-HA-MIB) ; l'échelle du processeur
# (centièmes de pour cent) est celle que décrit la documentation de Fireware.
# Aucun relevé réel d'un Firebox n'a encore servi à les vérifier : une série
# absente veut dire que le modèle ou la version ne la publie pas.
#
# Le SNMP du Firebox est en lecture seule et ne s'ouvre qu'à partir de
# Fireware (Système → SNMP) ; les compteurs 64 bits exigent SNMPv2c ou v3.
id: watchguard
name: WatchGuard Firebox
match:
  sysobjectid:
    - 1.3.6.1.4.1.3097
  priority: 0

include: [if-mib]

metrics:
  # wgSystemCpuUtil1 / 5 / 15 : « 234 » veut dire 2,34 %. La moyenne sur une
  # minute porte le nom générique pour que la règle « High CPU » s'applique
  # d'elle-même.
  - name: cpu_load_percent
    oid: 1.3.6.1.4.1.3097.6.3.77.0
    kind: gauge
    scale: 0.01

  - name: watchguard_cpu_5min_percent
    oid: 1.3.6.1.4.1.3097.6.3.78.0
    kind: gauge
    scale: 0.01

  - name: watchguard_cpu_15min_percent
    oid: 1.3.6.1.4.1.3097.6.3.79.0
    kind: gauge
    scale: 0.01

  # wgSystemCurrActiveConns : connexions actives dans la table d'état.
  - name: watchguard_active_connections
    oid: 1.3.6.1.4.1.3097.6.3.80.0
    kind: gauge

  # Trafic total du boîtier (wgSystemTotalSend/RecvBytes et Packets).
  - name: watchguard_bytes_out
    oid: 1.3.6.1.4.1.3097.6.3.8.0
    kind: counter

  - name: watchguard_bytes_in
    oid: 1.3.6.1.4.1.3097.6.3.9.0
    kind: counter

  - name: watchguard_packets_out
    oid: 1.3.6.1.4.1.3097.6.3.10.0
    kind: counter

  - name: watchguard_packets_in
    oid: 1.3.6.1.4.1.3097.6.3.11.0
    kind: counter

  # wgSystemStreamReqDrop : requêtes de flux refusées par le pare-feu.
  - name: watchguard_stream_requests_dropped
    oid: 1.3.6.1.4.1.3097.6.3.34.0
    kind: counter

  # wgIpsecTunnelNum : associations de sécurité IPsec établies en ce moment
  # (tunnels de site à site et accès nomades confondus).
  - name: watchguard_ipsec_tunnels
    oid: 1.3.6.1.4.1.3097.6.5.1.1.0
    kind: gauge

  # wgIpsecTunnelTable, une ligne par association établie, repérée par
  # l'adresse du correspondant. Volumes en kilo-octets.
  - name: watchguard_ipsec_tunnel_kbytes_in
    oid: 1.3.6.1.4.1.3097.6.5.1.2.1.28
    kind: counter
    walk: true
    labels:
      peer: 1.3.6.1.4.1.3097.6.5.1.2.1.3
    filters:
      max_rows: 64

  - name: watchguard_ipsec_tunnel_kbytes_out
    oid: 1.3.6.1.4.1.3097.6.5.1.2.1.29
    kind: counter
    walk: true
    labels:
      peer: 1.3.6.1.4.1.3097.6.5.1.2.1.3
    filters:
      max_rows: 64

  # WATCHGUARD-HA-MIB : état de ce membre et de son homologue, codes bruts de
  # la MIB (le Firebox seul ne publie pas ce groupe).
  - name: watchguard_ha_status
    oid: 1.3.6.1.4.1.3097.6.6.1.1.0
    kind: gauge

  - name: watchguard_ha_peer_status
    oid: 1.3.6.1.4.1.3097.6.6.1.2.0
    kind: gauge

  - name: watchguard_ha_error
    oid: 1.3.6.1.4.1.3097.6.6.1.4.0
    kind: gauge

  - name: watchguard_ha_peer_error
    oid: 1.3.6.1.4.1.3097.6.6.1.5.0
    kind: gauge
